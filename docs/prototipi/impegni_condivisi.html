  .ag-blocco.passati { --richiamo: var(--proposta); --richiamo-tinta: var(--proposta-tinta); }
  .ag-scelte { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
  .ag-scelte button { border: 1px solid var(--bordo); background: var(--superficie); border-radius: var(--raggio-pill); font-size: 14px; font-weight: 600; min-height: var(--pill-h); padding: 8px 14px; color: var(--testo); }
  .ag-scelte button.scelto { background: var(--accento); color: var(--accento-su); border-color: var(--accento); }
  /* MB Plan, «Modello appuntamenti settimanale» (27/09): gli spazi da riempire, tratteggiati col colore del tipo */
  .ag-ev.ag-cosa.ag-spazio { border: 1.5px dashed var(--tinta); background: color-mix(in srgb, var(--tinta) 7%, var(--superficie)); color: var(--testo); padding-left: 9px; }
  .ag-ev.ag-cosa.ag-spazio b { color: var(--tinta); }
  .ag-ev.ag-cosa.ag-spazio small { color: var(--testo-soft); }
  .ag-sev.ag-spazio { border: 1.5px dashed var(--tinta); background: color-mix(in srgb, var(--tinta) 10%, var(--superficie)); }
  .ss-riga.ss-spazio i, .ag-imp.sp-imp i { background: none; border: 1.5px dashed var(--tinta); box-sizing: border-box; }
  .ag-imp.sp-imp span { color: var(--tinta); }
  /* «In coda» di un giorno che deve venire: i nomi (27/09) */
  .cg-lista { display: grid; margin-top: 10px; }
  .cg-lista button { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-top: 1px solid var(--superficie-2); background: none; padding: 10px 2px; font-family: inherit; font-size: 16px; color: var(--testo); text-align: left; }
  .cg-lista button:first-child { border-top: 0; }
  .cg-lista button > span:nth-child(2) { flex: 1; display: flex; flex-direction: column; }
  .cg-lista small { font-size: 12.5px; color: var(--testo-soft); }
  .cg-lista svg.ic { color: var(--testo-tenue); }
  .cg-lista .ts-pastiglia { width: 36px; height: 36px; font-size: 13px; }
  /* la card «Programma della settimana» in fondo al menu di MB Plan (al posto del Modulo Core, 27/09) */
  .mb-programma { flex: none; margin: 12px 0 6px; border: 1.5px solid #2c4a7c; background: #d6e4f5; color: #2c4a7c; border-radius: 12px; padding: 11px 10px 10px; }
  .mb-prog-testa { display: flex; align-items: flex-start; gap: 12px; }
  .mb-prog-testa svg.ic { width: 22px; height: 22px; flex: none; color: #2c4a7c; margin-top: 2px; }
  .mb-prog-testa span { display: flex; flex-direction: column; gap: 2px; font-size: 16px; }
  .mb-prog-testa b { font-weight: 800; }
  .mb-prog-testa small { font-size: 12px; font-weight: 500; color: var(--testo-soft); }
  .mb-programma ul { list-style: none; margin: 10px 0 0; padding: 0 0 0 4px; display: grid; gap: 5px; }
  .mb-programma li { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--testo); }
  .mb-programma li i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px dashed var(--tinta); flex: none; box-sizing: border-box; }
  .mb-programma p { margin: 8px 0 0 4px; font-size: 13px; line-height: 1.35; color: var(--testo-soft); }
  .ag-lato .mb-programma button.mb-prog-bottone { margin: 10px 0 0; justify-content: center; gap: 6px; background: #2c4a7c; color: #fff; font-size: 14px; font-weight: 700; padding: 10px 8px; white-space: normal; text-align: center; }
  .ag-lato .mb-programma button.mb-prog-bottone svg.ic { color: #fff; width: 18px; height: 18px; }
  .ag-lato .mb-programma button.mb-prog-bottone span { flex: 0 1 auto; }
  .sp-domanda { font-size: 17px; font-weight: 700; margin: 4px 0 6px; }
  .sp-giorno { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--superficie-2); }
  .sp-g { flex: 1 1 140px; display: flex; align-items: baseline; gap: 10px; min-height: 40px; border: 1px solid var(--bordo); border-radius: 12px; background: var(--superficie);
    padding: 8px 12px; font-family: inherit; font-size: 15px; color: var(--testo); text-align: left; }
  .sp-giorno.aperto .sp-g { border-color: var(--accento); }
  .sp-g small { color: var(--testo-tenue); font-size: 13px; }
  .sp-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 4px 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 700;
    background: color-mix(in srgb, var(--tinta) 12%, var(--superficie)); color: var(--tinta); }
  .sp-chip button { border: 0; background: none; color: inherit; padding: 4px; display: inline-flex; }
  .sp-ore { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 10px; }
  .sp-ore button { border: 1px solid var(--bordo); background: var(--superficie); border-radius: var(--raggio-pill); font-size: 14px; font-weight: 600; min-height: var(--pill-h); padding: 8px 14px; color: var(--testo); }
  .sp-chip .sp-nome { font-size: 12.5px; font-weight: 600; padding: 2px 8px; margin: 0 2px; border-radius: 999px; background: var(--superficie); color: var(--testo-soft); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; }
  .sp-nome-riga { display: flex; gap: 8px; align-items: center; padding: 4px 0 8px; } .sp-nome-riga input { flex: 1; min-width: 0; }
  .sp-nome-riga button { border: 0; background: var(--accento); color: var(--accento-su); font-weight: 700; border-radius: var(--raggio-bottone); padding: 10px 16px; min-height: var(--tocco); }
  .sp-conto { margin: 12px 0 0; font-size: 15px; font-weight: 700; color: var(--testo-soft); }
  .sp-conto.pieno { color: var(--verde, #15803D); }
  .sp-tipo label { display: flex; align-items: center; justify-content: space-between; }
  .sp-via { border: 0; background: none; color: var(--testo-tenue); padding: 4px; display: inline-flex; }
  .sp-aggiungi { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 10px; padding: 11px 12px; border: 1px solid var(--bordo); border-radius: 12px;
    background: var(--superficie); font-family: inherit; font-size: 15px; font-weight: 700; color: var(--accento); text-align: left; }
  .sp-aggiungi span { flex: 1; }
  .sp-aggiungi svg.ic:last-child { transform: rotate(90deg); transition: transform .15s; color: var(--testo-tenue); }
  .sp-aggiungi.aperto { border-color: var(--accento); border-radius: 12px 12px 0 0; }
  .sp-aggiungi.aperto svg.ic:last-child { transform: rotate(-90deg); }
  .sp-menu { border: 1px solid var(--accento); border-top: 0; border-radius: 0 0 12px 12px; padding: 4px 12px 8px; background: var(--superficie); }
  .sp-menu small { display: block; margin: 8px 0 2px; font-size: 12px; font-weight: 600; color: var(--testo-tenue); }
  .sp-menu button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-top: 1px solid var(--superficie-2); background: none; padding: 10px 2px;
    font-family: inherit; font-size: 15px; color: var(--testo); text-align: left; }
  .sp-menu small + button { border-top: 0; }
  .sp-menu button i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px dashed var(--tinta); box-sizing: border-box; flex: none; }
  .sp-comandi { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .sp-comandi[hidden], #sp-campi[hidden] { display: none; }
  .ag-due-campi { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }

  /* ── Report (Fase 5) ── */
  .rp-periodi { display: flex; gap: 6px; margin: 8px 0 10px; }
  .rp-periodi button { flex: 1; font-size: 15px; font-weight: 600; padding: 9px 0; border-radius: 999px; border: 1px solid var(--linea); background: var(--superficie); color: var(--testo); }
  .rp-periodi button.scelto { background: var(--testo); color: #fff; border-color: var(--testo); }
  .rp-naviga { display: flex; align-items: center; justify-content: space-between; background: var(--superficie); border-radius: var(--raggio-riga); padding: 4px; margin-bottom: 12px; box-shadow: var(--ombra-card); }
  .rp-naviga b { font-size: 16px; text-align: center; flex: 1; }
  .rp-naviga button { border: 0; background: none; font-size: 24px; color: var(--blu); padding: 4px 16px; }
  .rp-naviga button:disabled { color: var(--linea); }
  .rp-lista { background: var(--superficie); border-radius: var(--raggio-card); overflow: hidden; box-shadow: var(--ombra-card); margin-bottom: 12px; }
  .rp-riga { display: grid; grid-template-columns: 1fr 52px 48px 18px; align-items: center; gap: 4px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--linea);
    background: none; padding: 13px 12px 13px 14px; font-family: inherit; color: var(--testo); font-size: 16px; }
  .rp-riga:first-child { border-top: 0; }
  .rp-riga .n { text-align: right; font-weight: 800; font-size: 18px; }
  .rp-riga .p { text-align: right; font-size: 13px; color: var(--grigio); font-weight: 600; }
  .rp-riga .f { text-align: right; color: var(--grigio-chiaro); font-size: 18px; }
  /* Report aperto (cantiere 34, Ignazio 19/09: «adeguarli nello stile al resto dell'app»): il tipo aperto resta bianco e in grassetto; gli esiti hanno
     il numero in una pastiglia grigia; le persone sono righe come nella coda, con il tondo delle iniziali nel colore della categoria */
  .rp-riga { min-height: 52px; }
  .rp-riga.tipo { font-weight: 700; }
  .rp-riga.tipo.aperto { background: var(--superficie); border-bottom: 1px solid var(--bordo); }
  .rp-riga.esito { background: var(--superficie); padding-left: 28px; font-size: 15px; font-weight: 600; border-top-color: var(--superficie-2); }
  .rp-riga.esito .n { justify-self: end; min-width: 32px; padding: 3px 9px; border-radius: var(--raggio-pill); background: var(--sfondo); font-size: 14px; font-weight: 700; text-align: center; }
  .rp-riga.esito.verde { color: var(--ok); } .rp-riga.esito.verde .n { color: var(--ok); background: var(--ok-tinta); }
  .rp-riga.esito.zero, .rp-riga.esito.zero .n { color: var(--grigio-chiaro); }
  .rp-riga.nome { background: var(--superficie-2); padding: 8px 14px 8px 28px; font-size: 15px; font-weight: 600; grid-template-columns: 1fr auto 18px; border-top-color: var(--superficie); }
  .rp-riga.nome small { color: var(--testo-soft); font-size: 12px; font-weight: 400; }
  .rp-chi { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .rp-tondo { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--cat, var(--testo-tenue)); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 12.5px; font-weight: 600; }
  .rp-altre { background: var(--superficie); padding: 12px 14px 6px 28px; font-size: var(--dim-etichetta); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--testo-tenue); border-top: 1px solid var(--bordo); }
  .rp-grafico { background: var(--superficie); border-radius: var(--raggio-card); padding: 14px; box-shadow: var(--ombra-card); margin-bottom: 12px; }
  .rp-grafico h3 { margin: 0; font-size: 15px; }
  .rp-grafico .legenda { font-size: 12px; color: var(--grigio); margin: 2px 0 10px; }
  .rp-grafico .legenda i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 4px 0 8px; vertical-align: -1px; }
  .rp-barre { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; align-items: end; height: 120px; }
  .rp-barre div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 0; }
  .rp-barre small { font-size: 10px; font-weight: 700; color: var(--grigio); margin-bottom: 2px; }
  /* barre piene, non una tinta: su card bianca la tinta chiara spariva (cantiere 34, 20/09) */
  .rp-barre span { width: 100%; background: var(--gr-volume); border-radius: 4px 4px 0 0; position: relative; overflow: hidden; }
  .rp-barre span i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--verde); }
  .rp-mesi { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; font-size: 10px; text-align: center; color: var(--grigio); margin-top: 4px; }
  .rp-mesi .futuro { color: var(--linea); }
  .ck-confronto { font-size: 12.5px; color: var(--testo-tenue); text-align: center; margin: 0 0 12px; }
  .ck-sezione { font-size: 13px; font-weight: 700; color: var(--testo-tenue); text-transform: uppercase; letter-spacing: .5px; margin: 20px 4px 8px; }
  /* LC1 (26/09): il traguardo del mese, quattro luci (100 VP · BBS · WES · CEP) e cosa manca */
  .ck-lc1 { background: var(--superficie); border-radius: var(--raggio-card); box-shadow: var(--ombra-card); padding: 12px 12px 10px; margin: 0 0 12px; border-left: 4px solid var(--grigio-chiaro); }
  .ck-lc1.fatto { border-left-color: var(--ok); }
  .ck-lc1 .sez { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0 2px; width: 100%; border: 0; background: none; text-align: left; font: inherit; color: var(--testo); }
  .ck-lc1 .sez b { font-size: 16px; color: var(--gr-volume); }
  .ck-lc1 .sez b small { display: block; font-size: 12px; font-weight: 500; color: var(--testo-soft); margin-top: 1px; }
  .ck-lc1 .sez.ok b { color: var(--ok); }
  .ck-lc1 .sez .st { font-weight: 800; font-size: 15px; color: var(--grigio); white-space: nowrap; }
  .ck-lc1 .sez.ok .st { color: var(--ok); }
  .ck-lc1 .sez .apri { font-size: 20px; line-height: 1; color: var(--testo-tenue); margin-left: 8px; }
  .ck-lc1 .sez.core { border-top: 1px solid var(--linea); margin-top: 10px; padding-top: 10px; }
  .ck-lc1 .voci { padding: 0 0 4px; }
  .ck-lc1 .voci div { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 6px 0; border-top: 1px dashed var(--linea); color: var(--testo); }
  .ck-lc1 .voci div.ok { color: var(--ok); }
  .ck-lc1 .voci div span:last-child { color: var(--testo-soft); white-space: nowrap; }
  .ck-lc1 .voci .lc-apri { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: left; text-decoration: underline dotted; }
  .ck-lc1 .voci .lc-scelta { display: block; padding: 6px 0 8px; }
  .ck-lc1 .voci .lc-scelta small { display: block; color: var(--testo-soft); font-size: 12px; margin-bottom: 4px; }
  .ck-lc1 .voci .lc-scelta button { border: 1px solid var(--bordo); background: none; color: var(--testo); border-radius: var(--raggio-pill); padding: 4px 12px; margin: 0 6px 6px 0; font: inherit; font-size: 13px; }
  .ck-lc1 .voci .lc-scelta button.su { border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .ck-lc1 .luci { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 6px 0 4px; }
  .ck-lc1 .luce { --luce: var(--grigio); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; padding: 8px 4px 6px; min-width: 0;
    border-radius: var(--raggio-bottone); background: var(--superficie-2); color: var(--grigio); font-size: 13px; font-weight: 700; }
  .ck-lc1 .luce i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--luce); font-style: normal; font-size: 13px; line-height: 18px; color: #fff; }
  .ck-lc1 .luce.on { color: var(--luce); }
  .ck-lc1 .luce.on i { background: var(--luce); }
  .ck-lc1 .luce.ignoto i { color: var(--grigio); }
  .ck-lc1 .luce.vp { --luce: var(--proposta); }   /* ambra: il blu era uguale al BBS (Ignazio 26/09) */ .ck-lc1 .luce.bbs { --luce: var(--bbs); } .ck-lc1 .luce.wes { --luce: var(--pericolo); } .ck-lc1 .luce.cep { --luce: var(--gr-segni); }
  .ck-lc1 .luce small { font-weight: 500; font-size: 11px; color: var(--testo-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .ck-lc1 .nota-lc1 { display: block; font-size: 13px; color: var(--testo-soft); }
  .ck-lc1 .prossimo { margin-top: 8px; background: var(--proposta-tinta); color: var(--proposta); border-radius: var(--raggio-bottone); padding: 8px 10px; font-size: 13px; font-weight: 600; }
  .ck-lc1 .prossimo.fatto { background: var(--ok-tinta); color: var(--ok); }
  .ck-lc1 .livelli-t { margin: 14px 0 0; padding-top: 10px; border-top: 2px solid var(--linea); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--testo-soft); }
  .ck-lc1 .livelli-t + .livello > .sez.core { border-top: 0; margin-top: 0; }
  /* il livello aperto in un riquadro grigio chiaro (Ignazio 27/09: «tutto questo bianco… staccare un livello da un altro») */
  /* la porta del Modulo Core dalla riga CORE (Ignazio 27/09): la stessa pagina che si apre da MB Plan */
  .ck-lc1 .ck-modulo { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 8px; padding: 9px 12px; border: 1px solid var(--bordo); border-radius: var(--raggio-bottone);
    background: var(--superficie-2); color: var(--blu); font: inherit; font-size: 14px; font-weight: 700; text-align: left; }
  .ck-lc1 .ck-modulo > span { margin-left: auto; font-size: 18px; line-height: 1; }
  /* «IL MIO MESE», un riquadro solo: sopra «Dove sono» (i numeri), sotto «Dove vado» (il percorso) — Ignazio 28/09 */
  .mese-card { padding: 14px; }
  .mese-t { display: block; font-size: 13px; font-weight: 700; color: var(--testo-soft); margin-bottom: 8px; }
  .dm-corpo { padding-bottom: 6px; }
  .dm-riga { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; align-items: baseline; padding: 6px 0 4px; }
  .dm-riga .n { font-size: 14px; font-weight: 700; }
  .dm-riga .n small.ev { font-size: 11px; font-weight: 600; opacity: .8; }
  .dm-riga .g { font-size: 16px; font-weight: 800; text-align: right; white-space: nowrap; }
  .dm-riga small { font-size: 12px; color: var(--testo-soft); }
  .dm-riga small.r { text-align: right; }
  .dm-barra { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--superficie-2); overflow: hidden; margin-top: 3px; }
  .dm-barra div { height: 100%; transition: width .4s ease; }
  .mese-riga { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; border-radius: var(--raggio-riga);
    background: var(--superficie-2); color: var(--testo); padding: 12px 14px; margin-top: 10px; font: inherit; font-weight: 600; }
  .mese-riga b { display: block; font-size: 14px; } .mese-riga small { display: block; font-size: 12px; font-weight: 400; color: var(--testo-soft); margin-top: 2px; }

      + (st.cosa === 'persona' && persona() && persona().cat === 'Partner' && !persona().app ? '<div class="cd" style="margin-top:10px"><div class="pt-testa"><b>' + esc(persona().nome) + ' non usa ancora MB21</b></div><div class="pt-comandi"><button type="button" class="link" data-azione="invita">' + ic('invito') + ' Invitalo nell\'app</button></div></div>' : '')
      + (st.condividi && st.condividi !== 'no' ? '<div class="campo" style="margin-top:10px"><label>' + (st.condividi === 'persona' ? 'Vede' : 'Vedono') + ' anche i punti da trattare?</label>' + pill('puntiCond', [['1', 'Sì'], ['0', 'No']], st.puntiCond) + '</div>' : ''));
    var pronto = l1ok() && l3ok() && st.condividi && (st.condividi === 'no' || st.puntiCond !== null);

    io.innerHTML = h;
    var ul = io.querySelector('.liv:not([hidden]):last-of-type'); if (ul) ul.scrollIntoView({ block: 'nearest' });
  }
  function risposteHtml() {
    var d = destinatari(), c = { ci: [], no: [], senza: [] };

  function disegnaDopo() {

    else h += '<div class="cd chiuso"><button type="button" class="link" data-azione="condividi">' + ic('condividi') + ' Condividi con ' + esc(st.cosa === 'team' ? 'tutto il Team' : st.cosa === 'linea' ? 'la Linea' : persona().nome) + '</button></div>';

    h += '<div class="mc-fondo"><button type="button" class="link" data-azione="annulla">Ricomincia da capo</button></div></div>';
    io.innerHTML = h;
  }
  function disegnaLoro() {
    var d = destinatari(), chi = st.cosa === 'team' ? 'il Team' : st.cosa === 'linea' && linea() ? 'la Linea ' + linea().nome : persona() ? persona().nome : '…';
    chiTitolo.textContent = (st.cosa === 'linea' ? 'Cosa arriva alla Linea ' + (linea() ? linea().nome : '…') : st.cosa === 'team' ? 'Cosa arriva al Team' : 'Cosa arriva a ' + chi);
    if (!st.cosa) { loro.innerHTML = '<div class="vuoto">Scegli cosa fissi: qui vedi, man mano, quello che arriva agli altri.</div>'; return; }
    if (!condiviso()) {
      loro.innerHTML = '<div class="vuoto">' + (st.cosa === 'persona' && persona() && !persona().app ? esc(persona().nome) + ' non usa ancora MB21: non riceve niente finché non si registra.<br><br>' : '') + 'Niente: ' + (serata() ? 'la serata resta solo nella tua Agenda' : 'l\'appuntamento resta solo tuo') + (st.condividi ? '' : ' finché non scegli «Condividi con»') + '.</div>'; return;
    }
    var uno = d[0], p = st.puntiCond === '1' ? puntiLista() : [], t = esc(titolo().replace(' · ' + (persona() ? persona().nome : ''), '')), r = st.risposte[uno];
    var h = '<p class="ricevente">Nel telefono di <b>' + esc(uno) + '</b>' + (d.length > 1 ? ' (e di altri ' + (d.length - 1) + ')' : '') + (st.salvato ? '' : ' · appena salvi') + '</p>';
    // il pop-up all'apertura
    if (!r) h += '<div class="foglio ric-foglio"><div class="testa-foglio"><h3>Hai un nuovo appuntamento</h3></div><div class="ric-nuovo"><b>' + t + '</b><span>da Ignazio · ' + esc(data()) + ' · ' + st.ora + '–' + fine() + '</span>' + (st.link ? '<a class="link" href="' + esc(st.link) + '" target="_blank" rel="noopener">Link della chiamata</a>' : '') + '<div class="ag-scelte ric-risposta"><button type="button" data-r="ci_sono">Partecipo</button><button type="button" data-r="non_ci_sono">Non posso</button><button type="button" class="dopo" data-r="dopo">Decido dopo</button></div></div></div>';
    // la riga in Agenda
    h += '<p class="rit">In MB Plan, ' + esc(data()) + '</p><div class="ag-impegni"><button type="button" class="ag-imp ric-imp' + (r === 'non_ci_sono' ? ' noci' : '') + '"><i></i><span>' + t + '<small>da Ignazio' + (r === 'ci_sono' ? ' · Partecipo' : r === 'non_ci_sono' ? ' · Non posso' : ' · nuovo') + '</small></span><b>' + st.ora + '–' + fine() + '</b></button></div>';

    h += '<p class="rit">Toccando la riga</p><div class="foglio ric-foglio"><div class="testa-foglio"><h3>' + t + '</h3></div><p>' + esc(data()) + ' · ' + st.ora + '–' + fine() + '</p><div class="vn-aiuto">Te lo ha mandato <b>Ignazio</b>: sta nella tua Agenda e nel tuo calendario. </div>'
      + (st.link ? '<a class="pt-link" href="' + esc(st.link) + '" target="_blank" rel="noopener">' + ic('chiamata') + ' Entra nella chiamata</a>' : '')
      + (p.length ? '<div class="pt pt-lettura"><div class="pt-testa"><b>Punti da trattare</b><small>li spunta chi organizza</small></div>' + p.map(function (x) { return '<div class="pt-riga"><span class="pt-segno">•</span><span class="pt-testo">' + esc(x) + '</span></div>'; }).join('') + '</div>' : '')
      + '<div class="campo"><label>Partecipi?</label><div class="ag-scelte ric-risposta"><button type="button" data-r="ci_sono" class="' + (r === 'ci_sono' ? 'scelto' : '') + '">Partecipo</button><button type="button" data-r="non_ci_sono" class="' + (r === 'non_ci_sono' ? 'scelto' : '') + '">Non posso</button></div></div></div>';
    // il calendario personale
    h += '<p class="rit">Nel suo Calendario Apple / Google</p><div class="cal"' + (r === 'non_ci_sono' ? ' style="opacity:.55;text-decoration:line-through"' : '') + '><b>MB21 · ' + t + ' · da Ignazio</b><div>' + st.ora + '–' + fine() + '</div>' + (st.link || p.length ? '<div style="white-space:pre-line;margin-top:4px">' + (st.link ? 'Chiamata: ' + esc(st.link) + '\n' : '') + (p.length ? 'Punti da trattare:\n' + p.map(function (x) { return '• ' + esc(x); }).join('\n') : '') + '</div>' : '') + '</div>';
    if (d.length > 1) h += '<p class="rit">Solo qui nella simulazione: rispondi al posto degli altri</p><div class="nomi">' + d.slice(1).map(function (n) { return '<div>' + esc(n) + ': <b>' + (st.risposte[n] === 'ci_sono' ? 'Partecipa' : st.risposte[n] === 'non_ci_sono' ? 'Non può' : 'Senza risposta') + '</b> <button type="button" class="link" data-rn="' + esc(n) + '" data-r="ci_sono">partecipa</button> <button type="button" class="link" data-rn="' + esc(n) + '" data-r="non_ci_sono">non può</button></div>'; }).join('') + '</div>';
    loro.innerHTML = h;
  }
  function tutto() { disegnaIo(); disegnaLoro(); }
  io.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-p] button'); if (b) {
      var p = b.parentElement.getAttribute('data-p'), v = b.getAttribute('data-v');
      if (p === 'durata') st.durata = +v; else st[p] = v;
      if (p === 'cosa') { st.condividi = null; st.puntiCond = null; st.risposte = {}; }
      if (p === 'persona' || p === 'linea') { st.condividi = null; st.puntiCond = null; }
      if (p === 'condividi' && v === 'no') st.puntiCond = null;
      return tutto();
    }
    var a = ev.target.closest('[data-azione]'); if (!a) return;
    var z = a.getAttribute('data-azione');
    if (z === 'salva') { if (a.disabled) return; st.salvato = true; }
    if (z === 'annulla') { st = { cosa: null, persona: null, tipo: null, linea: null, serataTipo: 'Team', nome: '', giorno: '2026-10-08', ora: '18:30', durata: 60, link: '', punti: '', condividi: null, puntiCond: null, salvato: false, risposte: {} }; }
    if (z === 'togli') { st.condividi = 'no'; st.risposte = {}; }
    if (z === 'condividi') { st.condividi = st.cosa === 'team' ? 'team' : st.cosa === 'linea' ? 'linea' : 'persona'; st.puntiCond = st.puntiCond || '0'; }
    if (z === 'punti') st.puntiCond = st.puntiCond === '1' ? '0' : '1';
    if (z === 'invita') { alert('Si apre il foglio del link di registrazione, lo stesso della scheda: «Invita ' + persona().nome + ' nell\'app MB21», da mandare con WhatsApp o SMS.'); return; }
    tutto();
  });
  io.addEventListener('input', function (ev) {
    var t = ev.target, id = t.id;
    if (id === 'f-nome') { st.nome = t.value; disegnaLoro(); var b = io.querySelector('.mc-testa b'); if (b) b.textContent = st.nome || titolo(); }
    if (id === 'f-giorno') { st.giorno = t.value; disegnaLoro(); }
    if (id === 'f-ora') { st.ora = t.value; disegnaLoro(); }
    if (id === 'f-link') { st.link = t.value.trim(); disegnaLoro(); }
    if (id === 'f-punti') { st.punti = t.value; disegnaLoro(); }
  });
  io.addEventListener('change', function (ev) { if (['f-giorno', 'f-ora', 'f-link', 'f-punti', 'f-nome'].indexOf(ev.target.id) >= 0) disegnaIo(); });
  loro.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-r]'); if (!b) return;
    var r = b.getAttribute('data-r'), n = b.getAttribute('data-rn') || destinatari()[0];
    if (r === 'dopo') { b.closest('.ric-foglio').remove(); return; }
    st.risposte[n] = r; tutto();
  });
  // solo per le foto di controllo: #demo = un appuntamento con Isabella già compilato; #demoteam = una serata di Linea salvata
  if (location.hash === '#demo') Object.assign(st, { cosa: 'persona', persona: 'isa', tipo: 'Counseling', link: 'https://meet.google.com/abc-defg-hij', punti: 'Il perché\nLista nomi: i primi 10', condividi: 'persona', puntiCond: '1' });
  if (location.hash === '#demoteam') Object.assign(st, { cosa: 'linea', linea: 'FR1', nome: 'Serata Linea Rossi', link: 'https://zoom.us/j/555', punti: 'Benvenuto ai nuovi\nRisultati del mese', condividi: 'linea', puntiCond: '0', salvato: true, risposte: { 'Anna Verdi': 'ci_sono', 'Carla Rossi': 'non_ci_sono' } });
  tutto();
})();
