<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img">
<style>
  text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #2C2C2A; }
  .t { font-size: 14px; } .ts { font-size: 12px; fill: #5F5E5A; } .th { font-size: 14px; font-weight: 500; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; } .leader { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 3; }
  .c-teal > rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; } .c-teal .th { fill: #085041; } .c-teal .ts { fill: #0F6E56; }
  .c-amber > rect, rect.c-amber { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; } .c-amber .th { fill: #633806; } .c-amber .ts { fill: #854F0B; }
  .c-gray > rect, rect.c-gray { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; } .c-gray .th { fill: #444441; } .c-gray .ts { fill: #5F5E5A; }
</style>
<rect x="0" y="0" width="680" height="560" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="36">Da dove arrivano</text><text class="th" x="250" y="36">Dove si scrive</text><text class="th" x="460" y="36">Chi lo vede</text>
<g class="c-teal"><rect x="40" y="48" width="170" height="38" rx="4"/><text class="th" x="125" y="64" text-anchor="middle">Il Check</text><text class="ts" x="125" y="79" text-anchor="middle">contatti, PM, iscritti</text></g>
<line class="arr" x1="210" y1="67" x2="248" y2="67" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="98" width="170" height="38" rx="4"/><text class="th" x="125" y="114" text-anchor="middle">File Amway, squadra</text><text class="ts" x="125" y="129" text-anchor="middle">chi sta sotto di te</text></g>
<line class="arr" x1="210" y1="117" x2="248" y2="117" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="148" width="170" height="38" rx="4"/><text class="th" x="125" y="164" text-anchor="middle">File Amway, volumi</text><text class="ts" x="125" y="179" text-anchor="middle">VPP, VPG, bonus</text></g>
<line class="arr" x1="210" y1="167" x2="248" y2="167" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="198" width="170" height="38" rx="4"/><text class="th" x="125" y="214" text-anchor="middle">PM del ramo</text><text class="ts" x="125" y="229" text-anchor="middle">i 15 Planner</text></g>
<line class="arr" x1="210" y1="217" x2="248" y2="217" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="250" y="48" width="170" height="188" rx="4"/><text class="th" x="335" y="128" text-anchor="middle">Foglio obiettivi</text><text class="ts" x="335" y="146" text-anchor="middle">si compila e si ritocca</text></g>
<line class="arr" x1="335" y1="236" x2="335" y2="254" marker-end="url(#arrow)"/>
<rect x="250" y="256" width="170" height="112" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="262" y="276">Nel database</text>
<g class="c-teal"><rect x="260" y="286" width="150" height="34" rx="4"/><text class="th" x="335" y="301" text-anchor="middle">Obiettivi del mese</text><text class="ts" x="335" y="315" text-anchor="middle">16 caselle</text></g>
<g class="c-teal"><rect x="260" y="326" width="150" height="34" rx="4"/><text class="th" x="335" y="341" text-anchor="middle">Linee del mese</text><text class="ts" x="335" y="355" text-anchor="middle">nome e VP</text></g>
<g class="c-teal"><rect x="460" y="48" width="170" height="38" rx="4"/><text class="th" x="545" y="64" text-anchor="middle">Il partner</text><text class="ts" x="545" y="79" text-anchor="middle">i suoi, li scrive</text></g>
<g class="c-teal"><rect x="460" y="98" width="170" height="38" rx="4"/><text class="th" x="545" y="114" text-anchor="middle">L'Admin</text><text class="ts" x="545" y="129" text-anchor="middle">tutti</text></g>
<g class="c-amber"><rect x="460" y="148" width="170" height="38" rx="4"/><text class="th" x="545" y="164" text-anchor="middle">L'upline</text><text class="ts" x="545" y="179" text-anchor="middle">verso il basso, lettura</text></g>
<g class="c-gray"><rect x="460" y="198" width="170" height="38" rx="4"/><text class="th" x="545" y="214" text-anchor="middle">Linee parallele</text><text class="ts" x="545" y="229" text-anchor="middle">mai, per nessuno</text></g>
<text class="th" x="40" y="400">Cosa resta da fare, in ordine</text>
<g class="c-amber"><rect x="40" y="412" width="184" height="38" rx="4"/><text class="th" x="132" y="428" text-anchor="middle">Foglio espandibile</text><text class="ts" x="132" y="443" text-anchor="middle">riepilogo e spiegazioni</text></g>
<line class="arr" x1="224" y1="431" x2="246" y2="431" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="248" y="412" width="184" height="38" rx="4"/><text class="th" x="340" y="428" text-anchor="middle">VP delle linee</text><text class="ts" x="340" y="443" text-anchor="middle">ora e obiettivo suo</text></g>
<line class="arr" x1="432" y1="431" x2="454" y2="431" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="456" y="412" width="184" height="38" rx="4"/><text class="th" x="548" y="428" text-anchor="middle">Upline in lettura</text><text class="ts" x="548" y="443" text-anchor="middle">solo verso il basso</text></g>
<g class="c-amber"><rect x="40" y="470" width="184" height="38" rx="4"/><text class="th" x="132" y="486" text-anchor="middle">Storico del partner</text><text class="ts" x="132" y="501" text-anchor="middle">PM e contatti reali</text></g>
<line class="arr" x1="224" y1="489" x2="246" y2="489" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="248" y="470" width="184" height="38" rx="4"/><text class="th" x="340" y="486" text-anchor="middle">Mappa disegnata</text><text class="ts" x="340" y="501" text-anchor="middle">le linee come disegno</text></g>
<line class="arr" x1="432" y1="489" x2="454" y2="489" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="456" y="470" width="184" height="38" rx="4"/><text class="th" x="548" y="486" text-anchor="middle">Obiettivo e risultato</text><text class="ts" x="548" y="501" text-anchor="middle">confronto a fine mese</text></g>
<rect x="40" y="528" width="14" height="14" rx="2" class="c-teal"/><text class="ts" x="62" y="540">già online</text><rect x="150" y="528" width="14" height="14" rx="2" class="c-amber"/><text class="ts" x="172" y="540">da fare</text><rect x="250" y="528" width="14" height="14" rx="2" class="c-gray"/><text class="ts" x="272" y="540">regola</text>
</svg>
