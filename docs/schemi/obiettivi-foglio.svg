<g class="c-teal"><rect x="52" y="316" width="180" height="38" rx="4"/><text class="th" x="142" y="332" text-anchor="middle">Dal gruppo</text><text class="ts" x="142" y="347" text-anchor="middle">VPG meno VPP</text></g>
<line class="arr" x1="142" y1="354" x2="142" y2="376" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="52" y="376" width="180" height="38" rx="4"/><text class="th" x="142" y="392" text-anchor="middle">Nuovi iscritti</text><text class="ts" x="142" y="407" text-anchor="middle">50 VP ciascuno</text></g>
