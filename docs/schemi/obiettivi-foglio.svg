<g class="c-teal"><rect x="52" y="436" width="180" height="38" rx="4"/><text class="th" x="142" y="452" text-anchor="middle">Le tue linee</text><text class="ts" x="142" y="467" text-anchor="middle">nome e VP attesi</text></g>
<line class="arr" x1="142" y1="474" x2="142" y2="496" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="52" y="496" width="180" height="38" rx="4"/><text class="th" x="142" y="512" text-anchor="middle">Ancora da trovare</text><text class="ts" x="142" y="527" text-anchor="middle">quanto manca</text></g>
<path class="arr" d="M232 395 L242 395 L242 215 L250 215" fill="none" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="252" y="196" width="180" height="38" rx="4"/><text class="th" x="342" y="212" text-anchor="middle">Nuovi iscritti</text><text class="ts" x="342" y="227" text-anchor="middle">il totale del mese</text></g>
<line class="arr" x1="342" y1="234" x2="342" y2="256" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="252" y="256" width="180" height="38" rx="4"/><text class="th" x="342" y="272" text-anchor="middle">Di cui personali</text><text class="ts" x="342" y="287" text-anchor="middle">le tue prime linee</text></g>
<line class="arr" x1="342" y1="294" x2="342" y2="316" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="252" y="316" width="180" height="38" rx="4"/><text class="th" x="342" y="332" text-anchor="middle">Piani Marketing</text><text class="ts" x="342" y="347" text-anchor="middle">5 per ogni iscritto</text></g>
<line class="arr" x1="342" y1="354" x2="342" y2="376" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="252" y="376" width="180" height="38" rx="4"/><text class="th" x="342" y="392" text-anchor="middle">Contatti</text><text class="ts" x="342" y="407" text-anchor="middle">5 per ogni PM</text></g>
<g class="c-amber"><rect x="252" y="436" width="180" height="38" rx="4"/><text class="th" x="342" y="452" text-anchor="middle">Storico del partner</text><text class="ts" x="342" y="467" text-anchor="middle">si correggono da soli</text></g>
<line class="leader" x1="342" y1="414" x2="342" y2="436"/>
<g class="c-teal"><rect x="452" y="196" width="180" height="38" rx="4"/><text class="th" x="542" y="212" text-anchor="middle">Squadra</text><text class="ts" x="542" y="227" text-anchor="middle">linee bonus, 15 Planner</text></g>
<g class="c-teal"><rect x="452" y="256" width="180" height="38" rx="4"/><text class="th" x="542" y="272" text-anchor="middle">Prime linee e totale</text><text class="ts" x="542" y="287" text-anchor="middle">dal file Amway</text></g>
<g class="c-teal"><rect x="452" y="316" width="180" height="38" rx="4"/><text class="th" x="542" y="332" text-anchor="middle">Segni vitali</text><text class="ts" x="542" y="347" text-anchor="middle">BBS, WES, CEP del gruppo</text></g>
<g class="c-teal"><rect x="452" y="376" width="180" height="38" rx="4"/><text class="th" x="542" y="392" text-anchor="middle">Crescita</text><text class="ts" x="542" y="407" text-anchor="middle">tracce e pagine</text></g>
<g class="c-amber"><rect x="452" y="436" width="180" height="38" rx="4"/><text class="th" x="542" y="452" text-anchor="middle">VP di ogni linea</text><text class="ts" x="542" y="467" text-anchor="middle">ora e obiettivo suo</text></g>
<rect x="52" y="586" width="14" height="14" rx="2" class="c-teal"/><text class="ts" x="74" y="598">già online</text><rect x="170" y="586" width="14" height="14" rx="2" class="c-amber"/><text class="ts" x="192" y="598">da fare</text><rect x="270" y="586" width="14" height="14" rx="2" class="c-gray"/><text class="ts" x="292" y="598">scelta o aiuto</text>
</svg>
