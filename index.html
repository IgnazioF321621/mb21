// Obiettivi del mese (lavoro 5): un foglio con i 12 obiettivi raggruppati come le schede, già compilati
// con quelli del mese (o del mese scorso). «Come <mese>» riempie, «Scelgo io» svuota, la barra «Crescita su <mese>»
// (5 · 10 · 20 · 30 · 40 · 50%) ricalcola tutti i campi mentre si sposta; sopra il 20% un avviso.
// Partenza di BBS/WES/CEP automatica: non si chiede. Si salva solo con almeno un obiettivo.
function apriObiettivi() {
  if (ST.offline || !DS.dati || soloGuardo()) return;
  const D = MB21Dashboard, mese = DS.dati.mese;
  const { valori, mesePrima } = D.propostaObiettivi(DS.obiettivi, mese, 'attuali');
  const prima = mesePrima ? D.nomeMese(mesePrima) : null;
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `<div class="foglio alto">
    <div class="testa-foglio"><h3>🎯 Obiettivi di ${esc(D.nomeMese(mese))}${esc(aNome())}</h3><button id="ob-x" aria-label="Chiudi">×</button></div>
    ${prima ? `<p>Come vuoi partire?</p><div class="chips ob-modi">
      <button data-modo="uguale">Come ${esc(prima.toLowerCase())}</button>
      <button data-modo="vuoti">Scelgo io</button></div>
      <div class="ob-crescita">
        <div class="ob-crescita-testa">Crescita su ${esc(prima.toLowerCase())}: <b id="ob-perc">scegli</b></div>
        <input type="range" id="ob-barra" min="0" max="${D.CRESCITE.length - 1}" step="1" value="${D.CRESCITE.indexOf(10)}">
        <div class="ob-tacche">${D.CRESCITE.map(c => `<span>${c}%</span>`).join('')}</div>
        <div class="ob-ambizioso" id="ob-ambizioso" hidden>💪 Obiettivo ambizioso: parlane con il tuo upline</div>
      </div>` : `<p>Scrivi i tuoi obiettivi per questo mese.</p>`}
    ${D.CAMPI_OBIETTIVI.map(([gruppo, pallino, campi]) => `<div class="ob-gruppo"><h4>${pallino} ${esc(gruppo)}</h4><div class="ob-campi">
      ${campi.map(([k, etichetta, decimale]) => `<label>${esc(etichetta)}<input id="ob-${k}" inputmode="${decimale ? 'decimal' : 'numeric'}" value="${esc(valori[k])}"></label>`).join('')}
    </div></div>`).join('')}
    <div class="errore" id="ob-errore"></div>
    <div class="due"><button class="link" id="ob-no">Annulla</button><button class="primario" id="ob-si">Salva obiettivi</button></div>
  </div>`;
  document.body.appendChild(velo);
  const chiudi = () => velo.remove();
  velo.querySelector('#ob-x').onclick = chiudi;
  velo.querySelector('#ob-no').onclick = chiudi;
  const scrivi = nuovi => { for (const [, , campi] of D.CAMPI_OBIETTIVI) for (const [k] of campi) velo.querySelector('#ob-' + k).value = nuovi ? nuovi[k] : ''; };
  const sceltaModo = b => velo.querySelectorAll('.ob-modi button').forEach(x => x.classList.toggle('scelto', x === b));
  velo.querySelectorAll('.ob-modi button').forEach(b => {
    b.onclick = () => { sceltaModo(b); scrivi(b.dataset.modo === 'vuoti' ? null : D.propostaObiettivi(DS.obiettivi, mese, b.dataset.modo).valori); };
  });
  const barra = velo.querySelector('#ob-barra');
  if (barra) barra.oninput = () => {
    const p = D.CRESCITE[Number(barra.value)];
    velo.querySelector('#ob-perc').textContent = `+${p}%`;
    velo.querySelector('#ob-ambizioso').hidden = p <= D.SOGLIA_AMBIZIOSO;
    sceltaModo(null);
    scrivi(D.propostaObiettivi(DS.obiettivi, mese, 'crescita', p).valori);
  };
  if (barra) barra.onclick = barra.oninput;   // un tocco sulla posizione di partenza (10%) vale anche senza spostarla
  velo.querySelector('#ob-si').onclick = async () => {
    const letti = {};
    for (const [, , campi] of D.CAMPI_OBIETTIVI) for (const [k] of campi) letti[k] = velo.querySelector('#ob-' + k).value;
    const { errore, valori: v } = D.validaObiettivi(letti);
    if (errore) { velo.querySelector('#ob-errore').textContent = errore; return; }
    const btn = velo.querySelector('#ob-si');
    btn.disabled = true; btn.textContent = 'Salvo…';
    // upsert sulla coppia partner+mese: tocca solo gli obiettivi (partenza e dati Amway restano)
    const { error } = await dbq('salva obiettivi', supa.from('obiettivi_mese')
      .upsert({ user_id: visto().id, mese, ...v }, { onConflict: 'user_id,mese' }));   // Partner Select: a nome del partner scelto
    if (error) {
      btn.disabled = false; btn.textContent = 'Salva obiettivi';
      velo.querySelector('#ob-errore').textContent = 'Non salvato: controlla la connessione e riprova.';
      return;
    }
    chiudi();
    await caricaDashboard(ST.oggi);
    disegnaOggi();
    mostraToast(`Obiettivi di ${D.nomeMese(mese)} salvati`);
  };
}

// Check del Giorno: 13 campi come in Glide. Più check sulla stessa data si sommano (decisione 9).
function apriCheck() {
  if (soloGuardo()) return;
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `<div class="foglio alto">
    <div class="testa-foglio"><h3>Check del Giorno${esc(aNome())}</h3><button id="ck-x" aria-label="Chiudi">×</button></div>
    <div class="campo"><label>📅 Data Check <small>Obbligatorio</small></label><input id="ck-data" type="date" value="${MB21Coda.oggiRoma()}" max="${MB21Coda.oggiRoma()}"></div>
    ${MB21Dashboard.CAMPI_CHECK.map(([k, etichetta, suggerimento, decimale]) => `<div class="campo">
      <label>${esc(etichetta)} <small>Obbligatorio</small></label>
      <input id="ck-${k}" inputmode="${decimale ? 'decimal' : 'numeric'}" placeholder="${esc(suggerimento)}"></div>`).join('')}
    <div class="campo"><label>Libro</label><select id="ck-libro"><option value="">—</option>${MB21Dashboard.LIBRI.map(l => `<option>${esc(l)}</option>`).join('')}</select></div>
    <div class="campo"><label>Note del libro</label><input id="ck-note" maxlength="150"><div class="conta" id="ck-conta">0/150</div></div>
    <div class="errore" id="ck-errore"></div>
    <div class="due"><button class="link" id="ck-no">Annulla</button><button class="primario" id="ck-si">Invia</button></div>
  </div>`;
  document.body.appendChild(velo);
  const chiudi = () => velo.remove();
  velo.querySelector('#ck-x').onclick = chiudi;
  velo.querySelector('#ck-no').onclick = chiudi;
  const note = velo.querySelector('#ck-note');
  note.oninput = () => { velo.querySelector('#ck-conta').textContent = `${note.value.length}/150`; };
  velo.querySelector('#ck-si').onclick = async () => {
    const v = { user_id: visto().id, data: velo.querySelector('#ck-data').value, libro: velo.querySelector('#ck-libro').value || null, note_libro: note.value.trim() || null };
    for (const [k] of MB21Dashboard.CAMPI_CHECK) v[k] = velo.querySelector('#ck-' + k).value;
    const errore = MB21Dashboard.validaCheck(v);
    if (errore) { velo.querySelector('#ck-errore').textContent = errore; return; }
    for (const [k] of MB21Dashboard.CAMPI_CHECK) v[k] = Number(String(v[k]).trim().replace(',', '.'));
    const btn = velo.querySelector('#ck-si');
    btn.disabled = true; btn.textContent = 'Invio…';
    const { data, error } = await dbq('salva check', supa.from('check_giorno').insert(v).select('id').single());
    if (error) {
      btn.disabled = false; btn.textContent = 'Invia';
      velo.querySelector('#ck-errore').textContent = 'Non salvato: controlla la connessione e riprova.';
      return;
    }
    chiudi();
    await caricaDashboard(ST.oggi);
    disegnaOggi();
    mostraToast('Check salvato', async () => {
      const { error: e2 } = await dbq('annulla check', supa.from('check_giorno').delete().eq('id', data.id));
      if (e2) return mostraToast('Annullamento non riuscito: riprova.');
      await caricaDashboard(ST.oggi);
      disegnaOggi();
      mostraToast('Check annullato');
    });
  };
}

// ── AGENDA (Fase 4) ──────────────────────────────────────
// Giornata a linea del tempo (brief Fase 4): striscia di 7 giorni, appuntamenti del giorno in ordine d'ora,
// telefonate del giorno, appuntamenti passati senza esito, [+] nuovo appuntamento. Logica pura in agenda.js.
// Appuntamenti = righe di `azioni` con tipo ≠ Contatto (per data inizio) + Contatti con data scelta (dalla coda).
const AG = { giorno: null, settimana: [], azioni: [], passati: [], aperta: null, telefonate: null };


async function apriAgenda(giorno) {
  AG.giorno = giorno || AG.giorno || MB21Coda.oggiRoma();
  if (!document.querySelector('.ag-settimana')) app.innerHTML = `<h1>Agenda</h1><div class="vuoto">Carico l'agenda…</div>`;
  try { await caricaAgenda(); }
  catch (e) {
    app.innerHTML = `<h1>Agenda</h1><div class="avviso">Non riesco a caricare l'agenda. Controlla la connessione e riprova.</div>${versione()}`;
    return;
  }
  disegnaAgenda();
}

async function caricaAgenda() {
  const A = MB21Agenda;
  AG.settimana = A.settimana(AG.giorno);
  const da = A.isoDaRoma(AG.settimana[0], '00:00'), a = A.isoDaRoma(A.spostaGiorno(AG.settimana[6], 1), '00:00');
  const oggi = MB21Coda.oggiRoma(), adesso = new Date().toISOString();
  const ids = idVisti();   // Partner Select (lavoro 3): il partner scelto, o tutti
  const richieste = [
    dbq('agenda appuntamenti', supa.from('azioni').select(CAMPI_AZIONE).in('user_id', ids).neq('tipo_azione', 'Contatto').gte('inizio', da).lt('inizio', a)),
    // Contatti: richiami/appuntamenti dati dalla coda (data scelta) e telefonate programmate dall'Agenda (non completate)
    dbq('agenda contatti', supa.from('azioni').select(CAMPI_AZIONE).in('user_id', ids).eq('tipo_azione', 'Contatto')
      .or(`and(data_scelta.gte."${da}",data_scelta.lt."${a}"),and(data_scelta.is.null,completata.eq.false,inizio.gte."${da}",inizio.lt."${a}")`)),
    dbq('agenda senza esito', supa.from('azioni').select(CAMPI_AZIONE).in('user_id', ids).neq('tipo_azione', 'Contatto').eq('completata', false).lt('inizio', adesso).order('inizio', { ascending: false }).limit(50)),
  ];
  const conferme = AG.giorno === oggi ? caricaConferme() : null;
  if (vediTutti()) { /* telefonate e rientri sono di un partner */ }
  else if (AG.giorno === oggi) richieste.push(dbq('stato di oggi', supa.rpc('stato_oggi', guardoAltri() ? { p_utente: visto().id } : {})));
  else if (AG.giorno > oggi) richieste.push(dbq('rientri del giorno', supa.from('contatti_coda').select('id', { count: 'exact', head: true }).eq('user_id', visto().id).eq('rientro_il', AG.giorno)));
  const [app1, ric, pas, tel] = await Promise.all(richieste);
  await conferme;
  for (const r of [app1, ric, pas, tel]) if (r && r.error) throw r.error;
  AG.azioni = MB21Agenda.senzaDoppioniCoda([...app1.data, ...ric.data]);
  AG.passati = pas.data;
  await aggiungiPortatoDa([...AG.azioni, ...AG.passati]);
  AG.telefonate = !tel ? null : AG.giorno === oggi ? { oggi: true, ...tel.data } : { oggi: false, rientri: tel.count || 0 };
}

function disegnaAgenda() {
  const A = MB21Agenda, oggi = MB21Coda.oggiRoma();
  const conEventi = A.giorniConEventi(AG.azioni);
  const eventi = A.eventiDelGiorno(AG.azioni, AG.giorno);
  const opz = { mioId: vediTutti() ? null : visto().id, admin: eAdmin() };   // con «Tutti» il nome del partner su ogni riga
  const titoloGiorno = new Date(AG.giorno + 'T12:00:00Z').toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
  let html = `
    <div class="ag-testa"><h1>Agenda</h1>
      ${AG.giorno !== oggi ? '<button class="ag-oggi" id="ag-oggi">Oggi</button>' : ''}
      <button class="ag-piu" id="ag-nuovo" aria-label="Nuovo appuntamento">+</button></div>
    ${partnerSelect()}
    <button class="ag-mese">${esc(A.titoloMese(AG.giorno))} ▾<input type="date" id="ag-scegli" value="${AG.giorno}"></button>
    <div class="ag-settimana">
      <button class="freccia" id="ag-prima" aria-label="Settimana prima">‹</button>
      ${AG.settimana.map((g, i) => `<button class="ag-giorno ${g === AG.giorno ? 'scelto' : ''} ${g === oggi ? 'oggi' : ''}" data-giorno="${g}">
        <small>${A.GIORNI[i]}</small><b>${Number(g.slice(8))}</b><i class="${conEventi.has(g) ? 'si' : ''}"></i></button>`).join('')}
      <button class="freccia" id="ag-dopo" aria-label="Settimana dopo">›</button>
    </div>
    <div class="sotto">${esc(titoloGiorno)}</div>`;
  html += eventi.length ? eventi.map(e => eventoAgenda(e, opz)).join('')
    : `<div class="vuoto">Nessun appuntamento. Tocca <b>+</b> per fissarne uno.</div>`;
  const t = AG.telefonate;
  if (t && t.oggi) html += `<button class="ag-blocco telefonate" id="ag-telefonate"><span>📞 Telefonate del giorno · Fatte ${t.fatti_oggi} di ${t.contatti_al_giorno}</span><span>›</span></button>`;
  else if (t && t.rientri) html += `<button class="ag-blocco telefonate" id="ag-telefonate"><span>📞 ${t.rientri} ${t.rientri === 1 ? 'contatto rientra' : 'contatti rientrano'} in coda</span><span>›</span></button>`;
  if (AG.giorno === oggi && CONF.righe.length) html += `<button class="ag-blocco conferme" id="ag-conferme"><span>📅 ${CONF.righe.length} ${CONF.righe.length === 1 ? 'conferma' : 'conferme'} da fare</span><span>›</span></button>`;
  if (AG.passati.length) html += `<button class="ag-blocco passati" id="ag-passati"><span>⚠️ ${AG.passati.length} ${AG.passati.length === 1 ? 'appuntamento passato' : 'appuntamenti passati'} senza esito</span><span>›</span></button>`;
  app.innerHTML = html + versione();
  collegaAgenda(eventi);
}

function eventoAgenda(e, opz) {
  const A = MB21Agenda;
  const r = A.riga(e, opz);
  const aperta = AG.aperta === e.id;
  const [inizio, fine] = A.orario(e).split('–');
  let extra = '';
  if (aperta) {
    const richiamo = e.tipo_azione === 'Contatto' && !!e.data_scelta;   // dato dalla coda: si guarda, non si chiude qui
    const fasi = richiamo ? [] : A.fasiPer(e.categoria, e.tipo_azione, e.modalita);
    extra = `<div class="extra">
      ${e.ospite ? `<div class="note-ev">Ospite: ${esc(e.ospite)}</div>` : ''}
      ${e.note ? `<div class="note-ev">${esc(e.note)}</div>` : ''}
      ${richiamo ? `<div class="note-ev">Dalla coda: ${esc(e.esito || '')}</div>`
        : fasi.length ? `<div class="ag-esiti">${fasi.map(f => `<button data-esito="${esc(f)}" class="${e.esito === f && e.completata ? 'attuale' : ''}">${esc(f)}</button>`).join('')}</div>`
        : `<div class="note-ev">Nessun esito previsto per ${esc(e.categoria || 'questa categoria')} · ${esc(e.tipo_azione)}</div>`}
      <div class="ag-comandi">
        ${richiamo ? `<button data-cmd="fissa">＋ Fissa appuntamento</button>` : `<button data-cmd="sposta">🕑 Sposta</button><button data-cmd="modifica">✏️ Modifica</button>`}
        <button data-cmd="contatto">👤 Apri contatto</button>
        ${richiamo ? '' : `<button data-cmd="elimina" class="pericolo">Elimina</button>`}
      </div></div>`;
  }
  return `<div class="ag-evento" data-evento="${esc(e.id)}">
    <div class="ora">${esc(inizio)}${fine ? `<small>${esc(fine)}</small>` : ''}</div>
    <div class="barra-tipo" style="background:${r.colore}"></div>
    <div class="dentro"><button class="apri"><div class="t">${esc(r.titolo)}</div><div class="s">${esc(r.sotto)}</div>${e.portatoNome ? `<div class="s">${rigaPortato(e.portatoNome)}</div>` : ''}</button>${extra}</div>
  </div>`;
}

function collegaAgenda(eventi) {
  const A = MB21Agenda;
  const su = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  su('ag-oggi', () => apriAgenda(MB21Coda.oggiRoma()));
  su('ag-prima', () => apriAgenda(A.spostaGiorno(AG.giorno, -7)));
  su('ag-dopo', () => apriAgenda(A.spostaGiorno(AG.giorno, 7)));
  collegaPartnerSelect();
  su('ag-nuovo', () => (vediTutti() ? mostraToast('Con «Tutti» scegli prima il partner nel Partner Select') : nuovoAppuntamento({ giorno: AG.giorno })));
  su('ag-telefonate', () => { ST.tab = 'oggi'; mostraTab(); });
  su('ag-passati', scegliPassato);
  su('ag-conferme', () => { ST.tab = 'oggi'; mostraTab(); });
  const scegli = document.getElementById('ag-scegli');
  if (scegli) scegli.onchange = () => { if (scegli.value) apriAgenda(scegli.value); };
  app.querySelectorAll('.ag-giorno').forEach(b => {
    b.onclick = () => { AG.aperta = null; apriAgenda(b.dataset.giorno); };
  });
  app.querySelectorAll('.ag-evento').forEach(el => {
    const e = eventi.find(x => x.id === el.dataset.evento);
    el.querySelector('.apri').onclick = () => { AG.aperta = AG.aperta === e.id ? null : e.id; disegnaAgenda(); };
    el.querySelectorAll('[data-esito]').forEach(b => { b.onclick = () => chiudiAppuntamento(e, b.dataset.esito); });
    el.querySelectorAll('[data-cmd]').forEach(b => {
      b.onclick = () => {
        if (b.dataset.cmd === 'sposta') return spostaAppuntamento(e);
        if (b.dataset.cmd === 'modifica') return foglioAzione(e.id, { ritorno: null, dopo: () => apriAgenda() });
        if (b.dataset.cmd === 'elimina') return eliminaAppuntamento(e);
        if (b.dataset.cmd === 'contatto') return apriContattoDa(e.contatto_id);
        if (b.dataset.cmd === 'fissa') return nuovoAppuntamento({ giorno: A.partiRoma(e.quando).giorno, ora: A.partiRoma(e.quando).ora, contatto: { id: e.contatto_id, ...e.contatti } });
      };
    });
  });
}

async function apriContattoDa(id, ritorno) {
  LS.ritorno = ritorno || null;   // 'report' / 'griglia' / 'oggi': la freccia della scheda torna lì
  ST.tab = 'lista';
  document.querySelectorAll('#tab button').forEach(b => b.classList.toggle('attiva', b.dataset.tab === 'lista'));
  if (!LS.righe.find(x => x.id === id)) {   // lista mai letta o senza questo contatto
    app.innerHTML = `<h1>Lista Nomi</h1><div class="vuoto">Carico il contatto…</div>`;
    try { LS.righe = await leggiLista(); } catch (e) { return mostraToast('Contatto non caricato: riprova.'); }
  }
  apriScheda(id);
}

// Esito di un appuntamento (decisione C: poi si chiede sempre il prossimo, con «Salta»)
async function chiudiAppuntamento(e, esito) {
  const { data: prima, error } = await dbq('chiudi appuntamento', supa.rpc('chiudi_appuntamento', { p_azione: e.id, p_esito: esito }));
  if (error) return mostraToast('Non salvato: controlla la connessione e riprova.');
  const annulla = async creato => {
    const { error: e2 } = await dbq('riapri appuntamento', supa.rpc('riapri_appuntamento', {
      p_azione: e.id, p_esito: prima.esito_prec, p_completata: prima.completata_prec, p_contatto: prima.contatto_id,
      p_rientro: prima.rientro_prec, p_in_coda: prima.in_coda_prec, p_rientro_cambiato: prima.rientro_cambiato }));
    if (!e2 && creato) await dbq('annulla prossimo', supa.from('azioni').delete().eq('id', creato.id));
    if (e2) return mostraToast('Annullamento non riuscito: riprova.');
    await apriAgenda();
    mostraToast('Annullato');
  };
  AG.aperta = null;
  const creato = await nuovoAppuntamento({
    titolo: `${esito} · ${e.contatti ? e.contatti.nome : ''}`, sottotitolo: 'Fissa il prossimo appuntamento', salta: true,
    giorno: MB21Agenda.spostaGiorno(MB21Coda.oggiRoma(), 1),
    contatto: { id: e.contatto_id, ...e.contatti }, tipo: e.tipo_azione, modalita: e.modalita, area: e.area, userId: e.user_id,
  });
  await apriAgenda();
  mostraToast(creato ? `${esito} · prossimo appuntamento fissato` : `${esito} salvato`, () => annulla(creato));
}

// Sposta un appuntamento (inizio/fine) o un esito dalla coda (data_scelta). `dopo(giorno)`: cosa ridisegnare
// (predefinito: l'Agenda su quel giorno). Spostando, la conferma torna da fare.
function spostaAppuntamento(e, dopo) {
  const A = MB21Agenda;
  const dallaCoda = e.tipo_azione === 'Contatto' && !!e.data_scelta;
  const quando = dallaCoda ? e.data_scelta : e.inizio;
  const { giorno, ora } = A.partiRoma(quando);
  const durata = !dallaCoda && e.fine ? (Date.parse(e.fine) - Date.parse(e.inizio)) : 0;
  dopo = dopo || (async g => { AG.aperta = e.id; await apriAgenda(g); });
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `<div class="foglio"><h3>🕑 Sposta</h3><p>${esc(A.riga(e, { mioId: ST.utente.id, admin: false }).titolo)}</p>
    <div class="ag-due-campi"><input id="sp-giorno" type="date" value="${giorno}"><input id="sp-ora" type="time" value="${ora}"></div>
    <div class="due"><button class="link" id="sp-no">Annulla</button><button class="primario" id="sp-si">Sposta</button></div></div>`;
  document.body.appendChild(velo);
  velo.onclick = ev => { if (ev.target === velo) velo.remove(); };
  velo.querySelector('#sp-no').onclick = () => velo.remove();
  velo.querySelector('#sp-si').onclick = async () => {
    const g = velo.querySelector('#sp-giorno').value, o = velo.querySelector('#sp-ora').value;
    if (!g || !o) return;
    const nuovaData = A.isoDaRoma(g, o);
    const nuovo = dallaCoda ? { data_scelta: nuovaData, confermato_il: null }
      : { inizio: nuovaData, fine: durata ? new Date(Date.parse(nuovaData) + durata).toISOString() : null, confermato_il: null };
    const prima = dallaCoda ? { data_scelta: e.data_scelta, confermato_il: e.confermato_il || null }
      : { inizio: e.inizio, fine: e.fine, confermato_il: e.confermato_il || null };
    velo.remove();
    const { error } = await dbq('sposta appuntamento', supa.from('azioni').update(nuovo).eq('id', e.id));
    if (error) return mostraToast('Non spostato: controlla la connessione e riprova.');
    await dopo(g);
    mostraToast(`Spostato a ${g.split('-').reverse().join('/')} ${o}`, async () => {
      await dbq('annulla sposta', supa.from('azioni').update(prima).eq('id', e.id));
      await dopo(giorno);
    });
  };
}

async function eliminaAppuntamento(e) {
  if (!confirm('Eliminare questo appuntamento?')) return;
  const { error } = await dbq('elimina appuntamento', supa.from('azioni').delete().eq('id', e.id));
  if (error) return mostraToast('Non eliminato: controlla la connessione e riprova.');
  AG.aperta = null;
  await apriAgenda();
  const copia = { ...e };
  for (const k of ['quando', 'contatti', 'utenti', 'chiave']) delete copia[k];
  mostraToast('Appuntamento eliminato', async () => {
    await dbq('ripristina appuntamento', supa.from('azioni').insert(copia));
    await apriAgenda();
  });
}

function scegliPassato() {
  const A = MB21Agenda, opz = { mioId: vediTutti() ? null : visto().id, admin: eAdmin() };
  const velo = document.createElement('div');
  velo.className = 'velo';

    <p>Tocca un appuntamento per dargli l'esito.</p>
    <div class="altri-voci">${AG.passati.map(e => { const r = A.riga(e, opz), p = A.partiRoma(e.inizio);
      return `<button data-id="${esc(e.id)}"><b>${esc(p.giorno.split('-').reverse().join('/'))} ${esc(p.ora)}</b> · ${esc(r.titolo)}</button>`; }).join('')}</div></div>`;

let contattiMiei = null;   // per l'elenco del nuovo appuntamento: solo i nomi del partner scelto (Partner Select; «Tutti» = sé stesso)
async function leggiContattiMiei() {
  if (contattiMiei) return contattiMiei;
  const righe = [];
  for (let da = 0; ; da += 1000) {
    const { data, error } = await dbq('contatti per appuntamento', supa.from('contatti').select('id, nome, categoria')
      .eq('user_id', visto().id).neq('categoria', 'Archiviato').order('nome').range(da, da + 999));
    if (error) throw error;
    righe.push(...data);
    if (data.length < 1000) break;
  }
  return (contattiMiei = righe);
}

// Foglio «Nuovo appuntamento» (lavoro 4). Restituisce l'id creato o null.
// opz: { giorno, ora, contatto:{id,nome,categoria}, categoria, tipo, modalita, area, titolo, sottotitolo, salta, resta, userId }
// Restituisce { id, inizio } o null. `salta`: il bottone in basso dice «Salta»; `salta`/`resta`: non si va in Agenda dopo il salvataggio.
async function nuovoAppuntamento(opz = {}) {
  const A = MB21Agenda;
  let elenco = [];
  if (!opz.contatto) {
    try { elenco = await leggiContattiMiei(); } catch (e) { mostraToast('Contatti non caricati: riprova.'); return null; }
  }
  const st = {
    contatto: opz.contatto || null, categoria: opz.categoria || (opz.contatto ? opz.contatto.categoria : null), categoriaToccata: false,
    area: opz.area && ['Attività', 'Prodotti'].includes(opz.area) ? opz.area : 'Attività',
    tipo: opz.tipo || null, modalita: opz.tipo ? opz.modalita : null, durata: 60, portato: null,
  };
  if (st.tipo && !A.tipiPer(st.categoria).includes(st.tipo)) { st.tipo = null; st.modalita = null; }
  const eventiGiorno = A.eventiDelGiorno(AG.azioni, opz.giorno || MB21Coda.oggiRoma());
  const oraIniziale = opz.ora || A.oraProposta(eventiGiorno, opz.giorno || MB21Coda.oggiRoma(), new Date().toISOString());
  return new Promise(risolvi => {
    const velo = document.createElement('div');
    velo.className = 'velo';
    velo.innerHTML = `<div class="foglio alto">
      <div class="testa-foglio"><h3>${esc(opz.titolo || 'Nuovo appuntamento')}</h3><button id="na-x" aria-label="Chiudi">×</button></div>
      ${opz.sottotitolo ? `<p>${esc(opz.sottotitolo)}</p>` : ''}
      <div id="na-corpo"></div>
      <div class="errore" id="na-errore"></div>
      <div class="due"><button class="link" id="na-no">${opz.salta ? 'Salta' : 'Annulla'}</button><button class="primario" id="na-si">Salva</button></div></div>`;
    document.body.appendChild(velo);
    const chiudi = valore => { velo.remove(); risolvi(valore); };
    velo.querySelector('#na-x').onclick = () => chiudi(null);
    velo.querySelector('#na-no').onclick = () => chiudi(null);
    const campi = { giorno: opz.giorno || MB21Coda.oggiRoma(), ora: oraIniziale, ospite: '', note: '' };
    const scelte = (nome, voci, attuale, etichette) => `<div class="ag-scelte" data-scelta="${nome}">${voci.map((v, i) =>
      `<button data-v="${esc(v)}" class="${String(v) === String(attuale) ? 'scelto' : ''}">${esc(etichette ? etichette[i] : v)}</button>`).join('')}</div>`;
    const leggiCampi = () => { for (const k of ['giorno', 'ora', 'ospite', 'note']) { const el = velo.querySelector('#na-' + k); if (el) campi[k] = el.value; } };
    function disegna() {
      const tipi = A.tipiPer(st.categoria);
      let h = '';
      h += st.contatto && opz.contatto
        ? `<div class="campo"><label>Contatto</label><div class="banner">${esc(st.contatto.nome)}</div></div>`
        : `<div class="campo"><label>Contatto <small>Obbligatorio</small></label>
            <input id="na-contatto" list="na-nomi" placeholder="Scrivi il nome" value="${esc(st.contatto ? st.contatto.nome : '')}" autocomplete="off">
            <datalist id="na-nomi">${elenco.map(c => `<option value="${esc(c.nome)}">`).join('')}</datalist></div>`;
      if (st.contatto) {
        h += `<div class="campo"><label>Categoria <small>dal contatto</small></label>${scelte('categoria', A.CATEGORIE, st.categoria)}
          ${!tipi.length ? `<div class="errore">${esc(st.categoria || 'Senza categoria')}: nessun appuntamento. Scegli Prospect, Partner o Cliente.</div>` : ''}</div>`;
      }
      if (tipi.length) {
        h += `<div class="campo"><label>Area</label>${scelte('area', ['Attività', 'Prodotti'], st.area)}</div>`;
        h += `<div class="campo"><label>Tipo di azione <small>Obbligatorio</small></label>${scelte('tipo', tipi, st.tipo)}</div>`;
      }
      if (st.tipo) {
        h += `<div class="campo"><label>${esc(A.etichettaSottotipo(st.tipo))} <small>Obbligatorio</small></label>${scelte('modalita', A.sottotipiPer(st.tipo), st.modalita)}</div>`;
        h += `<div class="campo"><label>Giorno e ora <small>Obbligatorio</small></label><div class="ag-due-campi">
          <input id="na-giorno" type="date" value="${esc(campi.giorno)}"><input id="na-ora" type="time" value="${esc(campi.ora)}"></div></div>`;
        h += `<div class="campo"><label>Durata</label>${scelte('durata', A.DURATE.map(d => d[0]), st.durata, A.DURATE.map(d => d[1]))}</div>`;
        if (A.conOspite(st.tipo)) h += `<div class="campo"><label>Portato da</label><div class="fa-persona"><span>${st.portato ? esc(st.portato.nome) : '<span style="color:var(--grigio)">nessuno</span>'}</span>
          ${st.portato ? '<button class="link" id="na-togli-portato" aria-label="Togli">×</button>' : '<button class="link" id="na-portato">＋ Scegli</button>'}</div></div>`;
        h += `<div class="campo"><label>Note</label><input id="na-note" maxlength="100" placeholder="Scrivi qualcosa da ricordare" value="${esc(campi.note)}"></div>`;
      }
      velo.querySelector('#na-corpo').innerHTML = h;
      const bp = velo.querySelector('#na-portato'), tp = velo.querySelector('#na-togli-portato');
      if (bp) bp.onclick = async () => { leggiCampi(); const c = await sceltaContatto('Portato da', '', st.contatto ? [st.contatto.id] : []); if (c) { st.portato = c; disegna(); } };
      if (tp) tp.onclick = () => { leggiCampi(); st.portato = null; disegna(); };
      const inp = velo.querySelector('#na-contatto');
      if (inp) inp.onchange = () => {
        const trovato = elenco.find(c => c.nome.toLowerCase() === inp.value.trim().toLowerCase());
        st.contatto = trovato || null; st.categoria = trovato ? trovato.categoria : null;
        if (!A.tipiPer(st.categoria).includes(st.tipo)) { st.tipo = null; st.modalita = null; }
        leggiCampi(); disegna();
      };
      velo.querySelectorAll('[data-scelta]').forEach(g => g.querySelectorAll('button').forEach(b => {
        b.onclick = () => {
          leggiCampi();
          const nome = g.dataset.scelta, v = b.dataset.v;
          if (nome === 'durata') st.durata = Number(v);
          else st[nome] = v;
          if (nome === 'categoria') st.categoriaToccata = true;
          if (nome === 'categoria' && !A.tipiPer(v).includes(st.tipo)) { st.tipo = null; st.modalita = null; }
          if (nome === 'tipo') st.modalita = null;
          disegna();
        };
      }));
    }
    disegna();
    velo.querySelector('#na-si').onclick = async () => {
      leggiCampi();
      const v = { contatto_id: st.contatto && st.contatto.id, categoria: st.categoria, area: st.area, tipo_azione: st.tipo, modalita: st.modalita,
        giorno: campi.giorno, ora: campi.ora, ospite: A.conOspite(st.tipo) ? campi.ospite.trim() : '', note: campi.note.trim() };
      const errore = A.validaAppuntamento(v);
      if (errore) { velo.querySelector('#na-errore').textContent = errore; return; }
      const inizio = A.isoDaRoma(v.giorno, v.ora);
      const riga = { contatto_id: v.contatto_id, user_id: opz.userId || visto().id, categoria: v.categoria, tipo_azione: v.tipo_azione,
        modalita: v.modalita, area: v.area, inizio, fine: new Date(Date.parse(inizio) + st.durata * 60000).toISOString(),
        completata: false, portato_da: A.conOspite(st.tipo) && st.portato && st.portato.id !== v.contatto_id ? st.portato.id : null, note: v.note || null };
      const btn = velo.querySelector('#na-si');
      btn.disabled = true; btn.textContent = 'Salvo…';
      if (st.categoriaToccata && st.contatto.categoria !== v.categoria) {   // come in Glide la categoria scelta vale per il contatto
        const { error: ec } = await dbq('categoria contatto', supa.from('contatti').update({ categoria: v.categoria }).eq('id', v.contatto_id));
        if (ec) { btn.disabled = false; btn.textContent = 'Salva'; velo.querySelector('#na-errore').textContent = 'Non salvato: riprova.'; return; }
        contattiMiei = null; LS.righe = [];
      }
      const { data, error } = await dbq('nuovo appuntamento', supa.from('azioni').insert(riga).select('id').single());
      if (error) { btn.disabled = false; btn.textContent = 'Salva'; velo.querySelector('#na-errore').textContent = 'Non salvato: controlla la connessione e riprova.'; return; }
      chiudi({ id: data.id, inizio });
      if (!opz.salta && !opz.resta) {
        AG.aperta = data.id;
        await apriAgenda(v.giorno);
        mostraToast('Appuntamento fissato', async () => {
          await dbq('annulla nuovo', supa.from('azioni').delete().eq('id', data.id));
          await apriAgenda();
        });
      }
    };
  });
}

// ── LISTA NOMI (Fase 2) ──────────────────────────────────
// Copia della tab Lista Nomi di Glide (docs/MB21_v3_Lista_come_e.md) con le decisioni di Ignazio del 14/09.
// La logica pura sta in lista.js; qui lettura/scrittura e disegno.
const BLOCCO = 40;                                    // card disegnate per volta, scorrendo se ne aggiungono
const LS = { righe: [], targhe: {}, coppie: null, filtro: 'lista', testo: '', mostrate: BLOCCO, contatto: null, sezione: 'dati' };
const eAdmin = () => ST.utente && ST.utente.ruolo === 'Admin';

async function leggiLista() {
  const righe = [];
  for (let da = 0; ; da += 1000) {
    const { data, error } = await dbq('lettura lista',
      supa.from('contatti_lista').select('*').order('id').range(da, da + 999));
    if (error) throw error;
    righe.push(...data);
    if (data.length < 1000) return righe;
  }
}

// Targhette BBS · WES · CEP della Lista: biglietti per eventi non ancora passati, periodi CEP, coppie collegate.
// Se la lettura non riesce la Lista si apre lo stesso, senza targhette colorate.
async function leggiTarghe() {
  const oggi = MB21Coda.oggiRoma();
  const [big, cep, coppie, bbs, wes] = await Promise.all([
    dbq('targhe biglietti', supa.from('biglietti').select('contatto_id, tipo, evento, contatto, compagno, ospiti').limit(10000)),
    dbq('targhe CEP', supa.from('cep').select('contatto_id, dal, uscito_il').limit(5000)),
    dbq('targhe coppie', supa.from('contatti').select('id, compagno_id, compagno_nome')
      .or('compagno_id.not.is.null,compagno_nome.not.is.null').limit(5000)),
    dbq('targhe BBS', supa.from('bbs').select('data')),
    dbq('targhe Wes', supa.from('wes').select('data')),
  ]);
  if (big.error || cep.error || coppie.error || bbs.error || wes.error) return {};
  LS.coppie = {};
  for (const r of coppie.data) LS.coppie[r.id] = r;
  return MB21Lista.targhePerContatto(big.data, cep.data, coppie.data, oggi, { bbs: MB21Lista.eventoAttivo(bbs.data), wes: MB21Lista.eventoAttivo(wes.data) });
}

async function apriLista() {
  LS.contatto = null;
  app.innerHTML = `<h1>Lista Nomi</h1><div class="vuoto">Carico i nomi…</div>`;
  try { [LS.righe, LS.targhe] = await Promise.all([leggiLista(), leggiTarghe()]); }
  catch (e) {
    app.innerHTML = `<h1>Lista Nomi</h1><div class="avviso">Non riesco a caricare i nomi. Controlla la connessione e riprova.</div>${versione()}`;
    return;
  }
  disegnaLista();
}

// Nomi di chi è scelto nel Partner Select (un partner o l'elenco di «Tutti»)
const utentiLista = () => (vediTutti() ? idVisti() : visto().id);

function coloreCategoria(c) { return COLORI[c] || 'var(--unlinked)'; }
// Targhetta NEW: contatto creato dentro l'app negli ultimi 30 giorni (richiesta di Ignazio 16/09)

function disegnaLista() {

  app.innerHTML = `
    <h1>Lista Nomi</h1>
    ${partnerSelect()}
    <div class="banner">${guardoAltri() ? `${esc(nomeVisto())}: ` : 'Hai '}un totale di <b>${totale.toLocaleString('it-IT')}</b> contatti registrati</div>
    <button class="nuovo" id="nuovo">+ Nuovo Contatto</button>
    <div class="chips">
      ${chip('lista')}${chip('prospect')}${chip('partner')}${chip('clienti')}
      <button id="altri" class="${f.altri ? 'scelto' : ''}">${altriScelto}</button>
    </div>
    <div class="cerca">
      <input id="cerca" type="search" placeholder="Cerca" value="${esc(LS.testo)}" autocomplete="off">
      <button id="svuota" ${LS.testo ? '' : 'hidden'} aria-label="Svuota">×</button>
    </div>
    <div id="elenco"></div>
    <div id="fondo"></div>
    ${versione()}`;
  collegaPartnerSelect();
  document.getElementById('nuovo').onclick = () => apriModulo(null);
  app.querySelectorAll('.chips button[data-filtro]').forEach(b => b.onclick = () => { LS.filtro = b.dataset.filtro; LS.mostrate = BLOCCO; disegnaLista(); });

  const cerca = document.getElementById('cerca');

    LS.testo = cerca.value; LS.mostrate = BLOCCO;
    document.getElementById('svuota').hidden = !LS.testo;
    disegnaElenco();
  };
  document.getElementById('svuota').onclick = () => { LS.testo = ''; disegnaLista(); };
  disegnaElenco();
}

function disegnaElenco() {
  const trovati = MB21Lista.filtraContatti(LS.righe, { filtro: LS.filtro, testo: LS.testo, utenteId: utentiLista(), admin: eAdmin(), oggi: MB21Coda.oggiRoma() });
  const elenco = document.getElementById('elenco');
  if (!elenco) return;
  elenco.innerHTML = trovati.length
    ? trovati.slice(0, LS.mostrate).map(cardNome).join('')
    : `<div class="vuoto">${LS.testo ? 'Nessun nome trovato.' : 'Nessun nome qui.'}</div>`;
  elenco.querySelectorAll('.cn').forEach(c => {
    c.onclick = e => { if (!e.target.closest('a, .menu')) apriScheda(c.dataset.id); };
  });
  elenco.querySelectorAll('.cn .menu').forEach(b => b.onclick = () => menuCard(b.dataset.id));
  // caricamento a blocchi: quando il fondo entra nello schermo, altre card
  const fondo = document.getElementById('fondo');
  if (LS.osservatore) LS.osservatore.disconnect();
  if (trovati.length > LS.mostrate) {
    LS.osservatore = new IntersectionObserver(voci => {
      if (voci.some(v => v.isIntersecting)) { LS.mostrate += BLOCCO; disegnaElenco(); }
    }, { rootMargin: '400px' });
    LS.osservatore.observe(fondo);
  }
}

// Foglio con un elenco di voci; restituisce la voce scelta (o null)
function sceltaDa(titolo, voci) {
  return new Promise(risolvi => {
    const velo = document.createElement('div');
    velo.className = 'velo';
    velo.innerHTML = `<div class="foglio"><h3>${esc(titolo)}</h3><div class="altri-voci">
      ${voci.map((v, i) => `<button data-i="${i}" class="${v.pericolo ? 'pericolo' : ''}">${esc(v.etichetta)}</button>`).join('')}
      </div><button class="link" id="scelta-no">Annulla</button></div>`;
    document.body.appendChild(velo);
    const chiudi = v => { velo.remove(); risolvi(v); };
    velo.onclick = e => { if (e.target === velo) chiudi(null); };
    velo.querySelector('#scelta-no').onclick = () => chiudi(null);
    velo.querySelectorAll('.altri-voci button').forEach(b => b.onclick = () => chiudi(voci[Number(b.dataset.i)]));
  });
}

async function menuCard(id) {
  if (soloGuardo()) return;

        </div>

          ${link('https://wa.me/' + cifre, 'WhatsApp')}${link('https://t.me/' + (tel || ''), 'Telegram')}
        </div>
        ${eAdmin() && c.user_id !== ST.utente.id ? `<div class="sotto" style="margin:10px 0 0">Nome di ${esc(c.partner)}</div>` : ''}
      </div>
    </div>
    <div class="sezioni">${sezioniPer(c).map(([k, t]) => `<button data-s="${k}" class="${LS.sezione === k ? 'scelto' : ''}">${t}</button>`).join('')}

// Coppia (cantiere 18, Ignazio 16/09): marito, moglie o compagno/a per qualsiasi contatto.
// Scheda della lista collegata nei due sensi (`collega_compagno`) oppure nome e telefono a mano.
// Con la scheda collegata i segni vitali della coppia valgono per tutte e due.
async function riquadroCoppia(c) {
  let SV;
  try { SV = await segniDellaScheda(c); } catch (e) { return; }
  const box = document.getElementById('coppia');
  if (!box || LS.contatto !== c || LS.sezione !== 'dati') return;
  const a = SV.ana, archiviato = c.categoria === 'Archiviato';
  const chi = SV.compagno
    ? `<button class="sv-link" id="cp-apri">${esc(SV.compagno.nome)} ›</button>`
    : a.compagno_nome || a.compagno_telefono
      ? `<span>${esc(a.compagno_nome || '')}${a.compagno_telefono ? ` <small class="sotto">${esc(a.compagno_telefono)}</small>` : ''}</span>`
      : '<span class="sotto" style="margin:0">—</span>';
  const presente = SV.compagno || a.compagno_nome || a.compagno_telefono;
  box.innerHTML = `<div class="riquadro sv-comp"><span class="sotto" style="margin:0">Coppia con</span>${chi}
    ${archiviato ? '' : `<button class="sv-piu" id="cp-cambia">${presente ? 'Cambia' : 'Collega'}</button>`}</div>`;

  const apri = document.getElementById('cp-apri');
  if (apri) apri.onclick = () => apriContattoDa(SV.compagno.id, LS.ritorno);

  const cambia = document.getElementById('cp-cambia');
  if (cambia) cambia.onclick = async () => {
    if (soloGuardo()) return;
    const scelta = await scegliScheda({ titolo: 'Coppia con', userId: c.user_id, escludi: c.id,
      mano: presente ? 'Non è in lista (o togli il collegamento): scrivo nome e telefono' : 'Non è in lista: scrivo nome e telefono' });
    if (!scelta) return;
    if (scelta === 'mano') {
      const v = await moduloSemplice('Coppia con (non in lista)', [
        { k: 'nome', etichetta: 'Nome e cognome (vuoto = nessuno)', tipo: 'text', valore: a.compagno_nome || '' },
        { k: 'telefono', etichetta: 'Telefono', tipo: 'tel', valore: a.compagno_telefono || '' },
      ]);
      if (!v) return;
      if (SV.compagno) {
        const { error } = await dbq('scollega compagno', supa.rpc('collega_compagno', { p_contatto: c.id, p_compagno: null }));
        if (error) return mostraToast('Non salvato: riprova.');
      }
      const { error } = await dbq('salva compagno', supa.from('contatti')
        .update({ compagno_nome: v.nome.trim() || null, compagno_telefono: v.telefono.trim() || null }).eq('id', c.id));
      if (error) return mostraToast('Non salvato: riprova.');
      mostraToast(v.nome.trim() || v.telefono.trim() ? 'Salvato' : 'Collegamento tolto');
    } else {
      const { error } = await dbq('collega compagno', supa.rpc('collega_compagno', { p_contatto: c.id, p_compagno: scelta.id }));
      if (error) return mostraToast('Non collegato: riprova.');
      mostraToast(`Coppia con ${scelta.nome}`);
    }
    LS.sv = null; LS.svLettura = null; LS.coppie = null;   // la coppia è cambiata: si rilegge
    leggiTarghe().then(t => { LS.targhe = t; }).catch(() => {});
    riquadroCoppia(c);
    segniDellaScheda(c).then(mostraTarghe).catch(() => {});
  };
}

// «Azione +»: gli stessi bottoni esito della Dashboard, stesso codice e stesso Annulla
async function azionePiu() {
  if (soloGuardo()) return;
  const c = LS.contatto;
  const scelta = await sceltaDa('Nuova azione · ' + c.nome, bottoniPer(c.categoria).map(b => ({ etichetta: b.etichetta, b })));
  if (!scelta) return;
  let data = null, appuntamento = null;
  if (scelta.b.classe === 'appuntamento') {
    appuntamento = await appuntamentoDaCoda(c);
    if (!appuntamento) return;
    data = appuntamento.inizio;
  } else if (scelta.b.data) { data = await chiediData(scelta.b, c.nome); if (!data) return; }
  const { data: esito, error } = await registraEsito(c.id, scelta.b, data, false);
  if (error) {
    if (appuntamento) await dbq('togli appuntamento', supa.from('azioni').delete().eq('id', appuntamento.id));
    return mostraToast('Non salvato: controlla la connessione e riprova.');
  }
  if (appuntamento) esito.appuntamento_id = appuntamento.id;
  LS.azioni = null;
  await ricaricaERidisegna();
  mostraToast(`${c.nome} · ${scelta.b.etichetta}`, async () => {
    const { error: e2 } = await annullaEsito(esito);
    if (e2) return mostraToast('Annullamento non riuscito: riprova.');
    LS.azioni = null;
    await ricaricaERidisegna();
    mostraToast('Annullato');
  });
}

    const { fatti, totale } = MB21Lista.contatoreOnboarding(c);
