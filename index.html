      <div class="riquadro"><div style="display:flex;justify-content:space-between;font-weight:700">
        <span>Passi di base per il successo</span><span id="conta-onb">${fatti}/${totale}</span></div>
        <div class="barra"><div style="width:${Math.round(fatti / totale * 100)}%"></div></div></div>
      <div class="riquadro">${MB21Lista.PASSI_ONBOARDING.map(([col, nome, descr]) => `
        <label class="interruttore"><span><b>${esc(nome)}</b><small>${esc(descr)}</small></span>
          <input type="checkbox" data-passo="${col}" ${c[col] ? 'checked' : ''} ${c.categoria === 'Archiviato' ? 'disabled' : ''}></label>`).join('')}
      </div>`;
    box.querySelectorAll('[data-passo]').forEach(i => i.onchange = async () => {
      if (soloGuardo()) { i.checked = !i.checked; return; }
      const col = i.dataset.passo;
      const { error } = await dbq('onboarding', supa.from('contatti').update({ [col]: i.checked }).eq('id', c.id));
      if (error) { i.checked = !i.checked; return mostraToast('Non salvato: riprova.'); }
      c[col] = i.checked;
      const riga = LS.righe.find(x => x.id === c.id);
      if (riga) riga[col] = i.checked;
      disegna();
    });
  };
  disegna();
}

// Segni vitali sulla persona (cantiere 18): compagno/a, biglietti BBS e WES, CEP.
// Compagno/a: una scheda della lista collegata nei due sensi (`collega_compagno`) oppure nome e telefono a mano.
// Con la scheda collegata i biglietti e il CEP della coppia si vedono e si modificano da tutte e due le schede.
// Biglietti, CEP e date dei BBS li scrive solo l'Admin; il compagno/a chi può modificare il contatto.
// Nome per un confronto esatto senza maiuscole (ilike senza caratteri jolly)
const nomeEsatto = nome => String(nome || '').trim().replace(/[\\%_]/g, x => '\\' + x);

async function caricaSegni(c) {
  const { data: ana, error } = await dbq('compagno', supa.from('contatti')
    .select('compagno_id, compagno_nome, compagno_telefono, codice_amway').eq('id', c.id).maybeSingle());
  if (error || !ana) throw error || new Error('contatto');
  // Regola di Ignazio (16/09): i segni vitali di una persona si scrivono su una scheda sola.
  // Per un partner vale la scheda col codice Amway: se è un'altra (stesso nome, altra lista) questa rimanda lì
  let ufficiale = null;
  if (!ana.codice_amway) {
    const r = await dbq('scheda col codice', supa.from('contatti').select('id, user_id, utenti(nome)')
      .not('codice_amway', 'is', null).neq('id', c.id).ilike('nome', nomeEsatto(c.nome)).limit(1));
    if (r.data && r.data.length) ufficiale = { id: r.data[0].id, lista: r.data[0].utenti ? r.data[0].utenti.nome : '' };
  }
  let compagno = null;
  if (ana.compagno_id) {
    const r = await dbq('scheda del compagno', supa.from('contatti').select('id, nome, categoria').eq('id', ana.compagno_id).maybeSingle());
    compagno = r.data || null;
  }
  const ids = [c.id, compagno && compagno.id].filter(Boolean);
  const [big, cep, bbs, wes] = await Promise.all([
    dbq('biglietti', supa.from('biglietti').select('*').in('contatto_id', ids)),
    dbq('cep', supa.from('cep').select('*').in('contatto_id', ids).order('dal', { ascending: false })),
    dbq('date dei BBS', supa.from('bbs').select('data').order('data')),
    dbq('date dei Wes', supa.from('wes').select('data').order('data')),
  ]);
  if (big.error || cep.error || bbs.error || wes.error) throw big.error || cep.error || bbs.error || wes.error;
  return { id: c.id, ana, compagno, ufficiale, biglietti: big.data, cep: cep.data, cepNuovo: false,
    date: { BBS: bbs.data.map(x => x.data), WES: wes.data.map(x => x.data) },
    attivi: { bbs: MB21Lista.eventoAttivo(bbs.data), wes: MB21Lista.eventoAttivo(wes.data) } };
}

// t: accese sì/no · numeri (facoltativo, Mappa): totale del gruppo scritto dentro la targhetta se sopra zero
function targheHtml(t, numeri) {
  return ['bbs', 'wes', 'cep'].map(k => `<span class="sv-targa ${k} ${t && t[k] ? 'on' : ''}">${k.toUpperCase()}${
    numeri && numeri[k] ? ' ' + numeri[k] : ''}</span>`).join('');
}
function mostraTarghe(SV) {
  const el = document.getElementById('sv-targhe');
  if (!SV || !LS.contatto || SV.id !== LS.contatto.id) return;
  const t = MB21Lista.targheSegni(SV.biglietti, SV.cep, MB21Coda.oggiRoma(), SV.attivi);
  LS.targhe = LS.targhe || {};
  for (const id of [SV.id, SV.compagno && SV.compagno.id]) if (id) LS.targhe[id] = t;
  if (el) el.innerHTML = targheHtml(t);
}
function segniDellaScheda(c) {   // una lettura sola per scheda: targhette e sezione la condividono
  if (LS.sv && LS.sv.id === c.id) return Promise.resolve(LS.sv);
  if (LS.svLettura && LS.svLettura.id === c.id) return LS.svLettura.promessa;
  const promessa = caricaSegni(c).then(SV => { if (LS.contatto && LS.contatto.id === c.id) LS.sv = SV; return SV; })
    .finally(() => { if (LS.svLettura && LS.svLettura.promessa === promessa) LS.svLettura = null; });
  LS.svLettura = { id: c.id, promessa };
  return promessa;
}

// Foglio per scegliere una scheda della lista di `userId` (compagno/a, partner della Mappa).
// opz: { titolo, sottotitolo, userId, escludi, mano (testo del bottone «non è in lista») }. Restituisce {id, nome} · 'mano' · null
function scegliScheda(opz) {
  return new Promise(risolvi => {
    const velo = document.createElement('div');
    velo.className = 'velo';
    velo.innerHTML = `<div class="foglio alto">
      <div class="testa-foglio"><h3>${esc(opz.titolo)}</h3><button id="sc-x" aria-label="Chiudi">×</button></div>
      ${opz.sottotitolo ? `<p>${esc(opz.sottotitolo)}</p>` : ''}
      <div class="campo"><label>Cerca nella lista</label><input id="sc-cerca" type="search" placeholder="Nome o cognome" autocomplete="off"></div>
      <div id="sc-elenco" class="sc-elenco"></div>
      ${opz.mano ? `<button class="link" id="sc-mano" style="width:100%">${esc(opz.mano)}</button>` : ''}</div>`;
    document.body.appendChild(velo);
    const chiudi = v => { velo.remove(); risolvi(v); };
    velo.querySelector('#sc-x').onclick = () => chiudi(null);
    if (opz.mano) velo.querySelector('#sc-mano').onclick = () => chiudi('mano');
    const input = velo.querySelector('#sc-cerca'), elenco = velo.querySelector('#sc-elenco');
    let giro = 0;
    input.oninput = async () => {
      const testo = input.value.trim(), mio = ++giro;
      if (testo.length < 2) { elenco.innerHTML = ''; return; }
      let q = supa.from('contatti').select('id, nome, categoria').eq('user_id', opz.userId);
      if (opz.escludi) q = q.neq('id', opz.escludi);
      const { data, error } = await dbq('cerca scheda', q.ilike('nome', `%${testo.replace(/[%_,]/g, ' ')}%`).order('nome').limit(15));
      if (mio !== giro) return;
      if (error) { elenco.innerHTML = '<div class="sotto">Ricerca non riuscita: riprova.</div>'; return; }
      elenco.innerHTML = data.length
        ? data.map(r => `<button data-id="${esc(r.id)}"><b>${esc(r.nome)}</b> <small>${esc(r.categoria || 'Senza categoria')}</small></button>`).join('')
        : '<div class="sotto">Nessun nome trovato</div>';
      elenco.querySelectorAll('[data-id]').forEach(b => b.onclick = () => chiudi(data.find(r => r.id === b.dataset.id)));
    };
    setTimeout(() => input.focus(), 50);
  });
}

async function sezioneSegni() {
  const c = LS.contatto;
  const box = document.getElementById('sezione');
  let SV;
  if (!(LS.sv && LS.sv.id === c.id)) box.innerHTML = '<div class="vuoto">Carico…</div>';
  try { SV = await segniDellaScheda(c); } catch (e) {
    if (LS.contatto === c) box.innerHTML = '<div class="vuoto">Segni vitali non caricati: riprova.</div>';
    return;
  }
  if (LS.contatto !== c || LS.sezione !== 'segni') return;
  const admin = eAdmin(), archiviato = c.categoria === 'Archiviato';
  const dis = admin && !archiviato ? '' : 'disabled';
  const primo = n => String(n || '').trim().split(/\s+/)[0] || '';
  const breve = d => MB21Lista.etichettaEvento(d);
  const nomeDi = id => (id === c.id ? c.nome : SV.compagno && SV.compagno.id === id ? SV.compagno.nome : '');
  // l'altra persona della coppia rispetto a chi ha il biglietto
  const altroDi = b => SV.compagno
    ? (b.contatto_id === c.id ? SV.compagno.nome : c.nome)
    : SV.ana.compagno_nome || (b.compagno ? 'Compagno/a' : '');

  const riquadroEventi = tipo => {
    const k = tipo.toLowerCase();
    const miei = SV.biglietti.filter(b => b.tipo === tipo).sort((a, b) => b.evento.localeCompare(a.evento));
    return `<div class="riquadro"><div class="sv-testa"><span class="sv-pill ${k}">${tipo}</span>
        ${dis ? '' : `<button class="sv-piu" data-piu="${tipo}">+ Biglietto</button>`}</div>
      ${miei.map(b => `<div class="sv-ev" data-big="${esc(b.id)}">
        <span class="quando">${esc(breve(b.evento))}</span>
        <button class="sv-chip ${k} ${b.contatto ? 'on' : ''}" data-campo="contatto" ${dis}>${esc(primo(nomeDi(b.contatto_id)))}</button>
        ${altroDi(b) ? `<button class="sv-chip ${k} ${b.compagno ? 'on' : ''}" data-campo="compagno" ${dis}>${esc(primo(altroDi(b)))}</button>` : ''}
        <label class="sv-osp">+<input type="number" min="0" max="50" data-campo="ospiti" value="${b.ospiti}" ${dis}>ospiti</label>
      </div>`).join('') || '<div class="sotto" style="margin:0">Nessun biglietto</div>'}
    </div>`;
  };

  // CEP a periodi (si esce e si rientra). Ogni periodo si salva col suo bottone:
  // salvando a ogni cambio, mentre si scrive l'anno «0002» sembrava già una data
  const bloccoCep = p => `<div class="sv-ev" data-cep="${esc(p.id || 'nuovo')}">
      <input type="date" data-k="dal" value="${esc(p.dal || '')}" ${dis} aria-label="Abbonato dal">
      <span class="sotto" style="margin:0">→</span>
      <input type="date" data-k="uscito_il" value="${esc(p.uscito_il || '')}" ${dis} aria-label="Uscito il">
      ${dis ? '' : `<button class="sv-ico" data-cep-salva aria-label="Salva">✓</button><button class="sv-ico no" data-cep-togli aria-label="${p.id ? 'Elimina' : 'Annulla'}">✕</button>`}
    </div>`;
  const riquadroCep = () => {
    const aperto = MB21Lista.targheSegni([], SV.cep, MB21Coda.oggiRoma()).cep;
    return `<div class="riquadro"><div class="sv-testa"><span class="sv-pill cep">CEP</span>
        <small class="sotto" style="margin:0">${SV.cep.length ? (aperto ? 'Abbonato ora' : 'Non abbonato ora') : 'dal → uscito il'}</small>
        ${dis || SV.cepNuovo ? '' : '<button class="sv-piu" id="sv-cep-nuovo">+ Periodo</button>'}</div>
      ${SV.cepNuovo ? bloccoCep({}) : ''}${SV.cep.map(bloccoCep).join('')}
      ${!SV.cep.length && !SV.cepNuovo ? '<div class="sotto" style="margin:0">Nessun abbonamento</div>' : ''}</div>`;
  };

  const disegna = () => {
    const a = SV.ana;
    if (SV.ufficiale) {   // partner con la scheda ufficiale in un'altra lista: qui non si scrive
      box.innerHTML = `<div class="riquadro"><div class="sotto" style="margin:0 0 8px">I segni vitali di ${esc(c.nome)} si scrivono su una scheda sola, quella collegata al codice Amway.</div>
        <button class="sv-link" id="sv-ufficiale">Scheda della lista di ${esc(SV.ufficiale.lista || 'un altro partner')} ›</button></div>`;
      document.getElementById('sv-ufficiale').onclick = async () => {
        await apriContattoDa(SV.ufficiale.id, LS.ritorno);
        if (LS.contatto && LS.contatto.id === SV.ufficiale.id) { LS.sezione = 'segni'; disegnaScheda(); }
      };
      return;
    }
    const conCep = c.categoria === 'Partner' || (SV.compagno && SV.compagno.categoria === 'Partner') || SV.cep.length;
    box.innerHTML = `
      ${SV.compagno || a.compagno_nome ? '' : '<div class="sotto" style="margin:0 0 8px">Per i biglietti della coppia collega il compagno/a in Dati.</div>'}
      ${riquadroEventi('BBS')}${riquadroEventi('WES')}${conCep ? riquadroCep() : ''}`;
    mostraTarghe(SV);
    collega();
  };

  const collega = () => {
    box.querySelectorAll('[data-piu]').forEach(b => b.onclick = async () => {
      if (soloGuardo()) return;
      const tipo = b.dataset.piu, nome = tipo === 'BBS' ? 'BBS' : 'Wes';
      const liberi = MB21Lista.eventiLiberi(SV.date[tipo], SV.biglietti, tipo);
      if (!liberi.length) return mostraToast(SV.date[tipo].length ? `C'è già un biglietto per tutti i ${nome}` : `Prima aggiungi le date dei ${nome} nella pagina Admin`);
      const etichette = liberi.map(d => MB21Lista.etichettaEvento(d));
      const v = await moduloSemplice(`Biglietto ${tipo}`, [{ k: 'evento', etichetta: `Quale ${nome}`, tipo: 'select', opzioni: etichette, valore: etichette[0] }]);
      if (!v) return;
      const evento = liberi[etichette.indexOf(v.evento)];
      // stessa persona (stesso nome) con un biglietto per questo evento in un'altra scheda: si avvisa (Ignazio 16/09)
      const doppi = await dbq('biglietti con lo stesso nome', supa.from('biglietti').select('contatto_id, contatti!inner(nome, utenti(nome))')
        .eq('tipo', tipo).eq('evento', evento).ilike('contatti.nome', nomeEsatto(c.nome)).limit(5));
      const altrove = (doppi.data || []).filter(x => !SV.biglietti.some(b => b.contatto_id === x.contatto_id));
      if (altrove.length) {
        const liste = [...new Set(altrove.map(x => (x.contatti && x.contatti.utenti ? x.contatti.utenti.nome : 'un altro partner')))].join(', ');
        if (!confirm(`${c.nome} ha già un biglietto ${tipo} ${MB21Lista.etichettaEvento(evento)} nella lista di ${liste}.\n\nLo aggiungo lo stesso?`)) return;
      }
      const { data, error } = await dbq('nuovo biglietto', supa.from('biglietti')
        .insert({ contatto_id: c.id, tipo, evento, contatto: true }).select().single());
      if (error) return mostraToast(error.code === '23505' ? 'Questo biglietto c\'è già' : 'Non salvato: riprova.');
      SV.biglietti.push(data); disegna();
    });

    const salvaBiglietto = async (el, campo, valore) => {
      if (soloGuardo()) return disegna();
      const b = SV.biglietti.find(x => x.id === el.closest('[data-big]').dataset.big);
      if (!MB21Lista.postiBiglietto({ ...b, [campo]: valore })) {   // niente posti: il biglietto si toglie
        if (!confirm(`Tolgo il biglietto ${b.tipo} ${MB21Lista.etichettaEvento(b.evento)}?`)) return disegna();
        const { error } = await dbq('togli biglietto', supa.from('biglietti').delete().eq('id', b.id));
        if (error) { mostraToast('Non salvato: riprova.'); return disegna(); }
        SV.biglietti = SV.biglietti.filter(x => x.id !== b.id); return disegna();
      }
      const { error } = await dbq('salva biglietto', supa.from('biglietti').update({ [campo]: valore }).eq('id', b.id));
      if (error) mostraToast('Non salvato: riprova.'); else b[campo] = valore;
      disegna();
    };
    box.querySelectorAll('[data-big] button[data-campo]').forEach(el => el.onclick = () =>
      salvaBiglietto(el, el.dataset.campo, !el.classList.contains('on')));
    box.querySelectorAll('[data-big] input[data-campo]').forEach(el => el.onchange = () =>
      salvaBiglietto(el, 'ospiti', Math.min(50, Math.max(0, Math.round(Number(el.value) || 0)))));

    const nuovoCep = document.getElementById('sv-cep-nuovo');
    if (nuovoCep) nuovoCep.onclick = () => { if (!soloGuardo()) { SV.cepNuovo = true; disegna(); } };
    if (!dis) box.querySelectorAll('[data-cep]').forEach(blocco => {
      const id = blocco.dataset.cep === 'nuovo' ? null : blocco.dataset.cep;
      blocco.querySelector('[data-cep-salva]').onclick = async () => {
        if (soloGuardo()) return;
        const p = { id, dal: blocco.querySelector('[data-k="dal"]').value, uscito_il: blocco.querySelector('[data-k="uscito_il"]').value || null };
        const errore = MB21Lista.controllaPeriodoCep(SV.cep, p);
        if (errore) return mostraToast(errore);
        const riga = { dal: p.dal, uscito_il: p.uscito_il, aggiornato_il: new Date().toISOString() };
        const { data, error } = await dbq('salva CEP', id
          ? supa.from('cep').update(riga).eq('id', id).select().single()
          : supa.from('cep').insert({ ...riga, contatto_id: c.id }).select().single());
        if (error) return mostraToast('Non salvato: riprova.');
        SV.cep = [data, ...SV.cep.filter(x => x.id !== id)].sort((a, b) => b.dal.localeCompare(a.dal));
        if (!id) SV.cepNuovo = false;
        mostraToast('CEP salvato'); disegna();
      };
      blocco.querySelector('[data-cep-togli]').onclick = async () => {
        if (!id) { SV.cepNuovo = false; return disegna(); }
        if (soloGuardo() || !confirm('Elimino questo periodo di CEP?')) return;
        const { error } = await dbq('togli CEP', supa.from('cep').delete().eq('id', id));
        if (error) return mostraToast('Non eliminato: riprova.');
        SV.cep = SV.cep.filter(x => x.id !== id); disegna();
      };
    });
  };

  disegna();
}

// Foglio con pochi campi (azione, nota). Restituisce {k: valore} o null.
function moduloSemplice(titolo, campi) {
  return new Promise(risolvi => {
    const velo = document.createElement('div');
    velo.className = 'velo';
    velo.innerHTML = `<div class="foglio alto">
      <div class="testa-foglio"><h3>${esc(titolo)}</h3><button id="chiudi">×</button></div>
      ${campi.map(f => `<div class="campo"><label>${esc(f.etichetta)}</label>${
        f.tipo === 'select' ? `<select data-k="${f.k}">${f.opzioni.map(o => `<option ${o === f.valore ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
        : f.tipo === 'textarea' ? `<textarea data-k="${f.k}" rows="${f.righe || 3}">${esc(f.valore)}</textarea>`
        : `<input data-k="${f.k}" type="${f.tipo}" value="${esc(f.valore)}">`}</div>`).join('')}
      <div class="due" style="margin-top:12px"><button class="link" id="no">Annulla</button><button class="primario" id="si">Salva</button></div>
    </div>`;
    document.body.appendChild(velo);
    const chiudi = v => { velo.remove(); risolvi(v); };
    velo.querySelector('#chiudi').onclick = () => chiudi(null);
    velo.querySelector('#no').onclick = () => chiudi(null);
    velo.querySelector('#si').onclick = () => {
      const v = {};
      velo.querySelectorAll('[data-k]').forEach(el => { v[el.dataset.k] = el.value; });
      if (campi.some(f => f.obbligatorio && !String(v[f.k] || '').trim())) return;
      chiudi(v);
    };
  });
}

// ── Nuovo Contatto / Modifica (stessi 9 campi di Glide, stesso ordine) ──
function apriModulo(c) {
  if (soloGuardo()) return;
  const nuovo = !c;
  const tel = MB21Lista.separaTelefono(c && c.telefono);
  // «Contatto e/o Incaricato di»: nomi della lista del partner proprietario (nuovo contatto = partner scelto nel Partner Select)
  const proprietario = c ? c.user_id : visto().id;
  const miei = LS.righe.filter(r => r.user_id === proprietario && r.categoria !== 'Archiviato' && (!c || r.id !== c.id));
  const opz = (lista, valore, vuoto) => (vuoto ? `<option value="">${vuoto}</option>` : '') +
    lista.map(o => `<option ${o === valore ? 'selected' : ''}>${esc(o)}</option>`).join('');
  // valori storici fuori elenco (es. fascia «36-45») restano sceglibili in modifica
  const conStorico = (lista, v) => v && !lista.includes(v) ? [...lista, v] : lista;
  const prefissi = conStorico(MB21Lista.PREFISSI.map(p => p[0]), tel.prefisso);
  const max = (base, v) => Math.max(base, (v || '').length);
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `<div class="foglio alto">
    <div class="testa-foglio"><h3>${nuovo ? 'Aggiungi un nuovo contatto' + esc(aNome()) : 'Modifica contatto'}</h3><button id="chiudi">×</button></div>
    <div class="campo"><label>Nominativo <small>Obbligatorio</small></label><input id="f-nome" placeholder="Nome Cognome" value="${esc(c ? c.nome : '')}"></div>
    <div class="campo"><label>Telefono</label><div class="telefono-campo">
      <select id="f-prefisso">${prefissi.map(p => { const n = MB21Lista.PREFISSI.find(x => x[0] === p); return `<option value="${p}" ${p === (tel.prefisso || '+39') ? 'selected' : ''}>${p}${n ? ' ' + n[1] : ''}</option>`; }).join('')}</select>
      <input id="f-tel" type="tel" inputmode="tel" placeholder="(es.) 33x xxxxxxx" value="${esc(tel.numero)}"></div></div>
    <div class="campo"><label>Fascia Età</label><select id="f-eta">${opz(conStorico(MB21Lista.FASCE_ETA, c && c.fascia_eta), c && c.fascia_eta, '—')}</select></div>
    <div class="campo"><label>Professione</label><input id="f-prof" placeholder="Mansione (Settore)" maxlength="${max(40, c && c.professione)}" value="${esc(c ? c.professione || '' : '')}"><div class="conta" data-conta="f-prof"></div></div>
    <div class="campo"><label>Località</label><input id="f-citta" placeholder="Città (Prov)" maxlength="${max(40, c && c.citta)}" value="${esc(c ? c.citta || '' : '')}"><div class="conta" data-conta="f-citta"></div></div>
    <div class="campo"><label>Categoria <small>Obbligatorio</small></label><select id="f-cat">${opz(conStorico(MB21Lista.CATEGORIE, c && c.categoria), c && c.categoria, 'Scegli qualcosa')}</select></div>
    <div class="campo"><label>Contatto e/o Incaricato di</label><input id="f-ref" list="f-ref-nomi" placeholder="—" value="${esc(c ? c.referral_di || '' : '')}">
      <datalist id="f-ref-nomi">${miei.map(r => `<option value="${esc(r.nome)}">`).join('')}</datalist></div>
    <div class="campo"><label>Area</label><select id="f-area">${opz(conStorico(MB21Lista.AREE, c && c.area), c && c.area, '—')}</select></div>
    <div class="campo"><label>Note</label><input id="f-note" maxlength="${max(50, c && c.note)}" value="${esc(c ? c.note || '' : '')}"><div class="conta" data-conta="f-note"></div></div>
    <div class="due" style="margin-top:12px"><button class="primario" id="invia" disabled>Invia</button><button class="link" id="annulla">Annulla</button></div>
  </div>`;
  document.body.appendChild(velo);
  const $ = id => velo.querySelector('#' + id);
  const chiudi = () => velo.remove();
  $('chiudi').onclick = chiudi;
  $('annulla').onclick = chiudi;
  const controlla = () => {
    $('invia').disabled = !$('f-nome').value.trim() || !$('f-cat').value;
    velo.querySelectorAll('[data-conta]').forEach(d => { const el = $(d.dataset.conta); d.textContent = `${el.value.length}/${el.maxLength}`; });
  };
  velo.querySelectorAll('input, select').forEach(el => { el.oninput = controlla; el.onchange = controlla; });
  controlla();
  $('invia').onclick = async () => {
    const telefono = MB21Lista.componiTelefono($('f-prefisso').value, $('f-tel').value);
    const riga = {
      nome: $('f-nome').value.trim(), telefono, fascia_eta: $('f-eta').value || null,
      professione: $('f-prof').value.trim() || null, citta: $('f-citta').value.trim() || null,
      categoria: $('f-cat').value, referral_di: $('f-ref').value.trim() || null,
      area: $('f-area').value || null, note: $('f-note').value.trim() || null,
    };
    const doppi = MB21Lista.trovaDoppioni(LS.righe, { nome: riga.nome, telefono: riga.telefono, utenteId: proprietario, escludiId: c && c.id });
    if (nuovo) riga.user_id = proprietario;
    if (doppi.length && !confirm(`Attenzione: ${proprietario === ST.utente.id ? 'tra i tuoi nomi' : 'tra i nomi di questo partner'} c'è già\n\n${doppi.slice(0, 3).map(d => `• ${d.nome}${d.telefono ? ' · ' + d.telefono : ''}`).join('\n')}\n\nSalvo lo stesso?`)) return;
    $('invia').disabled = true;
    // da senza categoria a una categoria: la sceglie `cataloga_contatto`, come in «Da catalogare» (conta nei Fatti, rientro domani)
    const catalogo = !nuovo && !c.categoria && riga.categoria;
    const q = nuovo ? supa.from('contatti').insert(riga)
      : supa.from('contatti').update({ ...riga, categoria: catalogo ? null : riga.categoria, aggiornato_il: new Date().toISOString() }).eq('id', c.id);
    let { error } = await dbq(nuovo ? 'nuovo contatto' : 'modifica contatto', q);
    if (!error && catalogo) ({ error } = await dbq('cataloga', supa.rpc('cataloga_contatto', { p_contatto: c.id, p_categoria: riga.categoria })));
    if (error) { $('invia').disabled = false; return mostraToast('Non salvato: controlla la connessione e riprova.'); }
    chiudi();
    mostraToast(nuovo ? `${riga.nome} aggiunto` : 'Modifiche salvate');
    ricaricaERidisegna();
  };
}

// «Portato da» uguale dappertutto (decisione di Ignazio 15/09): Agenda, Report, Griglia PM, scheda contatto.
// Aggiunge `portatoNome` alle azioni con portato_da (una lettura sola dei nomi). Senza rete i nomi restano vuoti.
async function aggiungiPortatoDa(azioni) {
  const ids = [...new Set(azioni.map(a => a.portato_da).filter(Boolean))];
  if (!ids.length) return azioni;
  const nomi = {};
  for (let i = 0; i < ids.length; i += 200) {
    const { data } = await dbq('nomi portato da', supa.from('contatti').select('id, nome').in('id', ids.slice(i, i + 200)));
    for (const x of data || []) nomi[x.id] = x.nome;
  }
  for (const a of azioni) a.portatoNome = nomi[a.portato_da] || null;
  return azioni;
}
const rigaPortato = nome => nome ? `🤝 Portato da ${esc(nome)}` : '';

// ── Foglio unico «Modifica azione» (decisioni di Ignazio 15/09) ──────────
// Stesso foglio da Report, Griglia PM, scheda contatto e Agenda: contatto, portato da, sottotipo, esito, giorno e ora, note.
// Serve a correggere un passo (per andare avanti si chiude con l'esito e se ne apre uno nuovo).
// Scelte da MB21Agenda.sceltePerModifica: un tipo nuovo aggiunto in agenda.js compare anche qui.
// L'azione è di chi ascolta; chi l'ha portato va in «Portato da». Le vecchie azioni con l'ospite scritto a mano
// si spostano sull'ospite con «L'esito è dell'ospite» (il contatto di prima diventa «Portato da»).
// Coda: se è l'ultima azione del contatto e cambia l'esito o il contatto, il rientro si ricalcola (modifica_azione). Avviso con Annulla.
// opz: { dopo() → ridisegna chi l'ha aperto, ritorno: 'report' | 'griglia' per «Apri contatto» (senza = niente bottone) }
async function foglioAzione(id, opz = {}) {
  if (soloGuardo()) return;
  const { data: a, error } = await dbq('azione da modificare', supa.from('azioni')
    .select('id, contatto_id, portato_da, categoria, tipo_azione, modalita, esito, inizio, fine, ospite, note, contatti(nome, categoria)').eq('id', id).maybeSingle());
  if (error || !a) return mostraToast('Azione non trovata: riprova.');
  let portato = null;
  if (a.portato_da) {
    const { data } = await dbq('portato da', supa.from('contatti').select('id, nome, categoria').eq('id', a.portato_da).maybeSingle());
    portato = data || { id: a.portato_da, nome: '—' };
  }
  const A = MB21Agenda, s = A.sceltePerModifica(a);
  const { giorno, ora } = a.inizio ? A.partiRoma(a.inizio) : { giorno: MB21Coda.oggiRoma(), ora: '18:30' };
  const st = { contatto: { id: a.contatto_id, ...(a.contatti || { nome: '—' }) }, portato, ospite: a.ospite, sottotipo: a.modalita, esito: a.esito };
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `<div class="foglio alto">
    <div class="testa-foglio"><h3>${esc(a.tipo_azione || 'Azione')}</h3><button id="fa-x" aria-label="Chiudi">×</button></div>
    <div id="fa-persone"></div>
    ${s.sottotipi.length ? `<div class="campo"><label>${esc(A.etichettaSottotipo(a.tipo_azione))}</label><div class="ag-scelte" id="fa-sottotipi">${s.sottotipi.map(x => `<button data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>` : ''}
    <div class="campo"><label>Esito</label><div class="ag-scelte" id="fa-esiti"></div></div>
    <div class="campo"><label>Giorno e ora</label><div class="ag-due-campi"><input type="date" id="fa-giorno" value="${giorno}"><input type="time" id="fa-ora" value="${ora}"></div></div>
    <div class="campo"><label>Note</label><textarea id="fa-note" rows="2" maxlength="${Math.max(100, (a.note || '').length)}">${esc(a.note || '')}</textarea></div>
    <div class="errore" id="fa-errore"></div>
    <div class="due">${opz.ritorno ? '<button class="link" id="fa-contatto">👤 Apri contatto</button>' : '<button class="link" id="fa-no">Annulla</button>'}
      <button class="primario" id="fa-si">Salva</button></div>
  </div>`;
  document.body.appendChild(velo);
  const $ = x => velo.querySelector('#' + x);
  const chiudi = () => velo.remove();
  velo.onclick = e => { if (e.target === velo) chiudi(); };
  $('fa-x').onclick = chiudi;
  if ($('fa-no')) $('fa-no').onclick = chiudi;
  if ($('fa-contatto')) $('fa-contatto').onclick = () => { chiudi(); apriContattoDa(st.contatto.id, opz.ritorno); };
  const disegnaPersone = () => {
    const riga = (etichetta, persona, cmd, extra = '') => `<div class="campo"><label>${etichetta}</label>
      <div class="fa-persona"><span>${persona}</span>${cmd}</div>${extra}</div>`;
    let h = riga('Contatto <small>l\'esito è suo</small>', esc(st.contatto.nome), '<button class="link" data-cmd="contatto">Cambia</button>');
    if (s.ospite) {
      // con l'ospite scritto a mano e l'azione ancora sul contatto sbagliato, «Portato da» non serve: prima si sposta
      if (st.ospite && !st.portato) h += riga('Ospite <small>scritto a mano</small>', esc(st.ospite), '',
        `<button class="piccolo fa-ospite" data-cmd="ospite">⇄ L'esito è dell'ospite</button>`);
      else h += riga('Portato da', st.portato ? esc(st.portato.nome) : '<span style="color:var(--grigio)">nessuno</span>',
        st.portato ? '<button class="link" data-cmd="togli" aria-label="Togli">×</button>' : '<button class="link" data-cmd="portato">＋ Scegli</button>');
    }
    $('fa-persone').innerHTML = h;
    $('fa-persone').querySelectorAll('[data-cmd]').forEach(b => b.onclick = async () => {
      const cmd = b.dataset.cmd;
      if (cmd === 'togli') { st.portato = null; return disegnaPersone(); }
      const scelto = await sceltaContatto(cmd === 'ospite' ? 'Chi è l\'ospite?' : cmd === 'portato' ? 'Portato da' : 'Contatto',
        cmd === 'ospite' ? st.ospite : '', [st.contatto.id]);
      if (!scelto) return;
      if (cmd === 'ospite') { st.portato = st.contatto; st.contatto = scelto; st.ospite = null; }
      else if (cmd === 'portato') st.portato = scelto;
      else st.contatto = scelto;
      disegnaPersone();
    });
  };
  const disegnaScelte = () => {   // gli esiti di Appuntamento cambiano col sottotipo
    const esiti = A.sceltePerModifica({ ...a, modalita: st.sottotipo, esito: st.esito }).esiti;
    $('fa-esiti').innerHTML = esiti.map(x => `<button data-v="${esc(x)}" class="${x === st.esito ? 'scelto' : ''}">${esc(x)}</button>`).join('');
    $('fa-esiti').querySelectorAll('button').forEach(b => b.onclick = () => { st.esito = b.dataset.v; disegnaScelte(); });
    velo.querySelectorAll('#fa-sottotipi button').forEach(b => b.classList.toggle('scelto', b.dataset.v === st.sottotipo));
  };
  velo.querySelectorAll('#fa-sottotipi button').forEach(b => b.onclick = () => { st.sottotipo = b.dataset.v; disegnaScelte(); });
  disegnaPersone();
  disegnaScelte();
  $('fa-si').onclick = async () => {
    if (!$('fa-giorno').value || !$('fa-ora').value) { $('fa-errore').textContent = 'Scegli giorno e ora.'; return; }
    if (st.portato && st.portato.id === st.contatto.id) { $('fa-errore').textContent = 'Contatto e «Portato da» sono la stessa persona.'; return; }
    const inizio = A.isoDaRoma($('fa-giorno').value, $('fa-ora').value);
    const fine = a.fine && a.inizio ? new Date(Date.parse(inizio) + Date.parse(a.fine) - Date.parse(a.inizio)).toISOString() : a.fine;   // stessa durata
    $('fa-si').disabled = true;
    const { data: prima, error: e2 } = await dbq('modifica azione', supa.rpc('modifica_azione', {
      p_azione: a.id, p_contatto: st.contatto.id, p_portato_da: st.portato ? st.portato.id : null,
      p_modalita: st.sottotipo || null, p_esito: st.esito || null, p_inizio: inizio, p_fine: fine || null,
      p_ospite: st.ospite || null, p_note: $('fa-note').value.trim() || null }));
    if (e2) { $('fa-si').disabled = false; $('fa-errore').textContent = 'Non salvato: controlla la connessione e riprova.'; return; }
    chiudi();
    LS.righe = [];   // la Lista si ricarica: fase e coda possono essere cambiate
    if (opz.dopo) await opz.dopo();
    mostraToast(`Azione modificata${prima.rientro_cambiato ? ' · coda aggiornata' : ''}`, async () => {
      const { error: e3 } = await dbq('annulla modifica', supa.rpc('annulla_modifica_azione', { p_prima: prima }));
      if (e3) return mostraToast('Annullamento non riuscito: riprova.');
      LS.righe = [];
      if (opz.dopo) await opz.dopo();
      mostraToast('Annullato');
    });
  };
}

// Scelta di un contatto tra i propri (ricerca come la Lista) o «＋ Aggiungi» come Prospect. Restituisce {id, nome, categoria} o null.
async function sceltaContatto(titolo, testo = '', escludi = [], motivo = 'è già il contatto') {
  let elenco;
  try { elenco = await leggiContattiMiei(); } catch (e) { mostraToast('Contatti non caricati: riprova.'); return null; }
  return new Promise(risolvi => {
    const velo = document.createElement('div');
    velo.className = 'velo';
    velo.style.zIndex = 25;   // sopra il foglio Modifica azione
    velo.innerHTML = `<div class="foglio alto">
      <div class="testa-foglio"><h3>${esc(titolo)}</h3><button id="sc-x" aria-label="Chiudi">×</button></div>
      <input id="sc-testo" placeholder="Scrivi il nome" value="${esc(testo)}" autocomplete="off">
      <div class="altri-voci" id="sc-elenco"></div></div>`;
    document.body.appendChild(velo);
    const chiudi = v => { velo.remove(); risolvi(v); };
    velo.onclick = e => { if (e.target === velo) chiudi(null); };
    velo.querySelector('#sc-x').onclick = () => chiudi(null);
    const inp = velo.querySelector('#sc-testo');
    const disegna = () => {
      const t = inp.value.trim();
      const trovati = t ? elenco.filter(c => MB21Lista.corrisponde(c, t)).slice(0, 20) : [];
      const uguale = trovati.some(c => MB21Lista.piega(c.nome) === MB21Lista.piega(t));
      velo.querySelector('#sc-elenco').innerHTML = trovati.map(c => escludi.includes(c.id)
          ? `<button disabled>${esc(c.nome)} <small style="color:var(--grigio)">· ${esc(motivo)}</small></button>`
          : `<button data-id="${esc(c.id)}">${esc(c.nome)} <small style="color:var(--grigio)">· ${esc(c.categoria || 'Senza categoria')}</small></button>`).join('')
        + (t && !uguale ? `<button data-nuovo="1">＋ Non c'è: aggiungi «${esc(t)}» come Prospect</button>` : '');
      velo.querySelectorAll('[data-id]').forEach(b => b.onclick = () => chiudi(elenco.find(c => c.id === b.dataset.id)));
      const n = velo.querySelector('[data-nuovo]');
      if (n) n.onclick = async () => {
        n.disabled = true;
        const { data, error } = await dbq('nuovo contatto', supa.from('contatti').insert({ nome: t, categoria: 'Prospect', user_id: visto().id }).select('id, nome, categoria').single());
        if (error) { n.disabled = false; return mostraToast('Non salvato: riprova.'); }
        contattiMiei = null; LS.righe = [];
        mostraToast(`${t} aggiunto alla Lista`);
        chiudi(data);
      };
    };
    inp.oninput = disegna;
    disegna();
    inp.focus();
  });
}

// ── CHECK (Fase 6) ───────────────────────────────────────
// Brief docs/MB21_v4_Brief_F6_Check.md: si apre dal bottone «visione completa» della Dashboard (decisione A), periodi Mese · Wes · Anno,
// adesso · prima (a pari giorni) · andamento, riga grigia col periodo prima intero (B), grafico dei 12 mesi, Segni Vitali a 12 mesi (C).
// Numeri del partner loggato. Calcoli in check.js.
const CK = { tipo: 'mese', periodo: null, giorni: null, obiettivi: [], wes: [], aperta: null };
const CAMPI_CK = 'user_id, data, ' + MB21Check.CAMPI_GIORNO.join(', ');

async function apriPaginaCheck() {
  if (!CK.giorni) app.innerHTML = `<button class="indietro" id="ck-indietro">‹ Dashboard</button><h1>Check</h1><div class="vuoto">Carico i numeri…</div>`;
  const indietro = document.getElementById('ck-indietro');
  if (indietro) indietro.onclick = () => { ST.tab = 'oggi'; mostraTab(); };
  try {
    const giorni = [];
    for (let da = 0; ; da += 1000) {
      const { data, error } = await dbq('check giornalieri', supa.from('check_giorno').select(CAMPI_CK)
        .in('user_id', idVisti()).order('id').range(da, da + 999));
      if (error) throw error;
      giorni.push(...data);
      if (data.length < 1000) break;
    }
    const [ob, wes, segniAl] = await Promise.all([
      dbq('obiettivi del mese', supa.from('obiettivi_mese').select('*').in('user_id', idVisti())),
      dbq('date dei Wes', supa.from('wes').select('data').order('data')),
      calcolatoreSegni(),   // BBS/WES/CEP dalle persone da settembre 2026
    ]);
    CK.segniAl = segniAl;
    if (ob.error || wes.error) throw ob.error || wes.error;
    // «Tutti»: check di tutti insieme, obiettivi sommati con le partenze calcolate per ognuno (dashboard.js → unisciPartner)
    CK.obiettivi = vediTutti()
      ? MB21Dashboard.unisciPartner(MB21Dashboard.mesiDaGiorni(giorni, ['bbs', 'wes', 'cep']), ob.data, MB21Coda.oggiRoma().slice(0, 8) + '01').obiettivi
      : ob.data;
    CK.giorni = giorni; CK.wes = wes.data.map(w => w.data);
  } catch (e) {
    app.innerHTML = `<button class="indietro" id="ck-indietro">‹ Dashboard</button><h1>Check</h1>
      <div class="avviso">Non riesco a caricare il Check. Controlla la connessione e riprova.</div>${versione()}`;
    document.getElementById('ck-indietro').onclick = () => { ST.tab = 'oggi'; mostraTab(); };
    return;
  }
  if (!CK.periodo) CK.periodo = MB21Report.periodoIniziale(CK.tipo, MB21Coda.oggiRoma(), CK.wes);
  disegnaCheck();
}

function disegnaCheck() {
  const R = MB21Report, C = MB21Check, oggi = MB21Coda.oggiRoma(), p = CK.periodo;
  const dati = { giorni: CK.giorni, obiettivi: CK.obiettivi, oggi, segniAl: CK.segniAl };
  let html = `<button class="indietro" id="ck-indietro">‹ Dashboard</button><h1>Check</h1>${partnerSelect()}
    <div class="rp-periodi">${[['mese', 'Mese'], ['wes', 'Wes'], ['anno', 'Anno']].map(([k, t]) =>
      `<button data-ckperiodo="${k}" class="${CK.tipo === k ? 'scelto' : ''}">${t}</button>`).join('')}</div>`;
  if (!p) {
    html += `<div class="vuoto">Nessun Wes ancora: l'Admin aggiunge le date dei Wes.</div>`;
  } else {
    const r = C.calcola({ ...dati, dateWes: CK.wes, periodo: p });
    html += `<div class="rp-naviga">
      <button id="ck-prima" aria-label="Periodo prima" ${R.spostaPeriodo(p, -1, oggi, CK.wes) ? '' : 'disabled'}>‹</button>
      <b>${esc(R.testoPeriodo(p))}</b>
      <button id="ck-dopo" aria-label="Periodo dopo" ${R.spostaPeriodo(p, 1, oggi, CK.wes) ? '' : 'disabled'}>›</button></div>
      <div class="ck-confronto">${esc(r.confronto)}</div>`;
    html += r.gruppi.map(g => `<div class="ck-gruppo" style="border-left-color:${g.colore}">
      <h3 style="color:${g.colore}">${g.pallino} ${esc(g.etichetta)}</h3>
      <div class="ck-testa"><span></span><span>adesso</span><span>prima</span><span>▲▼</span></div>
      ${g.voci.map(v => {
        const aperta = CK.aperta === v.chiave;
        let h = `<button class="ck-riga ${aperta ? 'aperta' : ''}" data-voce="${v.chiave}"><span>${esc(v.titolo)}</span>
          <span class="n">${esc(v.adesso)}</span><span class="pr">${esc(v.prima)}</span><span class="an ${v.andamento.segno}">${esc(v.andamento.testo)}</span>
          ${v.riga ? `<small>${esc(v.riga)}</small>` : ''}</button>`;
        if (!aperta) return h;
        const gr = C.grafico(dati, v.chiave, p.a && p.a <= oggi ? R.spostaGiorno(p.a, -1) : oggi);
        const fmt = x => x == null ? '—' : Number(x).toLocaleString('it-IT', { maximumFractionDigits: gr.decimali });
        h += `<div class="ck-grafico">
          <div class="legenda"><i style="background:${g.colore};margin-left:0"></i>${esc(gr.anno)}<i style="background:#D1D5DB"></i>${esc(gr.annoPrima)}</div>
          <div class="ck-barre">${gr.mesi.map(m => `<div>
            <span class="prima" style="height:${(m.prima || 0) / gr.max * 100}%"></span>
            <span style="height:${(m.valore || 0) / gr.max * 100}%;background:${g.colore}"></span></div>`).join('')}</div>
          <div class="rp-mesi">${gr.mesi.map(m => `<span class="${m.valore == null ? 'futuro' : ''}">${m.etichetta}</span>`).join('')}</div>
          <div class="ck-valori">${gr.mesi.filter(m => m.valore != null).map(m => `${m.etichetta} ${fmt(m.valore)} <span style="color:var(--grigio-chiaro)">(${fmt(m.prima)})</span>`).join(' · ')}</div>
        </div>`;
        return h;
      }).join('')}</div>`).join('');
  }
  html += tabellaSv(C.segniVitali(dati));
  app.innerHTML = html + versione();
  collegaCheck();
}

function collegaCheck() {
  const R = MB21Report, oggi = MB21Coda.oggiRoma();
  const su = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  su('ck-indietro', () => { ST.tab = 'oggi'; mostraTab(); });
  collegaPartnerSelect();
  app.querySelectorAll('[data-ckperiodo]').forEach(b => b.onclick = () => {
    CK.tipo = b.dataset.ckperiodo; CK.periodo = R.periodoIniziale(CK.tipo, oggi, CK.wes); disegnaCheck();
  });
  const sposta = n => { const q = R.spostaPeriodo(CK.periodo, n, oggi, CK.wes); if (q) { CK.periodo = q; disegnaCheck(); } };
  su('ck-prima', () => sposta(-1));
  su('ck-dopo', () => sposta(1));
  app.querySelectorAll('[data-voce]').forEach(b => b.onclick = () => { CK.aperta = CK.aperta === b.dataset.voce ? null : b.dataset.voce; disegnaCheck(); });
}

// ── MAPPA (Fase 8) ───────────────────────────────────────
// Brief docs/MB21_v4_Brief_F8_Mappa.md: l'albero del gruppo Amway che si apre e si chiude sul posto (come la LOS
// ufficiale), stato dai VPP del mese (≥50 attivo · >0 warning · 0 inattivo), filtri per stato e ricerca,
// pillole BBS/WES/CEP (grigie finché i segni vitali non stanno sulle persone). Calcoli in mappa.js.
const MP = { squadra: null, volumi: null, mese: null, schede: null, targhe: null, aperti: new Set(), filtro: 'tutti', cerca: '', completa: null, storico: {} };

async function apriMappa() {
  if (!MP.squadra) app.innerHTML = `<h1>Mappa</h1><div class="vuoto">Carico il gruppo…</div>`;
  if (!MP.squadra) {
    try {
      const ultimo = await dbq('ultimo mese dei volumi', supa.from('volumi_mese').select('mese').order('mese', { ascending: false }).limit(1));
      if (ultimo.error) throw ultimo.error;
      MP.mese = ultimo.data.length ? ultimo.data[0].mese : null;
      const [sq, vol] = await Promise.all([
        dbq('squadra', supa.from('squadra').select('partner_id, sponsor_id, nome, livello, data_ingresso, telefono, email')),
        MP.mese ? dbq('volumi del mese', supa.from('volumi_mese').select('*').eq('mese', MP.mese)) : { data: [] },
      ]);
      if (sq.error || vol.error) throw sq.error || vol.error;
      MP.squadra = sq.data; MP.volumi = vol.data || [];
    } catch (e) {
      app.innerHTML = `<h1>Mappa</h1><div class="avviso">Non riesco a caricare il gruppo. Controlla la connessione e riprova.</div>${versione()}`;
      return;
    }
  }
  disegnaMappa();
  // schede e targhette si rileggono a ogni apertura (possono essere cambiate nella scheda contatto)
  caricaSchedeMappa().then(() => { if (ST.tab === 'mappa' && !MP.completa) disegnaMappa(); }).catch(() => {});
}

// Segni vitali grezzi (cantiere 18): squadra, schede dei partner (contatti Partner o con codice Amway in tutte le liste che posso
// leggere: l'Admin tutte, anche con il Partner Select su un altro partner, così non si crea una scheda che c'è già altrove),
// biglietti e periodi CEP con il proprietario della lista, coppie, utenti, eventi BBS e Wes con la data di caricamento.
// Servono alla Mappa (adesso) e a Dashboard e Check (fotografia a fine mese, `MB21Mappa.segniAl`).
async function leggiSegniGrezzi() {
  const schede = [];
  for (let da = 0; ; da += 1000) {
    const { data, error } = await dbq('schede dei partner', supa.from('contatti').select('id, nome, user_id, codice_amway')
      .or('categoria.eq.Partner,codice_amway.not.is.null').order('id').range(da, da + 999));
    if (error) throw error;
    schede.push(...data);
    if (data.length < 1000) break;
  }
  const [sq, big, cep, coppie, ut, bbs, wes] = await Promise.all([
    MP.squadra ? { data: MP.squadra } : dbq('squadra per i segni', supa.from('squadra').select('partner_id, sponsor_id, nome')),
    dbq('biglietti per i segni', supa.from('biglietti').select('contatto_id, tipo, evento, contatto, compagno, ospiti, creato_il, contatti(user_id)').limit(10000)),
    dbq('CEP per i segni', supa.from('cep').select('contatto_id, dal, uscito_il, contatti(user_id)').limit(10000)),
    dbq('coppie per i segni', supa.from('contatti').select('id, compagno_id').not('compagno_id', 'is', null).limit(5000)),
    dbq('utenti per i segni', supa.from('utenti').select('id, partner_id')),
    dbq('BBS per i segni', supa.from('bbs').select('data, creato_il')),
    dbq('Wes per i segni', supa.from('wes').select('data, creato_il')),
  ]);
  const errore = [sq, big, cep, coppie, ut, bbs, wes].find(r => r.error);
  if (errore) throw errore.error;
  const conUtente = righe => righe.map(r => ({ ...r, user_id: r.contatti && r.contatti.user_id }));
  return { squadra: sq.data, schede, biglietti: conUtente(big.data), cep: conUtente(cep.data), coppie: coppie.data,
    utenti: ut.data, bbs: bbs.data, wes: wes.data, oggi: MB21Coda.oggiRoma() };
}

// Partner di cui si contano i segni: quello scelto; con «Tutti» il gruppo intero (l'Admin in cima), così non si conta due volte
const partnerDeiSegni = () => (vediTutti() ? ST.utente.partner_id : visto().partner_id);

// segniAl(giorno) per Dashboard e Check, con i risultati tenuti a mente per giorno. null se la lettura non riesce
async function calcolatoreSegni() {
  try {
    const g = await leggiSegniGrezzi(), pid = partnerDeiSegni(), preferito = visto().id, fatti = {};
    if (!pid) return null;
    return giorno => fatti[giorno] || (fatti[giorno] = MB21Mappa.segniAl(g, pid, giorno, preferito));
  } catch (e) {
    return null;
  }
}

// Mappa: schede, targhette e segni del gruppo per l'evento in vendita
async function caricaSchedeMappa() {
  const g = await leggiSegniGrezzi();
  const L = MB21Lista, attivi = { bbs: L.eventoAttivo(g.bbs), wes: L.eventoAttivo(g.wes) };
  MP.attivi = attivi;
  MP.schede = g.schede;
  MP.targhe = L.targhePerContatto(g.biglietti, g.cep, g.coppie, g.oggi, attivi);
  MP.segni = MB21Mappa.segniGruppo({ squadra: MP.squadra || g.squadra, schede: g.schede, preferito: visto().id, coppie: g.coppie,
    utenti: g.utenti, biglietti: g.biglietti, cep: g.cep, attivoBbs: attivi.bbs, attivoWes: attivi.wes, oggi: g.oggi });
}
const schedaMappa = r => (MP.schede ? MB21Mappa.schedaDelPartner(r, MP.schede, visto().id) : null);

function mesePulito(m) {
  return m ? `${String(m).slice(4, 6)}/${String(m).slice(0, 4)}` : '—';
}

function disegnaMappa() {
  const M = MB21Mappa;
  if (MP.completa) return disegnaCompleta();
  const cime = radiceVista(M.albero(MP.squadra || [], MP.volumi || []));
  const conta = M.conta(cime);
  const righe = M.righe(cime, { aperti: MP.aperti, filtro: MP.filtro, cerca: MP.cerca });
  const num = (v, d = 2) => (v == null ? '—' : Number(v).toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d }));
  const etichette = [['tutti', 'Tutti'], ['attivo', '🟢 Attivi'], ['warning', '🔴 Warning'], ['inattivo', '⚪ Inattivi']];

  let html = `<h1>Mappa</h1>${partnerSelect()}
    <div class="mp-testa"><span>Gruppo di ${esc(nomeVisto())}</span><span>mese ${esc(mesePulito(MP.mese))}</span></div>
    ${MP.attivi ? `<div class="mp-testa"><span>Segni vitali del gruppo: BBS ${MP.attivi.bbs ? esc(MB21Lista.etichettaEvento(MP.attivi.bbs)) : '—'} · WES ${MP.attivi.wes ? esc(MB21Lista.etichettaEvento(MP.attivi.wes)) : '—'} · CEP oggi</span></div>` : ''}
    <div class="mp-filtri">${etichette.map(([k, t]) =>
      `<button data-mpfiltro="${k}" class="${MP.filtro === k ? 'scelto' : ''}">${t} ${k === 'tutti' ? conta.tutti : conta[k]}</button>`).join('')}
      <button id="mp-tutto">${MP.aperti.size ? 'Chiudi tutto' : 'Apri tutto'}</button></div>
    <input class="mp-cerca" id="mp-cerca" type="search" placeholder="Cerca un nome o un codice" value="${esc(MP.cerca)}">`;

  if (!cime.length) {
    html += `<div class="vuoto">Nessun dato del gruppo. L'Admin carica il file Amway del mese.</div>`;
  } else if (!righe.length) {
    html += `<div class="vuoto">Nessuno con questo filtro.</div>`;
  } else {
    html += righe.map(r => {
      const s = M.STATI[r.stato];
      const apri = r.haFigli
        ? `<button class="mp-apri" data-mpapri="${esc(r.id)}" aria-label="${r.aperto ? 'Chiudi' : 'Apri'} il gruppo di ${esc(r.nome)}">${r.aperto ? '−' : '+'}</button>`
        : `<span class="mp-apri vuoto"></span>`;
      return `<div class="mp-riga ${r.spento ? 'spento' : ''}" style="padding-left:${10 + r.profondita * 18}px">
        ${apri}
        <div class="mp-corpo">
          <span class="mp-liv">${r.livello ?? ''}</span>
          <span title="${esc(s.titolo)}">${s.pallino}</span>
          <button class="mp-nome" data-mpnome="${esc(r.id)}">${esc(r.nome)}</button>
          <span class="sv-targhe" style="margin-left:6px">${targheHtml((() => { const sc = schedaMappa(r); return sc && MP.targhe ? MP.targhe[sc.id] : null; })(),
            MP.segni && MP.segni.gruppo[r.id])}</span>
          <div class="mp-numeri">VPP ${num(r.vpp)} · VPG ${num(r.vpg)} · <b class="mp-bonus">bonus ${r.bonus == null ? '—' : num(r.bonus, 0) + '%'}</b>${
            r.gruppo ? ` · gruppo ${r.gruppo}` : ''}${r.alLivelloSuccessivo ? ` · ${M.bonusSuccessivo(r.bonus) ? `per il ${M.bonusSuccessivo(r.bonus)}%` : 'per il livello successivo'} mancano ${num(r.alLivelloSuccessivo)}` : ''}</div>
        </div>
        <button class="mp-completa" data-mpcompleta="${esc(r.id)}" aria-label="Apri la scheda di ${esc(r.nome)}">›</button></div>`;
    }).join('');
  }
  app.innerHTML = html + versione();
  collegaMappa();
}

// «👁️ Visione completa» di un partner: storico dei 13 mesi e grafico (decisione C del 16/09)
async function apriCompleta(id) {
  MP.completa = id;
  if (!MP.storico[id]) {
    app.innerHTML = `<button class="indietro" id="mp-indietro">‹ Mappa</button><h1>Mappa</h1><div class="vuoto">Carico i mesi…</div>`;
    document.getElementById('mp-indietro').onclick = () => { MP.completa = null; disegnaMappa(); };
    const { data, error } = await dbq('storico del partner',
      supa.from('volumi_mese').select('mese, vpp, vpg, bonus, al_livello_successivo, dimensioni_gruppo').eq('partner_id', id).order('mese'));
    if (error) {
      app.innerHTML = `<button class="indietro" id="mp-indietro">‹ Mappa</button><h1>Mappa</h1>
        <div class="avviso">Non riesco a caricare i mesi di questo partner. Riprova.</div>${versione()}`;
      document.getElementById('mp-indietro').onclick = () => { MP.completa = null; disegnaMappa(); };
      return;
    }
    MP.storico[id] = data;
  }
  disegnaCompleta();
}

function disegnaCompleta() {
  const M = MB21Mappa, id = MP.completa;
  const chi = (MP.squadra || []).find(x => x.partner_id === id) || {};
  const nome = M.nomeLeggibile(chi.nome);
  const mesi = MP.storico[id] || [];
  const st = M.storico(mesi);
  const ultimo = mesi.length ? mesi[mesi.length - 1] : {};
  const s = M.STATI[M.stato(ultimo.vpp)];
  const num = (v, d = 2) => (v == null ? '—' : Number(v).toLocaleString('it-IT', { minimumFractionDigits: d, maximumFractionDigits: d }));
  const manca = Number(ultimo.al_livello_successivo) || 0;
  const bonus = Number(ultimo.bonus) || 0;
  const fatta = manca ? Math.max(0, Math.min(100, 100 * (Number(ultimo.vpg) || 0) / ((Number(ultimo.vpg) || 0) + manca))) : 100;

  let html = `<button class="indietro" id="mp-indietro">‹ Mappa</button>
    <div class="mp-scheda-testa"><h1>${s.pallino} ${esc(nome)}</h1><span style="color:var(--grigio-chiaro);font-size:12px">#${esc(id)}</span></div>
    <div class="mp-testa"><span>${chi.livello ? 'Livello ' + chi.livello : ''}${chi.data_ingresso ? ' · dal ' + esc(chi.data_ingresso.split('-').reverse().join('/')) : ''}</span>
      <span>mese ${esc(mesePulito(ultimo.mese))}</span></div>
    <div class="mp-riquadro">
      <div class="tre"><div><small>VPP</small><b>${num(ultimo.vpp)}</b></div>
        <div><small>VPG</small><b>${num(ultimo.vpg)}</b></div>
        <div><small>Bonus</small><b>${num(bonus, 0)}%</b></div></div>
      ${manca ? `<div style="display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:#C7CBD4">
        <span>${MB21Mappa.bonusSuccessivo(bonus) ? `Per il ${MB21Mappa.bonusSuccessivo(bonus)}% mancano` : 'Per il livello successivo mancano'}</span><span>${num(manca)}</span></div>
        <div class="mp-barra"><i style="width:${fatta.toFixed(1)}%"></i></div>` : ''}
    </div>`;

  if (!st.righe.length) {
    html += `<div class="vuoto">Nessun mese caricato per questo partner.</div>`;
  } else {
    html += `<div class="ck-grafico">
      <div class="legenda"><i style="background:#2563EB;margin-left:0"></i>VPG<i style="background:#93C5FD"></i>VPP</div>
      <div class="ck-barre">${st.righe.map(r => `<div>
        <span class="prima" style="height:${(r.vpg || 0) / st.max * 100}%;background:#2563EB"></span>
        <span style="height:${(r.vpp || 0) / st.max * 100}%;background:#93C5FD"></span></div>`).join('')}</div>
      <div class="rp-mesi">${st.righe.map(r => `<span>${esc(r.etichetta)}</span>`).join('')}</div>
      <div class="ck-valori">media VPP ${num(st.mediaVpp)} · media VPG ${num(st.mediaVpg)} su ${st.righe.length} mesi</div>
    </div>
    <h3>Storico mensile</h3>
    <table class="mp-tabella"><tr><th>Mese</th><th>VPP</th><th>VPG</th><th>Bonus</th></tr>
      ${[...st.righe].reverse().map(r => `<tr><td>${M.STATI[r.stato].pallino} ${esc(r.etichetta)}</td>
        <td>${num(r.vpp)}</td><td>${num(r.vpg)}</td><td>${num(r.bonus, 0)}%</td></tr>`).join('')}
    </table>`;
  }
  app.innerHTML = html + versione();
  const su = document.getElementById('mp-indietro');
  if (su) su.onclick = () => { MP.completa = null; disegnaMappa(); };
}

// Con Partner Select su un altro partner, la Mappa parte da lui (l'Admin vede tutto l'albero)
function radiceVista(cime) {
  const pid = vediTutti() ? null : (visto().partner_id || null);
  if (!pid) return cime;
  let trovato = null;
  const cerca = n => { if (n.id === pid) trovato = n; else n.figli.forEach(cerca); };
  cime.forEach(cerca);
  return trovato ? [trovato] : cime;
}

function collegaMappa() {
  collegaPartnerSelect();
  app.querySelectorAll('[data-mpfiltro]').forEach(b => b.onclick = () => { MP.filtro = b.dataset.mpfiltro; disegnaMappa(); });
  app.querySelectorAll('[data-mpapri]').forEach(b => b.onclick = () => {
    const id = b.dataset.mpapri;
    if (MP.aperti.has(id)) MP.aperti.delete(id); else MP.aperti.add(id);
    disegnaMappa();
  });
  const tutto = document.getElementById('mp-tutto');
  if (tutto) tutto.onclick = () => {
    const cime = radiceVista(MB21Mappa.albero(MP.squadra || [], MP.volumi || []));
    MP.aperti = MP.aperti.size ? new Set() : new Set(MB21Mappa.tuttiGliId(cime));
    disegnaMappa();
  };
  const cerca = document.getElementById('mp-cerca');
  if (cerca) cerca.oninput = () => {
    MP.cerca = cerca.value;
    if (MP.cerca.trim() && !MP.aperti.size) MP.aperti = new Set(MB21Mappa.tuttiGliId(MB21Mappa.albero(MP.squadra || [], MP.volumi || [])));
    const dove = cerca.selectionStart;
    disegnaMappa();
    const nuovo = document.getElementById('mp-cerca');
    if (nuovo) { nuovo.focus(); nuovo.setSelectionRange(dove, dove); }
  };
  app.querySelectorAll('[data-mpcompleta]').forEach(b => b.onclick = () => apriCompleta(b.dataset.mpcompleta));
  app.querySelectorAll('[data-mpnome]').forEach(b => b.onclick = async () => {
    const partner = (MP.squadra || []).find(x => x.partner_id === b.dataset.mpnome);
    if (!partner) return;
    const r = { id: partner.partner_id, nome: MB21Mappa.nomeLeggibile(partner.nome) };
    if (!MP.schede) {
      try { await caricaSchedeMappa(); } catch (e) { return mostraToast('Schede non caricate: riprova.'); }
    }
    const sc = schedaMappa(r);
    if (sc) return apriContattoDa(sc.id, 'mappa');
    // nessuna scheda con quel codice o quel nome: l'Admin la collega (es. Amway «Antonina», in lista «Tonya»)
    if (!eAdmin() || vediTutti()) return mostraToast(`${r.nome} non ha una scheda collegata nella lista`);
    const scelta = await scegliScheda({ titolo: `Scheda di ${r.nome}`, userId: visto().id, mano: `Non è in lista: crea la scheda di ${r.nome}`,
      sottotitolo: `Nella lista non c'è una scheda con questo nome. Cercala con il nome che usi tu: resterà collegata al codice ${r.id}.` });
    if (!scelta) return;
    if (scelta === 'mano') {   // scheda nuova: Partner, già collegata al codice, fuori dalla coda (Partner senza rientro)
      const { data, error } = await dbq('crea scheda dalla Mappa', supa.from('contatti')
        .insert({ user_id: visto().id, nome: r.nome, categoria: 'Partner', codice_amway: r.id }).select('id').single());
      if (error) return mostraToast('Scheda non creata: riprova.');
      mostraToast(`Scheda di ${r.nome} creata`);
      LS.righe = [];   // la Lista si rilegge con la scheda nuova
      return apriContattoDa(data.id, 'mappa');
    }
    const { error } = await dbq('collega codice Amway', supa.from('contatti').update({ codice_amway: r.id }).eq('id', scelta.id));
    if (error) return mostraToast('Non collegata: riprova.');
    mostraToast(`${scelta.nome} collegata a ${r.nome}`);
    try { await caricaSchedeMappa(); } catch (e) { /* si riprova alla prossima apertura */ }
    if (ST.tab === 'mappa' && !MP.completa) disegnaMappa();
  });
}

// ── REPORT (Fase 5) ──────────────────────────────────────
// Brief docs/MB21_v4_Brief_F5_Report.md: periodo Mese · Wes · Anno con ‹ ›, numeri a scalini tipo → esito → nomi
// (tocco su un nome = scheda contatto), grafico dell'anno, Griglia PM in una pagina sua, date dei Wes (solo Admin).
// Numeri del partner loggato (anche l'Admin vede i suoi, come la Dashboard). Calcoli in report.js.
const RP = { tipo: 'mese', periodo: null, azioni: null, wes: [], griglia: null, aperto: null, esito: null, vista: 'report', cella: null };
const CAMPI_REPORT = 'id, contatto_id, portato_da, tipo_azione, modalita, esito, inizio, ospite, contatti(nome)';

async function leggiAzioniMie() {
  const righe = [];
  for (let da = 0; ; da += 1000) {
    const { data, error } = await dbq('azioni del report', supa.from('azioni').select(CAMPI_REPORT)
      .in('user_id', idVisti()).not('inizio', 'is', null).order('id').range(da, da + 999));
    if (error) throw error;
    righe.push(...data);
    if (data.length < 1000) return righe;
  }
}

async function apriReport(vista) {
  RP.vista = vista || RP.vista;
  if (!RP.azioni) app.innerHTML = `<h1>Report</h1><div class="vuoto">Carico i numeri…</div>`;
  try {
    const [azioni, wes, gr] = await Promise.all([
      leggiAzioniMie(),
      dbq('date dei Wes', supa.from('wes').select('id, data').order('data')),
      vediTutti() ? { data: null } : dbq('griglia PM', supa.from('griglia_pm').select('obiettivo, inizio, mesi').eq('user_id', visto().id).maybeSingle()),
    ]);
    if (wes.error || gr.error) throw wes.error || gr.error;
    RP.azioni = await aggiungiPortatoDa(azioni); RP.wes = wes.data; RP.griglia = gr.data;
  } catch (e) {
    app.innerHTML = `<h1>Report</h1><div class="avviso">Non riesco a caricare il Report. Controlla la connessione e riprova.</div>${versione()}`;
    return;
  }
  const oggi = MB21Coda.oggiRoma();
  if (!RP.periodo) RP.periodo = MB21Report.periodoIniziale(RP.tipo, oggi, RP.wes.map(w => w.data));
  RP.vista === 'griglia' ? disegnaGriglia() : disegnaReport();
}

function disegnaReport() {
  const R = MB21Report, oggi = MB21Coda.oggiRoma(), date = RP.wes.map(w => w.data), p = RP.periodo;
  const riga = (classe, attr, testo, n, perc, freccia) =>
    `<button class="rp-riga ${classe}" ${attr}><span>${testo}</span><span class="n">${n}</span><span class="p">${perc}</span><span class="f">${freccia}</span></button>`;
  let html = `<h1>Report</h1>${partnerSelect()}
    <div class="rp-periodi">${[['mese', 'Mese'], ['wes', 'Wes'], ['anno', 'Anno']].map(([k, t]) =>
      `<button data-periodo="${k}" class="${RP.tipo === k ? 'scelto' : ''}">${t}</button>`).join('')}</div>`;
  if (!p) {
    html += `<div class="vuoto">Nessun Wes ancora. ${eAdmin() ? 'Aggiungi la data nella pagina Admin.' : "L'Admin aggiunge le date dei Wes."}</div>`;
  } else {
    html += `<div class="rp-naviga">
      <button id="rp-prima" aria-label="Periodo prima" ${R.spostaPeriodo(p, -1, oggi, date) ? '' : 'disabled'}>‹</button>
      <b>${esc(R.testoPeriodo(p))}</b>
      <button id="rp-dopo" aria-label="Periodo dopo" ${R.spostaPeriodo(p, 1, oggi, date) ? '' : 'disabled'}>›</button></div>`;
    const gruppi = R.numeri(RP.azioni, p, oggi);
    html += `<div class="rp-lista">${gruppi.map(g => {
      const aperto = RP.aperto === g.chiave;
      let h = riga(`tipo ${aperto ? 'aperto' : ''}`, `data-gruppo="${g.chiave}"`, esc(g.etichetta), g.totale, '', aperto ? '⌄' : '›');
      if (!aperto) return h;
      if (!g.esiti.length) return h + `<div class="rp-altre">Nessuna azione nel periodo</div>`;
      for (const e of g.esiti) {
        const scelto = RP.esito === e.esito;
        h += riga(`esito ${e.verde ? 'verde' : ''} ${e.n ? '' : 'zero'}`, `data-esito="${esc(e.esito)}" ${e.n ? '' : 'disabled'}`,
          esc(e.esito), e.n, `${e.percentuale}%`, e.n ? (scelto ? '⌄' : '›') : '');
        if (!scelto) continue;
        h += e.persone.map(x => `<button class="rp-riga nome" data-azione="${esc(x.id)}">
          <span>${esc(x.nome)}<br><small>${esc(R.dataBreve(x.giorno))}${x.modalita ? ' · ' + esc(x.modalita) : ''}${x.portato ? ' · ' + rigaPortato(x.portato) : ''}</small></span><span></span><span class="f">›</span></button>`).join('');
        if (e.altre) h += `<div class="rp-altre">e altri ${e.altre}: scegli un periodo più corto</div>`;
      }
      return h;
    }).join('')}</div>`;
    const anno = R.periodoAnno(p.da), aperto = gruppi.find(g => g.chiave === RP.aperto);
    const mesi = R.grafico(RP.azioni, anno, oggi, RP.aperto), max = Math.max(1, ...mesi.map(m => m.azioni));
    html += `<div class="rp-grafico"><h3>📈 Anno ${esc(anno.etichetta)}${aperto ? ' · ' + esc(aperto.etichetta) : ''}</h3>
      <div class="legenda"><i style="background:#93C5FD;margin-left:0"></i>azioni fatte<i style="background:var(--verde)"></i>risultati che contano</div>
      <div class="rp-barre">${mesi.map(m => `<div><small>${m.azioni || ''}</small><span style="height:${m.azioni / max * 100}%">
        <i style="height:${m.azioni ? m.verdi / m.azioni * 100 : 0}%"></i></span></div>`).join('')}</div>
      <div class="rp-mesi">${mesi.map(m => `<span class="${m.futuro ? 'futuro' : ''}">${m.etichetta}</span>`).join('')}</div></div>`;
  }
  const gp = RP.griglia ? R.griglia(RP.azioni.filter(a => a.tipo_azione === 'Piano Marketing'), RP.griglia, oggi) : null;
  if (!vediTutti()) html += `<button class="rp-apri" id="rp-griglia"><span>🟪 Griglia PM${gp ? ` · ${gp.fatti} di ${gp.obiettivo}` : ' · da impostare'}</span><span>›</span></button>`;
  app.innerHTML = html + versione();
  collegaReport();
}

function collegaReport() {
  const R = MB21Report, oggi = MB21Coda.oggiRoma(), date = RP.wes.map(w => w.data);
  const su = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  collegaPartnerSelect();
  app.querySelectorAll('[data-periodo]').forEach(b => b.onclick = () => {
    RP.tipo = b.dataset.periodo; RP.periodo = R.periodoIniziale(RP.tipo, oggi, date); RP.esito = null; disegnaReport();
  });
  const sposta = n => { const q = R.spostaPeriodo(RP.periodo, n, oggi, date); if (q) { RP.periodo = q; RP.esito = null; disegnaReport(); } };
  su('rp-prima', () => sposta(-1));
  su('rp-dopo', () => sposta(1));
  app.querySelectorAll('[data-gruppo]').forEach(b => b.onclick = () => {
    RP.aperto = RP.aperto === b.dataset.gruppo ? null : b.dataset.gruppo; RP.esito = null; disegnaReport();
  });
  app.querySelectorAll('[data-esito]').forEach(b => b.onclick = () => { RP.esito = RP.esito === b.dataset.esito ? null : b.dataset.esito; disegnaReport(); });
  app.querySelectorAll('[data-azione]').forEach(b => b.onclick = () => foglioAzione(b.dataset.azione, { ritorno: 'report', dopo: () => apriReport('report') }));
  su('rp-griglia', () => { RP.vista = 'griglia'; RP.cella = null; window.scrollTo(0, 0); disegnaGriglia(); });
}

// ── Admin ─────────────────────────────────────────────────
// Pagina solo per l'Admin (richiesta di Ignazio 16/09): date dei Wes e dei BBS (prima nel Report), poi «Carica file Amway».
// Le regole del database lasciano scrivere queste tabelle solo all'Admin: la tab nascosta è solo comodità.
const AD = { wes: [], bbs: [], utenti: [], aperti: new Set(), sezione: null };   // aperti: righe utente aperte (all'inizio tutte chiuse)

async function apriAdmin() {
  if (!eAdmin()) { ST.tab = 'oggi'; return mostraTab(); }
  app.innerHTML = `<h1>Admin</h1><div class="vuoto">Carico…</div>`;
  try {
    const [wes, bbs, ut] = await Promise.all([
      dbq('date dei Wes', supa.from('wes').select('id, data').order('data')),
      dbq('date dei BBS', supa.from('bbs').select('id, data').order('data')),
      dbq('utenti dell\'app', supa.from('utenti').select('id, nome, nome_cognome, email, partner_id, ruolo, accesso_attivo, nel_partner_select, auth_id, abbonamento_scadenza, abbonamento_con')),
    ]);
    if (wes.error || bbs.error || ut.error) throw wes.error || bbs.error || ut.error;
    AD.wes = wes.data; AD.bbs = bbs.data;
    // Admin per primo, poi chi può entrare, poi per nome
    AD.utenti = ut.data.sort((a, b) => (b.ruolo === 'Admin') - (a.ruolo === 'Admin') || b.accesso_attivo - a.accesso_attivo
      || nomeDi(a).localeCompare(nomeDi(b), 'it'));
  } catch (e) {
    app.innerHTML = `<h1>Admin</h1><div class="avviso">Non riesco a caricare la pagina. Controlla la connessione e riprova.</div>${versione()}`;
    return;
  }
  disegnaAdmin();
}

// Una riga per utente, chiusa: pallino dell'abbonamento, nome, scadenza. Tocco → si apre sul posto.
function rigaUtenteAdmin(u) {
  const D = MB21Dashboard, oggi = MB21Coda.oggiRoma(), io = u.id === ST.utente.id, aperto = AD.aperti.has(u.id);
  const chiPaga = u.abbonamento_con && AD.utenti.find(x => x.id === u.abbonamento_con);
  const perChi = AD.utenti.filter(x => x.abbonamento_con === u.id);
  const scad = D.scadenzaDi(u, AD.utenti), stato = D.statoAbbonamento(scad, oggi);
  const pallino = { attivo: '🟢', in_scadenza: '🟠', scaduto: '🔴' }[stato];
  const data = d => (d ? d.split('-').reverse().join('/') : '—');
  let h = `<button class="ad-riga" data-apri-ut="${esc(u.id)}"><span>${pallino}</span><b>${esc(nomeDi(u))}${io ? ' (tu)' : ''}</b>
    <small>${stato === 'scaduto' ? 'scaduto' : 'scade'} ${data(scad)}${u.accesso_attivo ? '' : ' · non entra'}</small><span class="f">${aperto ? '⌄' : '›'}</span></button>`;
  if (!aperto) return h;
  h += `<div class="ad-dettaglio">
    <small>${esc(u.email || 'senza email')} · codice ${esc(u.partner_id || '—')} · ${u.auth_id ? '✅ già entrato' : 'mai entrato'}</small>
    <button class="link" data-modifica-ut="${esc(u.id)}">✏️ Modifica nome, codice, email</button>
    <label class="interruttore"><span>Può entrare</span><input type="checkbox" data-ut="${esc(u.id)}" data-campo="accesso_attivo" ${u.accesso_attivo ? 'checked' : ''} ${io ? 'disabled' : ''}></label>
    <label class="interruttore"><span>Nel Partner Select</span><input type="checkbox" data-ut="${esc(u.id)}" data-campo="nel_partner_select" ${u.nel_partner_select ? 'checked' : ''} ${io ? 'disabled' : ''}></label>
    <div class="ad-abb"><b>Abbonamento</b>`;
  if (chiPaga) {
    h += `<div>In comune con <b>${esc(nomeDi(chiPaga))}</b>: vale la sua scadenza (${data(scad)}).</div>`;
  } else {
    h += `<div>Pagato fino al <b>${data(u.abbonamento_scadenza)}</b>${perChi.length ? ` · vale anche per ${perChi.map(x => esc(nomeDi(x))).join(', ')}` : ''}</div>
      <button class="primario" data-paga="${esc(u.id)}">✓ Pagamento ricevuto → ${data(D.scadenzaDopoPagamento(u.abbonamento_scadenza, oggi))}</button>
      <div class="nuovo-wes"><input type="date" data-scad-data="${esc(u.id)}" value="${esc(u.abbonamento_scadenza || '')}" aria-label="Scadenza"><button data-scad="${esc(u.id)}">Salva data</button></div>`;
  }
  if (!perChi.length) {
    h += `<label class="ad-comune">In comune con <select data-comune="${esc(u.id)}"><option value="">nessuno (paga per sé)</option>${AD.utenti
      .filter(x => x.id !== u.id && !x.abbonamento_con).map(x => `<option value="${esc(x.id)}" ${x.id === u.abbonamento_con ? 'selected' : ''}>${esc(nomeDi(x))}</option>`).join('')}</select></label>`;
  }
  return h + `</div></div>`;
}

// Sottopagine (richiesta di Ignazio 16/09: sul telefono una pagina sola diventa caotica):
// AD.sezione null = menu · 'utenti' · 'wes' · 'bbs'. «Carica file Amway» apre subito la scelta del file.
function disegnaAdmin() {
  const D = MB21Dashboard, oggi = MB21Coda.oggiRoma();
  const indietro = `<button class="indietro" id="ad-indietro">‹ Admin</button>`;
  let html;
  if (AD.sezione === 'utenti') {
    html = `${indietro}<h1>Utenti dell'app</h1>
      <div class="sotto" style="margin:0 0 8px">Entrano ${AD.utenti.filter(u => u.accesso_attivo).length} su ${AD.utenti.length} · 🟢 attivo · 🟠 scade entro ${D.GIORNI_PREAVVISO} giorni · 🔴 scaduto. Tocca un nome per aprirlo.</div>
      <div class="rp-wes">${AD.utenti.map(u => `<div class="ad-utente">${rigaUtenteAdmin(u)}</div>`).join('')}</div>
      <button class="primario" id="ad-nuovo-utente">＋ Nuovo utente</button>`;
  } else if (AD.sezione === 'wes') {
    html = `${indietro}<h1>Wes</h1><div class="rp-wes">
      ${[...AD.wes].reverse().map(w => `<div class="w"><span>WES ${esc(MB21Lista.etichettaEvento(w.data))}</span><button data-togli="${esc(w.id)}">Elimina</button></div>`).join('')}
      <div class="nuovo-wes"><input type="month" id="rp-data-wes" aria-label="Mese del Wes"><button id="rp-piu-wes">+ Wes</button></div>
      <div class="sotto" style="margin:6px 0 0">Solo mese e anno: conta l'ultimo Wes caricato.</div></div>`;
  } else if (AD.sezione === 'bbs') {
    html = `${indietro}<h1>BBS</h1><div class="rp-wes">
      ${[...AD.bbs].reverse().map(w => `<div class="w"><span>BBS ${esc(MB21Lista.etichettaEvento(w.data))}</span><button data-togli-bbs="${esc(w.id)}">Elimina</button></div>`).join('')}
      <div class="nuovo-wes"><input type="month" id="rp-data-bbs" aria-label="Mese del BBS"><button id="rp-piu-bbs">+ BBS</button></div>
      <div class="sotto" style="margin:6px 0 0">Solo mese e anno: conta l'ultimo BBS caricato.</div></div>`;
  } else {
    const stati = AD.utenti.map(u => D.statoAbbonamento(D.scadenzaDi(u, AD.utenti), oggi));
    const ultimo = l => (l.length ? MB21Lista.etichettaEvento(l[l.length - 1].data) : 'nessuno');
    const voce = (id, titolo, sotto) => `<button class="rp-apri ad-voce" id="${id}"><span>${titolo}<small>${sotto}</small></span><span>›</span></button>`;
    html = `<h1>Admin</h1>
      <input type="file" id="ad-file" accept=".csv,text/csv" hidden>
      ${voce('ad-scegli', '📄 Carica file Amway', 'il CSV della LOS: albero, volumi, VPP/VPG')}
      ${voce('ad-vai-utenti', "👥 Utenti dell'app", `entrano ${AD.utenti.filter(u => u.accesso_attivo).length} su ${AD.utenti.length} · 🟠 ${stati.filter(x => x === 'in_scadenza').length} · 🔴 ${stati.filter(x => x === 'scaduto').length}`)}
      ${voce('ad-vai-wes', '🎟 Wes', `ultimo ${ultimo(AD.wes)}`)}
      ${voce('ad-vai-bbs', '🎟 BBS', `ultimo ${ultimo(AD.bbs)}`)}`;
  }
  app.innerHTML = html + versione();
