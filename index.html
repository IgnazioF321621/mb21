<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MB21">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<title>MB21</title>
<style>
  :root {
    --sfondo: #F2F2F7; --card: #FFFFFF; --testo: #1C1C1E; --grigio: #6B7280; --grigio-chiaro: #9CA3AF;
    --linea: #E5E7EB; --blu: #2563EB; --coach: #8B5CF6; --verde: #059669; --rosso: #DC2626;
    --prospect: #F97316; --cliente: #3B82F6; --partner: #8B5CF6; --ex: #9CA3AF; --unlinked: #D1D5DB;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sfondo); color: var(--testo);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 16px) 16px 110px; }
  h1 { font-size: 32px; margin: 8px 0 2px; letter-spacing: -0.5px; }
  .sotto { color: var(--grigio); font-size: 14px; margin-bottom: 18px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--grigio); margin: 22px 4px 8px; }

  .card { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.04); }
  .strip { height: 4px; background: var(--unlinked); }
  .corpo { padding: 14px 16px 16px; }
  .nome { font-size: 17px; font-weight: 700; }
  .prof { font-size: 13px; color: var(--grigio); margin-top: 2px; }
  .luogo { font-size: 12px; color: var(--grigio-chiaro); margin-top: 2px; }
  .riga { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .tel { color: var(--blu); font-size: 16px; font-weight: 600; text-decoration: none; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #F3F4F6; color: #374151; }
  .badge.scaduto { background: #FEE2E2; color: var(--rosso); }
  .coach { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #F5F3FF; color: #5B21B6;
    font-size: 15px; font-weight: 600; line-height: 1.3; }
  .coach small { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--coach); margin-bottom: 2px; }

  .vuoto, .avviso { text-align: center; color: var(--grigio); padding: 28px 16px; font-size: 15px; }
  .avviso { background: #FFFBEB; color: #92400E; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }

  .accesso { max-width: 360px; margin: 12vh auto 0; }
  .accesso p { color: var(--grigio); font-size: 15px; }
  input { width: 100%; font-size: 17px; padding: 14px; border-radius: 12px; border: 1px solid var(--linea); background: #fff; margin: 6px 0 12px; }
  button.primario { width: 100%; font-size: 17px; font-weight: 600; padding: 14px; border: 0; border-radius: 12px; background: var(--testo); color: #fff; }
  button.primario:disabled { opacity: .5; }
  button.link { background: none; border: 0; color: var(--blu); font-size: 15px; padding: 10px 0; }
  .errore { color: var(--rosso); font-size: 14px; min-height: 20px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.92); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--linea); display: flex; justify-content: space-around;
    padding: 8px 0 calc(env(safe-area-inset-bottom) + 8px); }
  nav button { background: none; border: 0; font-size: 12px; font-weight: 600; color: var(--grigio-chiaro); padding: 6px 10px; }
  nav button.attiva { color: var(--testo); }
  .bottoni { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .bottoni button { font-size: 15px; font-weight: 600; padding: 12px 6px; border-radius: 12px; border: 0; background: #F3F4F6; color: var(--testo); }
  .bottoni button:active { transform: scale(.97); }
  .bottoni .appuntamento { background: #DCFCE7; color: #166534; }
  .bottoni .no { background: #FEF2F2; color: #991B1B; }
  .bottoni button:disabled { opacity: .45; }
  .bottoni button:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .card.compatta { margin-bottom: 8px; border-radius: 14px; }
  .riga-coda { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 36px 10px 14px; position: relative; font-family: inherit; color: var(--testo); }
  .riga-coda .rc-alto { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .riga-coda .nome { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .riga-coda .badge { flex: none; }
  .riga-coda .rc-glide { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: #1D4ED8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .riga-coda .rc-coach { display: block; margin-top: 3px; font-size: 13px; font-weight: 600; color: #6D28D9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .riga-coda .rc-freccia { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 20px; color: var(--grigio-chiaro); }
  .card.aperta .rc-coach { white-space: normal; }
  .card.aperta .corpo { padding-top: 0; }
  .card.via { opacity: 0; transform: translateX(40px); transition: all .25s ease; }

  .testa-coda { display: flex; align-items: center; justify-content: space-between; margin: 22px 4px 8px; }
  .testa-coda h2 { margin: 0; }
  .contatore { background: #fff; border: 1px solid var(--linea); border-radius: 999px; padding: 6px 12px;
    font-size: 13px; font-weight: 700; color: var(--testo); }
  .numeri { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 8px; }
  .numeri button { font-size: 20px; font-weight: 700; padding: 14px 0; border-radius: 12px; border: 0; background: #F3F4F6; color: var(--testo); }
  .numeri button.scelto { background: var(--testo); color: #fff; }

  .velo { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; z-index: 20; }
  .foglio { background: #fff; width: 100%; max-width: 520px; margin: 0 auto; border-radius: 20px 20px 0 0;
    padding: 20px 16px calc(env(safe-area-inset-bottom) + 20px); }
  .foglio h3 { margin: 0 0 4px; font-size: 20px; }
  .foglio p { margin: 0 0 12px; color: var(--grigio); font-size: 14px; }
  .foglio .due { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 78px); max-width: 488px; margin: 0 auto;
    background: #1C1C1E; color: #fff; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; font-size: 15px; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .toast button { background: none; border: 0; color: #FBBF24; font-size: 15px; font-weight: 700; padding: 4px 0; }

  /* ── Lista Nomi ── */
  .banner { background: #E5E7EB; border-radius: 12px; padding: 12px 14px; font-size: 15px; margin: 8px 0 12px; }
  .nuovo { width: 100%; font-size: 16px; font-weight: 600; padding: 13px; border: 0; border-radius: 12px; background: #334155; color: #fff; margin-bottom: 14px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; font-size: 14px; font-weight: 600; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--linea); background: #fff; color: var(--testo); }
  .chips button.scelto { background: var(--testo); color: #fff; border-color: var(--testo); }
  .cerca { margin: 10px 0 12px; position: relative; }
  .cerca input { margin: 0; padding-right: 40px; }
  .cerca button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; font-size: 20px; color: var(--grigio); padding: 6px 10px; }
  .cn { display: flex; background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 8px; height: 112px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .cn .striscia { width: 4px; flex: none; }
  .cn .dentro { flex: 1; min-width: 0; padding: 10px 6px 10px 12px; display: flex; flex-direction: column; justify-content: center; }
  .cn .etichetta { font-size: 11px; font-weight: 700; color: #1D4ED8; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 14px; }
  .cn .nome, .cn .prof { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cn .tel { font-size: 15px; margin-top: 4px; display: inline-block; min-height: 20px; }
  .cn .menu { flex: none; border: 0; background: none; font-size: 22px; color: var(--grigio); padding: 0 14px; align-self: flex-start; height: 44px; }
  .altri-voci button { display: block; width: 100%; text-align: left; font-size: 17px; padding: 14px 4px; border: 0; border-bottom: 1px solid var(--linea); background: none; color: var(--testo); }
  .altri-voci button.pericolo { color: var(--rosso); }

  .indietro { border: 0; background: none; color: var(--blu); font-size: 16px; padding: 6px 0; margin-top: 4px; }
  .testata { background: var(--card); border-radius: 16px; overflow: hidden; margin: 8px 0 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .testata .corpo { padding: 14px 16px 16px; }
  .testata .cat { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .testata h1 { font-size: 26px; margin: 2px 0; }
  .testata .alto { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .modifica { border: 0; border-radius: 10px; background: #334155; color: #fff; font-size: 14px; font-weight: 600; padding: 8px 12px; flex: none; }
  .contatta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .contatta a { text-align: center; text-decoration: none; background: #EEF2FF; color: #3730A3; font-size: 13px; font-weight: 600; padding: 10px 0; border-radius: 10px; }
  .contatta a.spento { opacity: .35; pointer-events: none; }
  .sezioni { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
  .sezioni button { flex: none; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 10px; border: 0; background: transparent; color: var(--grigio); }
  .sezioni button.scelto { background: #fff; color: var(--testo); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .riquadro { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .dati { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .dati small { display: block; font-size: 12px; color: var(--grigio); }
  .dati div { font-size: 15px; overflow-wrap: anywhere; }
  .fase { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 700; color: #1E3A8A; }
  .fase img, .fase .senza-icona { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: #E5E7EB; flex: none; }
  .piccolo { border: 0; border-radius: 10px; background: #F3F4F6; font-size: 14px; font-weight: 600; padding: 9px 14px; color: var(--testo); margin-bottom: 12px; }
  .azione { border-top: 1px solid #FDE68A; padding: 10px 0; }
  .azione:first-child { border-top: 0; }
  .azione .t { font-weight: 700; font-size: 15px; }
  .azione .s { font-size: 13px; color: #6B7280; }
  .azione .comandi { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .arancio { background: #FEF3C7; border: 1px solid #F59E0B; border-radius: 14px; padding: 4px 14px; margin-bottom: 12px; }
  .interruttore { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--linea); }
  .interruttore:first-child { border-top: 0; }
  .interruttore small { display: block; color: var(--grigio); font-size: 12px; }
  .interruttore input { width: 50px; height: 30px; margin: 0; appearance: none; -webkit-appearance: none; background: #E5E7EB; border-radius: 999px; position: relative; border: 0; padding: 0; flex: none; transition: background .2s; }
  .interruttore input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; background: #fff; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .2s; }
  .interruttore input:checked { background: var(--verde); }
  .interruttore input:checked::after { left: 23px; }
  .barra { height: 8px; background: #E5E7EB; border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .barra div { height: 100%; background: var(--coach); }
  .nota { background: #FEF3C7; border: 1px solid #F59E0B; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; width: 100%; text-align: left; font-size: 15px; color: var(--testo); }
  .testo-nota { white-space: pre-wrap; font-size: 15px; line-height: 1.45; max-height: 60vh; overflow-y: auto; }

  .foglio.alto { max-height: 92vh; overflow-y: auto; }
  .foglio .testa-foglio { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .foglio .testa-foglio button { border: 0; background: none; font-size: 24px; color: var(--grigio); padding: 0 4px; }
  .campo { margin-bottom: 4px; }
  .campo label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }
  .campo label small { font-weight: 400; color: var(--grigio); }
  .campo input, .campo select, .campo textarea { width: 100%; font-size: 17px; padding: 12px; border-radius: 12px; border: 1px solid var(--linea); background: #F9FAFB; margin: 6px 0 2px; font-family: inherit; color: var(--testo); }
  .campo .conta { text-align: right; font-size: 11px; color: var(--grigio-chiaro); min-height: 14px; }
  .telefono-campo { display: flex; gap: 6px; }
  .telefono-campo select { width: 118px; flex: none; }

  /* ── Dashboard (Fase 3) ── */
  .partner-select { background: #111827; color: #fff; border-radius: 16px; padding: 12px 14px; margin: 8px 0 12px; }
  .partner-select small { display: block; font-size: 12px; font-weight: 700; color: #9CA3AF; margin-bottom: 6px; }
  .partner-select button { width: 100%; display: flex; justify-content: space-between; align-items: center; background: #1F2937; color: #fff;
    border: 1px solid #374151; border-radius: 12px; padding: 10px 12px; font-size: 16px; font-weight: 600; }
  .partner-select button span { font-size: 12px; color: #9CA3AF; font-weight: 600; }
  .banner-abb { display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .banner-abb.attivo { background: rgba(5,150,105,.1); border: 1.5px solid #10B981; color: var(--verde); }
  .banner-abb.scaduto { border-radius: 16px; display: block; background: #FEF2F2; border: 1.5px solid #FCA5A5; color: #B91C1C; padding: 12px 14px; }
  .banner-abb.scaduto small { display: block; font-weight: 400; font-size: 12px; color: #EF4444; }
  .banner-abb.scaduto button { width: 100%; margin-top: 10px; border: 0; border-radius: 12px; background: var(--rosso); color: #fff; font-size: 15px; font-weight: 700; padding: 11px; }
  .banner-grande { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; font-family: inherit; }
  .banner-grande .ico { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; }
  .banner-grande b { display: block; font-size: 16px; }
  .banner-grande small { font-size: 12px; }
  .banner-grande .freccia { margin-left: auto; font-size: 22px; }
  .banner-grande.check { background: linear-gradient(135deg, #EFF6FF, #DBEAFE); border: 2px solid #3B82F6; color: #1D4ED8; }
  .banner-grande.check .ico { background: #3B82F6; }
  .banner-grande.obiettivi { background: #FEF2F2; border: 1.5px solid #FCA5A5; border-left: 5px solid var(--rosso); color: #991B1B; }
  .banner-grande.obiettivi .ico { background: #FEE2E2; }
  .schede-dash { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 12px; scrollbar-width: none; }
  .schede-dash::-webkit-scrollbar { display: none; }
  .schede-dash button { flex: none; font-size: 13px; font-weight: 600; padding: 7px 8px; border-radius: 10px; border: 0; background: transparent; color: var(--grigio); }
  .schede-dash button.scelto { background: #F3F4F6; color: var(--testo); }
  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
  .kpi > div { min-width: 0; border: 1px solid var(--linea); border-radius: 14px; padding: 10px; background: #fff; }
  .kpi .t { font-size: 14px; font-weight: 600; }
  .kpi .v { font-size: clamp(19px, 5.6vw, 26px); white-space: nowrap; font-weight: 800; letter-spacing: -.5px; margin: 4px 0; }
  .kpi ul { margin: 6px 0 0; padding-left: 14px; font-size: 12px; line-height: 1.4; }
  .kpi .barra div { transition: width .4s ease; }
  .kpi .complimento { color: var(--verde); font-weight: 700; }
  .obiettivi-mod { display: block; margin: 8px auto 0; font-weight: 600; }
  .ob-modi { margin-bottom: 10px; }
  .ob-crescita { background: #F5F3FF; border-radius: 14px; padding: 12px 14px; margin-bottom: 6px; }
  .ob-crescita-testa { font-size: 15px; font-weight: 600; color: #5B21B6; }
  .ob-crescita-testa b { font-size: 20px; }
  .ob-crescita input[type=range] { width: 100%; margin: 10px 0 2px; padding: 0; border: 0; background: none; accent-color: var(--coach); height: 28px; }
  .ob-tacche { display: flex; justify-content: space-between; font-size: 11px; color: var(--grigio); }
  .ob-ambizioso { margin-top: 8px; font-size: 13px; font-weight: 600; color: #92400E; background: #FEF3C7; border-radius: 10px; padding: 8px 10px; }
  .ob-gruppo h4 { margin: 14px 0 6px; font-size: 15px; }
  .ob-campi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ob-campi label { font-size: 13px; font-weight: 600; color: var(--grigio); }
  .ob-campi input { margin: 4px 0 0; padding: 10px; font-size: 17px; }
  .visione { display: block; margin: 14px auto; border: 0; background: none; font-size: 15px; font-weight: 600; color: #334155; }
  .sv { background: #1F2937; color: #fff; border-radius: 16px; padding: 14px; margin: 16px 0 6px; }
  .sv h3 { margin: 0; font-size: 20px; }
  .sv .sotto-sv { font-size: 12px; color: #9CA3AF; margin: 2px 0 10px; }
  .sv .legenda { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .sv .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .sv table { width: 100%; border-collapse: separate; border-spacing: 4px; table-layout: fixed; }
  .sv th { font-size: 10px; font-weight: 700; color: #9CA3AF; }
  .sv th.mese { width: 34px; text-align: right; line-height: 1.1; }
  .sv td { height: 34px; color: #fff; border-radius: 8px; text-align: center; font-size: 14px; font-weight: 800; }
  .sv td.zero { background: #374151 !important; color: #6B7280; font-weight: 600; }
  .sv .totali { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 8px; }
  .sv .totali div { background: #374151; border-radius: 10px; padding: 8px 2px; text-align: center; }
  .sv .totali b { display: block; font-size: 17px; }
  .sv .totali div { min-width: 0; overflow: hidden; }
  .sv .totali span { display: block; font-size: 9px; font-weight: 700; color: #D1D5DB; }
  .sv .totali small { display: block; font-size: 9px; color: #9CA3AF; }

  /* ── Agenda (Fase 4) ── */
  .ag-testa { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; }
  .ag-testa h1 { margin: 0; flex: 1; }
  .ag-mese { border: 0; background: none; font-size: 15px; font-weight: 700; color: var(--blu); padding: 6px 0; position: relative; }
  .ag-mese input { position: absolute; inset: 0; opacity: 0; width: 100%; }
  .ag-oggi { border: 1px solid var(--linea); background: #fff; border-radius: 999px; font-size: 13px; font-weight: 700; padding: 6px 12px; color: var(--testo); }
  .ag-piu { border: 0; background: var(--testo); color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 24px; line-height: 1; }
  .ag-settimana { display: flex; align-items: stretch; gap: 2px; background: #fff; border-radius: 16px; padding: 8px 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06); margin-bottom: 14px; }
  .ag-settimana .freccia { border: 0; background: none; color: var(--grigio); font-size: 20px; padding: 0 4px; }
  .ag-giorno { flex: 1; border: 0; background: none; border-radius: 12px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--testo); font-family: inherit; }
  .ag-giorno small { font-size: 11px; font-weight: 700; color: var(--grigio); }
  .ag-giorno b { font-size: 17px; }
  .ag-giorno i { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
  .ag-giorno i.si { background: var(--blu); }
  .ag-giorno.oggi b { color: var(--blu); }
  .ag-giorno.scelto { background: var(--testo); }
  .ag-giorno.scelto small, .ag-giorno.scelto b { color: #fff; }
  .ag-giorno.scelto i.si { background: #fff; }
  .ag-evento { display: flex; background: #fff; border-radius: 14px; margin-bottom: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .ag-evento .ora { width: 64px; flex: none; padding: 12px 0 12px 12px; font-size: 13px; font-weight: 700; color: var(--testo); line-height: 1.3; }
  .ag-evento .ora small { display: block; font-weight: 500; color: var(--grigio); }
  .ag-evento .barra-tipo { width: 4px; flex: none; margin: 10px 0; border-radius: 4px; }
  .ag-evento .dentro { flex: 1; min-width: 0; }
  .ag-evento .apri { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; font-family: inherit; color: var(--testo); }
  .ag-evento .t { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag-evento .s { font-size: 13px; color: var(--grigio); margin-top: 2px; }
  .ag-evento .extra { padding: 0 12px 12px; }
  .ag-evento .extra .note-ev { font-size: 13px; color: var(--grigio); margin-bottom: 8px; }
  .ag-esiti { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .ag-esiti button { border: 0; border-radius: 10px; background: #F3F4F6; font-size: 14px; font-weight: 600; padding: 9px 11px; color: var(--testo); }
  .ag-esiti button.attuale { background: #DBEAFE; color: #1D4ED8; }
  .ag-comandi { display: flex; gap: 8px; flex-wrap: wrap; }
  .ag-comandi button { border: 1px solid var(--linea); background: #fff; border-radius: 10px; font-size: 13px; font-weight: 600; padding: 8px 10px; color: var(--testo); }
  .ag-comandi button.pericolo { color: var(--rosso); }
  .ag-blocco { width: 100%; display: flex; justify-content: space-between; align-items: center; text-align: left; border: 0; border-radius: 14px; padding: 13px 14px; margin: 6px 0; font-size: 15px; font-weight: 600; font-family: inherit; }
  .ag-blocco.telefonate { background: #EEF2FF; color: #3730A3; }
  .ag-blocco.passati { background: #FEF3C7; color: #92400E; }
  .ag-scelte { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
  .ag-scelte button { border: 1px solid var(--linea); background: #fff; border-radius: 999px; font-size: 14px; font-weight: 600; padding: 8px 12px; color: var(--testo); }
  .ag-scelte button.scelto { background: var(--testo); color: #fff; border-color: var(--testo); }
  .ag-due-campi { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }

  .versione { text-align: center; color: var(--grigio-chiaro); font-size: 11px; margin-top: 28px; }
</style>
</head>
<body>
<main id="app"></main>
<nav id="tab" hidden>
  <button data-tab="oggi" class="attiva">Dashboard</button>
  <button data-tab="agenda">Agenda</button>
  <button data-tab="lista">Lista Nomi</button>
  <button data-tab="progressi">Progressi</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="coda.js"></script>
<script src="lista.js"></script>
<script src="dashboard.js"></script>
<script src="agenda.js"></script>
<script>
const APP_VERSION = '2026.09.14 · 23:44';

const SUPABASE_URL = 'https://exwgjlhbhlgebkgxtanq.supabase.co';
// Chiave pubblica (anon/publishable): può stare nella pagina, i dati li proteggono le regole di accesso.
const SUPABASE_KEY = 'sb_publishable_i9kxRdnrgk2fvk71P3VV9g_GJA1-r26';

const COLORI = { 'Prospect': 'var(--prospect)', 'Cliente': 'var(--cliente)', 'Partner': 'var(--partner)',
  'Ex Partner/Cliente': 'var(--ex)', 'Archiviato': 'var(--ex)', 'Referral': 'var(--ex)', 'Unlinked': 'var(--unlinked)' };
const CHIAVE_CACHE = 'mb21_coda';

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const ST = { email: '', utente: null, tab: 'oggi' };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function versione() { return `<div class="versione">Versione ${APP_VERSION}</div>`; }
function dataEstesa(iso) {
  return new Date(iso + 'T12:00:00Z').toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
}

// supabase-js non lancia eccezioni sugli errori: si controlla sempre `error` (lezione di Zona Tracker).
async function dbq(cosa, promessa) {
  const res = await promessa;
  if (res.error) console.error('[MB21] ' + cosa, res.error);
  return res;
}

// ── Accesso ──────────────────────────────────────────────
function mostraEmail(errore) {
  document.getElementById('tab').hidden = true;
  app.innerHTML = `
    <div class="accesso">
      <h1>MB21</h1>
      <p>Scrivi la tua email: ti mandiamo un link per entrare.</p>
      <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="nome@email.it" value="${esc(ST.email)}">
      <div class="errore">${esc(errore || '')}</div>
      <button class="primario" id="invia">Mandami il link</button>
      ${versione()}
    </div>`;
  document.getElementById('invia').onclick = inviaLink;
}

// Piano gratuito di Supabase: il testo dell'email non si può cambiare, quindi arriva solo il link
// (niente codice a 6 cifre). Il link riapre questa pagina e supabase-js legge l'accesso da solo.
async function inviaLink() {
  const btn = document.getElementById('invia');
  ST.email = document.getElementById('email').value.trim().toLowerCase();
  if (!ST.email.includes('@')) return mostraEmail('Controlla l\'email.');
  btn.disabled = true; btn.textContent = 'Invio…';
  const { error } = await dbq('invio link', supa.auth.signInWithOtp({
    email: ST.email, options: { emailRedirectTo: location.origin + location.pathname } }));
  if (error) return mostraEmail(messaggioAccesso(error));
  app.innerHTML = `
    <div class="accesso">
      <h1>Controlla l'email</h1>
      <p>Abbiamo mandato un link a <b>${esc(ST.email)}</b>. Aprilo <b>su questo telefono</b>: ti riporta qui già dentro.</p>
      <button class="link" id="indietro">Cambia email</button>
    </div>`;
  document.getElementById('indietro').onclick = () => mostraEmail();
}

function messaggioAccesso(error) {
  const m = (error.message || '').toLowerCase();
  if (m.includes('database error') || m.includes('non abilitato') || m.includes('signups not allowed')) return 'Utente non abilitato.';
  if (m.includes('rate limit') || error.status === 429) return 'Troppi tentativi: riprova tra un\'ora.';
  return 'Non è andata: ' + error.message;
}

async function dopoAccesso(sessione) {
  const { data, error } = await dbq('lettura utente',
    supa.from('utenti').select('id, nome, nome_cognome, ruolo, abbonamento_scadenza').eq('auth_id', sessione.user.id).maybeSingle());
  if (error && !navigator.onLine) { ST.utente = {}; return mostraTab(); }   // offline: si prova con la cache
  if (!data) {
    ST.motivoUscita = 'Utente non abilitato.';
    return supa.auth.signOut();   // → SIGNED_OUT mostra il motivo
  }
  ST.utente = data;
  mostraTab();
}

// ── Tab ──────────────────────────────────────────────────
function mostraTab() {
  const nav = document.getElementById('tab');
  nav.hidden = false;
  nav.querySelectorAll('button').forEach(b => {
    b.classList.toggle('attiva', b.dataset.tab === ST.tab);
    b.onclick = () => { ST.tab = b.dataset.tab; mostraTab(); };
  });
  if (ST.tab === 'oggi') return caricaOggi();
  if (ST.tab === 'lista') return apriLista();
  if (ST.tab === 'agenda') return apriAgenda();
  app.innerHTML = `<h1>Progressi</h1><div class="vuoto">In arrivo.</div>${versione()}`;
}

// ── OGGI ─────────────────────────────────────────────────
async function leggiCandidati(oggi) {
  const righe = [];
  for (let da = 0; ; da += 1000) {   // PostgREST restituisce al massimo 1000 righe per volta
    const { data, error } = await dbq('lettura coda',
      supa.from('contatti_coda').select('*').lte('rientro_il', oggi).order('id').range(da, da + 999));
    if (error) throw error;
    righe.push(...data);
    if (data.length < 1000) return righe;
  }
}

async function caricaOggi() {
  const oggi = MB21Coda.oggiRoma();
  app.innerHTML = `<h1>Dashboard</h1><div class="sotto">${esc(dataEstesa(oggi))}</div><div class="vuoto">Carico la coda…</div>`;
  let risultato, stato, offline = false;
  try {
    const { data, error } = await dbq('stato di oggi', supa.rpc('stato_oggi'));
    if (error) throw error;
    stato = data;   // { contatti_al_giorno, fatti_oggi }
    const posti = stato.contatti_al_giorno - stato.fatti_oggi;
    risultato = MB21Coda.calcolaCoda(await leggiCandidati(oggi), oggi, posti);
    if (risultato.nuoviInCoda.length) {
      await dbq('ingresso in coda', supa.from('contatti').update({ in_coda_dal: oggi })
        .in('id', risultato.nuoviInCoda).is('in_coda_dal', null));
    }
  } catch (e) {
    let cache = null;
    try { cache = JSON.parse(localStorage.getItem(CHIAVE_CACHE)); } catch (e2) {}
    if (!cache) {
      app.innerHTML = `<h1>Dashboard</h1><div class="avviso">Non riesco a caricare la coda. Controlla la connessione e riapri l'app.</div>${versione()}`;
      return;
    }
    risultato = cache.risultato; offline = cache.salvata;
    stato = cache.stato || { contatti_al_giorno: MB21Coda.CAPIENZA, fatti_oggi: 0 };   // copia salvata da una versione precedente
  }
  ST.oggi = oggi; ST.risultato = risultato; ST.stato = stato; ST.offline = offline;
  if (!offline) salvaCache();
  await caricaDashboard(oggi);
  disegnaOggi();
}

// ── Bottoni esito (tabella confermata da Ignazio il 14/09, STRUTTURA.md → Bottoni esito) ──
// Prospect, Referral e senza categoria: 5 bottoni sulle fasi Prospect · Contatto.
// Partner e Cliente: in Sequenze non hanno fasi di telefonata → solo i due con data.
const BOTTONI_PROSPECT = [
  { etichetta: 'Appuntamento', chiave: 'Prospect-Contatto-PM Fissato', data: 'giorno-ora', classe: 'appuntamento' },
  { etichetta: 'Richiamare', chiave: 'Prospect-Contatto-Richiamare', data: 'giorno' },
  { etichetta: 'Non risponde', chiave: 'Prospect-Contatto-No Risposta' },
  { etichetta: 'Non ora', chiave: 'Prospect-Contatto-Relazione' },
  { etichetta: 'Non interessato', chiave: 'Prospect-Contatto-No Interesse', classe: 'no' },
];
function bottoniPer(categoria) {
  if (categoria === 'Partner' || categoria === 'Cliente') return [
    { etichetta: 'Appuntamento', chiave: `${categoria}-Contatto-Appuntamento`, data: 'giorno-ora', classe: 'appuntamento' },
    { etichetta: 'Richiamare', chiave: `${categoria}-Contatto-Richiamare`, data: 'giorno' },
  ];
  return BOTTONI_PROSPECT;
}

// Riga compatta con le parole di Glide («Azioni da completare»): nome · «modalità • area | esito» dell'ultima azione · frase del coach. Il tocco la apre (una sola aperta): dati, telefono, coach intero, bottoni.
function rigaGlide(r) {
  const prima = [r.ultima_modalita || (r.contattato ? r.ultimo_tipo : 'Telefonata'), r.ultima_area || 'Attività'].filter(Boolean).join(' • ');
  return `${prima} | ${r.contattato ? (r.ultima_fase || 'Senza esito') : 'Mai contattato o 2+ anni'}`;
}
function cardContatto(r, dareSeguito) {
  const fase = r.contattato ? (r.ultima_fase || 'Senza esito') : 'Mai contattato';
  const badge = dareSeguito
    ? `<span class="badge scaduto">${esc(fase)} · scaduto da ${r.scadutoDa} ${r.scadutoDa === 1 ? 'giorno' : 'giorni'}</span>`
    : `<span class="badge">${esc(fase)}</span>`;
  const aperta = ST.aperta === r.id;
  const testa = `
    <button class="riga-coda" data-apri="${esc(r.id)}" aria-expanded="${aperta}">
      <span class="rc-alto"><span class="nome">${esc(r.nome)}</span>${dareSeguito ? badge : ''}</span>
      <span class="rc-glide">${esc(rigaGlide(r))}</span>
      ${r.coach ? `<span class="rc-coach">${esc(r.coach)}</span>` : ''}
      <span class="rc-freccia">${aperta ? '⌃' : '›'}</span>
    </button>`;
  if (!aperta) {
    return `<div class="card compatta" id="card-${esc(r.id)}"><div class="strip" style="background:${COLORI[r.categoria] || 'var(--unlinked)'}"></div>${testa}</div>`;
  }
  const luogo = [r.citta, r.fascia_eta].filter(Boolean).join(' · ');
  const tel = r.telefono ? `<a class="tel" href="tel:${esc(r.telefono.replace(/[^0-9+]/g, ''))}">${esc(r.telefono)}</a>` : '';
  const bottoni = bottoniPer(r.categoria).map((b, i) =>
    `<button class="${b.classe || ''}" data-contatto="${esc(r.id)}" data-bottone="${i}" ${ST.offline ? 'disabled' : ''}>${esc(b.etichetta)}</button>`).join('');
  return `
    <div class="card compatta aperta" id="card-${esc(r.id)}">
      <div class="strip" style="background:${COLORI[r.categoria] || 'var(--unlinked)'}"></div>
      ${testa}
      <div class="corpo">
        ${r.professione ? `<div class="prof">${esc(r.professione)}</div>` : ''}
        ${luogo ? `<div class="luogo">${esc(luogo)}</div>` : ''}
        ${tel ? `<div class="riga">${tel}</div>` : ''}
        <div class="bottoni">${bottoni}</div>
      </div>
    </div>`;
}

function disegnaOggi() {
  const r = ST.risultato;
  let html = `<h1>Dashboard</h1><div class="sotto">${esc(dataEstesa(ST.oggi))}</div>` + dashboardAlto();
  if (ST.offline) {
    const ora = new Date(ST.offline).toLocaleString('it-IT', { timeZone: 'Europe/Rome', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    html += `<div class="avviso">Sei offline: questa è la coda salvata il ${esc(ora)}. Solo lettura.</div>`;
  }
  if (r.dareSeguito.length) {
    html += `<h2>Dare Seguito scaduti</h2>` + r.dareSeguito.map(x => cardContatto(x, true)).join('');
  }
  const st = ST.stato;
  const finito = st.fatti_oggi >= st.contatti_al_giorno;
  html += `<div class="testa-coda"><h2>La tua coda</h2>
    <button class="contatore" id="contatore" ${ST.offline ? 'disabled' : ''}>Fatti ${st.fatti_oggi} di ${st.contatti_al_giorno}</button></div>`;
  html += r.coda.length ? r.coda.map(x => cardContatto(x, false)).join('')
    : `<div class="vuoto">${finito ? `Per oggi hai finito: ${st.fatti_oggi} di ${st.contatti_al_giorno}. 👏` : 'Nessuno da chiamare oggi.'}</div>`;
  app.innerHTML = html + dashboardBasso() + versione();
  collegaDashboard();
  const contatore = document.getElementById('contatore');
  if (contatore) contatore.onclick = scegliNumero;
  app.querySelectorAll('.riga-coda').forEach(b => {
    b.onclick = () => { ST.aperta = ST.aperta === b.dataset.apri ? null : b.dataset.apri; disegnaOggi(); };
  });
  app.querySelectorAll('.bottoni button').forEach(btn => {
    btn.onclick = () => toccaBottone(btn.dataset.contatto, Number(btn.dataset.bottone));
  });
}

function trovaInCoda(id) {
  for (const lista of ['dareSeguito', 'coda']) {
    const i = ST.risultato[lista].findIndex(x => x.id === id);
    if (i >= 0) return { lista, i, contatto: ST.risultato[lista][i] };
  }
  return null;
}

async function toccaBottone(id, indice) {
  const pos = trovaInCoda(id);
  if (!pos) return;
  const bottone = bottoniPer(pos.contatto.categoria)[indice];
  let data = null;
  if (bottone.data) {
    data = await chiediData(bottone, pos.contatto.nome);
    if (!data) return;                       // annullato dal foglio
  }
  const card = document.getElementById('card-' + id);
  card.querySelectorAll('button').forEach(b => { b.disabled = true; });
  const daCoda = pos.lista === 'coda';   // i Dare Seguito non contano nei contatti al giorno
  const { data: esito, error } = await registraEsito(id, bottone, data, daCoda);
  if (error) {
    card.querySelectorAll('button').forEach(b => { b.disabled = false; });
    return mostraToast('Non salvato: controlla la connessione e riprova.');
  }
  card.classList.add('via');
  setTimeout(() => {
    ST.risultato[pos.lista].splice(pos.i, 1);
    if (daCoda) ST.stato.fatti_oggi++;
    salvaCache();
    disegnaOggi();
    mostraToast(`${pos.contatto.nome} · ${bottone.etichetta}`, () => annulla(pos, esito));
  }, 250);
}

// Un esito (Dashboard e scheda contatto usano lo stesso codice) e il suo annullamento.
function registraEsito(contattoId, bottone, data, daCoda) {
  return dbq('registra esito', supa.rpc('registra_esito',
    { p_contatto: contattoId, p_chiave: bottone.chiave, p_data: data, p_da_coda: daCoda }));
}
function annullaEsito(esito) {
  return dbq('annulla esito', supa.rpc('annulla_esito',
    { p_azione: esito.azione_id, p_rientro: esito.rientro_prec, p_in_coda: esito.in_coda_prec }));
}

async function annulla(pos, esito) {
  const { error } = await annullaEsito(esito);
  if (error) return mostraToast('Annullamento non riuscito: riprova.');
  ST.risultato[pos.lista].splice(pos.i, 0, pos.contatto);
  if (pos.lista === 'coda') ST.stato.fatti_oggi--;
  salvaCache();
  disegnaOggi();
  mostraToast('Annullato');
}

function salvaCache() {
  try { localStorage.setItem(CHIAVE_CACHE, JSON.stringify({ oggi: ST.oggi, risultato: ST.risultato, stato: ST.stato, salvata: new Date().toISOString() })); } catch (e) {}
}

// Foglio in basso per scegliere il giorno (e l'ora per l'appuntamento). Restituisce un ISO o null.
function chiediData(bottone, nome) {
  const domani = MB21Coda.oggiRoma(new Date(Date.now() + 86400000));
  return new Promise(risolvi => {
    const velo = document.createElement('div');
    velo.className = 'velo';
    velo.innerHTML = `
      <div class="foglio">
        <h3>${esc(bottone.etichetta)}</h3>
        <p>${esc(nome)}</p>
        <input id="scelta-giorno" type="date" value="${domani}" min="${MB21Coda.oggiRoma()}">
        ${bottone.data === 'giorno-ora' ? '<input id="scelta-ora" type="time" value="18:30">' : ''}
        <div class="due">
          <button class="link" id="scelta-no">Annulla</button>
          <button class="primario" id="scelta-si">Conferma</button>
        </div>
      </div>`;
    document.body.appendChild(velo);
    const chiudi = valore => { velo.remove(); risolvi(valore); };
    velo.onclick = e => { if (e.target === velo) chiudi(null); };
    velo.querySelector('#scelta-no').onclick = () => chiudi(null);
    velo.querySelector('#scelta-si').onclick = () => {
      const giorno = velo.querySelector('#scelta-giorno').value;
      if (!giorno) return;
      const ora = bottone.data === 'giorno-ora' ? (velo.querySelector('#scelta-ora').value || '12:00') : '12:00';
      chiudi(new Date(`${giorno}T${ora}:00`).toISOString());   // ora del telefono (Italia)
    };
  });
}

// Contatti al giorno (1-10): è il massimo di esiti dalla coda in un giorno.
function scegliNumero() {
  const attuale = ST.stato.contatti_al_giorno;
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `
    <div class="foglio">
      <h3>Contatti al giorno</h3>
      <p>Quanti contatti vuoi lavorare ogni giorno. I Dare Seguito scaduti si aggiungono sempre.</p>
      <div class="numeri">${Array.from({ length: 10 }, (_, i) => i + 1).map(n =>
        `<button class="${n === attuale ? 'scelto' : ''}" data-n="${n}">${n}</button>`).join('')}</div>
      <button class="link" id="numero-no">Annulla</button>
    </div>`;
  document.body.appendChild(velo);
  velo.onclick = e => { if (e.target === velo) velo.remove(); };
  velo.querySelector('#numero-no').onclick = () => velo.remove();
  velo.querySelectorAll('.numeri button').forEach(b => {
    b.onclick = async () => {
      const n = Number(b.dataset.n);
      velo.remove();
      if (n === attuale) return;
      const { error } = await dbq('contatti al giorno', supa.rpc('imposta_contatti_al_giorno', { p_numero: n }));
      if (error) return mostraToast('Non salvato: controlla la connessione e riprova.');
      mostraToast(`Contatti al giorno: ${n}`);
      caricaOggi();   // con un numero più alto la coda si riempie
    };
  });
}

let timerToast;
function mostraToast(testo, suAnnulla) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  clearTimeout(timerToast);
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${esc(testo)}</span>${suAnnulla ? '<button>Annulla</button>' : ''}`;
  if (suAnnulla) t.querySelector('button').onclick = () => { t.remove(); clearTimeout(timerToast); suAnnulla(); };
  document.body.appendChild(t);
  timerToast = setTimeout(() => t.remove(), suAnnulla ? 6000 : 3500);
}

// ── DASHBOARD (Fase 3) ───────────────────────────────────
// Copia della Dashboard di Glide (docs/MB21_v3_Dashboard_Agenda_come_e.md), brief Fase 3. Calcoli in dashboard.js.
// Ordine: Partner Select · banner · 4 schede · visione completa · [OGGI] · Segni Vitali · Mostra di più.
const DS = { dati: null, obiettivi: [], scheda: 'volume' };

async function caricaDashboard(oggi) {
  try {
    const mio = ST.utente.id;
    const [cm, ob] = await Promise.all([
      dbq('check dei mesi', supa.from('check_mesi').select('*').eq('user_id', mio)),
      dbq('obiettivi del mese', supa.from('obiettivi_mese').select('*').eq('user_id', mio)),
    ]);
    if (cm.error || ob.error) throw cm.error || ob.error;
    DS.obiettivi = ob.data;
    DS.dati = MB21Dashboard.calcola({ checkMesi: cm.data, obiettivi: ob.data, oggi, scadenza: ST.utente.abbonamento_scadenza });
  } catch (e) {
    DS.dati = null;   // la coda si mostra lo stesso
  }
}

const inArrivo = cosa => mostraToast(`${cosa}: in arrivo`);
const dataBreve = iso => iso ? iso.split('-').reverse().join('/') : '—';

function dashboardAlto() {
  const d = DS.dati;
  let html = eAdmin() ? `<div class="partner-select"><small>Partner Select</small>
    <button id="ds-partner">${esc(ST.utente.nome || ST.utente.nome_cognome || '')}<span>In arrivo ▾</span></button></div>` : '';
  if (!d) return html + (ST.offline ? '' : `<div class="avviso">Numeri della Dashboard non disponibili: riprova più tardi.</div>`);
  html += d.abbonamentoAttivo
    ? `<div class="banner-abb attivo">✅ Abbonamento attivo · Buon lavoro!</div>`
    : `<div class="banner-abb scaduto">🔴 Abbonamento scaduto<small>Accesso limitato alle funzionalità</small>
        <button id="ds-rinnova">Rinnova subito →</button></div>`;
  if (d.obiettiviMancanti) html += `<button class="banner-grande obiettivi" id="ds-obiettivi"><span class="ico">🎯</span>
    <span><b>Imposta gli obiettivi del mese!</b><small>Clicca su questo banner</small></span></button>`;
  html += `<button class="banner-grande check" id="ds-check" ${ST.offline ? 'disabled' : ''}><span class="ico">⚡</span>
    <span><b>Compila il Check del Giorno!</b><small>Ultimo check: <u>${esc(dataBreve(d.ultimoCheck))}</u> · Tocca per aprire</small></span>
    <span class="freccia">›</span></button>`;
  const s = d.schede.find(x => x.chiave === DS.scheda);
  html += `<div class="riquadro"><div class="schede-dash">${d.schede.map(x =>
    `<button data-scheda="${x.chiave}" class="${x.chiave === DS.scheda ? 'scelto' : ''}">${x.pallino} ${esc(x.etichetta)}</button>`).join('')}</div>
    <div class="kpi">${s.riquadri.map(r => `<div>
      <div class="t" style="color:${s.colore}">${esc(r.titolo)}</div>
      <div class="v" style="color:${s.colore}">${esc(r.numero)}</div>
      ${r.senzaObiettivo ? '' : `<div class="barra"><div style="width:${r.percentuale}%;background:${r.raggiunto ? 'var(--verde)' : s.colore}"></div></div>`}
      <ul style="color:${s.colore}">${r.righe.map(t => `<li class="${r.raggiunto && t.startsWith(r.complimento) ? 'complimento' : ''}">${esc(t)}</li>`).join('')}</ul>
    </div>`).join('')}</div></div>
    ${d.obiettiviMancanti ? '' : `<button class="link obiettivi-mod" id="ds-obiettivi-mod" ${ST.offline ? 'disabled' : ''}>🎯 Obiettivi di ${esc(MB21Dashboard.nomeMese(d.mese))}</button>`}
    <button class="visione" id="ds-visione">👁️ Clicca qui per una visione completa!</button>`;
  return html;
}

const COLORI_SV = { contatti: '#9CA3AF', pm: '#EA580C', bbs: '#3B82F6', wes: '#DC2626', cep: '#16A34A' };
function dashboardBasso() {
  const d = DS.dati;
  if (!d) return '';
  const sv = d.segniVitali;
  const colonne = [['contatti', 'Contatti'], ['pm', 'PM'], ['bbs', 'BBS'], ['wes', 'WES'], ['cep', 'CEP']];
  const cella = (k, v) => {
    if (!v) return `<td class="zero">0</td>`;
    const forza = 0.35 + 0.65 * v / (sv.massimi[k] || 1);   // più alto il numero, più acceso il colore
    const [rr, gg, bb] = [1, 3, 5].map(i => parseInt(COLORI_SV[k].slice(i, i + 2), 16));
    return `<td style="background:rgba(${rr},${gg},${bb},${forza.toFixed(2)})">${v}</td>`;
  };
  return `<div class="sv">
      <h3>📊 Segni Vitali</h3>
      <div class="sotto-sv">Ultimi 12 mesi · 👤 ${esc(ST.utente.nome_cognome || '')}</div>
      <div class="legenda">${colonne.map(([k, t]) => `<span><i style="background:${COLORI_SV[k]}"></i>${t}</span>`).join('')}</div>
      <table><tr><th class="mese"></th>${colonne.map(([k, t]) => `<th style="color:${COLORI_SV[k]}">${t.toUpperCase()}</th>`).join('')}</tr>
      ${sv.righe.map(r => `<tr><th class="mese">${r.etichetta}<br>${r.anno}</th>${colonne.map(([k]) => cella(k, r[k])).join('')}</tr>`).join('')}
      </table>
      <div class="totali">${colonne.map(([k, t]) => `<div><b style="color:${COLORI_SV[k]}">${sv.totali[k].valore}</b><span>${t.toUpperCase()}</span><small>${esc(sv.totali[k].sotto)}</small></div>`).join('')}</div>
    </div>
    <button class="visione" id="ds-altro">👁️ Mostra di più!</button>`;
}

function collegaDashboard() {
  const su = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  su('ds-partner', () => inArrivo('Partner Select'));
  su('ds-rinnova', () => inArrivo('Rinnovo abbonamento'));
  su('ds-obiettivi', apriObiettivi);
  su('ds-obiettivi-mod', apriObiettivi);
  su('ds-visione', () => inArrivo('Sezione Check'));
  su('ds-altro', () => inArrivo('Sezione Report'));
  su('ds-check', apriCheck);
  app.querySelectorAll('.schede-dash button').forEach(b => {
    b.onclick = () => { DS.scheda = b.dataset.scheda; disegnaOggi(); };
  });
}

// Obiettivi del mese (lavoro 5): un foglio con i 12 obiettivi raggruppati come le schede, già compilati
// con quelli del mese (o del mese scorso). «Come <mese>» riempie, «Scelgo io» svuota, la barra «Crescita su <mese>»
// (5 · 10 · 20 · 30 · 40 · 50%) ricalcola tutti i campi mentre si sposta; sopra il 20% un avviso.
// Partenza di BBS/WES/CEP automatica: non si chiede. Si salva solo con almeno un obiettivo.
function apriObiettivi() {
  if (ST.offline || !DS.dati) return;
  const D = MB21Dashboard, mese = DS.dati.mese;
  const { valori, mesePrima } = D.propostaObiettivi(DS.obiettivi, mese, 'attuali');
  const prima = mesePrima ? D.nomeMese(mesePrima) : null;
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `<div class="foglio alto">
    <div class="testa-foglio"><h3>🎯 Obiettivi di ${esc(D.nomeMese(mese))}</h3><button id="ob-x" aria-label="Chiudi">×</button></div>
    ${prima ? `<p>Come vuoi partire?</p><div class="chips ob-modi">
      <button data-modo="uguale">Come ${esc(prima.toLowerCase())}</button>
      <button data-modo="vuoti">Scelgo io</button></div>
      <div class="ob-crescita">
        <div class="ob-crescita-testa">Crescita su ${esc(prima.toLowerCase())}: <b id="ob-perc">scegli</b></div>
        <input type="range" id="ob-barra" min="0" max="${D.CRESCITE.length - 1}" step="1" value="${D.CRESCITE.indexOf(10)}">
        <div class="ob-tacche">${D.CRESCITE.map(c => `<span>${c}%</span>`).join('')}</div>
        <div class="ob-ambizioso" id="ob-ambizioso" hidden>💪 Obiettivo ambizioso: parlane con il tuo upline</div>
      </div>` : `<p>Scrivi i tuoi obiettivi per questo mese.</p>`}
    ${D.CAMPI_OBIETTIVI.map(([gruppo, pallino, campi]) => `<div class="ob-gruppo"><h4>${pallino} ${esc(gruppo)}</h4><div class="ob-campi">
      ${campi.map(([k, etichetta, decimale]) => `<label>${esc(etichetta)}<input id="ob-${k}" inputmode="${decimale ? 'decimal' : 'numeric'}" value="${esc(valori[k])}"></label>`).join('')}
    </div></div>`).join('')}
    <div class="errore" id="ob-errore"></div>
    <div class="due"><button class="link" id="ob-no">Annulla</button><button class="primario" id="ob-si">Salva obiettivi</button></div>
  </div>`;
  document.body.appendChild(velo);
  const chiudi = () => velo.remove();
  velo.querySelector('#ob-x').onclick = chiudi;
  velo.querySelector('#ob-no').onclick = chiudi;
  const scrivi = nuovi => { for (const [, , campi] of D.CAMPI_OBIETTIVI) for (const [k] of campi) velo.querySelector('#ob-' + k).value = nuovi ? nuovi[k] : ''; };
  const sceltaModo = b => velo.querySelectorAll('.ob-modi button').forEach(x => x.classList.toggle('scelto', x === b));
  velo.querySelectorAll('.ob-modi button').forEach(b => {
    b.onclick = () => { sceltaModo(b); scrivi(b.dataset.modo === 'vuoti' ? null : D.propostaObiettivi(DS.obiettivi, mese, b.dataset.modo).valori); };
  });
  const barra = velo.querySelector('#ob-barra');
  if (barra) barra.oninput = () => {
    const p = D.CRESCITE[Number(barra.value)];
    velo.querySelector('#ob-perc').textContent = `+${p}%`;
    velo.querySelector('#ob-ambizioso').hidden = p <= D.SOGLIA_AMBIZIOSO;
    sceltaModo(null);
    scrivi(D.propostaObiettivi(DS.obiettivi, mese, 'crescita', p).valori);
  };
  if (barra) barra.onclick = barra.oninput;   // un tocco sulla posizione di partenza (10%) vale anche senza spostarla
  velo.querySelector('#ob-si').onclick = async () => {
    const letti = {};
    for (const [, , campi] of D.CAMPI_OBIETTIVI) for (const [k] of campi) letti[k] = velo.querySelector('#ob-' + k).value;
    const { errore, valori: v } = D.validaObiettivi(letti);
    if (errore) { velo.querySelector('#ob-errore').textContent = errore; return; }
    const btn = velo.querySelector('#ob-si');
    btn.disabled = true; btn.textContent = 'Salvo…';
    // upsert sulla coppia partner+mese: tocca solo gli obiettivi (partenza e dati Amway restano)
    const { error } = await dbq('salva obiettivi', supa.from('obiettivi_mese')
      .upsert({ user_id: ST.utente.id, mese, ...v }, { onConflict: 'user_id,mese' }));
    if (error) {
      btn.disabled = false; btn.textContent = 'Salva obiettivi';
      velo.querySelector('#ob-errore').textContent = 'Non salvato: controlla la connessione e riprova.';
      return;
    }
    chiudi();
    await caricaDashboard(ST.oggi);
    disegnaOggi();
    mostraToast(`Obiettivi di ${D.nomeMese(mese)} salvati`);
  };
}

// Check del Giorno: 13 campi come in Glide. Più check sulla stessa data si sommano (decisione 9).
function apriCheck() {
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `<div class="foglio alto">
    <div class="testa-foglio"><h3>Check del Giorno</h3><button id="ck-x" aria-label="Chiudi">×</button></div>
    <div class="campo"><label>📅 Data Check <small>Obbligatorio</small></label><input id="ck-data" type="date" value="${MB21Coda.oggiRoma()}" max="${MB21Coda.oggiRoma()}"></div>
    ${MB21Dashboard.CAMPI_CHECK.map(([k, etichetta, suggerimento, decimale]) => `<div class="campo">
      <label>${esc(etichetta)} <small>Obbligatorio</small></label>
      <input id="ck-${k}" inputmode="${decimale ? 'decimal' : 'numeric'}" placeholder="${esc(suggerimento)}"></div>`).join('')}
    <div class="campo"><label>Libro</label><select id="ck-libro"><option value="">—</option>${MB21Dashboard.LIBRI.map(l => `<option>${esc(l)}</option>`).join('')}</select></div>
    <div class="campo"><label>Note del libro</label><input id="ck-note" maxlength="150"><div class="conta" id="ck-conta">0/150</div></div>
    <div class="errore" id="ck-errore"></div>
    <div class="due"><button class="link" id="ck-no">Annulla</button><button class="primario" id="ck-si">Invia</button></div>
  </div>`;
  document.body.appendChild(velo);
  const chiudi = () => velo.remove();
  velo.querySelector('#ck-x').onclick = chiudi;
  velo.querySelector('#ck-no').onclick = chiudi;
  const note = velo.querySelector('#ck-note');
  note.oninput = () => { velo.querySelector('#ck-conta').textContent = `${note.value.length}/150`; };
  velo.querySelector('#ck-si').onclick = async () => {
    const v = { data: velo.querySelector('#ck-data').value, libro: velo.querySelector('#ck-libro').value || null, note_libro: note.value.trim() || null };
    for (const [k] of MB21Dashboard.CAMPI_CHECK) v[k] = velo.querySelector('#ck-' + k).value;
    const errore = MB21Dashboard.validaCheck(v);
    if (errore) { velo.querySelector('#ck-errore').textContent = errore; return; }
    for (const [k] of MB21Dashboard.CAMPI_CHECK) v[k] = Number(String(v[k]).trim().replace(',', '.'));
    const btn = velo.querySelector('#ck-si');
    btn.disabled = true; btn.textContent = 'Invio…';
    const { data, error } = await dbq('salva check', supa.from('check_giorno').insert(v).select('id').single());
    if (error) {
      btn.disabled = false; btn.textContent = 'Invia';
      velo.querySelector('#ck-errore').textContent = 'Non salvato: controlla la connessione e riprova.';
      return;
    }
    chiudi();
    await caricaDashboard(ST.oggi);
    disegnaOggi();
    mostraToast('Check salvato', async () => {
      const { error: e2 } = await dbq('annulla check', supa.from('check_giorno').delete().eq('id', data.id));
      if (e2) return mostraToast('Annullamento non riuscito: riprova.');
      await caricaDashboard(ST.oggi);
      disegnaOggi();
      mostraToast('Check annullato');
    });
  };
}

// ── AGENDA (Fase 4) ──────────────────────────────────────
// Giornata a linea del tempo (brief Fase 4): striscia di 7 giorni, appuntamenti del giorno in ordine d'ora,
// telefonate del giorno, appuntamenti passati senza esito, [+] nuovo appuntamento. Logica pura in agenda.js.
// Appuntamenti = righe di `azioni` con tipo ≠ Contatto (per data inizio) + Contatti con data scelta (dalla coda).
const AG = { giorno: null, settimana: [], azioni: [], passati: [], aperta: null, telefonate: null };
const CAMPI_AZIONE = '*, contatti(nome, categoria), utenti(nome, nome_cognome)';

async function apriAgenda(giorno) {
  AG.giorno = giorno || AG.giorno || MB21Coda.oggiRoma();
  if (!document.querySelector('.ag-settimana')) app.innerHTML = `<h1>Agenda</h1><div class="vuoto">Carico l'agenda…</div>`;
  try { await caricaAgenda(); }
  catch (e) {
    app.innerHTML = `<h1>Agenda</h1><div class="avviso">Non riesco a caricare l'agenda. Controlla la connessione e riprova.</div>${versione()}`;
    return;
  }
  disegnaAgenda();
}

async function caricaAgenda() {
  const A = MB21Agenda;
  AG.settimana = A.settimana(AG.giorno);
  const da = A.isoDaRoma(AG.settimana[0], '00:00'), a = A.isoDaRoma(A.spostaGiorno(AG.settimana[6], 1), '00:00');
  const oggi = MB21Coda.oggiRoma(), adesso = new Date().toISOString();
  const richieste = [
    dbq('agenda appuntamenti', supa.from('azioni').select(CAMPI_AZIONE).neq('tipo_azione', 'Contatto').gte('inizio', da).lt('inizio', a)),
    // Contatti: richiami/appuntamenti dati dalla coda (data scelta) e telefonate programmate dall'Agenda (non completate)
    dbq('agenda contatti', supa.from('azioni').select(CAMPI_AZIONE).eq('tipo_azione', 'Contatto')
      .or(`and(data_scelta.gte."${da}",data_scelta.lt."${a}"),and(data_scelta.is.null,completata.eq.false,inizio.gte."${da}",inizio.lt."${a}")`)),
    dbq('agenda senza esito', supa.from('azioni').select(CAMPI_AZIONE).neq('tipo_azione', 'Contatto').eq('completata', false).lt('inizio', adesso).order('inizio', { ascending: false }).limit(50)),
  ];
  if (AG.giorno === oggi) richieste.push(dbq('stato di oggi', supa.rpc('stato_oggi')));
  else if (AG.giorno > oggi) richieste.push(dbq('rientri del giorno', supa.from('contatti_coda').select('id', { count: 'exact', head: true }).eq('rientro_il', AG.giorno)));
  const [app1, ric, pas, tel] = await Promise.all(richieste);
  for (const r of [app1, ric, pas, tel]) if (r && r.error) throw r.error;
  AG.azioni = [...app1.data, ...ric.data];
  AG.passati = pas.data;
  AG.telefonate = !tel ? null : AG.giorno === oggi ? { oggi: true, ...tel.data } : { oggi: false, rientri: tel.count || 0 };
}

function disegnaAgenda() {
  const A = MB21Agenda, oggi = MB21Coda.oggiRoma();
  const conEventi = A.giorniConEventi(AG.azioni);
  const eventi = A.eventiDelGiorno(AG.azioni, AG.giorno);
  const opz = { mioId: ST.utente.id, admin: eAdmin() };
  const titoloGiorno = new Date(AG.giorno + 'T12:00:00Z').toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
  let html = `
    <div class="ag-testa"><h1>Agenda</h1>
      ${AG.giorno !== oggi ? '<button class="ag-oggi" id="ag-oggi">Oggi</button>' : ''}
      <button class="ag-piu" id="ag-nuovo" aria-label="Nuovo appuntamento">+</button></div>
    <button class="ag-mese">${esc(A.titoloMese(AG.giorno))} ▾<input type="date" id="ag-scegli" value="${AG.giorno}"></button>
    <div class="ag-settimana">
      <button class="freccia" id="ag-prima" aria-label="Settimana prima">‹</button>
      ${AG.settimana.map((g, i) => `<button class="ag-giorno ${g === AG.giorno ? 'scelto' : ''} ${g === oggi ? 'oggi' : ''}" data-giorno="${g}">
        <small>${A.GIORNI[i]}</small><b>${Number(g.slice(8))}</b><i class="${conEventi.has(g) ? 'si' : ''}"></i></button>`).join('')}
      <button class="freccia" id="ag-dopo" aria-label="Settimana dopo">›</button>
    </div>
    <div class="sotto">${esc(titoloGiorno)}</div>`;
  html += eventi.length ? eventi.map(e => eventoAgenda(e, opz)).join('')
    : `<div class="vuoto">Nessun appuntamento. Tocca <b>+</b> per fissarne uno.</div>`;
  const t = AG.telefonate;
  if (t && t.oggi) html += `<button class="ag-blocco telefonate" id="ag-telefonate"><span>📞 Telefonate del giorno · Fatte ${t.fatti_oggi} di ${t.contatti_al_giorno}</span><span>›</span></button>`;
  else if (t && t.rientri) html += `<button class="ag-blocco telefonate" id="ag-telefonate"><span>📞 ${t.rientri} ${t.rientri === 1 ? 'contatto rientra' : 'contatti rientrano'} in coda</span><span>›</span></button>`;
  if (AG.passati.length) html += `<button class="ag-blocco passati" id="ag-passati"><span>⚠️ ${AG.passati.length} ${AG.passati.length === 1 ? 'appuntamento passato' : 'appuntamenti passati'} senza esito</span><span>›</span></button>`;
  app.innerHTML = html + versione();
  collegaAgenda(eventi);
}

function eventoAgenda(e, opz) {
  const A = MB21Agenda;
  const r = A.riga(e, opz);
  const aperta = AG.aperta === e.id;
  const [inizio, fine] = A.orario(e).split('–');
  let extra = '';
  if (aperta) {
    const richiamo = e.tipo_azione === 'Contatto' && !!e.data_scelta;   // dato dalla coda: si guarda, non si chiude qui
    const fasi = richiamo ? [] : A.fasiPer(e.categoria, e.tipo_azione, e.modalita);
    extra = `<div class="extra">
      ${e.ospite ? `<div class="note-ev">Ospite: ${esc(e.ospite)}</div>` : ''}
      ${e.note ? `<div class="note-ev">${esc(e.note)}</div>` : ''}
      ${richiamo ? `<div class="note-ev">Dalla coda: ${esc(e.esito || '')}</div>`
        : fasi.length ? `<div class="ag-esiti">${fasi.map(f => `<button data-esito="${esc(f)}" class="${e.esito === f && e.completata ? 'attuale' : ''}">${esc(f)}</button>`).join('')}</div>`
        : `<div class="note-ev">Nessun esito previsto per ${esc(e.categoria || 'questa categoria')} · ${esc(e.tipo_azione)}</div>`}
      <div class="ag-comandi">
        ${richiamo ? `<button data-cmd="fissa">＋ Fissa appuntamento</button>` : `<button data-cmd="sposta">🕑 Sposta</button>`}
        <button data-cmd="contatto">👤 Apri contatto</button>
        ${richiamo ? '' : `<button data-cmd="elimina" class="pericolo">Elimina</button>`}
      </div></div>`;
  }
  return `<div class="ag-evento" data-evento="${esc(e.id)}">
    <div class="ora">${esc(inizio)}${fine ? `<small>${esc(fine)}</small>` : ''}</div>
    <div class="barra-tipo" style="background:${r.colore}"></div>
    <div class="dentro"><button class="apri"><div class="t">${esc(r.titolo)}</div><div class="s">${esc(r.sotto)}</div></button>${extra}</div>
  </div>`;
}

function collegaAgenda(eventi) {
  const A = MB21Agenda;
  const su = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  su('ag-oggi', () => apriAgenda(MB21Coda.oggiRoma()));
  su('ag-prima', () => apriAgenda(A.spostaGiorno(AG.giorno, -7)));
  su('ag-dopo', () => apriAgenda(A.spostaGiorno(AG.giorno, 7)));
  su('ag-nuovo', () => nuovoAppuntamento({ giorno: AG.giorno }));
  su('ag-telefonate', () => { ST.tab = 'oggi'; mostraTab(); });
  su('ag-passati', scegliPassato);
  const scegli = document.getElementById('ag-scegli');
  if (scegli) scegli.onchange = () => { if (scegli.value) apriAgenda(scegli.value); };
  app.querySelectorAll('.ag-giorno').forEach(b => {
    b.onclick = () => { AG.aperta = null; apriAgenda(b.dataset.giorno); };
  });
  app.querySelectorAll('.ag-evento').forEach(el => {
    const e = eventi.find(x => x.id === el.dataset.evento);
    el.querySelector('.apri').onclick = () => { AG.aperta = AG.aperta === e.id ? null : e.id; disegnaAgenda(); };
    el.querySelectorAll('[data-esito]').forEach(b => { b.onclick = () => chiudiAppuntamento(e, b.dataset.esito); });
    el.querySelectorAll('[data-cmd]').forEach(b => {
      b.onclick = () => {
        if (b.dataset.cmd === 'sposta') return spostaAppuntamento(e);
        if (b.dataset.cmd === 'elimina') return eliminaAppuntamento(e);
        if (b.dataset.cmd === 'contatto') return apriContattoDa(e.contatto_id);
        if (b.dataset.cmd === 'fissa') return nuovoAppuntamento({ giorno: A.partiRoma(e.quando).giorno, ora: A.partiRoma(e.quando).ora, contatto: { id: e.contatto_id, ...e.contatti } });
      };
    });
  });
}

async function apriContattoDa(id) {
  ST.tab = 'lista';
  document.querySelectorAll('#tab button').forEach(b => b.classList.toggle('attiva', b.dataset.tab === 'lista'));
  if (!LS.righe.length) {
    app.innerHTML = `<h1>Lista Nomi</h1><div class="vuoto">Carico il contatto…</div>`;
    try { LS.righe = await leggiLista(); } catch (e) { return mostraToast('Contatto non caricato: riprova.'); }
  }
  apriScheda(id);
}

// Esito di un appuntamento (decisione C: poi si chiede sempre il prossimo, con «Salta»)
async function chiudiAppuntamento(e, esito) {
  const { data: prima, error } = await dbq('chiudi appuntamento', supa.rpc('chiudi_appuntamento', { p_azione: e.id, p_esito: esito }));
  if (error) return mostraToast('Non salvato: controlla la connessione e riprova.');
  const annulla = async creato => {
    const { error: e2 } = await dbq('riapri appuntamento', supa.rpc('riapri_appuntamento', {
      p_azione: e.id, p_esito: prima.esito_prec, p_completata: prima.completata_prec, p_contatto: prima.contatto_id,
      p_rientro: prima.rientro_prec, p_in_coda: prima.in_coda_prec, p_rientro_cambiato: prima.rientro_cambiato }));
    if (!e2 && creato) await dbq('annulla prossimo', supa.from('azioni').delete().eq('id', creato));
    if (e2) return mostraToast('Annullamento non riuscito: riprova.');
    await apriAgenda();
    mostraToast('Annullato');
  };
  AG.aperta = null;
  const creato = await nuovoAppuntamento({
    titolo: `${esito} · ${e.contatti ? e.contatti.nome : ''}`, sottotitolo: 'Fissa il prossimo appuntamento', salta: true,
    giorno: MB21Agenda.spostaGiorno(MB21Coda.oggiRoma(), 1),
    contatto: { id: e.contatto_id, ...e.contatti }, tipo: e.tipo_azione, modalita: e.modalita, area: e.area, userId: e.user_id,
  });
  await apriAgenda();
  mostraToast(creato ? `${esito} · prossimo appuntamento fissato` : `${esito} salvato`, () => annulla(creato));
}

function spostaAppuntamento(e) {
  const A = MB21Agenda;
  const { giorno, ora } = A.partiRoma(e.inizio);
  const durata = e.fine ? (Date.parse(e.fine) - Date.parse(e.inizio)) : 0;
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `<div class="foglio"><h3>🕑 Sposta</h3><p>${esc(A.riga(e, { mioId: ST.utente.id, admin: false }).titolo)}</p>
    <div class="ag-due-campi"><input id="sp-giorno" type="date" value="${giorno}"><input id="sp-ora" type="time" value="${ora}"></div>
    <div class="due"><button class="link" id="sp-no">Annulla</button><button class="primario" id="sp-si">Sposta</button></div></div>`;
  document.body.appendChild(velo);
  velo.onclick = ev => { if (ev.target === velo) velo.remove(); };
  velo.querySelector('#sp-no').onclick = () => velo.remove();
  velo.querySelector('#sp-si').onclick = async () => {
    const g = velo.querySelector('#sp-giorno').value, o = velo.querySelector('#sp-ora').value;
    if (!g || !o) return;
    const inizio = A.isoDaRoma(g, o);
    const nuovo = { inizio, fine: durata ? new Date(Date.parse(inizio) + durata).toISOString() : null };
    velo.remove();
    const { error } = await dbq('sposta appuntamento', supa.from('azioni').update(nuovo).eq('id', e.id));
    if (error) return mostraToast('Non spostato: controlla la connessione e riprova.');
    AG.aperta = e.id;
    await apriAgenda(g);
    mostraToast(`Spostato a ${g.split('-').reverse().join('/')} ${o}`, async () => {
      await dbq('annulla sposta', supa.from('azioni').update({ inizio: e.inizio, fine: e.fine }).eq('id', e.id));
      await apriAgenda(giorno);
    });
  };
}

async function eliminaAppuntamento(e) {
  if (!confirm('Eliminare questo appuntamento?')) return;
  const { error } = await dbq('elimina appuntamento', supa.from('azioni').delete().eq('id', e.id));
  if (error) return mostraToast('Non eliminato: controlla la connessione e riprova.');
  AG.aperta = null;
  await apriAgenda();
  const copia = { ...e };
  for (const k of ['quando', 'contatti', 'utenti', 'chiave']) delete copia[k];
  mostraToast('Appuntamento eliminato', async () => {
    await dbq('ripristina appuntamento', supa.from('azioni').insert(copia));
    await apriAgenda();
  });
}

function scegliPassato() {
  const A = MB21Agenda, opz = { mioId: ST.utente.id, admin: eAdmin() };
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `<div class="foglio alto"><div class="testa-foglio"><h3>⚠️ Senza esito</h3><button id="ps-x">×</button></div>
    <p>Tocca un appuntamento per dargli l'esito.</p>
    <div class="altri-voci">${AG.passati.map(e => { const r = A.riga(e, opz), p = A.partiRoma(e.inizio);
      return `<button data-id="${esc(e.id)}"><b>${esc(p.giorno.split('-').reverse().join('/'))} ${esc(p.ora)}</b> · ${esc(r.titolo)}</button>`; }).join('')}</div></div>`;
  document.body.appendChild(velo);
  velo.querySelector('#ps-x').onclick = () => velo.remove();
  velo.querySelectorAll('[data-id]').forEach(b => {
    b.onclick = () => {
      const e = AG.passati.find(x => x.id === b.dataset.id);
      velo.remove();
      AG.aperta = e.id;
      apriAgenda(A.partiRoma(e.inizio).giorno);
    };
  });
}

let contattiMiei = null;   // per l'elenco del nuovo appuntamento: solo i nomi del partner loggato
async function leggiContattiMiei() {
  if (contattiMiei) return contattiMiei;
  const righe = [];
  for (let da = 0; ; da += 1000) {
    const { data, error } = await dbq('contatti per appuntamento', supa.from('contatti').select('id, nome, categoria')
      .eq('user_id', ST.utente.id).neq('categoria', 'Archiviato').order('nome').range(da, da + 999));
    if (error) throw error;
    righe.push(...data);
    if (data.length < 1000) break;
  }
  return (contattiMiei = righe);
}

// Foglio «Nuovo appuntamento» (lavoro 4). Restituisce l'id creato o null.
// opz: { giorno, ora, contatto:{id,nome,categoria}, tipo, modalita, area, titolo, sottotitolo, salta, userId }
async function nuovoAppuntamento(opz = {}) {
  const A = MB21Agenda;
  let elenco = [];
  if (!opz.contatto) {
    try { elenco = await leggiContattiMiei(); } catch (e) { mostraToast('Contatti non caricati: riprova.'); return null; }
  }
  const st = {
    contatto: opz.contatto || null, categoria: opz.contatto ? opz.contatto.categoria : null,
    area: opz.area && ['Attività', 'Prodotti'].includes(opz.area) ? opz.area : 'Attività',
    tipo: opz.tipo || null, modalita: opz.tipo ? opz.modalita : null, durata: 60,
  };
  if (st.tipo && !A.tipiPer(st.categoria).includes(st.tipo)) { st.tipo = null; st.modalita = null; }
  const eventiGiorno = A.eventiDelGiorno(AG.azioni, opz.giorno || MB21Coda.oggiRoma());
  const oraIniziale = opz.ora || A.oraProposta(eventiGiorno, opz.giorno || MB21Coda.oggiRoma(), new Date().toISOString());
  return new Promise(risolvi => {
    const velo = document.createElement('div');
    velo.className = 'velo';
    velo.innerHTML = `<div class="foglio alto">
      <div class="testa-foglio"><h3>${esc(opz.titolo || 'Nuovo appuntamento')}</h3><button id="na-x" aria-label="Chiudi">×</button></div>
      ${opz.sottotitolo ? `<p>${esc(opz.sottotitolo)}</p>` : ''}
      <div id="na-corpo"></div>
      <div class="errore" id="na-errore"></div>
      <div class="due"><button class="link" id="na-no">${opz.salta ? 'Salta' : 'Annulla'}</button><button class="primario" id="na-si">Salva</button></div></div>`;
    document.body.appendChild(velo);
    const chiudi = valore => { velo.remove(); risolvi(valore); };
    velo.querySelector('#na-x').onclick = () => chiudi(null);
    velo.querySelector('#na-no').onclick = () => chiudi(null);
    const campi = { giorno: opz.giorno || MB21Coda.oggiRoma(), ora: oraIniziale, ospite: '', note: '' };
    const scelte = (nome, voci, attuale, etichette) => `<div class="ag-scelte" data-scelta="${nome}">${voci.map((v, i) =>
      `<button data-v="${esc(v)}" class="${String(v) === String(attuale) ? 'scelto' : ''}">${esc(etichette ? etichette[i] : v)}</button>`).join('')}</div>`;
    const leggiCampi = () => { for (const k of ['giorno', 'ora', 'ospite', 'note']) { const el = velo.querySelector('#na-' + k); if (el) campi[k] = el.value; } };
    function disegna() {
      const tipi = A.tipiPer(st.categoria);
      let h = '';
      h += st.contatto && opz.contatto
        ? `<div class="campo"><label>Contatto</label><div class="banner">${esc(st.contatto.nome)}</div></div>`
        : `<div class="campo"><label>Contatto <small>Obbligatorio</small></label>
            <input id="na-contatto" list="na-nomi" placeholder="Scrivi il nome" value="${esc(st.contatto ? st.contatto.nome : '')}" autocomplete="off">
            <datalist id="na-nomi">${elenco.map(c => `<option value="${esc(c.nome)}">`).join('')}</datalist></div>`;
      if (st.contatto) {
        h += `<div class="campo"><label>Categoria <small>dal contatto</small></label>${scelte('categoria', A.CATEGORIE, st.categoria)}
          ${!tipi.length ? `<div class="errore">${esc(st.categoria || 'Senza categoria')}: nessun appuntamento. Scegli Prospect, Partner o Cliente.</div>` : ''}</div>`;
      }
      if (tipi.length) {
        h += `<div class="campo"><label>Area</label>${scelte('area', ['Attività', 'Prodotti'], st.area)}</div>`;
        h += `<div class="campo"><label>Tipo di azione <small>Obbligatorio</small></label>${scelte('tipo', tipi, st.tipo)}</div>`;
      }
      if (st.tipo) {
        h += `<div class="campo"><label>Sottotipo <small>Obbligatorio</small></label>${scelte('modalita', A.sottotipiPer(st.tipo), st.modalita)}</div>`;
        h += `<div class="campo"><label>Giorno e ora <small>Obbligatorio</small></label><div class="ag-due-campi">
          <input id="na-giorno" type="date" value="${esc(campi.giorno)}"><input id="na-ora" type="time" value="${esc(campi.ora)}"></div></div>`;
        h += `<div class="campo"><label>Durata</label>${scelte('durata', A.DURATE.map(d => d[0]), st.durata, A.DURATE.map(d => d[1]))}</div>`;
        if (A.conOspite(st.tipo)) h += `<div class="campo"><label>Ospite</label><input id="na-ospite" maxlength="50" value="${esc(campi.ospite)}"></div>`;
        h += `<div class="campo"><label>Note</label><input id="na-note" maxlength="100" placeholder="Scrivi qualcosa da ricordare" value="${esc(campi.note)}"></div>`;
      }
      velo.querySelector('#na-corpo').innerHTML = h;
      const inp = velo.querySelector('#na-contatto');
      if (inp) inp.onchange = () => {
        const trovato = elenco.find(c => c.nome.toLowerCase() === inp.value.trim().toLowerCase());
        st.contatto = trovato || null; st.categoria = trovato ? trovato.categoria : null;
        if (!A.tipiPer(st.categoria).includes(st.tipo)) { st.tipo = null; st.modalita = null; }
        leggiCampi(); disegna();
      };
      velo.querySelectorAll('[data-scelta]').forEach(g => g.querySelectorAll('button').forEach(b => {
        b.onclick = () => {
          leggiCampi();
          const nome = g.dataset.scelta, v = b.dataset.v;
          if (nome === 'durata') st.durata = Number(v);
          else st[nome] = v;
          if (nome === 'categoria' && !A.tipiPer(v).includes(st.tipo)) { st.tipo = null; st.modalita = null; }
          if (nome === 'tipo') st.modalita = null;
          disegna();
        };
      }));
    }
    disegna();
    velo.querySelector('#na-si').onclick = async () => {
      leggiCampi();
      const v = { contatto_id: st.contatto && st.contatto.id, categoria: st.categoria, area: st.area, tipo_azione: st.tipo, modalita: st.modalita,
        giorno: campi.giorno, ora: campi.ora, ospite: A.conOspite(st.tipo) ? campi.ospite.trim() : '', note: campi.note.trim() };
      const errore = A.validaAppuntamento(v);
      if (errore) { velo.querySelector('#na-errore').textContent = errore; return; }
      const inizio = A.isoDaRoma(v.giorno, v.ora);
      const riga = { contatto_id: v.contatto_id, user_id: opz.userId || ST.utente.id, categoria: v.categoria, tipo_azione: v.tipo_azione,
        modalita: v.modalita, area: v.area, inizio, fine: new Date(Date.parse(inizio) + st.durata * 60000).toISOString(),
        completata: false, ospite: v.ospite || null, note: v.note || null };
      const btn = velo.querySelector('#na-si');
      btn.disabled = true; btn.textContent = 'Salvo…';
      if (st.contatto.categoria !== v.categoria) {   // come in Glide la categoria scelta vale per il contatto
        const { error: ec } = await dbq('categoria contatto', supa.from('contatti').update({ categoria: v.categoria }).eq('id', v.contatto_id));
        if (ec) { btn.disabled = false; btn.textContent = 'Salva'; velo.querySelector('#na-errore').textContent = 'Non salvato: riprova.'; return; }
        contattiMiei = null; LS.righe = [];
      }
      const { data, error } = await dbq('nuovo appuntamento', supa.from('azioni').insert(riga).select('id').single());
      if (error) { btn.disabled = false; btn.textContent = 'Salva'; velo.querySelector('#na-errore').textContent = 'Non salvato: controlla la connessione e riprova.'; return; }
      chiudi(data.id);
      if (!opz.salta) {
        AG.aperta = data.id;
        await apriAgenda(v.giorno);
        mostraToast('Appuntamento fissato', async () => {
          await dbq('annulla nuovo', supa.from('azioni').delete().eq('id', data.id));
          await apriAgenda();
        });
      }
    };
  });
}

// ── LISTA NOMI (Fase 2) ──────────────────────────────────
// Copia della tab Lista Nomi di Glide (docs/MB21_v3_Lista_come_e.md) con le decisioni di Ignazio del 14/09.
// La logica pura sta in lista.js; qui lettura/scrittura e disegno.
const BLOCCO = 40;                                    // card disegnate per volta, scorrendo se ne aggiungono
const LS = { righe: [], filtro: 'lista', testo: '', mostrate: BLOCCO, contatto: null, sezione: 'dati' };
const eAdmin = () => ST.utente && ST.utente.ruolo === 'Admin';

async function leggiLista() {
  const righe = [];
  for (let da = 0; ; da += 1000) {
    const { data, error } = await dbq('lettura lista',
      supa.from('contatti_lista').select('*').order('id').range(da, da + 999));
    if (error) throw error;
    righe.push(...data);
    if (data.length < 1000) return righe;
  }
}

async function apriLista() {
  LS.contatto = null;
  app.innerHTML = `<h1>Lista Nomi</h1><div class="vuoto">Carico i nomi…</div>`;
  try { LS.righe = await leggiLista(); }
  catch (e) {
    app.innerHTML = `<h1>Lista Nomi</h1><div class="avviso">Non riesco a caricare i nomi. Controlla la connessione e riprova.</div>${versione()}`;
    return;
  }
  disegnaLista();
}

function coloreCategoria(c) { return COLORI[c] || 'var(--unlinked)'; }

function linkTelefono(tel, classe) {
  if (!tel) return `<span class="${classe || 'tel'}"></span>`;
  return `<a class="${classe || 'tel'}" href="tel:${esc(tel.replace(/[^0-9+]/g, ''))}">${esc(tel)}</a>`;
}

function disegnaLista() {
  const admin = eAdmin();
  const f = MB21Lista.FILTRI[LS.filtro];
  const totale = MB21Lista.totaleContatti(LS.righe, { filtro: LS.filtro, utenteId: ST.utente.id, admin });
  const chip = (k) => `<button data-filtro="${k}" class="${LS.filtro === k ? 'scelto' : ''}">${MB21Lista.FILTRI[k].etichetta}</button>`;
  const altriScelto = f.altri ? `Altri: ${f.etichetta} ▾` : 'Altri ▾';
  app.innerHTML = `
    <h1>Lista Nomi</h1>
    <div class="banner">Hai un totale di <b>${totale.toLocaleString('it-IT')}</b> contatti registrati</div>
    <button class="nuovo" id="nuovo">+ Nuovo Contatto</button>
    <div class="chips">
      ${admin ? chip('all') : ''}${chip('lista')}${chip('prospect')}${chip('partner')}${chip('clienti')}
      <button id="altri" class="${f.altri ? 'scelto' : ''}">${altriScelto}</button>
    </div>
    <div class="cerca">
      <input id="cerca" type="search" placeholder="Cerca" value="${esc(LS.testo)}" autocomplete="off">
      <button id="svuota" ${LS.testo ? '' : 'hidden'} aria-label="Svuota">×</button>
    </div>
    <div id="elenco"></div>
    <div id="fondo"></div>
    ${versione()}`;
  document.getElementById('nuovo').onclick = () => apriModulo(null);
  app.querySelectorAll('.chips button[data-filtro]').forEach(b => b.onclick = () => { LS.filtro = b.dataset.filtro; LS.mostrate = BLOCCO; disegnaLista(); });
  document.getElementById('altri').onclick = scegliAltri;
  const cerca = document.getElementById('cerca');
  cerca.oninput = () => {
    LS.testo = cerca.value; LS.mostrate = BLOCCO;
    document.getElementById('svuota').hidden = !LS.testo;
    disegnaElenco();
  };
  document.getElementById('svuota').onclick = () => { LS.testo = ''; disegnaLista(); };
  disegnaElenco();
}

function disegnaElenco() {
  const trovati = MB21Lista.filtraContatti(LS.righe, { filtro: LS.filtro, testo: LS.testo, utenteId: ST.utente.id, admin: eAdmin() });
  const elenco = document.getElementById('elenco');
  if (!elenco) return;
  elenco.innerHTML = trovati.length
    ? trovati.slice(0, LS.mostrate).map(cardNome).join('')
    : `<div class="vuoto">${LS.testo ? 'Nessun nome trovato.' : 'Nessun nome qui.'}</div>`;
  elenco.querySelectorAll('.cn').forEach(c => {
    c.onclick = e => { if (!e.target.closest('a, .menu')) apriScheda(c.dataset.id); };
  });
  elenco.querySelectorAll('.cn .menu').forEach(b => b.onclick = () => menuCard(b.dataset.id));
  // caricamento a blocchi: quando il fondo entra nello schermo, altre card
  const fondo = document.getElementById('fondo');
  if (LS.osservatore) LS.osservatore.disconnect();
  if (trovati.length > LS.mostrate) {
    LS.osservatore = new IntersectionObserver(voci => {
