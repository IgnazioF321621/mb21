<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFF1F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MB21">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<title>MB21</title>
<style>
  /* Lo stile dell'app (cantiere 34): la fonte unica è docs/MB21_Design.md. Qui i valori, nel resto del foglio solo var(--…). */
  :root {
    /* superfici e testo */
    --sfondo: #EFF1F5; --superficie: #FFFFFF; --superficie-2: #F7F8FA; --bordo: #E3E7EE;
    --testo: #10151F; --testo-soft: #5A6475; --testo-tenue: #7B8496; --accento: #10151F; --accento-su: #FFFFFF;
    /* categorie dei contatti: colore pieno e tinta */
    --cat-prospect: #DD5F0D; --cat-prospect-tinta: #FDEEE2; --cat-cliente: #0E7490; --cat-cliente-tinta: #DFF1F6;
    --cat-partner: #1D4ED8; --cat-partner-tinta: #E7EFFE; --cat-ex: #5A6475; --cat-ex-tinta: #EAECF1;
    --cat-unlinked: #7B8496; --cat-unlinked-tinta: #F2F4F7; --cat-archiviato: #374151; --cat-archiviato-tinta: #E4E7EC;
    /* segni vitali e stati */
    --bbs: #1D4ED8; --bbs-tinta: #E7EFFE; --wes: #C02626; --cep: #15803D; --spento: #C3C8D1;
    --ok: #15803D; --ok-tinta: #E4F3E8; --pericolo: #C02626; --pericolo-tinta: #FCEAEA; --proposta: #B45309; --proposta-tinta: #FEF3C8;
    /* i quattro gruppi dei numeri (Dashboard, Check, Obiettivi): colori loro, non delle categorie */
    --gr-volume: #1D4ED8; --gr-volume-tinta: #E7EFFE; --gr-azione: #DD5F0D; --gr-azione-tinta: #FDEEE2;
    --gr-segni: #15803D; --gr-segni-tinta: #E4F3E8; --gr-crescita: #6D28D9; --gr-crescita-tinta: #F0E9FD;
    /* i tipi di azione: si vedono nella strisciolina delle Conferme e dei Riordini e nei calendari */
    --az-pm: #1D4ED8; --az-followup: #15803D; --az-appuntamento: #6D28D9; --az-consulenza: #C2410C; --az-contatto: #5A6475;
    /* i brand dei prodotti Amway: colori loro, decisi da Amway */
    --revolut: #185FA5;   /* il blu del marchio Revolut, per il bottone del rinnovo */
    --brand-artistry: #BE185D; --brand-espring: #1D4ED8; --brand-home: #C2410C; --brand-nutrilite: #15803D; --brand-persona: #6D28D9; --brand-altro: #5A6475;
    /* gli stessi colori in numeri, per le caselle della tabella dei Segni Vitali che si accendono piano piano */
    --tenue-rgb: 123, 132, 150; --gr-azione-rgb: 221, 95, 13; --bbs-rgb: 29, 78, 216; --wes-rgb: 192, 38, 38; --cep-rgb: 21, 128, 61;
    /* i 4 modi di contattare tengono il colore a cui la gente è abituata (Ignazio 19/09) */
    --ct-chiama: #1FA750; --ct-sms: #2F7FD6; --ct-whatsapp: #1FA855; --ct-telegram: #1F94D2;
    /* scritte */
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --dim-pagina: 26px; --dim-sezione: 16px; --dim-corpo: 15px; --dim-piccolo: 12.5px; --dim-etichetta: 11px; --dim-numero: 34px;
    --peso-medio: 600; --peso-forte: 700; --interlinea: 1.35;
    /* spazi, angoli, ombre, misure */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --raggio-bottone: 14px; --raggio-riga: 18px; --raggio-card: 22px; --raggio-foglio: 28px; --raggio-pill: 999px;
    --ombra-card: 0 2px 12px rgba(16,21,31,.05); --ombra-foglio: 0 -8px 30px rgba(16,21,31,.14);
    --bottone-h: 50px; --pill-h: 40px; --tocco: 44px; --pagina-x: 16px;
    /* nomi di prima: restano validi e puntano ai nuovi (si tolgono pagina per pagina) */
    --card: var(--superficie); --grigio: var(--testo-soft); --grigio-chiaro: var(--testo-tenue); --linea: var(--bordo);
    --blu: var(--gr-volume); --coach: var(--cat-partner); --verde: var(--ok); --rosso: var(--pericolo);
    --prospect: var(--cat-prospect); --cliente: var(--cat-cliente); --partner: var(--cat-partner); --ex: var(--cat-ex); --unlinked: var(--spento);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sfondo); color: var(--testo);
    font-family: var(--font); font-size: var(--dim-corpo); line-height: var(--interlinea);
    -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: inherit; }
  main { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 16px) 16px 110px; }
  h1 { font-size: var(--dim-pagina); font-weight: var(--peso-forte); line-height: 1.15; margin: 8px 0 2px; letter-spacing: -0.5px; }
  .sotto { color: var(--grigio); font-size: 14px; margin-bottom: 18px; }
  h2 { font-size: var(--dim-sezione); font-weight: var(--peso-forte); line-height: 1.15; color: var(--testo); margin: 26px 4px 10px; }   /* 26 px fra le sezioni: il respiro */

  .card { background: var(--card); border-radius: var(--raggio-card); overflow: hidden; margin-bottom: 12px;
    box-shadow: var(--ombra-card); }
  .strip { height: 3px; margin: 0 var(--raggio-riga); border-radius: 0 0 3px 3px; background: var(--unlinked); }
  .corpo { padding: 14px 16px 16px; }
  .nome { font-size: 17px; font-weight: 700; }
  .prof { font-size: 13px; color: var(--grigio); margin-top: 2px; }
  .luogo { font-size: 12px; color: var(--grigio-chiaro); margin-top: 2px; }
  .riga { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .tel { color: var(--blu); font-size: 16px; font-weight: 600; text-decoration: none; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--sfondo); color: var(--testo-soft); }
  .badge.scaduto { background: var(--pericolo-tinta); color: var(--rosso); }
  .badge.new { background: var(--ok-tinta); color: var(--ok); }
  .coach { margin-top: 12px; padding: 10px 12px; border-radius: var(--raggio-bottone); background: var(--cat-partner-tinta); color: var(--cat-partner);
    font-size: 15px; font-weight: 600; line-height: 1.3; }
  .coach small { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--coach); margin-bottom: 2px; }

  .vuoto, .avviso { text-align: center; color: var(--grigio); padding: 28px 16px; font-size: 15px; }
  .avviso { background: var(--proposta-tinta); color: var(--proposta); border-radius: var(--raggio-bottone); padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }

  .accesso { max-width: 360px; margin: 12vh auto 0; }
  .accesso p { color: var(--grigio); font-size: 15px; }
  input { width: 100%; font-size: 17px; padding: 14px; border-radius: var(--raggio-bottone); border: 1px solid var(--linea); background: var(--superficie); margin: 6px 0 12px; }
  button.primario { width: 100%; min-height: var(--bottone-h); font-size: 16px; font-weight: var(--peso-medio); padding: 13px 14px; border: 0; border-radius: var(--raggio-bottone); background: var(--accento); color: var(--accento-su); }
  button.primario:disabled { opacity: .5; }
  button.link { background: none; border: 0; color: var(--blu); font-size: 15px; padding: 10px 0; min-height: var(--tocco); }
  .errore { color: var(--rosso); font-size: 14px; min-height: 20px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--superficie); border-radius: 26px 26px 0 0;
    box-shadow: 0 -3px 16px rgba(16,21,31,.06); display: flex; justify-content: space-around;
    padding: 8px 0 calc(env(safe-area-inset-bottom) + 8px); }
  /* Le icone (icone.js): a tratto, un colore solo, grandi quanto la scritta se non si dice altro */
  svg.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.14em; flex: none; }
  nav button { background: none; border: 0; font-size: 10.5px; font-weight: 500; color: var(--testo-soft); padding: 4px 2px; min-height: var(--tocco); min-width: 44px; white-space: nowrap; }   /* 24/09: con «Training» le voci arrivano a 7; 25/09: per l'Admin 8 con «Progetti» (44 px, su una riga) */
  nav button svg.ic { display: block; width: 23px; height: 23px; margin: 0 auto 3px; }
  nav:has(button[data-tab="progetti"]:not([hidden])) button { font-size: 9.5px; padding: 4px 0; min-width: 40px; }   /* l'Admin con 8 voci (25/09): su un iPhone da 375 punti le scritte si toccavano */
  nav[hidden] { display: none; }   /* cantiere 32: «display: flex» qui sopra vinceva su hidden, e la barra restava a video anche quando il codice la nascondeva (benvenuto, accesso) */
  nav button[hidden] { display: none; }
  nav button.attiva { color: var(--accento); font-weight: var(--peso-forte); }
  /* Progetti e Admin, solo per l'Admin (Ignazio 25/09): in fondo alla barra, su fondo scuro, «così subito risaltano e so che sono solo per l'admin» */
  #tab button[data-tab="progetti"], #tab button[data-tab="admin"] { background: var(--testo); color: rgba(255,255,255,.7); border-radius: 12px; padding: 4px 5px; }
  #tab button.attiva[data-tab="progetti"], #tab button.attiva[data-tab="admin"] { color: #fff; }
  /* Gli esiti (Ignazio 19/09): l'esito buono per intero in alto, i neutri in fila (fino a tre), «No Interesse» per intero in fondo (parole ufficiali dal cantiere 39).
     Due esiti buoni (Cliente: Ordine · Appuntamento) si dividono la prima riga. */
  .bottoni { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .bottoni button { flex: 1 1 28%; min-width: 0; min-height: var(--tocco); font-size: 15px; font-weight: 600; padding: 12px 6px; border-radius: var(--raggio-bottone); border: 0; background: var(--sfondo); color: var(--testo); }
  .bottoni button:active { transform: scale(.97); }
  .bottoni .appuntamento, .bottoni .ordine { flex: 1 1 100%; background: var(--ok-tinta); color: var(--ok); }
  .bottoni .ordine:has(+ .appuntamento), .bottoni .ordine + .appuntamento { flex: 1 1 40%; }   /* solo se gli esiti buoni sono due si dividono la riga */
  /* scegliere la categoria in «Da catalogare» (scelta «A» di Ignazio): tre tasselli con il tondo colorato e l'icona, il resto sotto in piccolo */
  .bottoni.scegli-cat button.grande { flex: 1 1 28%; display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 12px 4px 10px; border-radius: var(--raggio-riga); font-size: 14px; }
  .bottoni.scegli-cat button.grande span { width: 44px; height: 44px; border-radius: 50%; background: var(--cat); color: #fff; display: grid; place-items: center; font-size: 21px; }
  .bottoni.scegli-cat button.piccola { flex: 1 1 auto; background: none; color: var(--testo-soft); font-size: 13px; padding: 6px 2px; white-space: nowrap; }
  .bottoni.scegli-cat button.piccola.no { flex: 1 1 auto; background: none; color: var(--pericolo); }
  .bottoni .no { flex: 1 1 100%; background: var(--pericolo-tinta); color: var(--pericolo); }
  /* Cantiere 39 (Ignazio 21/09: «ci stiamo evolvendo»): in coda gli stessi esiti di «Com'è andata?», sopra i buoni a due a due,
     sotto i non andati in fila. Supera la disposizione del 19/09 (buono intero in alto, negativo intero in fondo), che resta ai Riordini. */
  .bottoni.due-righe { display: block; }
  .bottoni.due-righe > div { display: flex; flex-wrap: wrap; gap: 8px; }
  .bottoni.due-righe > div + div { margin-top: 14px; }
  .bottoni.due-righe .buoni button { flex: 1 1 40%; }
  .bottoni.due-righe .nonandati button { flex: 1 1 28%; font-size: 14px; }
  .bottoni button:disabled { opacity: .45; }
  /* Il colore che parla (cantiere 34). Scelta di Ignazio 19/09 («B»): negli elenchi la riga resta BIANCA e la categoria la dice il tondo con le
     iniziali (la riga tutta tinta, sul fondo perla, dava fastidio); la tinta --cat-tinta si usa dove c'è una persona sola: la testata della scheda. */
  /* --cat-scuro: la stessa tinta scritta scura, per il testo dentro i blocchi tinti dell'Agenda a orario (cantiere 37) */
  .cat-prospect { --cat: var(--cat-prospect); --cat-tinta: var(--cat-prospect-tinta); --cat-scuro: #8E3B06; } .cat-cliente { --cat: var(--cat-cliente); --cat-tinta: var(--cat-cliente-tinta); --cat-scuro: #0A5468; }
  .cat-partner { --cat: var(--cat-partner); --cat-tinta: var(--cat-partner-tinta); --cat-scuro: #16379B; } .cat-ex { --cat: var(--cat-ex); --cat-tinta: var(--cat-ex-tinta); --cat-scuro: #3A4150; }
  .cat-unlinked { --cat: var(--cat-unlinked); --cat-tinta: var(--cat-unlinked-tinta); --cat-scuro: #434C5C; } .cat-archiviato { --cat: var(--cat-archiviato); --cat-tinta: var(--cat-archiviato-tinta); --cat-scuro: #26303F; }
  .cat-nessuna { --cat: var(--testo-tenue); --cat-tinta: var(--superficie); --cat-scuro: #363E4C; }
  .card[class*="cat-"].aperta .corpo { border-top: 1px solid var(--bordo); }
  .rc-pastiglia { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border-radius: 50%; background: var(--cat, var(--testo-tenue)); color: #fff;
    display: grid; place-items: center; font-size: 13.5px; font-weight: 600; letter-spacing: .2px; }
  .pallino { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; flex: none; }
  .ic-vuoto { display: inline-block; width: 1em; height: 1em; border: 1.8px solid var(--spento); border-radius: 50%; vertical-align: -0.14em; }
  .card.compatta { margin-bottom: 8px; border-radius: var(--raggio-riga); }
  .riga-coda { display: block; width: 100%; min-height: 64px; text-align: left; border: 0; background: none; padding: 11px 36px 11px 66px; position: relative; font-family: inherit; color: var(--testo); }
  .riga-coda .rc-alto { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .riga-coda .nome { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .riga-coda .badge { flex: none; }
  .riga-coda .rc-glide { display: block; margin-top: 2px; font-size: 13px; font-weight: 500; color: var(--testo-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .riga-coda .rc-coach { display: block; margin-top: 3px; font-size: 13px; font-weight: 600; color: var(--cat-partner); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .riga-coda .rc-freccia { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 20px; color: var(--grigio-chiaro); }
  .card.aperta .rc-coach { white-space: normal; }
  .card.aperta .corpo { padding-top: 0; }
  .card.via { opacity: 0; transform: translateX(40px); transition: all .25s ease; }

  .testa-coda { display: flex; align-items: center; justify-content: space-between; margin: 22px 4px 8px; }
  .testa-coda h2 { margin: 0; }
  .contatore { background: var(--superficie); border: 1px solid var(--linea); border-radius: 999px; padding: 6px 12px;
    font-size: 13px; font-weight: 700; color: var(--testo); }
  .numeri { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 8px; }
  .numeri button { font-size: 20px; font-weight: 700; padding: 14px 0; border-radius: var(--raggio-bottone); border: 0; background: var(--sfondo); color: var(--testo); }
  .numeri button.scelto { background: var(--testo); color: #fff; }

  .velo { position: fixed; inset: 0; background: rgba(16,21,31,.4); display: flex; align-items: flex-end; z-index: 20; }
  .foglio { background: var(--superficie); width: 100%; max-width: 520px; margin: 0 auto; border-radius: var(--raggio-foglio) var(--raggio-foglio) 0 0;
    padding: 26px 16px calc(env(safe-area-inset-bottom) + 20px); box-shadow: var(--ombra-foglio); position: relative; }
  .foglio::before { content: ''; position: absolute; top: 9px; left: 50%; width: 44px; height: 5px; margin-left: -22px; border-radius: 99px; background: var(--spento); }   /* la maniglia */
  .foglio h3 { margin: 0 0 4px; font-size: 20px; }
  .foglio p { margin: 0 0 12px; color: var(--grigio); font-size: 14px; }
  .cf-spunta { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 14px; font-size: 15px; }
  .cf-spunta input { width: 22px; height: 22px; flex: none; margin: 0; }
  button.link.elimina-qui { display: block; width: 100%; margin-top: 18px; color: var(--rosso); font-weight: 600; }   /* rosso: si deve sempre notare (Ignazio 19/09) */
  .foglio .due { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 78px); max-width: 488px; margin: 0 auto;
    background: var(--accento); color: var(--accento-su); border-radius: var(--raggio-riga); padding: 8px 16px; min-height: 52px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; font-size: 15px; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .toast button { background: none; border: 0; color: var(--accento-su); text-decoration: underline; text-underline-offset: 3px; font-size: 15px; font-weight: 700; padding: 4px 0; min-height: var(--tocco); }

  /* ── Lista Nomi ── */
  /* Lista Nomi, cantiere 30: parte alta ferma in alto, scorrono solo i nomi. Il «+» è quello dell'Agenda (.ag-testa · .ag-piu) */
  .ls-testa { position: sticky; top: 0; z-index: 5; background: var(--sfondo); margin: calc(-1 * (env(safe-area-inset-top) + 16px)) -16px 10px;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 8px; border-bottom: 1px solid var(--linea); }
  .ls-testa .ag-testa { margin: 0 0 8px; }
  .ls-testa .partner-select { margin: 0 0 8px; }
  .ls-testa .cerca { margin: 0 0 8px; }
  .chips button span { font-weight: 500; opacity: .6; margin-left: 2px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; font-size: 14px; font-weight: 600; min-height: var(--pill-h); padding: 8px 14px; border-radius: var(--raggio-pill); border: 1px solid var(--bordo); background: var(--superficie); color: var(--testo); }
  .chips button.scelto { background: var(--accento); color: var(--accento-su); border-color: var(--accento); }
  .cerca { margin: 10px 0 12px; position: relative; }
  .cerca input { margin: 0; padding-right: 40px; border-radius: var(--raggio-pill); padding-left: 18px; border-color: transparent; box-shadow: var(--ombra-card); }
  .cerca button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; font-size: 20px; color: var(--grigio); padding: 6px 10px; }
  .cn { display: flex; align-items: center; background: var(--card); border-radius: var(--raggio-riga); overflow: hidden; margin-bottom: 8px; min-height: 64px; padding-left: 12px;
    box-shadow: var(--ombra-card); }
  .cn-pastiglia { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--cat, var(--testo-tenue)); color: #fff; display: grid; place-items: center; font-size: 13.5px; font-weight: 600; letter-spacing: .2px; }
  .cn .frase svg.ic { color: var(--testo-soft); }
  .cn .striscia { width: 4px; flex: none; align-self: stretch; }
  .cn .dentro { flex: 1; min-width: 0; padding: 9px 6px 9px 12px; }
  .cn .nome, .cn .prof, .cn .frase { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* la prima riga è solo del nome; «nuovo» e le targhette hanno una riga loro in fondo alla card (Ignazio 19/09: accanto al nome «ci si perde») */
  .cn-segni { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .cn-segni .sv-targhe, .cn-segni .badge { margin-left: 0; }
  .cn .frase { font-size: 14px; color: var(--testo-soft); margin-top: 1px; }   /* niente colori: il colore resta alla categoria (Ignazio 18/09) */
  .cn .chiama { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--sfondo); color: var(--cat, var(--testo)); display: flex; align-items: center; justify-content: center; }
  .cn .chiama svg.ic { width: 19px; height: 19px; }
  .cn .chiama.spento { opacity: .3; pointer-events: none; }
  .ls-ordina { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--grigio); margin: 0 4px 8px; }
  .ls-ordina button { border: 0; background: none; color: var(--blu); font-size: 13px; font-weight: 600; padding: 4px 0; }
  .foglio > .contatta { margin: 4px 0 8px; }
  .f-comp { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 6px; }
  .f-comp select, .f-comp input { margin: 0; }
  /* Importa dalla rubrica (cantiere 30) */
  .rb-passi > b { font-size: 16px; }
  .rb-passi button.link { padding: 8px 0 0; font-size: 14px; }

  .ck-vn { --vn: var(--gr-volume); --vn-tinta: var(--gr-volume-tinta); background: var(--vn-tinta); border: 1px solid var(--vn-tinta); border-radius: var(--raggio-bottone); padding: 12px; margin: 4px 0 10px; color: var(--cat-cliente); }
  .ck-vn > b { font-size: 16px; }
  .ck-vn.azioni { --vn: var(--gr-azione); --vn-tinta: var(--gr-azione-tinta); }
  .ck-vn .vn-aiuto { color: var(--vn); margin-bottom: 4px; }
  .ck-vn-riga { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; font-family: inherit; font-size: 15px; background: var(--superficie); border: 0; border-radius: 10px; padding: 10px 12px; margin-top: 6px; color: var(--testo); }

  .vn-brand-testata button { font-family: inherit; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--linea); background: var(--sfondo); color: var(--grigio-chiaro); }
  .vn-brand-testata button.acceso { background: var(--col); border-color: var(--col); color: #fff; }
  button.piu-sezione { margin-bottom: 12px; }   /* «＋ Nuova vendita», «＋ Nuova azione»: il bottone in cima a una sezione della scheda */
  .vn-quando { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0 8px; }
  .vn-quando button { font-size: 16px; font-weight: 600; padding: 12px; border-radius: var(--raggio-bottone); border: 1.5px solid var(--linea); background: var(--superficie); color: var(--testo); }

  .vn-attesa { color: var(--grigio); font-size: 13px; font-weight: 600; margin-top: 3px; }
  .vn-attesa.tardi { color: var(--proposta); }

  .vn-aiuto { font-size: 13px; color: var(--grigio); margin-top: 3px; line-height: 1.35; }
  .vn-numeri { text-align: right; flex: none; }
  .vn-numeri b { display: block; font-size: 15px; }
  .vn-numeri span { font-size: 13px; color: var(--grigio); }
  .nota { background: var(--proposta-tinta); border: 1px solid var(--proposta); border-radius: var(--raggio-bottone); padding: 12px 14px; margin-bottom: 8px; width: 100%; text-align: left; font-size: 15px; color: var(--testo); }
  .testo-nota { white-space: pre-wrap; font-size: 15px; line-height: 1.45; max-height: 60vh; overflow-y: auto; }

  .foglio.alto { max-height: 92vh; overflow-y: auto; }
  /* Il modulo Nuovo contatto / Modifica (cantiere 34): fondo perla, gruppi in card bianche, categoria a pastiglie, «Annulla · Salva» fermi in fondo */
  .foglio.mc { background: var(--sfondo); padding-bottom: 0; }
  .mc-testa { display: flex; align-items: center; gap: 12px; margin-top: 2px; }
  .mc-testa .ts-pastiglia { width: 46px; height: 46px; font-size: 16px; }
  .mc-testa > div { flex: 1; min-width: 0; } .mc-testa small { display: block; font-size: 12px; color: var(--testo-soft); }
  .mc-testa b { display: block; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mc-testa button { flex: none; border: 0; background: var(--superficie); width: 38px; height: 38px; border-radius: 50%; font-size: 22px; line-height: 1; color: var(--testo-soft); }
  .mc-t { margin: 18px 6px 8px; font-size: var(--dim-etichetta); font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--testo-tenue); }
  .mc-g { padding: 4px 14px 12px; margin-bottom: 0; }
  .mc-cats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .mc-cat { border: 1px solid var(--bordo); background: var(--superficie); border-radius: var(--raggio-pill); min-height: 40px; padding: 6px 13px; font-size: 14px; font-weight: 600; color: var(--testo); }
  .mc-cat.on { background: var(--cat); border-color: var(--cat); color: #fff; }
  .foglio.mc .elimina-qui { margin: 14px 0; }
  .mc-fondo { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; align-items: center; background: var(--superficie); margin: 0 -16px;
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 14px); border-radius: 22px 22px 0 0; box-shadow: var(--ombra-foglio); }
  /* Dopo l'esito (cantiere 42): il foglio della chat prende il colore del tipo di appuntamento (--tipo, come in Agenda) */
  .foglio.mc.rifl { border-top: 6px solid var(--tipo); background: var(--sfondo); background: color-mix(in srgb, var(--tipo) 7%, var(--sfondo)); }
  .rifl .mc-testa .ts-pastiglia { background: var(--tipo); }
  .rifl .mc-testa .ts-pastiglia > svg.ic { width: 24px; height: 24px; }
  /* Il coach che parla (cantiere 42, 24/09): la chat dopo l'esito, nello stesso foglio colorato del tipo; il motore è in coach.js */
  .cch-corpo { padding: 8px 0 16px; min-height: 45vh; }
  .cch-fumetto { display: flex; gap: 8px; align-items: flex-end; margin: 8px 0; animation: cch-entra .3s ease both; }
  .cch-av { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--tipo); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
  .cch-bolla { background: var(--superficie); border-radius: 18px 18px 18px 4px; padding: 10px 13px; font-size: 16px; line-height: 1.42; box-shadow: var(--ombra-card); max-width: 86%; overflow-wrap: anywhere; }
  .cch-mio { flex-direction: row-reverse; }
  .cch-mio .cch-bolla { background: var(--tipo); color: #fff; border-radius: 18px 18px 4px 18px; }
  .cch-fonte { display: block; margin-top: 6px; font-size: 12.5px; font-weight: 600; color: var(--verde); }
  .cch-fonte.no { color: var(--testo-tenue); font-weight: 500; font-style: italic; }
  .cch-puntini .cch-bolla i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--testo-tenue); margin: 0 2px; animation: cch-salta 1s infinite; }
  .cch-puntini .cch-bolla i:nth-child(2) { animation-delay: .15s; } .cch-puntini .cch-bolla i:nth-child(3) { animation-delay: .3s; }
  .cch-risposte { display: flex; flex-wrap: wrap; gap: 7px; justify-content: flex-end; margin: 12px 0 6px; }
  .cch-risposte button { border: 1.5px solid var(--tipo); color: var(--tipo); background: var(--superficie); border-radius: var(--raggio-pill); min-height: 42px; padding: 8px 14px; font-size: 15px; font-weight: 600; }
  .cch-risposte button.cch-on { background: var(--tipo); color: #fff; }
  .cch-risposte button.cch-avanti { background: var(--accento); border-color: var(--accento); color: var(--accento-su); }
  .cch-risposte button.cch-avanti:disabled { opacity: .3; }
  .cch-risposte input { flex: 1 1 100%; margin: 0; font-size: 16px; padding: 11px 16px; border-radius: var(--raggio-pill); }
  .cch-rif { margin: 0; padding-left: 4px; list-style: none; } .cch-rif li { display: flex; gap: 7px; align-items: baseline; margin: 6px 0; font-size: 15px; }
  .cch-rif li svg.ic { flex: none; color: var(--tipo); }
  .cch .mc-fondo { grid-template-columns: 1fr; }
  /* il promemoria «Ti eri detto…» nella coda e in Agenda: col colore del coach, come la sua frase nelle righe della coda */
  .ricordo { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 12px; padding: 10px 12px; border-radius: var(--raggio-bottone);
    background: var(--cat-partner-tinta); color: var(--testo); font-size: 14.5px; line-height: 1.4; }
  .ricordo > svg.ic { flex: none; color: var(--cat-partner); width: 20px; height: 20px; margin-top: 1px; }
  .ricordo small { display: block; font-size: 12.5px; color: var(--cat-partner); font-weight: 600; margin-bottom: 2px; }
  @keyframes cch-entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes cch-salta { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
  /* ── Training (cantieri 42 e 45): pagina-training.js. Impara (la scala che sale), Ripassa, Studia (il catalogo: ogni settore ha il suo
     colore, --col). Il colore del Training è il viola della crescita, come la sua icona ── */
  .trn-ciao { display: flex; align-items: center; gap: 8px; margin: -6px 2px 12px; }
  .trn-ciao b { flex: 1; font-size: 18px; }
  .trn-conto { display: inline-flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 700; color: var(--testo-soft); background: var(--superficie);
    border-radius: var(--raggio-pill); padding: 6px 12px; box-shadow: var(--ombra-card); }
  .trn-conto > svg.ic { width: 18px; height: 18px; }

  button.trn-conto { border: 0; font-family: inherit; min-height: 0; width: auto; cursor: pointer; }
  /* «Come funziona» (25/09): sotto il saluto, a destra; il foglio con le regole del Training */
  button.trn-come { display: flex; align-items: center; gap: 6px; margin: -6px 2px 12px auto; width: auto; min-height: 0; padding: 4px 2px; border: 0; background: none;
    font: inherit; font-size: 14px; font-weight: 600; color: var(--gr-crescita); cursor: pointer; }
  .trn-come > svg.ic { width: 18px; height: 18px; }
  .trn-come-parte { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--bordo); }
  .trn-come-parte:first-child { border-top: 0; padding-top: 0; }
  .trn-come-parte b { display: block; font-size: 15px; } .trn-come-parte p { margin: 3px 0 0; font-size: 14.5px; line-height: 1.45; color: var(--testo); }
  .trn-come-foglio #trn-capito { margin-top: 14px; }
  /* Le medaglie (25/09): il conto in alto, la medaglia nuova alla fine del test, la festa del livello, il foglio «Le tue medaglie» */
  .trn-conto.medaglie > svg.ic { color: var(--proposta); }
  .trn-medaglia-nuova { display: flex; align-items: center; gap: 12px; text-align: left; margin: 14px 0 6px; padding: 12px 14px; border-radius: var(--raggio-riga);
    background: color-mix(in srgb, var(--proposta) 14%, var(--superficie)); }
  .trn-medaglia-nuova > svg.ic { flex: none; width: 32px; height: 32px; color: var(--proposta); }
  .trn-medaglia-nuova small { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--testo-soft); }
  .trn-medaglia-nuova b { display: block; font-size: 17px; line-height: 1.3; }
  .trn-livello-nuovo { display: flex; align-items: center; gap: 10px; text-align: left; margin: 8px 0; padding: 12px 14px; border-radius: var(--raggio-riga);
    background: var(--gr-crescita); color: #fff; }
  .trn-livello-nuovo > svg.ic { flex: none; width: 22px; height: 22px; }
  .trn-med { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--bordo); }
  .trn-med b { display: block; font-size: 15px; } .trn-med small { display: flex; align-items: center; gap: 4px; font-size: 13.5px; color: var(--testo-soft); margin-top: 2px; }
  .trn-med-tondo { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--sfondo); color: var(--testo-tenue); }
  .trn-med-tondo > svg.ic { width: 22px; height: 22px; }
  .trn-med:not(.presa) b { color: var(--testo-soft); font-weight: 600; }
  .trn-med.presa .trn-med-tondo { background: color-mix(in srgb, var(--proposta) 16%, var(--superficie)); color: var(--proposta); }
  .trn-med-foglio h4 .trn-badge { margin: 0 0 0 6px; vertical-align: 2px; }
  .trn-fila-oggi { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--cat-prospect); background: var(--cat-prospect-tinta);
    border-radius: var(--raggio-riga); padding: 9px 12px; margin: 0 0 12px; }
  .trn-schede { display: flex; gap: 4px; background: var(--superficie); border-radius: var(--raggio-pill); padding: 4px; margin: 0 0 16px; box-shadow: var(--ombra-card); }
  .trn-schede button { flex: 1; border: 0; background: none; border-radius: var(--raggio-pill); min-height: 40px; font-size: 15px; font-weight: 600; color: var(--testo-soft); font-family: inherit; }
  .trn-schede button.scelta { background: var(--gr-crescita); color: #fff; }
  .trn-num { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 99px; background: var(--cat-prospect); color: #fff; font-size: 12px; line-height: 20px; }
  /* la scala: dall'alto i livelli chiusi, poi i percorsi del livello aperto a zig-zag (come Duolingo), e in basso la sua base */
  .trn-scala { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 8px; }
  .trn-gradino { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--raggio-riga); }
  .trn-gradino > div { flex: 1; min-width: 0; } .trn-gradino b { display: block; font-size: 16px; }
  .trn-gradino small { display: block; font-size: 13px; margin-top: 1px; color: var(--testo-soft); }
  .trn-gradino.chiuso { border: 1.5px dashed var(--spento); color: var(--testo-tenue); } .trn-gradino.chiuso b { color: var(--testo-soft); }
  .trn-lucchetto { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--superficie-2); }
  .trn-lucchetto > svg.ic { width: 19px; height: 19px; }
  .trn-gradino.qui { background: var(--gr-crescita); color: #fff; margin-top: 4px; } .trn-gradino.qui small { color: rgba(255,255,255,.85); }
  .trn-gradino.fatto { background: var(--ok-tinta); color: var(--ok); } .trn-gradino > svg.ic { width: 24px; height: 24px; }
  .trn-nodo { display: flex; align-items: center; gap: 12px; margin-left: var(--x); border: 0; background: none; padding: 6px 0; text-align: left; font-family: inherit; color: var(--testo); }
  .trn-nodo > div { min-width: 0; } .trn-nodo b { display: block; font-size: 16px; }

  .trn-tondo-n { width: 64px; height: 64px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--superficie); color: var(--gr-crescita);

  .trn-tondo-n > svg.ic { width: 28px; height: 28px; }
  .trn-nodo.qui .trn-tondo-n { background: var(--gr-crescita); color: #fff; box-shadow: 0 5px 0 color-mix(in srgb, var(--gr-crescita) 55%, #000); }
  .trn-nodo.fatto .trn-tondo-n { background: var(--ok); border-color: var(--ok); color: #fff; box-shadow: 0 5px 0 color-mix(in srgb, var(--ok) 55%, #000); }
  .trn-nodo.presto .trn-tondo-n, .trn-nodo.chiuso .trn-tondo-n { border: 2px dashed var(--spento); color: var(--testo-tenue); box-shadow: none; }
  .trn-nodo.presto b, .trn-nodo.chiuso b { color: var(--testo-soft); } .trn-nodo.chiuso .trn-tondo-n { background: var(--superficie-2); }
  .trn-qui { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--gr-crescita-tinta); color: var(--gr-crescita); margin-left: 8px; vertical-align: 2px; }
  .trn-stelle { display: inline-flex; gap: 1px; } .trn-stelle i { display: inline-flex; color: var(--spento); }
  .trn-stelle i.presa { color: var(--proposta); } .trn-stelle i.presa svg.ic { fill: currentColor; }
  /* il foglio di un percorso */
  .trn-avanzamento { position: relative; height: 12px; border-radius: 99px; background: var(--sfondo); overflow: hidden; margin: 14px 0 4px; }
  .trn-avanzamento i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: color-mix(in srgb, var(--gr-crescita) 35%, var(--superficie)); }
  .trn-avanzamento i.sapute { background: var(--gr-crescita); }
  .trn-percorso .trn-conti { margin: 8px 0 16px; } .trn-percorso .trn-conti span { background: var(--sfondo); }
  button.trn-via { margin: 4px 0 8px; background: var(--gr-crescita); }

  .trn-ripassa b { display: block; font-size: 18px; margin: 6px 0; } .trn-ripassa p { color: var(--testo-soft); font-size: 15px; line-height: 1.45; margin: 0 0 16px; }

  /* la sessione: una carta alla volta */

  button.primario.pf-prova { display: block; width: 100%; margin-top: 12px; }
  .banner-big .riga { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .banner-big .riga .primario { width: auto; padding: 8px 14px; font-size: 14px; }
  .banner-big small { display: block; margin-top: 6px; color: var(--grigio); font-size: 12px; }
  .banner-abb.in-scadenza { background: var(--proposta-tinta); color: var(--proposta); }
  .banner-abb.scaduto button { width: 100%; margin-top: 10px; border: 0; border-radius: var(--raggio-bottone); background: var(--rosso); color: #fff; font-size: 15px; font-weight: 700; padding: 11px; }
  .banner-abb.in-scadenza button { background: var(--proposta); }
  .banner-grande { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border-radius: var(--raggio-card); padding: 14px 16px; margin-bottom: 10px; font-family: inherit; }

  .banner-grande .freccia { margin-left: auto; font-size: 22px; }
  .banner-grande { border: 0; min-height: 72px; }
  .banner-grande .ico svg.ic { width: 22px; height: 22px; }
  .banner-grande.check { background: var(--accento); color: var(--accento-su); }

  .banner-grande.obiettivi { background: var(--pericolo-tinta); color: var(--pericolo); }
  .banner-grande.obiettivi .ico { background: var(--superficie); border-radius: 50%; }
  .schede-dash { display: flex; gap: 2px; overflow-x: auto; margin-bottom: 14px; scrollbar-width: none; background: var(--sfondo); border-radius: var(--raggio-pill); padding: 4px; }
  .schede-dash::-webkit-scrollbar { display: none; }
  .schede-dash button { flex: 1 0 auto; font-size: 13px; font-weight: 600; min-height: 36px; padding: 7px 11px; border-radius: var(--raggio-pill); border: 0; background: transparent; color: var(--testo-soft); white-space: nowrap; }
  .schede-dash button.scelto { background: var(--accento); color: var(--accento-su); }
  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
  .kpi > div { min-width: 0; border: 0; border-radius: var(--raggio-riga); padding: 12px; background: var(--superficie-2); }
  .kpi .t { font-size: 14px; font-weight: 600; }
  .kpi .v { font-size: clamp(19px, 5.6vw, 26px); white-space: nowrap; font-weight: 800; letter-spacing: -.5px; margin: 4px 0; }
  .kpi ul { margin: 6px 0 0; padding-left: 14px; font-size: 12px; line-height: 1.4; }
  .kpi .barra div { transition: width .4s ease; }
  .kpi .complimento { color: var(--verde); font-weight: 700; }
  .obiettivi-mod { display: block; margin: 8px auto 0; font-weight: 600; }
  /* Le azioni sotto i numeri (Obiettivi · Visione completa · Mostra di più): due tasselli affiancati, con l'icona nel tondo, un titolo e una riga che dice
     cosa aprono (Ignazio 19/09: come due scritte al centro «non dicono niente e sono buttate a casaccio») */
  .ds-azioni { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 12px; }
  .ds-azioni.una, .ds-azioni:has(> :only-child) { grid-template-columns: 1fr; }
  .ds-azione { display: flex; align-items: center; gap: 10px; text-align: left; min-width: 0; min-height: 64px; padding: 10px 12px; border: 0; border-radius: var(--raggio-riga);
    background: var(--superficie); box-shadow: var(--ombra-card); color: var(--testo); font-family: inherit; --richiamo: var(--testo-soft); --richiamo-tinta: var(--sfondo); }
  .ds-azione:disabled { opacity: .5; }
  .ds-azione > svg.ic { flex: none; width: 40px; height: 40px; padding: 10px; border-radius: 50%; box-sizing: border-box; color: var(--richiamo); background: var(--richiamo-tinta); }
  .ds-azione span { min-width: 0; } .ds-azione b { display: block; font-size: 14px; line-height: 1.2; } .ds-azione small { display: block; font-size: 12px; color: var(--testo-soft); margin-top: 2px; line-height: 1.25; }
  .ds-azione.obiettivi { --richiamo: var(--pericolo); --richiamo-tinta: var(--pericolo-tinta); }
  .ds-azione.visione-completa { --richiamo: var(--gr-volume); --richiamo-tinta: var(--gr-volume-tinta); }   /* i numeri, non i Clienti (Ignazio 20/09) */
  .ds-azione.report { --richiamo: var(--testo-soft); --richiamo-tinta: var(--sfondo); }
  .ds-azione.griglia { --richiamo: var(--gr-azione); --richiamo-tinta: var(--gr-azione-tinta); }   /* i Piani Marketing stanno nel gruppo Azione, non sono i Partner */
  .ob-modi { margin-bottom: 10px; }
  .ob-crescita { background: var(--gr-crescita-tinta); border-radius: var(--raggio-riga); padding: 12px 14px; margin-bottom: 6px; }
  .ob-crescita-testa { font-size: 15px; font-weight: 600; color: var(--gr-crescita); }
  .ob-crescita-testa b { font-size: 20px; }
  .ob-crescita input[type=range] { width: 100%; margin: 10px 0 2px; padding: 0; border: 0; background: none; accent-color: var(--gr-crescita); height: 28px; }
  .ob-tacche { display: flex; justify-content: space-between; font-size: 11px; color: var(--grigio); }
  .ob-ambizioso { margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--proposta); background: var(--proposta-tinta); border-radius: 10px; padding: 8px 10px; }
  .ob-gruppo { padding: 12px 14px; }
  .mc-t .pallino { vertical-align: 0; }
  .ob-campi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ob-campi label { font-size: 13px; font-weight: 600; color: var(--grigio); }
  .ob-campi input { margin: 4px 0 0; padding: 10px; font-size: 17px; }
  .visione { display: block; margin: 14px auto; min-height: var(--tocco); border: 0; background: none; font-size: 15px; font-weight: 600; color: var(--testo-soft); }
  .sv { background: var(--accento); color: #fff; border-radius: var(--raggio-card); padding: 14px; margin: 16px 0 6px; }
  .sv h3 { margin: 0; font-size: 20px; }
  .sv .sotto-sv { font-size: 12px; color: var(--testo-tenue); margin: 2px 0 10px; }
  .sv .legenda { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .sv .legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .sv table { width: 100%; border-collapse: separate; border-spacing: 4px; table-layout: fixed; }
  .sv th { font-size: 10px; font-weight: 700; color: var(--testo-tenue); }
  .sv th.mese { width: 34px; text-align: right; line-height: 1.1; }
  .sv td { height: 34px; color: #fff; border-radius: 8px; text-align: center; font-size: 14px; font-weight: 800; }
  .sv td.zero { background: rgba(255,255,255,.08) !important; color: var(--testo-soft); font-weight: 600; }
  .sv .totali { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 8px; }
  .sv .totali div { background: rgba(255,255,255,.08); border-radius: 10px; padding: 8px 2px; text-align: center; }
  .sv .totali b { display: block; font-size: 17px; }
  .sv .totali div { min-width: 0; overflow: hidden; }
  .sv .totali span { display: block; font-size: 9px; font-weight: 700; color: var(--spento); }
  .sv .totali small { display: block; font-size: 9px; color: var(--testo-tenue); }
  /* ── Gli ultimi 12 mesi: il foglio dello storico dei Segni Vitali (Ignazio 25/09: la griglia non deve stare
     in fondo a una pagina lunga, e si devono poter scegliere gli utenti). Una riga per linea, il flusso a
     barrette, il numero di adesso e il cambiamento; il tocco porta la griglia in cima su quella linea. ── */
  .sl-chi { display: flex; align-items: center; gap: 8px; width: 100%; min-height: var(--tocco); margin-bottom: 4px;
    border: 1px solid var(--linea); border-radius: var(--raggio-bottone); background: var(--superficie);
    font-family: inherit; font-size: 16px; font-weight: 600; color: var(--testo); padding: 10px 12px; text-align: left; }
  .sl-chi svg.ic { flex: none; width: 20px; height: 20px; color: var(--gr-segni); }
  .sl-chi span { margin-left: auto; color: var(--testo-tenue); font-weight: 400; }
  .sl-chi small { font-size: 13px; font-weight: 400; color: var(--testo-tenue); }
  .sl { display: grid; gap: 6px; }
  .sl-riga { display: grid; grid-template-columns: 1fr auto 42px 22px; align-items: center; gap: 8px; width: 100%;
    border: 1px solid transparent; border-radius: var(--raggio-riga); background: var(--superficie-2); padding: 8px 10px;
    font-family: inherit; font-size: 15px; color: var(--testo); text-align: left; min-height: var(--tocco); }
  .sl-riga.scelta { border-color: var(--sl-c); background: var(--superficie); }
  .sl-riga > b { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sl-riga > b i.ramo { font-style: normal; font-weight: 400; color: var(--testo-tenue); margin-right: 4px; }
  .sl-barre { display: flex; align-items: flex-end; gap: 2px; height: 26px; }
  .sl-barre i { display: block; width: 7px; min-height: 2px; border-radius: 2px 2px 0 0; background: var(--spento); }
  .sl-barre i.pieno { background: var(--sl-c); }
  .sl-n { text-align: right; font-weight: 800; font-size: 16px; color: var(--sl-c); }
  .sl-n.zero { color: var(--grigio-chiaro); font-weight: 600; }
  .sl-f { font-size: 13px; font-weight: 700; color: var(--testo-tenue); text-align: center; }
  .sl-f.su { color: var(--ok); } .sl-f.giu { color: var(--pericolo); }
  .sl-riga.gruppo { background: var(--accento); color: #fff; border-color: var(--accento); }
  .sl-riga.gruppo .sl-n { color: #fff; }
  .sl-nota { font-size: 12.5px; color: var(--grigio); margin: 8px 0 0; }

  /* ── Agenda (Fase 4) ── */
  .ag-testa { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; }
  .ag-testa h1 { margin: 0; flex: 1; }
  .ag-mese { border: 0; background: none; font-size: 15px; font-weight: 700; color: var(--testo-soft); min-height: var(--tocco); padding: 6px 0; position: relative; }
  .ag-mese input { position: absolute; inset: 0; opacity: 0; width: 100%; }
  .ag-oggi { border: 0; background: var(--superficie); box-shadow: var(--ombra-card); border-radius: var(--raggio-pill); font-size: 13px; font-weight: 700; min-height: 36px; padding: 6px 14px; color: var(--testo); }
  .ag-piu { border: 0; background: var(--accento); color: var(--accento-su); width: 44px; height: 44px; border-radius: 50%; font-size: 24px; line-height: 1; }
  .ag-settimana { display: flex; align-items: stretch; gap: 2px; background: var(--superficie); border-radius: var(--raggio-card); padding: 8px 4px; box-shadow: var(--ombra-card); margin-bottom: 16px; }
  .ag-settimana .freccia { border: 0; background: none; color: var(--grigio); font-size: 20px; padding: 0 4px; }
  .ag-giorno { flex: 1; border: 0; background: none; border-radius: var(--raggio-riga); padding: 8px 0; min-height: 60px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--testo); font-family: inherit; }
  .ag-giorno small { font-size: var(--dim-etichetta); font-weight: 700; color: var(--testo-tenue); text-transform: uppercase; letter-spacing: .6px; }
  .ag-giorno b { font-size: 17px; }
  .ag-giorno i { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
  .ag-giorno i.si { background: var(--accento); }
  .ag-giorno.oggi b { color: var(--accento); }
  .ag-giorno.scelto { background: var(--accento); }
  .ag-giorno.scelto small, .ag-giorno.scelto b { color: #fff; }
  .ag-giorno.scelto i.si { background: var(--superficie); }
  .ag-evento { display: flex; background: var(--superficie); border-radius: var(--raggio-riga); margin-bottom: 8px; overflow: hidden; box-shadow: var(--ombra-card); }
  .ag-evento .ora { width: 64px; flex: none; padding: 12px 0 12px 12px; font-size: 13px; font-weight: 700; color: var(--testo); line-height: 1.3; }
  .ag-evento .ora small { display: block; font-weight: 500; color: var(--grigio); }
  /* la barretta ha il colore della categoria della persona, come il tondo nella scheda (scelta «B» di Ignazio 19/09: viola, blu e arancio
     vogliono dire Partner, Cliente e Prospect in tutta l'app; il tipo di appuntamento resta scritto nel titolo) */
  .ag-evento .barra-tipo { width: 4px; flex: none; margin: 12px 0; border-radius: 4px; background: var(--cat, var(--spento)); }
  .ag-evento .dentro { flex: 1; min-width: 0; }
  .ag-evento .apri { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; font-family: inherit; color: var(--testo); }
  .ag-evento .t { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag-evento .s { font-size: 13px; color: var(--grigio); margin-top: 2px; }
  .ag-evento .extra { padding: 0 12px 12px; }
  .ag-evento .extra .note-ev { font-size: 13px; color: var(--grigio); margin-bottom: 8px; }
  .ag-esiti { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  /* gli esiti: pastiglie alte 40, bordo grigio su bianco; quello scelto pieno inchiostro (docs/MB21_Design.md) */
  .ag-esiti button { border: 1px solid var(--bordo); border-radius: var(--raggio-pill); background: var(--superficie); font-size: 14px; font-weight: 600; min-height: var(--pill-h); padding: 8px 14px; color: var(--testo); }
  /* cantiere 39 + 24/09 (Ignazio, variante A): gli esiti buoni a due a due, larghi uguali, come la coda; i non andati sotto in una riga loro, più piccoli e grigi. Sta prima di .attuale/.scelto, che devono vincere */
  .ag-esiti .buoni, .ag-esiti .nonandati, .ag-scelte .buoni, .ag-scelte .nonandati { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
  .ag-esiti .buoni button, .ag-scelte .buoni button { flex: 1 1 40%; }
  .ag-esiti .nonandati button, .ag-scelte .nonandati button { flex: 1 1 auto; white-space: nowrap; font-size: 13px; min-height: 34px; padding: 6px 10px; color: var(--testo-soft); }
  .ag-esiti button.attuale { background: var(--accento); color: var(--accento-su); border-color: var(--accento); }
  .ag-comandi { display: flex; gap: 8px; flex-wrap: wrap; }
  .ag-comandi button { border: 0; background: var(--sfondo); border-radius: var(--raggio-pill); font-size: 13px; font-weight: 600; min-height: 36px; padding: 8px 12px; color: var(--testo); display: inline-flex; align-items: center; gap: 6px; }
  .ag-comandi button.pericolo { color: var(--rosso); }
  .ag-blocco { width: 100%; display: flex; justify-content: space-between; align-items: center; text-align: left; border: 0; border-radius: var(--raggio-riga); padding: 13px 14px; margin: 6px 0; font-size: 15px; font-weight: 600; font-family: inherit; }
  /* Righe di richiamo (partner da avviare, telefonate, riordini, conferme…): bianche come le righe delle persone (Ignazio 19/09: le tinte
     sul fondo perla danno fastidio); il colore del richiamo resta solo nell'icona, --richiamo */
  .ag-blocco { min-height: 60px; padding: 10px 14px 10px 12px; background: var(--superficie); color: var(--testo); box-shadow: var(--ombra-card); --richiamo: var(--testo-soft); --richiamo-tinta: var(--sfondo); }
  /* l'icona sta in un tondo con la tinta del richiamo: dà colore alla riga senza tingerla tutta (tutta bianca era «troppo piatta», Ignazio 19/09) */
  .ag-blocco > span:first-child { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .ag-blocco > span:first-child svg.ic { color: var(--richiamo); background: var(--richiamo-tinta); width: 40px; height: 40px; padding: 10px; border-radius: 50%; box-sizing: border-box; }
  .ag-blocco > span:last-child { color: var(--testo-tenue); }
  .ag-blocco.telefonate { --richiamo: var(--az-contatto); --richiamo-tinta: var(--superficie-2); }
  .ag-blocco.riordini { --richiamo: var(--proposta); --richiamo-tinta: var(--proposta-tinta); }
  .ag-blocco.conferme { --richiamo: var(--ok); --richiamo-tinta: var(--ok-tinta); }
  .ag-blocco.avvio { --richiamo: var(--cat-partner); --richiamo-tinta: var(--cat-partner-tinta); }
  /* ── Agenda a orario (cantiere 37): griglia del giorno, settimana, interruttore delle viste ── */
  /* i tre modi di guardare lo stesso giorno; la scelta si ricorda (MB21Viste) */
  .ag-viste { display: flex; background: #E2E5EC; border-radius: var(--raggio-pill); padding: 3px; margin-bottom: 12px; }
  .ag-viste button { flex: 1; border: 0; background: none; font-family: inherit; font-size: 14px; font-weight: 700; color: var(--testo-soft); min-height: 34px; border-radius: var(--raggio-pill); display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
  .ag-viste button svg.ic { width: 16px; height: 16px; }
  .ag-viste button.si { background: var(--superficie); color: var(--testo); box-shadow: 0 1px 4px rgba(16,21,31,.12); }
  /* la striscia dei giorni: un pallino per impegno, col colore della persona (Ignazio 20/09) */
  .ag-giorno .ag-punti { display: flex; gap: 3px; height: 6px; align-items: center; }
  .ag-giorno .ag-punti i { width: 6px; height: 6px; border-radius: 50%; background: var(--cat, var(--spento)); }
  .ag-giorno .ag-punti i.tanti { width: 10px; border-radius: 3px; }
  .ag-giorno.scelto .ag-punti i { filter: brightness(1.75) saturate(.85); }   /* sul fondo scuro del giorno scelto i colori vanno schiariti */
  /* i richiami del giorno, pastiglie corte sopra la giornata (cantiere 37): il tondo dell'icona tiene il
     colore del richiamo, come le righe grandi della Dashboard */
  .ag-rich { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .ag-rich button { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 0; background: var(--superficie); box-shadow: var(--ombra-card);
    border-radius: var(--raggio-pill); min-height: 38px; padding: 5px 13px 5px 5px; font-family: inherit; font-size: 13px; color: var(--testo);
    --richiamo: var(--testo-soft); --richiamo-tinta: var(--sfondo); }
  .ag-rich button svg.ic { width: 28px; height: 28px; padding: 6px; box-sizing: border-box; border-radius: 50%; color: var(--richiamo); background: var(--richiamo-tinta); }
  .ag-rich button b { font-weight: 700; }
  .ag-rich .telefonate { --richiamo: var(--az-contatto); --richiamo-tinta: var(--superficie-2); }
  .ag-rich .riordini { --richiamo: var(--proposta); --richiamo-tinta: var(--proposta-tinta); }
  .ag-rich .conferme { --richiamo: var(--ok); --richiamo-tinta: var(--ok-tinta); }
  .ag-rich .passati { --richiamo: var(--pericolo); --richiamo-tinta: var(--pericolo-tinta); }
  /* il foglio del giorno (cantiere 41): le cose da fare, con la spunta tonda e il campo per aggiungere */
  .ag-cose { background: var(--superficie); border-radius: var(--raggio-card); box-shadow: var(--ombra-card); padding: 10px 12px 8px; margin-bottom: 12px; }
  .ag-cose-testa { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--testo-soft); margin-bottom: 4px; }
  .ag-cose-testa svg.ic { width: 18px; height: 18px; color: var(--ok); }
  .ag-cose-testa b { margin-left: auto; font-weight: 700; color: var(--testo-tenue); }
  .ag-cose .cosa { display: flex; align-items: flex-start; gap: 10px; border-top: 1px solid var(--superficie-2); }
  .ag-cose .cosa button { border: 0; background: none; font-family: inherit; color: var(--testo); padding: 0; margin: 0; text-align: left; }
  .ag-cose .cosa .spunta { flex: none; width: 24px; height: 24px; margin: 9px 0; border-radius: 50%; border: 2px solid var(--testo-tenue); display: inline-flex; align-items: center; justify-content: center; }
  .ag-cose .cosa .spunta svg.ic { width: 24px; height: 24px; }
  .ag-cose .cosa.fatta .spunta { border-color: var(--ok); color: var(--ok); }
  .ag-cose .cosa .testo { flex: 1; min-height: 42px; padding: 10px 0; font-size: 15px; line-height: 1.3; display: flex; flex-direction: column; gap: 2px; }
  .ag-cose .cosa .testo small { font-size: 11.5px; font-weight: 600; color: var(--proposta); }
  .ag-cose .cosa.fatta .testo span { color: var(--testo-tenue); }
  .ag-cosa-nuova { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--superficie-2); padding-top: 6px; }
  .ag-cosa-nuova input { flex: 1; min-width: 0; border: 0; background: none; font-family: inherit; font-size: 15px; color: var(--testo); padding: 8px 0; outline: none; }
  .ag-cosa-nuova input::placeholder { color: var(--testo-tenue); }
  .ag-cosa-nuova button { flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--accento); color: var(--accento-su); display: inline-flex; align-items: center; justify-content: center; padding: 0; }

  /* la pagina formato NotePlan (cantiere 41): testa con ☰, titolo del giorno, card degli impegni, foglio a sezioni, cassetto Timeline */

  .ag-cronologia { position: sticky; bottom: 92px; display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: var(--superficie); box-shadow: 0 -2px 14px rgba(16,21,31,.12); border-radius: 18px 18px 0 0; padding: 12px 16px; margin-top: 12px; font-family: inherit; font-size: 15px; font-weight: 700; color: var(--testo); }

  /* il Check a righe numerate come il modulo Core (cantiere 41, 22/09): numero blu N21, targhetta «Core», come si riempie */

  /* (le righe .ck-core di prima, tenute per il banco) */

  /* il Modulo Core del mese (cantiere 41): sette riquadri numerati come il foglio N21, titolo blu, tabelle e caselle */

  .cm-testa .freccia { border: 0; background: var(--superficie); box-shadow: var(--ombra-card); border-radius: 50%; width: 38px; height: 38px; font-size: 22px; color: var(--testo); }
  .cm-mese { text-align: center; font-size: 15px; font-weight: 700; color: var(--testo-soft); margin: 0 0 10px; }
  .cm-pdf { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 0 12px; }   /* «Condividi PDF» del Modulo Core (23/09) */
  .cm-riass { text-align: center; font-size: 13px; font-weight: 700; color: var(--testo-tenue); margin-bottom: 12px; }

  .cm-num { width: 44px; text-align: center; font-family: inherit; font-size: 14px; padding: 5px 4px; border: 1px solid var(--bordo); border-radius: 8px; background: var(--superficie-2); color: var(--testo); }
  .cm-num.larga { width: 110px; }
  .cm-testo { flex: 1; min-width: 0; font-family: inherit; font-size: 14px; padding: 6px 8px; border: 1px solid var(--bordo); border-radius: 8px; background: var(--superficie-2); color: var(--testo); }
  .cm-riga { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--superficie-2); font-size: 14px; }
  .cm-riga > span:first-child { flex: 1; }
  .cm-riga small { font-size: 11px; color: var(--testo-tenue); }
  .cm-riga small.cm-prossimo { display: block; margin-top: 1px; }   /* «prossimo: ottobre 2026» sotto i biglietti */
  .cm-auto { font-weight: 700; background: var(--sfondo); border-radius: 8px; padding: 5px 10px; min-width: 44px; text-align: center; }
  .cm-auto.si { background: var(--ok-tinta); color: var(--ok); }   /* SI acceso (Ignazio 22/09) */

  /* MB Plan a tre colonne su schermo largo (cantiere 41, vista modulabile): menu · foglio del giorno · mese + Timeline */
  main:has(.mb-3col) { max-width: 1240px; }
  .mb-3col { display: grid; grid-template-columns: 220px minmax(0, 1fr) 380px; gap: 18px; align-items: start; }

  .mb-crono { flex: 1; min-height: 0; overflow-y: auto; background: var(--superficie); border-radius: var(--raggio-card); box-shadow: var(--ombra-card); padding: 10px 12px; }

  /* le linguette ai bordi (telefono, iPad in verticale): menu a sinistra, mese e Timeline a destra (Ignazio 22/09) */

  .mb-linguetta { position: fixed; top: 50%; z-index: 15; width: 26px; height: 64px; margin-top: -32px; border: 0; padding: 0; background: var(--superficie); box-shadow: var(--ombra-card); color: var(--testo-soft); display: inline-flex; align-items: center; justify-content: center; }

  .mm-testa h1 { flex: 1; text-align: center; }

  .mm-testa .freccia { border: 0; background: var(--superficie); box-shadow: var(--ombra-card); border-radius: 50%; width: 36px; height: 36px; font-size: 20px; color: var(--testo); }

  .ag-cose-invito svg.ic { width: 20px; height: 20px; flex: none; color: var(--gr-crescita, var(--proposta)); }
  /* il modello: una riga per voce con l'interruttore a sinistra */
  .foglio.mod .mod-voce { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--superficie-2); }
  .foglio.mod .mod-voce button { border: 0; background: none; font-family: inherit; color: var(--testo); padding: 0; margin: 0; text-align: left; }
  .foglio.mod .mod-voce .mod-int { flex: none; width: 44px; height: 26px; border-radius: 13px; background: var(--ok); position: relative; transition: background .15s; }   /* più specifico di «.mod-voce button», se no resta senza sfondo (visto da Ignazio 22/09) */
  .foglio.mod .mod-int i { position: absolute; top: 3px; left: 21px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .15s; }
  .foglio.mod .mod-voce.spenta .mod-int { background: var(--spento); }
  .foglio.mod .spenta .mod-int i { left: 3px; }
  .foglio.mod .mod-testo { flex: 1; min-height: 48px; padding: 8px 0; display: flex; flex-direction: column; gap: 1px; font-size: 15px; }
  .foglio.mod .mod-testo small { font-size: 12px; color: var(--testo-tenue); }
  .foglio.mod .spenta .mod-testo span { color: var(--testo-tenue); }
  .foglio.mod .ag-cosa-nuova { border-top: 1px solid var(--superficie-2); margin-top: 4px; }
  .fv-giorni button { flex: 1; padding: 8px 4px; }
  .fc-quando { color: var(--testo-soft); font-size: 14px; }
  .fc-scala { display: flex; align-items: center; gap: 8px; }
  .fc-scala b { flex: 1; text-align: center; font-size: 15px; }
  .fc-comandi { display: flex; justify-content: space-between; gap: 10px; }
  .fc-comandi button.link.elimina-qui { display: inline; width: auto; margin-top: 0; }
  /* la griglia: una card bianca con le ore a sinistra e i blocchi dentro */
  .ag-griglia { position: relative; background: var(--superficie); border-radius: var(--raggio-card); box-shadow: var(--ombra-card); padding: 10px 10px 12px 0; overflow: hidden; }
  .ag-ore { position: relative; margin-left: 50px; }
  .ag-lin { position: absolute; left: 0; right: 0; border-top: 1px solid var(--linea); pointer-events: none; }
  .ag-lin b { position: absolute; left: -50px; top: -8px; width: 44px; text-align: right; font-size: 12px; font-weight: 600; color: var(--testo-tenue); }
  .ag-mezza { position: absolute; left: 0; right: 0; border-top: 1px solid var(--superficie-2); pointer-events: none; }
  /* il tocco su un'ora libera fissa lì: l'ora è quella del punto toccato, al quarto d'ora */
  /* lo strato che prende il tocco sul vuoto: deve coprire TUTTA la griglia (senza inset è alto zero e non
     succede niente — trovato da Ignazio il 21/09 provando l'app) */
  .ag-libero { position: absolute; inset: 0; border: 0; background: none; padding: 0; margin: 0; font-family: inherit; }
  .ag-invito { position: absolute; left: 2px; right: 4px; border: 1px dashed #E6E9EF; border-radius: 12px; color: var(--testo-tenue); font-size: 11.5px; font-weight: 600; display: flex; align-items: flex-start; justify-content: flex-end; gap: 3px; padding: 4px 8px 0 0; pointer-events: none; }
  .ag-invito svg.ic { width: 13px; height: 13px; margin-top: 1px; }
  /* un impegno: tinta della categoria della persona, barretta piena a sinistra (come nell'elenco) */
  .ag-ev { position: absolute; border: 0; margin: 0; padding: 4px 7px 4px 11px; border-radius: 12px; overflow: hidden; text-align: left;
    font-family: inherit; font-size: 13px; line-height: 1.25; background: var(--cat-tinta, var(--superficie-2)); color: var(--cat-scuro, var(--testo)); }
  .ag-ev .bar { position: absolute; left: 4px; top: 4px; bottom: 4px; width: 3px; border-radius: 3px; background: var(--cat, var(--spento)); }
  .ag-ev b { display: block; font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag-ev small { display: block; font-size: 11.5px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag-ev.bassa { padding-top: 1px; padding-bottom: 1px; font-size: 12px; }
  .ag-ev.bassa b { font-size: 12px; }
  .ag-ev.fatta { opacity: .62; }
  .ag-ev.fatta b { text-decoration: line-through; text-decoration-thickness: 1px; }
  .ag-ev.dacoda { background: var(--superficie-2); border: 1px dashed var(--cat, var(--spento)); padding-top: 3px; }   /* righine: viene dalla coda, non è un appuntamento fissato */
  .ag-ev.scelta { outline: 2px solid var(--cat, var(--testo)); outline-offset: -2px; }
  /* adesso: la linea rossa che attraversa la giornata, solo su oggi */
  .ag-adesso { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--pericolo); z-index: 3; pointer-events: none; }
  .ag-adesso i { position: absolute; left: -4px; top: -5px; width: 9px; height: 9px; border-radius: 50%; background: var(--pericolo); }
  .ag-adesso b { position: absolute; left: -50px; top: -9px; width: 44px; text-align: right; font-size: 11px; font-weight: 700; color: var(--pericolo); background: var(--superficie); }
  /* avviso in cima alla griglia quando due impegni si accavallano */
  .ag-doppi { display: flex; align-items: center; gap: 8px; background: var(--pericolo-tinta); color: var(--pericolo); border-radius: var(--raggio-bottone); padding: 9px 12px; margin-bottom: 10px; font-size: 13.5px; font-weight: 600; }
  .ag-doppi svg.ic { width: 18px; height: 18px; flex: none; }
  /* bottone «Ora» che riporta la griglia su adesso */
  /* «Ora» si vede solo quando la linea di adesso è uscita dallo schermo: se sei già lì, un bottone che non
     sposta niente sembra rotto (Ignazio 21/09) */
  .ag-vai-ora { position: sticky; bottom: 12px; float: right; margin: -44px 6px 0 0; z-index: 4; border: 0; background: var(--accento); color: var(--accento-su); border-radius: var(--raggio-pill); font-size: 13px; font-weight: 700; min-height: 34px; padding: 6px 14px; box-shadow: 0 4px 14px rgba(16,21,31,.28); font-family: inherit;
    opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .18s ease, transform .18s ease; }
  .ag-vai-ora.si { opacity: 1; pointer-events: auto; transform: none; }
  /* avviso «a quest'ora hai già…» nel modulo, con le prime ore libere da toccare (cantiere 37) */
  .ag-scontro { background: var(--pericolo-tinta); color: var(--pericolo); border-radius: var(--raggio-bottone); padding: 10px 12px; margin: 0 0 10px; font-size: 13.5px; font-weight: 700; }
  .ag-scontro svg.ic { width: 17px; height: 17px; vertical-align: -4px; margin-right: 3px; }
  .ag-scontro span { display: block; font-weight: 500; color: var(--testo); margin-top: 3px; }
  .ag-scontro em { font-style: normal; color: var(--testo-soft); font-weight: 500; }
  .ag-orelibere { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ag-orelibere button { border: 1px solid var(--bordo); background: var(--superficie); border-radius: var(--raggio-pill); min-height: 36px; padding: 7px 13px; font-size: 13px; font-weight: 700; color: var(--testo); font-family: inherit; }
  /* ── Settimana: sette colonne strette, si tocca un blocco per aprire quel giorno ── */
  .ag-sett-testa { display: flex; margin: 0 0 2px 30px; }
  .ag-sett-testa div { flex: 1; text-align: center; font-size: 11px; font-weight: 700; color: var(--testo-tenue); text-transform: uppercase; letter-spacing: .4px; padding-bottom: 3px; }
  .ag-sett-testa div b { display: block; font-size: 14px; color: var(--testo); letter-spacing: 0; }
  .ag-sett-testa div.oggi b { color: var(--accento); }
  .ag-sett-testa div.scelto b { background: var(--accento); color: #fff; border-radius: 50%; width: 22px; height: 22px; line-height: 22px; margin: 0 auto; }
  .ag-griglia.sett { padding: 8px 6px 10px 0; }
  .ag-griglia.sett .ag-ore { margin-left: 30px; }
  .ag-griglia.sett .ag-lin b { left: -30px; width: 26px; font-size: 10.5px; }
  .ag-griglia.sett .ag-adesso b { display: none; }
  .ag-colonna { position: absolute; top: 0; bottom: 0; right: auto; border-left: 1px solid var(--bordo); background: none; padding: 0; }   /* left e width arrivano dallo stile della colonna */
  .ag-colonna:first-of-type { border-left: 0; }
  .ag-colonna.oggi { background: var(--superficie-2); }
  .ag-colonna.scelto { background: rgba(16,21,31,.05); }
  .ag-sev { position: absolute; border: 0; padding: 2px 3px; border-radius: 6px; overflow: hidden; font-family: inherit; font-size: 10px; line-height: 1.15;
    text-align: left; background: var(--cat-tinta, var(--superficie-2)); color: var(--cat-scuro, var(--testo)); font-weight: 700; }
  .ag-sev .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 2.5px; background: var(--cat, var(--spento)); border-radius: 3px; }
  .ag-sev span { display: block; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ag-sev.fatta { opacity: .55; }
  /* due o più accavallati nella settimana: un blocco solo con le barrette dei colori e quanti sono */
  .ag-sev.molti { background: var(--superficie-2); border: 1px solid var(--bordo); color: var(--testo-soft); display: flex; align-items: center; gap: 3px; padding: 2px 3px; }
  .ag-sev.molti .barre { display: flex; gap: 1px; align-self: stretch; padding: 1px 0; }
  .ag-sev.molti .barre i { width: 3px; border-radius: 2px; background: var(--cat, var(--spento)); }
  .ag-sev.molti b { font-size: 11px; }
  .ag-sett-vuoto { text-align: center; color: var(--testo-tenue); font-size: 13px; padding: 10px 0 2px; }
  /* il riassunto della settimana: quanti PM, quanti Follow Up… (il colore è quello del tipo di lavoro, --az-*) */
  .ag-conto { display: flex; flex-wrap: wrap; gap: 6px 10px; padding: 10px 4px 0; }
  .ag-conto span { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--testo-soft); }
  .ag-conto i { width: 8px; height: 8px; border-radius: 2px; background: var(--tinta, var(--spento)); }
  /* Pagina «Partner da avviare» (cantiere 31 lavoro 2) */
  .avv-partner { padding: 10px 14px 12px; }
  .avv-testa { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 0; background: none; padding: 2px 0; text-align: left; font-family: inherit; font-size: 16px; color: var(--testo); }
  .avv-testa small { display: block; color: var(--grigio); font-size: 13px; font-weight: 400; margin-top: 2px; }
  .avv-conta { font-weight: 700; flex: none; }
  .avv-passi { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 12px; font-size: 14px; color: var(--grigio); }
  .avv-passi .fatto { color: var(--testo); }
  .avv-passi button { border: 0; background: var(--sfondo); border-radius: 10px; padding: 8px 10px; text-align: left; font-family: inherit; font-size: 14px; color: var(--grigio); }
  .avv-sponsor { color: var(--grigio); font-weight: 400; font-size: 14px; }
  .avv-sponsor.tuo { color: var(--cat-partner); font-weight: 600; }
  .avv-proposte { margin-top: 12px; padding: 10px 12px; border-radius: var(--raggio-bottone); background: var(--proposta-tinta); color: var(--proposta); font-size: 14px; }
  .avv-proposte div { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; }
  .interruttore small.avvio-proposta { color: var(--proposta); }
  .avv-proposte .piccolo { margin: 0; background: var(--superficie); flex: none; }
  .avv-azioni { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 4px; }
  .ag-blocco.avv-pausa { color: var(--testo-soft); margin-top: 14px; }
  .ag-blocco.avv-come { margin: 0 0 12px; padding: 10px 14px; font-size: 14px; min-height: 52px; --richiamo: var(--az-contatto); --richiamo-tinta: var(--superficie-2); }
  .avv-come-testo ul { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.45; }
  .avv-come-testo li { margin: 5px 0; }
  .avv-partner.mio { border: 2px solid var(--cat-partner-tinta); }
  /* Cantiere 32: sotto il passo «Perché iniziare», in piccolo ma leggibile, le voci scelte nel benvenuto (percheHtml) */
  .avv-passi .largo { grid-column: 1 / -1; }
  /* Benvenuto per chi entra la prima volta (cantiere 32, pagina-benvenuto.js) */
  .bv { max-width: 440px; margin: 0 auto; padding-bottom: 24px; }
  .bv-testa { display: flex; justify-content: space-between; align-items: center; min-height: 44px; margin-bottom: 8px; }
  .bv-pallini { display: flex; gap: 6px; }
  .bv-pallini i { width: 8px; height: 8px; border-radius: 50%; background: var(--spento); }
  .bv-pallini i.fatto { background: var(--testo-tenue); }
  .bv-pallini i.qui { background: var(--accento); width: 22px; border-radius: 999px; }
  .bv-grande { font-size: 64px; text-align: center; margin: 7vh 0 8px; }
  .bv-s-benvenuto h1, .bv-s-benvenuto .bv-lead { text-align: center; }
  .bv h1 { font-size: 28px; line-height: 1.15; margin: 6px 0 12px; }
  .bv-lead { font-size: 19px; line-height: 1.4; margin: 8px 0 18px; }
  .bv-lead.piccolo-lead { font-size: 16px; color: var(--grigio); margin: 4px 0 14px; }
  .bv button.primario { margin-top: 6px; }   /* prende l'inchiostro come tutti gli altri bottoni grandi */
  .bv button.primario.bv-finito { background: var(--testo); }   /* diverso da «Aggiungi», che gli sta vicino */
  .bv-indietro { display: block; margin: 4px auto 0; }
  .bv-nomi { margin-top: 14px; }
  .bv-punti div, .bv-pagine div { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--linea); }
  .bv-punti div:first-child, .bv-pagine div:first-child { border-top: 0; }
  .bv-punti span, .bv-pagine span { font-size: 24px; line-height: 1.2; flex: none; width: 30px; text-align: center; }
  .bv-punti p, .bv-pagine p { margin: 0; font-size: 16px; line-height: 1.4; }
  .bv-voce { background: var(--card); border-radius: var(--raggio-riga); margin-bottom: 8px; box-shadow: var(--ombra-card); border: 2px solid transparent; }
  .bv-voce.scelta { border-color: var(--accento); }
  .bv-voce button { width: 100%; border: 0; background: none; text-align: left; font-family: inherit; font-size: 17px; font-weight: 600; color: var(--testo); padding: 14px; }
  .bv-voce button span { margin-right: 6px; }
  .bv-voce input { width: calc(100% - 28px); margin: 0 14px 12px; font-size: 16px; padding: 11px 12px; }
  .bv-nota { margin: 10px 2px 14px; }
  .bv-spunti { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .bv-spunti span { background: var(--superficie-2); color: var(--testo-soft); border-radius: 999px; padding: 5px 11px; font-size: 13px; }
  .bv-fatto { background: var(--ok-tinta); color: var(--ok); border-radius: var(--raggio-bottone); padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
  .bv-conto { text-align: center; font-weight: 700; margin: 4px 0 12px; }
  .bv-nomi div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--linea); font-size: 15px; }
  .bv-nomi div:first-child { border-top: 0; }
  .bv-nomi small { color: var(--grigio); flex: none; }
  .ag-blocco.bv-telefono { --richiamo: var(--az-contatto); --richiamo-tinta: var(--superficie-2); }
  .pf-perche { font-size: 15px; line-height: 1.45; color: var(--testo-soft); }
  .pf-perche span, .avv-perche span { display: block; margin-top: 5px; color: inherit; }
  .pf-perche span:first-child, .avv-perche span:first-child { margin-top: 0; }
  .pf-perche b, .avv-perche b { color: var(--testo); font-weight: 700; }
  .pf-box .avv-perche { font-size: 13px; margin-top: 4px; color: var(--testo-soft); }
  .pf-avvio .avv-testa small { font-size: 13px; margin-top: 2px; }
  .avv-perche, .interruttore small.avv-perche { display: block; margin-top: 4px; font-size: 13px; line-height: 1.4; font-weight: 400; color: var(--testo-soft); }
  .card.conferma .conf-testo { font-size: 14px; font-weight: 700; color: var(--ok); margin-top: 2px; }
  .card.conferma .conf-nr { font-size: 13px; color: var(--rosso); margin-top: 4px; }
  .card.riordino .rc-glide { color: var(--proposta); }
  .riga-coda .conf-nr { display: block; }
  .conf-bottoni { grid-template-columns: 1fr 1fr 1fr; }
  .conf-bottoni button:last-child:nth-child(odd) { grid-column: auto; }
  .ag-blocco.passati { --richiamo: var(--proposta); --richiamo-tinta: var(--proposta-tinta); }
  .ag-scelte { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
  .ag-scelte button { border: 1px solid var(--bordo); background: var(--superficie); border-radius: var(--raggio-pill); font-size: 14px; font-weight: 600; min-height: var(--pill-h); padding: 8px 14px; color: var(--testo); }
  .ag-scelte button.scelto { background: var(--accento); color: var(--accento-su); border-color: var(--accento); }
  .ag-due-campi { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }

  /* ── Report (Fase 5) ── */
  .rp-periodi { display: flex; gap: 6px; margin: 8px 0 10px; }
  .rp-periodi button { flex: 1; font-size: 15px; font-weight: 600; padding: 9px 0; border-radius: 999px; border: 1px solid var(--linea); background: var(--superficie); color: var(--testo); }
  .rp-periodi button.scelto { background: var(--testo); color: #fff; border-color: var(--testo); }
  .rp-naviga { display: flex; align-items: center; justify-content: space-between; background: var(--superficie); border-radius: var(--raggio-riga); padding: 4px; margin-bottom: 12px; box-shadow: var(--ombra-card); }
  .rp-naviga b { font-size: 16px; text-align: center; flex: 1; }
  .rp-naviga button { border: 0; background: none; font-size: 24px; color: var(--blu); padding: 4px 16px; }
  .rp-naviga button:disabled { color: var(--linea); }
  .rp-lista { background: var(--superficie); border-radius: var(--raggio-card); overflow: hidden; box-shadow: var(--ombra-card); margin-bottom: 12px; }
  .rp-riga { display: grid; grid-template-columns: 1fr 52px 48px 18px; align-items: center; gap: 4px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--linea);
    background: none; padding: 13px 12px 13px 14px; font-family: inherit; color: var(--testo); font-size: 16px; }
  .rp-riga:first-child { border-top: 0; }
  .rp-riga .n { text-align: right; font-weight: 800; font-size: 18px; }
  .rp-riga .p { text-align: right; font-size: 13px; color: var(--grigio); font-weight: 600; }
  .rp-riga .f { text-align: right; color: var(--grigio-chiaro); font-size: 18px; }
  /* Report aperto (cantiere 34, Ignazio 19/09: «adeguarli nello stile al resto dell'app»): il tipo aperto resta bianco e in grassetto; gli esiti hanno
     il numero in una pastiglia grigia; le persone sono righe come nella coda, con il tondo delle iniziali nel colore della categoria */
  .rp-riga { min-height: 52px; }
  .rp-riga.tipo { font-weight: 700; }
  .rp-riga.tipo.aperto { background: var(--superficie); border-bottom: 1px solid var(--bordo); }
  .rp-riga.esito { background: var(--superficie); padding-left: 28px; font-size: 15px; font-weight: 600; border-top-color: var(--superficie-2); }
  .rp-riga.esito .n { justify-self: end; min-width: 32px; padding: 3px 9px; border-radius: var(--raggio-pill); background: var(--sfondo); font-size: 14px; font-weight: 700; text-align: center; }
  .rp-riga.esito.verde { color: var(--ok); } .rp-riga.esito.verde .n { color: var(--ok); background: var(--ok-tinta); }
  .rp-riga.esito.zero, .rp-riga.esito.zero .n { color: var(--grigio-chiaro); }
  .rp-riga.nome { background: var(--superficie-2); padding: 8px 14px 8px 28px; font-size: 15px; font-weight: 600; grid-template-columns: 1fr auto 18px; border-top-color: var(--superficie); }
  .rp-riga.nome small { color: var(--testo-soft); font-size: 12px; font-weight: 400; }
  .rp-chi { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .rp-tondo { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--cat, var(--testo-tenue)); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 12.5px; font-weight: 600; }
  .rp-altre { background: var(--superficie); padding: 12px 14px 6px 28px; font-size: var(--dim-etichetta); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--testo-tenue); border-top: 1px solid var(--bordo); }
  .rp-grafico { background: var(--superficie); border-radius: var(--raggio-card); padding: 14px; box-shadow: var(--ombra-card); margin-bottom: 12px; }
  .rp-grafico h3 { margin: 0; font-size: 15px; }
  .rp-grafico .legenda { font-size: 12px; color: var(--grigio); margin: 2px 0 10px; }
  .rp-grafico .legenda i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 4px 0 8px; vertical-align: -1px; }
  .rp-barre { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; align-items: end; height: 120px; }
