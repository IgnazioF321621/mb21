<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MB21">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<title>MB21</title>
<style>
  :root {
    --sfondo: #F2F2F7; --card: #FFFFFF; --testo: #1C1C1E; --grigio: #6B7280; --grigio-chiaro: #9CA3AF;
    --linea: #E5E7EB; --blu: #2563EB; --coach: #8B5CF6; --verde: #059669; --rosso: #DC2626;
    --prospect: #F97316; --cliente: #3B82F6; --partner: #8B5CF6; --ex: #9CA3AF; --unlinked: #D1D5DB;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sfondo); color: var(--testo);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 16px) 16px 110px; }
  h1 { font-size: 32px; margin: 8px 0 2px; letter-spacing: -0.5px; }
  .sotto { color: var(--grigio); font-size: 14px; margin-bottom: 18px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--grigio); margin: 22px 4px 8px; }

  .card { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.04); }
  .strip { height: 4px; background: var(--unlinked); }
  .corpo { padding: 14px 16px 16px; }
  .nome { font-size: 17px; font-weight: 700; }
  .prof { font-size: 13px; color: var(--grigio); margin-top: 2px; }
  .luogo { font-size: 12px; color: var(--grigio-chiaro); margin-top: 2px; }
  .riga { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .tel { color: var(--blu); font-size: 16px; font-weight: 600; text-decoration: none; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #F3F4F6; color: #374151; }
  .badge.scaduto { background: #FEE2E2; color: var(--rosso); }
  .badge.new { background: #DCFCE7; color: #166534; }
  .badge.mb21 { background: #EDE9FE; color: #5B21B6; }
  .coach { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #F5F3FF; color: #5B21B6;
    font-size: 15px; font-weight: 600; line-height: 1.3; }
  .coach small { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--coach); margin-bottom: 2px; }

  .vuoto, .avviso { text-align: center; color: var(--grigio); padding: 28px 16px; font-size: 15px; }
  .avviso { background: #FFFBEB; color: #92400E; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }

  .accesso { max-width: 360px; margin: 12vh auto 0; }
  .accesso p { color: var(--grigio); font-size: 15px; }
  input { width: 100%; font-size: 17px; padding: 14px; border-radius: 12px; border: 1px solid var(--linea); background: #fff; margin: 6px 0 12px; }
  button.primario { width: 100%; font-size: 17px; font-weight: 600; padding: 14px; border: 0; border-radius: 12px; background: var(--testo); color: #fff; }
  button.primario:disabled { opacity: .5; }
  button.link { background: none; border: 0; color: var(--blu); font-size: 15px; padding: 10px 0; }
  .errore { color: var(--rosso); font-size: 14px; min-height: 20px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.92); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--linea); display: flex; justify-content: space-around;
    padding: 8px 0 calc(env(safe-area-inset-bottom) + 8px); }
  nav button { background: none; border: 0; font-size: 12px; font-weight: 600; color: var(--grigio-chiaro); padding: 6px 6px; }
  nav button[hidden] { display: none; }
  nav button.attiva { color: var(--testo); }
  .bottoni { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .bottoni button { font-size: 15px; font-weight: 600; padding: 12px 6px; border-radius: 12px; border: 0; background: #F3F4F6; color: var(--testo); }
  .bottoni button:active { transform: scale(.97); }
  .bottoni .appuntamento { background: #DCFCE7; color: #166534; }
  .bottoni .no { background: #FEF2F2; color: #991B1B; }
  .bottoni button:disabled { opacity: .45; }
  .bottoni button:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .card.compatta { margin-bottom: 8px; border-radius: 14px; }
  .riga-coda { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 36px 10px 14px; position: relative; font-family: inherit; color: var(--testo); }
  .riga-coda .rc-alto { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .riga-coda .nome { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .riga-coda .badge { flex: none; }
  .riga-coda .rc-glide { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: #1D4ED8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .riga-coda .rc-coach { display: block; margin-top: 3px; font-size: 13px; font-weight: 600; color: #6D28D9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .riga-coda .rc-freccia { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 20px; color: var(--grigio-chiaro); }
  .card.aperta .rc-coach { white-space: normal; }
  .card.aperta .corpo { padding-top: 0; }
  .card.via { opacity: 0; transform: translateX(40px); transition: all .25s ease; }

  .testa-coda { display: flex; align-items: center; justify-content: space-between; margin: 22px 4px 8px; }
  .testa-coda h2 { margin: 0; }
  .contatore { background: #fff; border: 1px solid var(--linea); border-radius: 999px; padding: 6px 12px;
    font-size: 13px; font-weight: 700; color: var(--testo); }
  .numeri { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 8px; }
  .numeri button { font-size: 20px; font-weight: 700; padding: 14px 0; border-radius: 12px; border: 0; background: #F3F4F6; color: var(--testo); }
  .numeri button.scelto { background: var(--testo); color: #fff; }

  .velo { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; z-index: 20; }
  .foglio { background: #fff; width: 100%; max-width: 520px; margin: 0 auto; border-radius: 20px 20px 0 0;
    padding: 20px 16px calc(env(safe-area-inset-bottom) + 20px); }
  .foglio h3 { margin: 0 0 4px; font-size: 20px; }
  .foglio p { margin: 0 0 12px; color: var(--grigio); font-size: 14px; }
  .foglio .due { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 78px); max-width: 488px; margin: 0 auto;
    background: #1C1C1E; color: #fff; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; font-size: 15px; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .toast button { background: none; border: 0; color: #FBBF24; font-size: 15px; font-weight: 700; padding: 4px 0; }

  /* ── Lista Nomi ── */
  .banner { background: #E5E7EB; border-radius: 12px; padding: 12px 14px; font-size: 15px; margin: 8px 0 12px; }
  .nuovo { width: 100%; font-size: 16px; font-weight: 600; padding: 13px; border: 0; border-radius: 12px; background: #334155; color: #fff; margin-bottom: 14px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; font-size: 14px; font-weight: 600; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--linea); background: #fff; color: var(--testo); }
  .chips button.scelto { background: var(--testo); color: #fff; border-color: var(--testo); }
  .cerca { margin: 10px 0 12px; position: relative; }
  .cerca input { margin: 0; padding-right: 40px; }
  .cerca button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; font-size: 20px; color: var(--grigio); padding: 6px 10px; }
  .cn { display: flex; background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 8px; height: 112px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .cn .striscia { width: 4px; flex: none; }
  .cn .dentro { flex: 1; min-width: 0; padding: 10px 6px 10px 12px; display: flex; flex-direction: column; justify-content: center; }
  .cn .etichetta { font-size: 11px; font-weight: 700; color: #1D4ED8; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 14px; }
  .cn .nome, .cn .prof { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cn .tel { font-size: 15px; margin-top: 4px; display: inline-block; min-height: 20px; }
  .cn .menu { flex: none; border: 0; background: none; font-size: 22px; color: var(--grigio); padding: 0 14px; align-self: flex-start; height: 44px; }
  .altri-voci button { display: block; width: 100%; text-align: left; font-size: 17px; padding: 14px 4px; border: 0; border-bottom: 1px solid var(--linea); background: none; color: var(--testo); }
  .altri-voci button.pericolo { color: var(--rosso); }

  .indietro { border: 0; background: none; color: var(--blu); font-size: 16px; padding: 6px 0; margin-top: 4px; }
  .testata { background: var(--card); border-radius: 16px; overflow: hidden; margin: 8px 0 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .testata .corpo { padding: 14px 16px 16px; }
  .testata .cat { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .testata h1 { font-size: 26px; margin: 2px 0; }
  .testata .alto { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .modifica { border: 0; border-radius: 10px; background: #334155; color: #fff; font-size: 14px; font-weight: 600; padding: 8px 12px; flex: none; }
  .contatta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .contatta a { text-align: center; text-decoration: none; background: #EEF2FF; color: #3730A3; font-size: 13px; font-weight: 600; padding: 10px 0; border-radius: 10px; }
  .contatta a.spento { opacity: .35; pointer-events: none; }
  .sezioni { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
  .sezioni button { flex: none; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 10px; border: 0; background: transparent; color: var(--grigio); }
  .sezioni button.scelto { background: #fff; color: var(--testo); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .riquadro { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .dati { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .dati small { display: block; font-size: 12px; color: var(--grigio); }
  .dati div { font-size: 15px; overflow-wrap: anywhere; }
  .fase { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 700; color: #1E3A8A; }
  .fase img, .fase .senza-icona { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: #E5E7EB; flex: none; }
  .piccolo { border: 0; border-radius: 10px; background: #F3F4F6; font-size: 14px; font-weight: 600; padding: 9px 14px; color: var(--testo); margin-bottom: 12px; }
  .azione { border-top: 1px solid #FDE68A; padding: 10px 0; }
  .azione:first-child { border-top: 0; }
  .azione .t { font-weight: 700; font-size: 15px; }
  .azione .s { font-size: 13px; color: #6B7280; }
  .azione .comandi { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .stato-az { font-size: 13px; color: var(--grigio); }
  .come-andata { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #FCD34D; font-size: 14px; font-weight: 700; color: var(--testo); }
  .come-andata small { font-weight: 400; color: var(--grigio); }
  .stato-az.fatto { color: #166534; }
  .arancio { background: #FEF3C7; border: 1px solid #F59E0B; border-radius: 14px; padding: 4px 14px; margin-bottom: 12px; }
  .interruttore { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--linea); }
  .interruttore:first-child { border-top: 0; }
  .interruttore small { display: block; color: var(--grigio); font-size: 12px; }
  .interruttore input { width: 50px; height: 30px; margin: 0; appearance: none; -webkit-appearance: none; background: #E5E7EB; border-radius: 999px; position: relative; border: 0; padding: 0; flex: none; transition: background .2s; }
  .interruttore input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; background: #fff; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .2s; }
  .interruttore input:checked { background: var(--verde); }
  .interruttore input:checked::after { left: 23px; }
  .barra { height: 8px; background: #E5E7EB; border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .barra div { height: 100%; background: var(--coach); }
  .nota { background: #FEF3C7; border: 1px solid #F59E0B; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; width: 100%; text-align: left; font-size: 15px; color: var(--testo); }
  .testo-nota { white-space: pre-wrap; font-size: 15px; line-height: 1.45; max-height: 60vh; overflow-y: auto; }

  .foglio.alto { max-height: 92vh; overflow-y: auto; }
  .foglio .testa-foglio { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .foglio .testa-foglio button { border: 0; background: none; font-size: 24px; color: var(--grigio); padding: 0 4px; }
  .campo { margin-bottom: 4px; }
  .campo label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }
  .campo label small { font-weight: 400; color: var(--grigio); }
  .campo input, .campo select, .campo textarea { width: 100%; font-size: 17px; padding: 12px; border-radius: 12px; border: 1px solid var(--linea); background: #F9FAFB; margin: 6px 0 2px; font-family: inherit; color: var(--testo); }
  .campo .conta { text-align: right; font-size: 11px; color: var(--grigio-chiaro); min-height: 14px; }
  .telefono-campo { display: flex; gap: 6px; }
  .telefono-campo select { width: 118px; flex: none; }

  /* ── Dashboard (Fase 3) ── */
  .partner-select { background: #111827; color: #fff; border-radius: 16px; padding: 12px 14px; margin: 8px 0 12px; }
  .partner-select small { display: block; font-size: 12px; font-weight: 700; color: #9CA3AF; margin-bottom: 6px; }
  .partner-select button { width: 100%; display: flex; justify-content: space-between; align-items: center; background: #1F2937; color: #fff;
    border: 1px solid #374151; border-radius: 12px; padding: 10px 12px; font-size: 16px; font-weight: 600; }
  .partner-select button span { font-size: 12px; color: #9CA3AF; font-weight: 600; }
  .partner-select.altro { background: #C2410C; }   /* dati di un altro partner: si scrive a nome suo */
  .partner-select.altro small, .partner-select.altro button span { color: #FFEDD5; }
  .partner-select.altro button { background: #9A3412; border-color: #FDBA74; }
  .banner-abb { display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 10px 16px; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .banner-abb.attivo { background: rgba(5,150,105,.1); border: 1.5px solid #10B981; color: var(--verde); }
  .banner-abb.scaduto { border-radius: 16px; display: block; background: #FEF2F2; border: 1.5px solid #FCA5A5; color: #B91C1C; padding: 12px 14px; }
  .banner-abb.scaduto small { display: block; font-weight: 400; font-size: 12px; color: #EF4444; }
  .banner-big { border-radius: 16px; background: #fff; border: 1.5px solid var(--linea); padding: 12px 14px; margin-bottom: 10px; font-size: 14px; }
  .banner-big.bbs { border-color: #93C5FD; background: #EFF6FF; }
  .banner-big.wes { border-color: #FCA5A5; background: #FEF2F2; }
  .banner-big.avvisi { border-color: #FDE68A; background: #FFFBEB; }
  .banner-big .riga button.link { padding: 6px 0; font-size: 14px; }
  .riga-avvisi { text-align: center; color: var(--grigio); font-size: 13px; margin-top: 6px; }
  .riga-avvisi button.link { font-size: 13px; padding: 4px 0; }
  .banner-big .riga { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .banner-big .riga .primario { width: auto; padding: 8px 14px; font-size: 14px; }
  .banner-big small { display: block; margin-top: 6px; color: var(--grigio); font-size: 12px; }
  .banner-abb.in-scadenza { background: #FFF7ED; border-color: #FDBA74; color: #C2410C; }
  .banner-abb.in-scadenza small { color: #EA580C; }
  .banner-abb.scaduto button { width: 100%; margin-top: 10px; border: 0; border-radius: 12px; background: var(--rosso); color: #fff; font-size: 15px; font-weight: 700; padding: 11px; }
  .banner-abb.in-scadenza button { background: #EA580C; }
  .banner-grande { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; font-family: inherit; }
  .banner-grande .ico { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; }
  .banner-grande b { display: block; font-size: 16px; }
  .banner-grande small { font-size: 12px; }
  .banner-grande .freccia { margin-left: auto; font-size: 22px; }
  .banner-grande.check { background: linear-gradient(135deg, #EFF6FF, #DBEAFE); border: 2px solid #3B82F6; color: #1D4ED8; }
  .banner-grande.check .ico { background: #3B82F6; }
  .banner-grande.obiettivi { background: #FEF2F2; border: 1.5px solid #FCA5A5; border-left: 5px solid var(--rosso); color: #991B1B; }
  .banner-grande.obiettivi .ico { background: #FEE2E2; }
  .schede-dash { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 12px; scrollbar-width: none; }
  .schede-dash::-webkit-scrollbar { display: none; }
  .schede-dash button { flex: none; font-size: 13px; font-weight: 600; padding: 7px 8px; border-radius: 10px; border: 0; background: transparent; color: var(--grigio); }
  .schede-dash button.scelto { background: #F3F4F6; color: var(--testo); }
  .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
  .kpi > div { min-width: 0; border: 1px solid var(--linea); border-radius: 14px; padding: 10px; background: #fff; }
  .kpi .t { font-size: 14px; font-weight: 600; }
  .kpi .v { font-size: clamp(19px, 5.6vw, 26px); white-space: nowrap; font-weight: 800; letter-spacing: -.5px; margin: 4px 0; }
  .kpi ul { margin: 6px 0 0; padding-left: 14px; font-size: 12px; line-height: 1.4; }
  .kpi .barra div { transition: width .4s ease; }
  .kpi .complimento { color: var(--verde); font-weight: 700; }
  .obiettivi-mod { display: block; margin: 8px auto 0; font-weight: 600; }
  .ob-modi { margin-bottom: 10px; }
  .ob-crescita { background: #F5F3FF; border-radius: 14px; padding: 12px 14px; margin-bottom: 6px; }
  .ob-crescita-testa { font-size: 15px; font-weight: 600; color: #5B21B6; }
  .ob-crescita-testa b { font-size: 20px; }
  .ob-crescita input[type=range] { width: 100%; margin: 10px 0 2px; padding: 0; border: 0; background: none; accent-color: var(--coach); height: 28px; }
  .ob-tacche { display: flex; justify-content: space-between; font-size: 11px; color: var(--grigio); }
  .ob-ambizioso { margin-top: 8px; font-size: 13px; font-weight: 600; color: #92400E; background: #FEF3C7; border-radius: 10px; padding: 8px 10px; }
  .ob-gruppo h4 { margin: 14px 0 6px; font-size: 15px; }
  .ob-campi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ob-campi label { font-size: 13px; font-weight: 600; color: var(--grigio); }
  .ob-campi input { margin: 4px 0 0; padding: 10px; font-size: 17px; }
  .visione { display: block; margin: 14px auto; border: 0; background: none; font-size: 15px; font-weight: 600; color: #334155; }
  .sv { background: #1F2937; color: #fff; border-radius: 16px; padding: 14px; margin: 16px 0 6px; }
  .sv h3 { margin: 0; font-size: 20px; }
  .sv .sotto-sv { font-size: 12px; color: #9CA3AF; margin: 2px 0 10px; }

<script>
const APP_VERSION = '2026.09.17 · 21:04';

const SUPABASE_URL = 'https://exwgjlhbhlgebkgxtanq.supabase.co';
// Chiave pubblica (anon/publishable): può stare nella pagina, i dati li proteggono le regole di accesso.
const SUPABASE_KEY = 'sb_publishable_i9kxRdnrgk2fvk71P3VV9g_GJA1-r26';

const COLORI = { 'Prospect': 'var(--prospect)', 'Cliente': 'var(--cliente)', 'Partner': 'var(--partner)',
  'Ex Partner/Cliente': 'var(--ex)', 'Archiviato': 'var(--ex)', 'Referral': 'var(--ex)', 'Unlinked': 'var(--unlinked)' };
const CHIAVE_CACHE = 'mb21_coda';

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const ST = { email: '', utente: null, tab: 'oggi' };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function versione() { return `<div class="versione">Versione ${APP_VERSION}</div>`; }
function dataEstesa(iso) {
  return new Date(iso + 'T12:00:00Z').toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
}

// supabase-js non lancia eccezioni sugli errori: si controlla sempre `error` (lezione di Zona Tracker).
async function dbq(cosa, promessa) {
  const res = await promessa;
  if (res.error) console.error('[MB21] ' + cosa, res.error);
  return res;
}

// ── Accesso ──────────────────────────────────────────────
function mostraEmail(errore) {
  document.getElementById('tab').hidden = true;
  app.innerHTML = `
    <div class="accesso">
      <h1>MB21</h1>
      <p>Entra con email e password.</p>
      <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="nome@email.it" value="${esc(ST.email)}">
      <input id="password" type="password" autocomplete="current-password" placeholder="password" style="margin-top:8px">
      <div class="errore">${esc(errore || '')}</div>
      <button class="primario" id="entra">Entra</button>
      <p style="margin-top:18px">Non hai la password? Scrivi solo l'email:</p>
      <button class="link" id="invia">Mandami il link</button>
      ${versione()}
    </div>`;
  document.getElementById('invia').onclick = inviaLink;
  document.getElementById('entra').onclick = entraConPassword;
  mostraPassword(app);
}

// Accesso con password (Ignazio 17/09: «dobbiamo essere rapidi»); funziona anche dentro l'app installata sull'iPhone
async function entraConPassword() {
  const btn = document.getElementById('entra');
  ST.email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  if (!ST.email.includes('@') || !password) return mostraEmail('Scrivi email e password.');
  btn.disabled = true; btn.textContent = 'Entro…';
  const { error } = await dbq('accesso con password', supa.auth.signInWithPassword({ email: ST.email, password }));
  if (error) return mostraEmail(/invalid login/i.test(error.message || '') ? 'Email o password sbagliate. Se non hai la password usa «Mandami il link».' : messaggioAccesso(error));
}

// Entrato con la password dal modulo ma non ancora approvato: resta dentro e aspetta (si apre la Dashboard appena approvato)
function mostraAttesa(sessione) {
  document.getElementById('tab').hidden = true;
  app.innerHTML = `<div class="accesso"><h1>Richiesta inviata ✅</h1>
    <p>Appena viene approvata entri direttamente: riapri l'app oppure premi il bottone qui sotto.</p>
    <button class="primario" id="at-controlla">Controlla di nuovo</button>
    <button class="link" id="at-esci">Esci</button>${versione()}</div>`;
  document.getElementById('at-controlla').onclick = () => { if (!accessoInCorso) { accessoInCorso = true; dopoAccesso(sessione).finally(() => { accessoInCorso = false; }); } };
  document.getElementById('at-esci').onclick = () => supa.auth.signOut();
}

// ── Registrazione con il link (cantiere 19, Ignazio 16/09) ──
// «…/mb21/?registrati» (con «&da=<id utente>» se arriva da chi invita): nasce una richiesta che approva l'Admin.
const REGISTRAZIONE = new URLSearchParams(location.search);
function mostraRegistrazione(esito) {
  document.getElementById('tab').hidden = true;
  const testi = { gia_utente: 'Questa email è già registrata: apri l\'app ed entra.', gia_richiesta: 'Hai già mandato la richiesta con questa email: aspetta l\'approvazione.',
    troppe: 'Troppe richieste in questo momento: riprova tra un\'ora.', password: 'La password deve avere almeno 8 caratteri.', dati: 'Controlla i dati: nome, email e codice Amway (solo numeri) sono obbligatori.' };
  if (esito === 'ok') {
    app.innerHTML = `<div class="accesso"><h1>Richiesta inviata ✅</h1>
      <p>Quando viene approvata, apri <b>${esc(location.origin + location.pathname)}</b> e scrivi la stessa email: ti arriva il link per entrare.</p>${versione()}</div>`;
    return;
  }
  app.innerHTML = `<div class="accesso">
    <h1>Registrati a MB21</h1>
    <p>Compila i dati: la richiesta viene controllata e approvata prima di poter entrare.</p>
    <label>Nome e cognome<input id="rg-nome" autocomplete="name"></label>
    <label>Email<input id="rg-email" type="email" autocomplete="email" inputmode="email" autocapitalize="off"></label>
    <label>Telefono<input id="rg-tel" type="tel" autocomplete="tel" inputmode="tel"></label>
    <label>Codice Amway<input id="rg-codice" inputmode="numeric" autocomplete="off"></label>
    <label>Scegli una password (almeno 8 caratteri)<input id="rg-password" type="password" autocomplete="new-password"></label>
    <div class="errore">${esc(testi[esito] || esito || '')}</div>
    <button class="primario" id="rg-invia">Invia la richiesta</button>
    <button class="link" id="rg-entra">Sono già registrato: entra</button>
    ${versione()}</div>`;
  document.getElementById('rg-entra').onclick = () => { history.replaceState(null, '', location.pathname); mostraEmail(); };
  mostraPassword(app);
  document.getElementById('rg-invia').onclick = async () => {
    const v = id => document.getElementById(id).value.trim();
    const codice = v('rg-codice').replace(/\s/g, '');
    const password = document.getElementById('rg-password').value;
    if (v('rg-nome').length < 3 || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('rg-email')) || !/^\d{3,15}$/.test(codice)) return mostraRegistrazione('dati');
    if (password.length < 8) return mostraRegistrazione('password');
    const b = document.getElementById('rg-invia'); b.disabled = true; b.textContent = 'Invio…';
    const da = /^[0-9a-f-]{36}$/.test(REGISTRAZIONE.get('da') || '') ? REGISTRAZIONE.get('da') : null;
    const { data, error } = await dbq('richiesta di registrazione', supa.rpc('richiedi_accesso',
      { p_nome: v('rg-nome'), p_email: v('rg-email'), p_telefono: v('rg-tel'), p_codice: codice, p_invitato_da: da }));
    if (error) { b.disabled = false; b.textContent = 'Invia la richiesta'; document.querySelector('.accesso .errore').textContent = 'Non inviata: controlla la connessione e riprova.'; return; }
    if (data !== 'ok') return mostraRegistrazione(data);
    // Account con password: si resta dentro in attesa (mostraAttesa). Se non riesce (es. email già con un account), vale il link dell'email
    history.replaceState(null, '', location.pathname);
    const iscr = await dbq('account con password', supa.auth.signUp({ email: v('rg-email').toLowerCase(), password, options: { data: { password_scelta: true } } }));
    if (!iscr.error && iscr.data.session) return;   // SIGNED_IN → dopoAccesso → mostraAttesa
    mostraRegistrazione('ok');
  };
}

// Piano gratuito di Supabase: il testo dell'email non si può cambiare, quindi arriva solo il link
// (niente codice a 6 cifre). Il link riapre questa pagina e supabase-js legge l'accesso da solo.
async function inviaLink() {
  const btn = document.getElementById('invia');
  ST.email = document.getElementById('email').value.trim().toLowerCase();
  if (!ST.email.includes('@')) return mostraEmail('Controlla l\'email.');
  btn.disabled = true; btn.textContent = 'Invio…';
  const { error } = await dbq('invio link', supa.auth.signInWithOtp({
    email: ST.email, options: { emailRedirectTo: location.origin + location.pathname } }));
  if (error) return mostraEmail(messaggioAccesso(error));
  app.innerHTML = `
    <div class="accesso">
      <h1>Controlla l'email</h1>
      <p>Abbiamo mandato un link a <b>${esc(ST.email)}</b>. Aprilo <b>su questo telefono</b>: ti riporta qui già dentro.</p>
      <button class="link" id="indietro">Cambia email</button>
    </div>`;
  document.getElementById('indietro').onclick = () => mostraEmail();
}

function messaggioAccesso(error) {
  const m = (error.message || '').toLowerCase();
  if (m.includes('database error') || m.includes('non abilitato') || m.includes('signups not allowed')) return 'Utente non abilitato.';
  if (m.includes('rate limit') || error.status === 429) return 'Troppi tentativi: riprova tra un\'ora.';
  return 'Non è andata: ' + error.message;
}

// Password scelta da chi è entrato (Ignazio 17/09: chi entra col link non ne ha una, e nell'app installata il link non arriva).
// Pagina web normale: uguale su iPhone, iPad, Android e computer; autocomplete="new-password" fa proporre al telefono di salvarla.
// primaVolta: foglio che compare dopo l'accesso a chi non l'ha ancora scelta (segno `password_scelta` sull'account), con «Più tardi».
// Occhio dentro ogni campo password (Ignazio 17/09: vederla mentre si scrive evita errori). Tocco: mostra / nasconde.
function mostraPassword(dove) {
  dove.querySelectorAll('input[type="password"]').forEach(campo => {
    const box = document.createElement('span');
    box.style.cssText = 'position:relative;display:block';
    box.style.margin = `${campo.style.marginTop || '6px'} 0 12px`; campo.style.margin = '0';   // il margine va fuori, così l'occhio resta al centro
    campo.parentNode.insertBefore(box, campo);
    box.appendChild(campo);
    campo.style.paddingRight = '48px';
    const occhio = document.createElement('button');
    occhio.type = 'button';
    occhio.textContent = '👁️';
    occhio.setAttribute('aria-label', 'Mostra la password');
    occhio.style.cssText = 'position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:20px;padding:8px;width:auto;margin:0;box-shadow:none';
    occhio.onclick = () => {
      const visibile = campo.type === 'password';
      campo.type = visibile ? 'text' : 'password';
      occhio.textContent = visibile ? '🙈' : '👁️';
      occhio.setAttribute('aria-label', visibile ? 'Nascondi la password' : 'Mostra la password');
    };
    box.appendChild(occhio);
  });
}

function foglioPassword(primaVolta) {
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `<div class="foglio"><h3>🔑 ${primaVolta ? 'Scegli la tua password' : 'Cambia password'}</h3>
    <p>${primaVolta ? 'Così la prossima volta entri con email e password, anche dall\'app installata sul telefono o sul tablet.' : 'Scrivi la nuova password due volte.'}</p>
    <input type="email" autocomplete="username" value="${esc(ST.emailAccount || ST.email || '')}" hidden>
    <label>Password (almeno 8 caratteri)<input id="pw-1" type="password" autocomplete="new-password"></label>
    <label>Ripeti la password<input id="pw-2" type="password" autocomplete="new-password"></label>
    <div class="errore" id="pw-errore"></div>
    <div class="due"><button class="link" id="pw-no">${primaVolta ? 'Più tardi' : 'Annulla'}</button><button class="primario" id="pw-si">Salva</button></div></div>`;
  document.body.appendChild(velo);
  const chiudi = () => velo.remove();
  velo.querySelector('#pw-no').onclick = chiudi;
  mostraPassword(velo);
  velo.querySelector('#pw-si').onclick = async () => {
    const p1 = velo.querySelector('#pw-1').value, p2 = velo.querySelector('#pw-2').value;
    const errore = velo.querySelector('#pw-errore');
    if (p1.length < 8) { errore.textContent = 'La password deve avere almeno 8 caratteri.'; return; }
    if (p1 !== p2) { errore.textContent = 'Le due password non sono uguali.'; return; }
    const btn = velo.querySelector('#pw-si'); btn.disabled = true; btn.textContent = 'Salvo…';
    const { error } = await dbq('scelta password', supa.auth.updateUser({ password: p1, data: { password_scelta: true } }));
    if (error) {
      btn.disabled = false; btn.textContent = 'Salva';
      // motivo vero dell'errore (Ignazio 17/09: «controlla la connessione» compariva anche con la connessione attiva)
      const m = error.message || '', c = error.code || '';
      errore.textContent = c === 'same_password' || /different from the old/i.test(m) ? 'È la password che hai già: scegline una diversa, oppure premi Annulla e continua a usare quella.'
        : c === 'weak_password' || /weak|at least/i.test(m) ? 'Password troppo semplice: allungala o aggiungi numeri e simboli.'
        : !navigator.onLine ? 'Sei offline: riprova quando c\'è connessione.'
        : /session|jwt|expired|not authenticated/i.test(m) ? 'Accesso scaduto: esci, rientra e riprova.'
        : 'Non salvata: ' + m;
      return;
    }
    chiudi();
    mostraToast('Password salvata: da ora entri con email e password');
  };
}

async function dopoAccesso(sessione) {
  ST.emailAccount = sessione.user.email;   // per il foglio della password (i telefoni la salvano con l'email)
  await dbq('collega account', supa.rpc('collega_account'));   // primo accesso col link dell'email: collega l'account all'utente
  const { data, error } = await dbq('lettura utente',
    supa.from('utenti').select('id, nome, nome_cognome, ruolo, abbonamento_scadenza, partner_id, accesso_attivo').eq('auth_id', sessione.user.id).maybeSingle());
  if (error && !navigator.onLine) { ST.utente = {}; return mostraTab(); }   // offline: si prova con la cache
  if (!data && !error) {   // entrato con la password del modulo: richiesta ancora da approvare
    const { data: stato } = await dbq('stato della richiesta', supa.rpc('mia_richiesta'));
    if (stato === 'in_attesa') return mostraAttesa(sessione);
  }
  if (!data || !data.accesso_attivo) {   // accesso tolto dall'Admin (pagina Admin → Utenti): esce anche chi era già entrato
    ST.motivoUscita = 'Utente non abilitato.';
    return supa.auth.signOut();   // → SIGNED_OUT mostra il motivo
  }
  ST.utente = data;
  await controllaAbbonamento();
  dbq('ultimo utilizzo', supa.rpc('segna_uso'));   // per «ultimo utilizzo» in Admin → Utenti; se non riesce non blocca
  await caricaPersone();
  // Toccando un avviso push «…/?apri=check» (o «agenda») si apre direttamente quella pagina (cantiere 24)
  const apri = REGISTRAZIONE.get('apri');
  if (['check', 'agenda'].includes(apri) && !limitato()) {
    ST.tab = apri;
    if (apri === 'agenda') { AG.giorno = REGISTRAZIONE.get('giorno') || null; AG.aperta = REGISTRAZIONE.get('azione') || null; }   // «&azione=<id>»: l'appuntamento dell'avviso si apre già aperto (con «&giorno=AAAA-MM-GG» se non è di oggi)
    history.replaceState(null, '', location.pathname);
  }
  mostraTab();
  if (!(sessione.user.user_metadata || {}).password_scelta) foglioPassword(true);
}

// ── PARTNER SELECT (cantiere 15, decisioni di Ignazio 15/09) ──
// Solo Admin. La scelta vale in Dashboard, Lista Nomi, Report e Check finché non si cambia (in Agenda no).
// Nel menu: gli utenti con `nel_partner_select`, più «Tutti» (somma). Dal lavoro 3: con un altro partner l'Admin
// vede tutto (anche coda e Agenda) e modifica a nome suo (riquadro arancione), tranne gli esiti della coda.
// Con «Tutti» si guarda soltanto: ogni modifica avvisa di scegliere un partner (in Agenda si modifica come prima).
const PS = { persone: [], scelto: null };   // scelto: null = sé stesso · id di utenti · 'tutti'

async function caricaPersone() {
  PS.persone = []; PS.scelto = null;
  if (!eAdmin()) return;
  const { data, error } = await dbq('Partner Select', supa.from('utenti')
    .select('id, nome, nome_cognome, abbonamento_scadenza, partner_id, ruolo').eq('nel_partner_select', true));
  if (error) return;
  PS.persone = data.sort((a, b) => (a.id === ST.utente.id ? -1 : b.id === ST.utente.id ? 1 : nomeDi(a).localeCompare(nomeDi(b), 'it')));
}
const nomeDi = p => String(p.nome_cognome || p.nome || '').trim();
const vediTutti = () => PS.scelto === 'tutti';
const guardoAltri = () => !!PS.scelto;
const visto = () => (PS.scelto && !vediTutti() && PS.persone.find(p => p.id === PS.scelto)) || ST.utente;   // con «Tutti»: sé stesso, non usarlo
const idVisti = () => (vediTutti() ? PS.persone.map(p => p.id) : [visto().id]);
const nomeVisto = () => (vediTutti() ? 'Tutti' : nomeDi(visto()));
const aNome = () => (guardoAltri() && !vediTutti() ? ` · ${nomeDi(visto())}` : '');   // nei titoli dei fogli: a nome di chi si scrive

function soloGuardo() {
  if (!vediTutti() || ST.tab === 'agenda') return false;
  mostraToast('Con «Tutti» si guarda soltanto: scegli un partner per modificare');
  return true;
}
function partnerSelect() {
  if (!eAdmin() || !PS.persone.length) return '';
  const nota = vediTutti() ? '👁️ solo lettura ' : guardoAltri() ? '✏️ modifiche a suo nome ' : '';
  return `<div class="partner-select ${guardoAltri() && !vediTutti() ? 'altro' : ''}"><small>Partner Select</small>
    <button id="ps-scegli">${esc(nomeVisto())}<span>${nota}▾</span></button></div>`;
}
function collegaPartnerSelect() {
  const b = document.getElementById('ps-scegli');
  if (b) b.onclick = scegliPartner;
}
async function scegliPartner() {

const TAB_SCADUTO = ['oggi', 'lista'];
const limitato = () => !!ST.scaduto;

async function controllaAbbonamento() {
  if (!ST.utente || !ST.utente.id || ST.utente.ruolo === 'Admin') { ST.scaduto = false; return; }

function aggiornaTab() {

  });
}

function mostraTab() {
  const nav = document.getElementById('tab');
  nav.hidden = false;
  if (ST.tab === 'admin' && !eAdmin()) ST.tab = 'oggi';

// ── OGGI / DASHBOARD ── la pagina è in pagina-dashboard.js; qui resta l'avviso in basso usato da tutte le pagine
let timerToast;
function mostraToast(testo, suAnnulla) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  clearTimeout(timerToast);
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${esc(testo)}</span>${suAnnulla ? '<button>Annulla</button>' : ''}`;
  if (suAnnulla) t.querySelector('button').onclick = () => { t.remove(); clearTimeout(timerToast); suAnnulla(); };
  document.body.appendChild(t);
  timerToast = setTimeout(() => t.remove(), suAnnulla ? 6000 : 3500);
}

// ── AGENDA (Fase 4) ──────────────────────────────────────
// Giornata a linea del tempo (brief Fase 4): striscia di 7 giorni, appuntamenti del giorno in ordine d'ora,
// telefonate del giorno, appuntamenti passati senza esito, [+] nuovo appuntamento. Logica pura in agenda.js.
// Appuntamenti = righe di `azioni` con tipo ≠ Contatto (per data inizio) + Contatti con data scelta (dalla coda).
const AG = { giorno: null, settimana: [], azioni: [], passati: [], aperta: null, telefonate: null };


async function apriAgenda(giorno) {
  AG.giorno = giorno || AG.giorno || MB21Coda.oggiRoma();
  if (!document.querySelector('.ag-settimana')) app.innerHTML = `<h1>Agenda</h1><div class="vuoto">Carico l'agenda…</div>`;
  try { await caricaAgenda(); }
  catch (e) {
    app.innerHTML = `<h1>Agenda</h1><div class="avviso">Non riesco a caricare l'agenda. Controlla la connessione e riprova.</div>${versione()}`;
    return;
  }
  disegnaAgenda();
}

async function caricaAgenda() {
  const A = MB21Agenda;
  AG.settimana = A.settimana(AG.giorno);
  const da = A.isoDaRoma(AG.settimana[0], '00:00'), a = A.isoDaRoma(A.spostaGiorno(AG.settimana[6], 1), '00:00');
  const oggi = MB21Coda.oggiRoma(), adesso = new Date().toISOString();
  const ids = idVisti();   // Partner Select (lavoro 3): il partner scelto, o tutti
  const richieste = [
    dbq('agenda appuntamenti', supa.from('azioni').select(CAMPI_AZIONE).in('user_id', ids).neq('tipo_azione', 'Contatto').gte('inizio', da).lt('inizio', a)),
    // Contatti: richiami/appuntamenti dati dalla coda (data scelta) e telefonate programmate dall'Agenda (non completate)
    dbq('agenda contatti', supa.from('azioni').select(CAMPI_AZIONE).in('user_id', ids).eq('tipo_azione', 'Contatto')
      .or(`and(data_scelta.gte."${da}",data_scelta.lt."${a}"),and(data_scelta.is.null,completata.eq.false,inizio.gte."${da}",inizio.lt."${a}")`)),
    dbq('agenda senza esito', supa.from('azioni').select(CAMPI_AZIONE).in('user_id', ids).neq('tipo_azione', 'Contatto').eq('completata', false).lt('inizio', adesso).order('inizio', { ascending: false }).limit(50)),
  ];
  const conferme = AG.giorno === oggi ? caricaConferme() : null;
  if (vediTutti()) { /* telefonate e rientri sono di un partner */ }
  else if (AG.giorno === oggi) richieste.push(dbq('stato di oggi', supa.rpc('stato_oggi', guardoAltri() ? { p_utente: visto().id } : {})));
  else if (AG.giorno > oggi) richieste.push(dbq('rientri del giorno', supa.from('contatti_coda').select('id', { count: 'exact', head: true }).eq('user_id', visto().id).eq('rientro_il', AG.giorno)));
  const [app1, ric, pas, tel] = await Promise.all(richieste);
  await conferme;
  for (const r of [app1, ric, pas, tel]) if (r && r.error) throw r.error;
  AG.azioni = MB21Agenda.senzaDoppioniCoda([...app1.data, ...ric.data]);
  AG.passati = pas.data;
  await aggiungiPortatoDa([...AG.azioni, ...AG.passati]);
  AG.telefonate = !tel ? null : AG.giorno === oggi ? { oggi: true, ...tel.data } : { oggi: false, rientri: tel.count || 0 };
}

function disegnaAgenda() {
  const A = MB21Agenda, oggi = MB21Coda.oggiRoma();
  const conEventi = A.giorniConEventi(AG.azioni);
  const eventi = A.eventiDelGiorno(AG.azioni, AG.giorno);
  const opz = { mioId: vediTutti() ? null : visto().id, admin: eAdmin() };   // con «Tutti» il nome del partner su ogni riga
  const titoloGiorno = new Date(AG.giorno + 'T12:00:00Z').toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
  let html = `
    <div class="ag-testa"><h1>Agenda</h1>
      ${AG.giorno !== oggi ? '<button class="ag-oggi" id="ag-oggi">Oggi</button>' : ''}
      <button class="ag-piu" id="ag-nuovo" aria-label="Nuovo appuntamento">+</button></div>
    ${partnerSelect()}
    <button class="ag-mese">${esc(A.titoloMese(AG.giorno))} ▾<input type="date" id="ag-scegli" value="${AG.giorno}"></button>
    <div class="ag-settimana">
      <button class="freccia" id="ag-prima" aria-label="Settimana prima">‹</button>
      ${AG.settimana.map((g, i) => `<button class="ag-giorno ${g === AG.giorno ? 'scelto' : ''} ${g === oggi ? 'oggi' : ''}" data-giorno="${g}">
        <small>${A.GIORNI[i]}</small><b>${Number(g.slice(8))}</b><i class="${conEventi.has(g) ? 'si' : ''}"></i></button>`).join('')}
      <button class="freccia" id="ag-dopo" aria-label="Settimana dopo">›</button>
    </div>
    <div class="sotto">${esc(titoloGiorno)}</div>`;
  html += eventi.length ? eventi.map(e => eventoAgenda(e, opz)).join('')
    : `<div class="vuoto">Nessun appuntamento. Tocca <b>+</b> per fissarne uno.</div>`;
  const t = AG.telefonate;
  if (t && t.oggi) html += `<button class="ag-blocco telefonate" id="ag-telefonate"><span>📞 Telefonate del giorno · Fatte ${t.fatti_oggi} di ${t.contatti_al_giorno}</span><span>›</span></button>`;
  else if (t && t.rientri) html += `<button class="ag-blocco telefonate" id="ag-telefonate"><span>📞 ${t.rientri} ${t.rientri === 1 ? 'contatto rientra' : 'contatti rientrano'} in coda</span><span>›</span></button>`;
  if (AG.giorno === oggi && CONF.righe.length) html += `<button class="ag-blocco conferme" id="ag-conferme"><span>📅 ${CONF.righe.length} ${CONF.righe.length === 1 ? 'conferma' : 'conferme'} da fare</span><span>›</span></button>`;
  if (AG.passati.length) html += `<button class="ag-blocco passati" id="ag-passati"><span>⚠️ ${AG.passati.length} ${AG.passati.length === 1 ? 'appuntamento passato' : 'appuntamenti passati'} senza esito</span><span>›</span></button>`;
  app.innerHTML = html + versione();
  collegaAgenda(eventi);
}

  const A = MB21Agenda;
  const su = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };

  su('ag-prima', () => apriAgenda(A.spostaGiorno(AG.giorno, -7)));

  collegaPartnerSelect();
  su('ag-nuovo', () => (vediTutti() ? mostraToast('Con «Tutti» scegli prima il partner nel Partner Select') : nuovoAppuntamento({ giorno: AG.giorno })));
  su('ag-telefonate', () => { ST.tab = 'oggi'; mostraTab(); });

    collegaEsiti(el, e, { nome: e.contatti ? e.contatti.nome : '', categoria: e.contatti ? e.contatti.categoria : e.categoria }, () => apriAgenda());
    el.querySelectorAll('[data-cmd]').forEach(b => {
      b.onclick = () => {

        if (b.dataset.cmd === 'modifica') return foglioAzione(e.id, { ritorno: null, dopo: () => apriAgenda() });
        if (b.dataset.cmd === 'elimina') return eliminaAppuntamento(e);
        if (b.dataset.cmd === 'contatto') return apriContattoDa(e.contatto_id);

async function apriContattoDa(id, ritorno) {

  }

// Esito di un appuntamento (decisione C: poi si chiede sempre il prossimo, con «Salta»)
// ── Esito di un'azione: stesso blocco in Agenda e nella scheda contatto (Ignazio 17/09: «il modulo deve essere uguale
// in tutte le parti, altrimenti ci si confonde come su Glide») ──
// I passi li decide MB21Agenda.passiEsito: «È avvenuto?» (Fatto · Rimandato · No Show) per Piano Marketing e Follow Up,
// poi «Com'è andata?» con i risultati; un passo solo per gli altri tipi; azione già chiusa → «Esito · tocca per cambiarlo».
// Fatto del PM = fase «Presentazione» (chiudi_appuntamento senza «prossimo appuntamento»); del Follow Up = apre solo il secondo passo.
const daChiudere = MB21Agenda.daChiudere;
const FATTO_APERTO = new Set();   // Follow Up con «Fatto» toccato, in attesa del risultato (solo a video)
// Azione già chiusa: il blocco resta chiuso (si vede solo l'esito nella riga) e si apre con «Cambia esito ›» (Ignazio 17/09)
function bloccoEsiti(a, categoria, aperto = false) {
  const gruppi = MB21Agenda.passiEsito(a, categoria, FATTO_APERTO.has(a.id));
  if (!gruppi) return '';
  const chiusa = gruppi.every(p => p.passo.startsWith('cambia'));
  const dentro = chiusa && !aperto
    ? `<button class="link" data-apri-esiti style="padding:4px 0;font-size:13px">Cambia esito ›</button>`
    : gruppi.map(p => `<div class="come-andata">${esc(p.titolo)}${p.passo.startsWith('cambia') ? ' <small>· tocca per cambiare</small>' : ''}</div>
    <div class="ag-esiti" data-azione="${esc(a.id)}" data-passo="${p.passo}">${p.bottoni.map(f => `<button data-esito="${esc(f)}" class="${p.attuale === f ? 'attuale' : ''}">${esc(f)}</button>`).join('')}</div>`).join('');
  return `<div class="blocco-esiti" data-blocco="${esc(a.id)}">${dentro}</div>`;
}
// Stato scritto accanto all'azione
function statoAzione(a) {
  if (!a.completata && !a.esito) return '<span class="stato-az">⏳ Da completare</span>';
  return a.esito === MB21Agenda.fattoDi(a.tipo_azione) ? '<span class="stato-az fatto">✅ Fatto · risultato da dare</span>' : '<span class="stato-az fatto">✅ Completato</span>';
}
// Collega i bottoni del blocco dentro `el`; `dopo()` ridisegna chi l'ha aperto
function collegaEsiti(el, a, contatto, dopo) {
  const apri = el.querySelector('[data-apri-esiti]');
  if (apri) apri.onclick = () => {   // si apre sul posto, senza ricaricare
    const blocco = apri.closest('.blocco-esiti');
    blocco.outerHTML = bloccoEsiti(a, contatto.categoria, true);
    collegaEsiti(el.querySelector(`.blocco-esiti[data-blocco="${a.id}"]`) || el, a, contatto, dopo);
  };
  el.querySelectorAll('.ag-esiti[data-azione] [data-esito]').forEach(b => b.onclick = () => {
    if (soloGuardo() || b.classList.contains('attuale')) return;
    const passo = b.closest('.ag-esiti').dataset.passo, esito = b.dataset.esito;
    const e = { ...a, categoria: a.categoria || contatto.categoria, contatti: { nome: contatto.nome, categoria: contatto.categoria } };
    const fase = MB21Agenda.fattoDi(a.tipo_azione);
    if (passo === 'avvenuto' && esito === 'Fatto') {
      if (fase) return chiudiAppuntamento(e, fase, { dopo, senzaProssimo: true, testo: 'Fatto' });   // PM: «Presentazione», poi il risultato
      FATTO_APERTO.add(a.id); return dopo();                                                       // Follow Up: si passa al risultato
    }
    if (passo === 'cambia-avvenuto' && esito === 'Fatto') {   // era Rimandato / No Show: torna «fatto», poi il risultato
      if (!fase) FATTO_APERTO.add(a.id);
      return cambiaEsito(a, fase, dopo, 'Fatto');
    }
    FATTO_APERTO.delete(a.id);
    if (passo.startsWith('cambia')) return cambiaEsito(a, esito, dopo);
    chiudiAppuntamento(e, esito, { dopo });
  });
}
async function cambiaEsito(a, esito, dopo, testo) {
  const { data: prima, error } = await dbq('cambia esito', supa.rpc('modifica_azione', {
    p_azione: a.id, p_contatto: a.contatto_id, p_portato_da: a.portato_da || null, p_modalita: a.modalita || null, p_esito: esito || null,
    p_inizio: a.inizio, p_fine: a.fine || null, p_ospite: a.ospite || null, p_note: a.note || null }));
  if (error) return mostraToast('Non salvato: controlla la connessione e riprova.');
  await dopo();
  mostraToast(`Esito: ${testo || esito}${prima.rientro_cambiato ? ' · coda aggiornata' : ''}`, async () => {
    const { error: e3 } = await dbq('annulla cambio esito', supa.rpc('annulla_modifica_azione', { p_prima: prima }));
    if (e3) return mostraToast('Annullamento non riuscito: riprova.');
    await dopo();
    mostraToast('Annullato');
  });
}

// opz.dopo(): cosa ridisegnare dopo (predefinito: l'Agenda; dalla scheda contatto, la scheda) · senzaProssimo: niente «Fissa il prossimo appuntamento» · testo: parola dell'avviso
async function chiudiAppuntamento(e, esito, opz = {}) {
  const ridisegna = opz.dopo || apriAgenda;
  const { data: prima, error } = await dbq('chiudi appuntamento', supa.rpc('chiudi_appuntamento', { p_azione: e.id, p_esito: esito }));
  if (error) return mostraToast('Non salvato: controlla la connessione e riprova.');
  const annulla = async creato => {
    const { error: e2 } = await dbq('riapri appuntamento', supa.rpc('riapri_appuntamento', {
      p_azione: e.id, p_esito: prima.esito_prec, p_completata: prima.completata_prec, p_contatto: prima.contatto_id,
      p_rientro: prima.rientro_prec, p_in_coda: prima.in_coda_prec, p_rientro_cambiato: prima.rientro_cambiato }));
    if (!e2 && creato) await dbq('annulla prossimo', supa.from('azioni').delete().eq('id', creato.id));
    if (e2) return mostraToast('Annullamento non riuscito: riprova.');
    await ridisegna();
    mostraToast('Annullato');
  };
  AG.aperta = null;
  if (MB21Agenda.chiudeRelazione(esito)) {   // No Interesse / No BuonFine: niente prossimo appuntamento, «Quando risentirlo?»
    const giorno = await chiediRientro(e.contatto_id, e.contatti ? e.contatti.nome : '', esito);
    await ridisegna();
    return mostraToast(`${esito}${giorno ? ' · risentirlo il ' + dataBreve(giorno) : ' salvato'}`, () => annulla(null));
  }
  const creato = opz.senzaProssimo ? null : await nuovoAppuntamento({
    titolo: `${esito} · ${e.contatti ? e.contatti.nome : ''}`, sottotitolo: 'Fissa il prossimo appuntamento', salta: true,
    giorno: MB21Agenda.spostaGiorno(MB21Coda.oggiRoma(), 1),
    contatto: { id: e.contatto_id, ...e.contatti }, tipo: e.tipo_azione, modalita: e.modalita, area: e.area, userId: e.user_id,
  });
  await ridisegna();
  mostraToast(creato ? `${esito} · prossimo appuntamento fissato` : `${opz.testo || esito} salvato`, () => annulla(creato));
}

// Sposta un appuntamento (inizio/fine) o un esito dalla coda (data_scelta). `dopo(giorno)`: cosa ridisegnare
// (predefinito: l'Agenda su quel giorno). Spostando, la conferma torna da fare.
function spostaAppuntamento(e, dopo) {
  const A = MB21Agenda;
  const dallaCoda = e.tipo_azione === 'Contatto' && !!e.data_scelta;
  const quando = dallaCoda ? e.data_scelta : e.inizio;
  const { giorno, ora } = A.partiRoma(quando);
  const durata = !dallaCoda && e.fine ? (Date.parse(e.fine) - Date.parse(e.inizio)) : 0;
  dopo = dopo || (async g => { AG.aperta = e.id; await apriAgenda(g); });
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `<div class="foglio"><h3>🕑 Sposta</h3><p>${esc(A.riga(e, { mioId: ST.utente.id, admin: false }).titolo)}</p>
    <div class="ag-due-campi"><input id="sp-giorno" type="date" value="${giorno}"><input id="sp-ora" type="time" value="${ora}"></div>
    <div class="due"><button class="link" id="sp-no">Annulla</button><button class="primario" id="sp-si">Sposta</button></div></div>`;
  document.body.appendChild(velo);
  velo.onclick = ev => { if (ev.target === velo) velo.remove(); };
  velo.querySelector('#sp-no').onclick = () => velo.remove();
  velo.querySelector('#sp-si').onclick = async () => {
    const g = velo.querySelector('#sp-giorno').value, o = velo.querySelector('#sp-ora').value;
    if (!g || !o) return;
    if (A.controllaGiorno(g)) return mostraToast(A.controllaGiorno(g));
    const nuovaData = A.isoDaRoma(g, o);
    const nuovo = dallaCoda ? { data_scelta: nuovaData, confermato_il: null }
      : { inizio: nuovaData, fine: durata ? new Date(Date.parse(nuovaData) + durata).toISOString() : null, confermato_il: null };
    const prima = dallaCoda ? { data_scelta: e.data_scelta, confermato_il: e.confermato_il || null }
      : { inizio: e.inizio, fine: e.fine, confermato_il: e.confermato_il || null };
    velo.remove();
    const { error } = await dbq('sposta appuntamento', supa.from('azioni').update(nuovo).eq('id', e.id));
    if (error) return mostraToast('Non spostato: controlla la connessione e riprova.');
    await dopo(g);
    mostraToast(`Spostato a ${g.split('-').reverse().join('/')} ${o}`, async () => {
      await dbq('annulla sposta', supa.from('azioni').update(prima).eq('id', e.id));
      await dopo(giorno);
    });
  };
}

// Elimina un'azione (Agenda e scheda contatto, stesso codice; `dopo()` ridisegna chi l'ha aperto). Avviso con Annulla che la rimette.
async function eliminaAppuntamento(e, dopo) {
  const ridisegna = dopo || apriAgenda;
  if (!await chiediConferma('Eliminare questa azione?', `${e.tipo_azione || 'Azione'}${e.modalita ? ' · ' + e.modalita : ''}${e.esito ? ' · ' + e.esito : ''}`, 'Elimina', true)) return;   // conferma dell'app, non confirm(): in Arc/Claude non compariva (Ignazio 17/09)
  const { error } = await dbq('elimina azione', supa.from('azioni').delete().eq('id', e.id));
  if (error) return mostraToast('Non eliminata: controlla la connessione e riprova.');
  AG.aperta = null;
  await ridisegna();
  const copia = { ...e };
  for (const k of ['quando', 'contatti', 'utenti', 'chiave', 'portatoNome']) delete copia[k];
  mostraToast('Azione eliminata', async () => {
    await dbq('ripristina azione', supa.from('azioni').insert(copia));
    await ridisegna();
  });
}

let contattiMiei = null;   // per l'elenco del nuovo appuntamento: solo i nomi del partner scelto (Partner Select; «Tutti» = sé stesso)
async function leggiContattiMiei() {
  if (contattiMiei) return contattiMiei;
  const righe = [];
  for (let da = 0; ; da += 1000) {
    const { data, error } = await dbq('contatti per appuntamento', supa.from('contatti').select('id, nome, categoria')
      .eq('user_id', visto().id).neq('categoria', 'Archiviato').order('nome').range(da, da + 999));
    if (error) throw error;
    righe.push(...data);
    if (data.length < 1000) break;
  }
  return (contattiMiei = righe);
}

// Foglio «Nuovo appuntamento» (lavoro 4). Restituisce l'id creato o null.
// opz: { giorno, ora, contatto:{id,nome,categoria}, categoria, tipo, modalita, area, titolo, sottotitolo, salta, resta, userId }
// Restituisce { id, inizio } o null. `salta`: il bottone in basso dice «Salta»; `salta`/`resta`: non si va in Agenda dopo il salvataggio.
async function nuovoAppuntamento(opz = {}) {
  const A = MB21Agenda;
  let elenco = [];
  if (!opz.contatto) {
    try { elenco = await leggiContattiMiei(); } catch (e) { mostraToast('Contatti non caricati: riprova.'); return null; }
  }
  const st = {
    contatto: opz.contatto || null, categoria: opz.categoria || (opz.contatto ? opz.contatto.categoria : null), categoriaToccata: false,
    area: opz.area && ['Attività', 'Prodotti'].includes(opz.area) ? opz.area : 'Attività',
    tipo: opz.tipo || null, modalita: opz.tipo ? opz.modalita : null, durata: 60, portato: null,
  };
  if (st.tipo && !A.tipiPer(st.categoria).includes(st.tipo)) { st.tipo = null; st.modalita = null; }
  const eventiGiorno = A.eventiDelGiorno(AG.azioni, opz.giorno || MB21Coda.oggiRoma());
  const oraIniziale = opz.ora || A.oraProposta(eventiGiorno, opz.giorno || MB21Coda.oggiRoma(), new Date().toISOString());
  return new Promise(risolvi => {
    const velo = document.createElement('div');
    velo.className = 'velo';
    velo.innerHTML = `<div class="foglio alto">
      <div class="testa-foglio"><h3>${esc(opz.titolo || 'Nuovo appuntamento')}</h3><button id="na-x" aria-label="Chiudi">×</button></div>
      ${opz.sottotitolo ? `<p>${esc(opz.sottotitolo)}</p>` : ''}
      <div id="na-corpo"></div>
      <div class="errore" id="na-errore"></div>
      <div class="due"><button class="link" id="na-no">${opz.salta ? 'Salta' : 'Annulla'}</button><button class="primario" id="na-si">Salva</button></div></div>`;
    document.body.appendChild(velo);
    const chiudi = valore => { velo.remove(); risolvi(valore); };
    velo.querySelector('#na-x').onclick = () => chiudi(null);
    velo.querySelector('#na-no').onclick = () => chiudi(null);
    const campi = { giorno: opz.giorno || MB21Coda.oggiRoma(), ora: oraIniziale, ospite: '', note: '' };
    const scelte = (nome, voci, attuale, etichette) => `<div class="ag-scelte" data-scelta="${nome}">${voci.map((v, i) =>
      `<button data-v="${esc(v)}" class="${String(v) === String(attuale) ? 'scelto' : ''}">${esc(etichette ? etichette[i] : v)}</button>`).join('')}</div>`;
    const leggiCampi = () => { for (const k of ['giorno', 'ora', 'ospite', 'note']) { const el = velo.querySelector('#na-' + k); if (el) campi[k] = el.value; } };
    function disegna() {
      const tipi = A.tipiPer(st.categoria);
      let h = '';
      h += st.contatto && opz.contatto
        ? `<div class="campo"><label>Contatto <small>l'esito è suo</small></label><div class="fa-persona"><span>${esc(st.contatto.nome)}</span>
            ${st.portato ? '' : '<button class="link" id="na-porta">⇄ Porta qualcuno</button>'}</div></div>`
        : `<div class="campo"><label>Contatto <small>${st.contatto ? 'l\'esito è suo' : 'Obbligatorio'}</small></label>
            <div class="fa-persona"><input id="na-contatto" list="na-nomi" placeholder="Scrivi il nome" value="${esc(st.contatto ? st.contatto.nome : '')}" autocomplete="off" style="flex:1">
            ${st.contatto && !st.portato ? '<button class="link" id="na-porta">⇄ Porta qualcuno</button>' : ''}</div>
            <datalist id="na-nomi">${elenco.map(c => `<option value="${esc(c.nome)}">`).join('')}</datalist></div>`;
      if (st.contatto) {
        const categorie = st.categoria && !A.CATEGORIE.includes(st.categoria) ? [st.categoria, ...A.CATEGORIE] : A.CATEGORIE;   // Ex, Unlinked…: resta com'è, o si cambia
        h += `<div class="campo"><label>Categoria <small>dal contatto</small></label>${scelte('categoria', categorie, st.categoria)}
          ${!tipi.length ? '<div class="errore">Il contatto non ha una categoria: scegli Prospect, Partner o Cliente.</div>' : ''}</div>`;
      }
      if (tipi.length) {
        h += `<div class="campo"><label>Area</label>${scelte('area', ['Attività', 'Prodotti'], st.area)}</div>`;
        h += `<div class="campo"><label>Tipo di azione <small>Obbligatorio</small></label>${scelte('tipo', tipi, st.tipo)}</div>`;
      }
      if (st.tipo) {
        h += `<div class="campo"><label>${esc(A.etichettaSottotipo(st.tipo))} <small>Obbligatorio</small></label>${scelte('modalita', A.sottotipiPer(st.tipo), st.modalita)}</div>`;
        h += `<div class="campo"><label>Giorno e ora <small>Obbligatorio</small></label><div class="ag-due-campi">
          <input id="na-giorno" type="date" value="${esc(campi.giorno)}"><input id="na-ora" type="time" value="${esc(campi.ora)}"></div></div>`;
        h += `<div class="campo"><label>Durata</label>${scelte('durata', A.DURATE.map(d => d[0]), st.durata, A.DURATE.map(d => d[1]))}</div>`;
        h += `<div class="campo"><label>Portato da</label><div class="fa-persona"><span>${st.portato ? esc(st.portato.nome) : '<span style="color:var(--grigio)">nessuno</span>'}</span>
          ${st.portato ? '<button class="link" id="na-togli-portato" aria-label="Togli">×</button>' : '<button class="link" id="na-portato">＋ Scegli</button>'}</div></div>`;
        h += `<div class="campo"><label>Note</label><input id="na-note" maxlength="100" placeholder="Scrivi qualcosa da ricordare" value="${esc(campi.note)}"></div>`;
      }
      velo.querySelector('#na-corpo').innerHTML = h;
      const bp = velo.querySelector('#na-portato'), tp = velo.querySelector('#na-togli-portato');
      if (bp) bp.onclick = async () => { leggiCampi(); const c = await sceltaContatto('Portato da', '', st.contatto ? [st.contatto.id] : []); if (c) { st.portato = c; disegna(); } };
      if (tp) tp.onclick = () => { leggiCampi(); st.portato = null; disegna(); };
      // Dalla scheda o dall'Agenda (Ignazio 17/09, in entrambe le direzioni): è questa persona che porta qualcuno → l'azione va sull'ospite, lei diventa «Portato da»
      const porta = velo.querySelector('#na-porta');
      if (porta) porta.onclick = async () => {
        leggiCampi();
        const g = await sceltaContatto(`Chi porta ${st.contatto.nome}?`, '', [st.contatto.id]);
        if (!g) return;
        st.portato = st.contatto; st.contatto = g; st.categoria = g.categoria; st.categoriaToccata = false;
        if (!A.tipiPer(st.categoria).includes(st.tipo)) { st.tipo = null; st.modalita = null; }
        disegna();
      };
      const inp = velo.querySelector('#na-contatto');
      if (inp) inp.onchange = () => {
        const trovato = elenco.find(c => c.nome.toLowerCase() === inp.value.trim().toLowerCase());
        st.contatto = trovato || null; st.categoria = trovato ? trovato.categoria : null;
        if (!A.tipiPer(st.categoria).includes(st.tipo)) { st.tipo = null; st.modalita = null; }
        leggiCampi(); disegna();
      };
      velo.querySelectorAll('[data-scelta]').forEach(g => g.querySelectorAll('button').forEach(b => {
        b.onclick = () => {
          leggiCampi();
          const nome = g.dataset.scelta, v = b.dataset.v;
          if (nome === 'durata') st.durata = Number(v);
          else st[nome] = v;
          if (nome === 'categoria') st.categoriaToccata = true;
          if (nome === 'categoria' && !A.tipiPer(v).includes(st.tipo)) { st.tipo = null; st.modalita = null; }
          if (nome === 'tipo') st.modalita = null;
          disegna();
        };
      }));
    }
    disegna();
    velo.querySelector('#na-si').onclick = async () => {
      leggiCampi();
      const v = { contatto_id: st.contatto && st.contatto.id, categoria: st.categoria, area: st.area, tipo_azione: st.tipo, modalita: st.modalita,
        giorno: campi.giorno, ora: campi.ora, ospite: A.conOspite(st.tipo) ? campi.ospite.trim() : '', note: campi.note.trim() };
      const errore = A.validaAppuntamento(v);
      if (errore) { velo.querySelector('#na-errore').textContent = errore; return; }
      const inizio = A.isoDaRoma(v.giorno, v.ora);
      const riga = { contatto_id: v.contatto_id, user_id: opz.userId || visto().id, categoria: v.categoria, tipo_azione: v.tipo_azione,
        modalita: v.modalita, area: v.area, inizio, fine: new Date(Date.parse(inizio) + st.durata * 60000).toISOString(),
        completata: false, portato_da: st.portato && st.portato.id !== v.contatto_id ? st.portato.id : null, note: v.note || null };
      const btn = velo.querySelector('#na-si');
      btn.disabled = true; btn.textContent = 'Salvo…';
      if (st.categoriaToccata && st.contatto.categoria !== v.categoria) {   // come in Glide la categoria scelta vale per il contatto
        const { error: ec } = await dbq('categoria contatto', supa.from('contatti').update({ categoria: v.categoria }).eq('id', v.contatto_id));
        if (ec) { btn.disabled = false; btn.textContent = 'Salva'; velo.querySelector('#na-errore').textContent = 'Non salvato: riprova.'; return; }
        contattiMiei = null; LS.righe = [];
        if (v.categoria === 'Partner') setTimeout(() => domandaInvito({ ...st.contatto, user_id: riga.user_id }), 400);
      }
      const { data, error } = await dbq('nuovo appuntamento', supa.from('azioni').insert(riga).select('id').single());
      if (error) { btn.disabled = false; btn.textContent = 'Salva'; velo.querySelector('#na-errore').textContent = 'Non salvato: controlla la connessione e riprova.'; return; }
      chiudi({ id: data.id, inizio });
      if (!opz.salta && !opz.resta) {
        AG.aperta = data.id;
        await apriAgenda(v.giorno);
        mostraToast('Appuntamento fissato', async () => {
          await dbq('annulla nuovo', supa.from('azioni').delete().eq('id', data.id));
          await apriAgenda();
        });
      }
    };
  });
}
