// ── Foglio unico «Modifica azione» (decisioni di Ignazio 15/09) ──────────
// Stesso foglio da Report, Griglia PM, scheda contatto e Agenda: contatto, portato da, sottotipo, esito, giorno e ora, note.
// Serve a correggere un passo (per andare avanti si chiude con l'esito e se ne apre uno nuovo).
// Scelte da MB21Agenda.sceltePerModifica: un tipo nuovo aggiunto in agenda.js compare anche qui.
// L'azione è di chi ascolta; chi l'ha portato va in «Portato da». Le vecchie azioni con l'ospite scritto a mano
// si spostano sull'ospite con «L'esito è dell'ospite» (il contatto di prima diventa «Portato da»).
// Coda: se è l'ultima azione del contatto e cambia l'esito o il contatto, il rientro si ricalcola (modifica_azione). Avviso con Annulla.
// opz: { dopo() → ridisegna chi l'ha aperto, ritorno: 'report' | 'griglia' per «Apri contatto» (senza = niente bottone) }
async function foglioAzione(id, opz = {}) {
  if (soloGuardo()) return;
  const { data: a, error } = await dbq('azione da modificare', supa.from('azioni')
    .select('id, contatto_id, portato_da, categoria, tipo_azione, modalita, esito, inizio, fine, data_scelta, ospite, note, contatti(nome, categoria)').eq('id', id).maybeSingle());
  if (error || !a) return mostraToast('Azione non trovata: riprova.');
  let portato = null;
  if (a.portato_da) {
    const { data } = await dbq('portato da', supa.from('contatti').select('id, nome, categoria').eq('id', a.portato_da).maybeSingle());
    portato = data || { id: a.portato_da, nome: '—' };
  }
  const A = MB21Agenda, s = A.sceltePerModifica(a);
  // cantiere 37: qui si può cambiare anche quanto dura (prima si poteva solo quando si fissava)
  const duraOra = a.inizio && a.fine && Date.parse(a.fine) > Date.parse(a.inizio) ? Math.round((Date.parse(a.fine) - Date.parse(a.inizio)) / 60000) : 0;
  const { giorno, ora } = a.inizio ? A.partiRoma(a.inizio) : { giorno: MB21Coda.oggiRoma(), ora: '18:30' };
  const st = { contatto: { id: a.contatto_id, ...(a.contatti || { nome: '—' }) }, portato, ospite: a.ospite, sottotipo: a.modalita, esito: a.esito };
  // Esito dato dalla coda con un giorno scelto (Richiamare, PM Fissato…; cantiere 39): «Giorno e ora» è quando la telefonata è stata
  // FATTA, il giorno scelto sta in un campo suo. Prima c'era un campo solo e chi voleva spostare il richiamo spostava la telefonata.
  const dallaCoda = a.tipo_azione === 'Contatto' && !!a.data_scelta;
  const scelta = dallaCoda ? A.partiRoma(a.data_scelta) : null;
  const velo = document.createElement('div');
  velo.className = 'velo';
  // forma del modulo contatto (cantiere 34, Ignazio 19/09): in testa la persona, gruppi «Tipo ed esito» e «Data e note», Annulla · Salva fermi in fondo
  velo.innerHTML = `<div class="foglio alto mc">
    <div class="mc-testa ${classeCat(a.contatti && a.contatti.categoria)}"><span class="ts-pastiglia">${esc(iniziali(st.contatto.nome))}</span>
      <div><small>${esc(a.tipo_azione || 'Azione')}</small><b>${esc(st.contatto.nome)}</b></div><button id="fa-x" aria-label="Chiudi">${ic('chiudi')}</button></div>
    <div class="riquadro mc-g" style="margin-top:14px"><div id="fa-persone"></div></div>
    <h4 class="mc-t">Tipo ed esito</h4><div class="riquadro mc-g">
    ${s.sottotipi.length ? `<div class="campo"><label>${esc(A.etichettaSottotipo(a.tipo_azione))}</label><div class="ag-scelte" id="fa-sottotipi">${s.sottotipi.map(x => `<button data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>` : ''}
    <div class="campo"><label id="fa-esito-titolo">Esito</label><div id="fa-esiti"></div><div class="sotto" id="fa-esito-nota" style="margin:4px 0 0"></div></div>
    </div><h4 class="mc-t">Data e note</h4><div class="riquadro mc-g">
    <div class="campo"><label>${dallaCoda ? 'Telefonata fatta il' : 'Giorno e ora'}</label><div class="ag-due-campi"><input type="date" id="fa-giorno" value="${giorno}"><input type="time" id="fa-ora" value="${ora}"></div></div>
    ${dallaCoda ? `<div class="campo"><label id="fa-scelta-titolo"></label><div class="ag-due-campi"><input type="date" id="fa-scelta-giorno" value="${scelta.giorno}"><input type="time" id="fa-scelta-ora" value="${scelta.ora}"></div><div class="sotto" style="margin:4px 0 0">È il giorno in cui lo vedi in Agenda.</div></div>` : ''}
    ${duraOra ? `<div class="campo"><label>Finisce alle</label><input type="time" id="fa-fine" value="${A.daMinuti(Math.min(1440, A.inMinuti(ora) + duraOra))}"></div>` : ''}
    <div id="fa-avviso"></div>
    <div class="campo"><label>Note</label><textarea id="fa-note" rows="2" maxlength="${Math.max(100, (a.note || '').length)}">${esc(a.note || '')}</textarea></div>
    </div>
    <div class="errore" id="fa-errore"></div>
    <div class="mc-fondo">${opz.ritorno ? '<button class="link" id="fa-contatto">' + ic('persona') + ' Apri contatto</button>' : '<button class="link" id="fa-no">Annulla</button>'}
      <button class="primario" id="fa-si">Salva</button></div>
  </div>`;
  document.body.appendChild(velo);
  const $ = x => velo.querySelector('#' + x);
  const chiudi = () => velo.remove();
  velo.onclick = e => { if (e.target === velo) chiudi(); };
  $('fa-x').onclick = chiudi;
  if ($('fa-no')) $('fa-no').onclick = chiudi;
  if ($('fa-contatto')) $('fa-contatto').onclick = () => { chiudi(); apriContattoDa(st.contatto.id, opz.ritorno); };
  const disegnaPersone = () => {
    const riga = (etichetta, persona, cmd, extra = '') => `<div class="campo"><label>${etichetta}</label>
      <div class="fa-persona"><span>${persona}</span>${cmd}</div>${extra}</div>`;
    let h = riga('Contatto <small>l\'esito è suo</small>', esc(st.contatto.nome), '<button class="link" data-cmd="contatto">Cambia</button>');
    if (s.ospite) {
      // con l'ospite scritto a mano e l'azione ancora sul contatto sbagliato, «Portato da» non serve: prima si sposta
      if (st.ospite && !st.portato) h += riga('Ospite <small>scritto a mano</small>', esc(st.ospite), '',
        `<button class="piccolo fa-ospite" data-cmd="ospite">${ic('squadra')} L'esito è dell'ospite</button>`);
      else h += riga('Portato da', st.portato ? esc(st.portato.nome) : '<span style="color:var(--grigio)">nessuno</span>',
        st.portato ? '<button class="link" data-cmd="togli" aria-label="Togli">' + ic('chiudi') + '</button>' : '<button class="link" data-cmd="portato">＋ Scegli</button>');
    }
    $('fa-persone').innerHTML = h;
    $('fa-persone').querySelectorAll('[data-cmd]').forEach(b => b.onclick = async () => {
      const cmd = b.dataset.cmd;
      if (cmd === 'togli') { st.portato = null; return disegnaPersone(); }
      const scelto = await sceltaContatto(cmd === 'ospite' ? 'Chi è l\'ospite?' : cmd === 'portato' ? 'Portato da' : 'Contatto',
        cmd === 'ospite' ? st.ospite : '', [st.contatto.id]);
      if (!scelto) return;
      if (cmd === 'ospite') { st.portato = st.contatto; st.contatto = scelto; st.ospite = null; }
      else if (cmd === 'portato') st.portato = scelto;
      else st.contatto = scelto;
      disegnaPersone();
    });
  };
  const disegnaScelte = () => {   // gli esiti di Appuntamento cambiano col sottotipo
    // Piano Marketing e Follow Up: gli stessi passi di Agenda e scheda (Ignazio 17/09, dalla Griglia PM: «seguire il flusso che stiamo creando»)
    const stato = { ...a, modalita: st.sottotipo, esito: st.esito, completata: !!st.esito, data_scelta: null };
    const gruppi = A.RISULTATI[a.tipo_azione] ? A.passiEsito(stato, a.contatti ? a.contatti.categoria : null, st.fattoAperto)
      : [{ passo: 'cambia', titolo: 'Esito', bottoni: A.sceltePerModifica(stato).esiti, attuale: st.esito }];
    $('fa-esito-titolo').textContent = gruppi.length === 1 ? gruppi[0].titolo : '';
    $('fa-esito-nota').textContent = gruppi.some(g => g.passo === 'risultato') ? (st.esito ? `${st.esito}: fatto, risultato da dare` : 'Fatto: scegli il risultato') : '';
    $('fa-esiti').innerHTML = gruppi.map((g, i) => `${gruppi.length > 1 ? `<div class="come-andata" style="border:0;margin-top:${i ? 8 : 0}px;padding:0">${esc(g.titolo)}</div>` : ''}
      <div class="ag-scelte" data-passo="${g.passo}">${bottoniEsiti(g.bottoni, g.attuale, 'data-v', 'scelto')}</div>`).join('');
    $('fa-esiti').querySelectorAll('button').forEach(b => b.onclick = () => {
      const x = b.dataset.v, fase = A.fattoDi(a.tipo_azione);
      if (x === 'Fatto') { st.esito = fase; st.fattoAperto = !fase; }
      else { st.esito = x; st.fattoAperto = false; }
      disegnaScelte();
    });
    velo.querySelectorAll('#fa-sottotipi button').forEach(b => b.classList.toggle('scelto', b.dataset.v === st.sottotipo));
    if (dallaCoda) $('fa-scelta-titolo').textContent = st.esito === 'Richiamare' ? 'Da richiamare il' : A.ESITI_CON_GIORNO.includes(st.esito) ? 'Appuntamento il' : 'Giorno scelto';
  };
  velo.querySelectorAll('#fa-sottotipi button').forEach(b => b.onclick = () => { st.sottotipo = b.dataset.v; disegnaScelte(); });
  disegnaPersone();
  disegnaScelte();
  const duraScelta = () => {
    if (!duraOra || !$('fa-fine')) return duraOra;
    const d = A.inMinuti($('fa-fine').value) - A.inMinuti($('fa-ora').value);
    return d > 0 ? d : 0;
  };
  const avvisaFa = () => {
    $('fa-avviso').innerHTML = avvisoSovrapposti($('fa-giorno').value, $('fa-ora').value, duraScelta() || A.durataPredefinita(a.tipo_azione), a.id, a.user_id);
    $('fa-avviso').querySelectorAll('.ag-orelibere button').forEach(b => b.onclick = () => {
      const quanto = duraScelta();
      $('fa-ora').value = b.dataset.ora;
      if ($('fa-fine')) $('fa-fine').value = A.daMinuti(Math.min(1440, A.inMinuti(b.dataset.ora) + (quanto || duraOra)));
      avvisaFa();
    });
  };
  legaInizioFine($('fa-ora'), $('fa-fine'));
  for (const k of ['fa-giorno', 'fa-ora', 'fa-fine']) { const el = $(k); if (el) el.onchange = avvisaFa; }
  avvisaFa();
  $('fa-si').onclick = async () => {
    if (!$('fa-giorno').value || !$('fa-ora').value) { $('fa-errore').textContent = 'Scegli giorno e ora.'; return; }
    if (A.controllaGiorno($('fa-giorno').value)) { $('fa-errore').textContent = A.controllaGiorno($('fa-giorno').value); return; }
    if (st.portato && st.portato.id === st.contatto.id) { $('fa-errore').textContent = 'Contatto e «Portato da» sono la stessa persona.'; return; }
    const inizio = A.isoDaRoma($('fa-giorno').value, $('fa-ora').value);
    if (duraOra && !duraScelta()) { $('fa-errore').textContent = 'L\'ora di fine deve venire dopo quella di inizio.'; return; }
    const fine = duraOra ? new Date(Date.parse(inizio) + duraScelta() * 60000).toISOString() : a.fine;   // la durata scelta qui (prima: sempre la stessa)
    // Il giorno scelto (cantiere 39, Ignazio 21/09: «l'app chiede»): con un esito che non lo porta più con sé (No Interesse…)
    // si chiede se toglierlo dall'Agenda. Prima restava lì per sempre, e il contatto rientrava in coda nel giorno vecchio.
    let dataScelta = null;
    if (dallaCoda) {
      if (!$('fa-scelta-giorno').value || !$('fa-scelta-ora').value) { $('fa-errore').textContent = 'Scegli il giorno e l\'ora.'; return; }
      if (A.controllaGiorno($('fa-scelta-giorno').value)) { $('fa-errore').textContent = A.controllaGiorno($('fa-scelta-giorno').value); return; }
      dataScelta = A.isoDaRoma($('fa-scelta-giorno').value, $('fa-scelta-ora').value);
      if (st.esito && !A.ESITI_CON_GIORNO.includes(st.esito)
        && await chiediConferma(`Tolgo dall'Agenda il giorno scelto?`, `${st.contatto.nome} è in Agenda ${dataLunga($('fa-scelta-giorno').value)}. Con «${st.esito}» di solito non serve più.`, 'Sì, togli', false, '', 'No, lascialo in Agenda')) dataScelta = null;
    }
    $('fa-si').disabled = true;
    const { data: prima, error: e2 } = await dbq('modifica azione', supa.rpc('modifica_azione', {
      p_azione: a.id, p_contatto: st.contatto.id, p_portato_da: st.portato ? st.portato.id : null,
      p_modalita: st.sottotipo || null, p_esito: st.esito || null, p_inizio: inizio, p_fine: fine || null,
      p_ospite: st.ospite || null, p_note: $('fa-note').value.trim() || null,
      ...(dallaCoda ? { p_cambia_scelta: true, p_data_scelta: dataScelta } : {}) }));
    if (e2) { $('fa-si').disabled = false; $('fa-errore').textContent = 'Non salvato: controlla la connessione e riprova.'; return; }
    chiudi();
    LS.righe = [];   // la Lista si ricarica: fase e coda possono essere cambiate
    if (opz.dopo) await opz.dopo();
    mostraToast(`Azione modificata${prima.rientro_cambiato ? ' · coda aggiornata' : ''}`, async () => {
      const { error: e3 } = await dbq('annulla modifica', supa.rpc('annulla_modifica_azione', { p_prima: prima }));
      if (e3) return mostraToast('Annullamento non riuscito: riprova.');
      LS.righe = [];
      if (opz.dopo) await opz.dopo();
      mostraToast('Annullato');
    });
  };
}

// Scelta di un contatto tra i propri (ricerca come la Lista) o «＋ Aggiungi» come Prospect. Restituisce {id, nome, categoria} o null.
async function sceltaContatto(titolo, testo = '', escludi = [], motivo = 'è già il contatto') {
  let elenco;
  try { elenco = await leggiContattiMiei(); } catch (e) { mostraToast('Contatti non caricati: riprova.'); return null; }
  return new Promise(risolvi => {
    const velo = document.createElement('div');
    velo.className = 'velo';
    velo.style.zIndex = 25;   // sopra il foglio Modifica azione
    velo.innerHTML = `<div class="foglio alto mc">
      <div class="mc-testa"><span class="ts-pastiglia">${ic('cerca')}</span>
        <div><small>Scegli dalla tua lista</small><b>${esc(titolo)}</b></div>
        <button id="sc-x" aria-label="Chiudi">${ic('chiudi')}</button></div>
      <div class="riquadro mc-g" style="margin-top:14px">
        <div class="campo"><label>Chi</label><input id="sc-testo" placeholder="Scrivi il nome" value="${esc(testo)}" autocomplete="off"></div>
        <div class="altri-voci" id="sc-elenco"></div></div></div>`;
    document.body.appendChild(velo);
    const chiudi = v => { velo.remove(); risolvi(v); };
    velo.onclick = e => { if (e.target === velo) chiudi(null); };
    velo.querySelector('#sc-x').onclick = () => chiudi(null);
    const inp = velo.querySelector('#sc-testo');
    const disegna = () => {
      const t = inp.value.trim();
      const trovati = t ? elenco.filter(c => MB21Lista.corrisponde(c, t)).slice(0, 20) : [];
      const uguale = trovati.some(c => MB21Lista.piega(c.nome) === MB21Lista.piega(t));
      velo.querySelector('#sc-elenco').innerHTML = trovati.map(c => escludi.includes(c.id)
          ? `<button disabled>${esc(c.nome)} <small style="color:var(--grigio)">· ${esc(motivo)}</small></button>`
          : `<button data-id="${esc(c.id)}">${esc(c.nome)} <small style="color:var(--grigio)">· ${esc(c.categoria || 'Senza categoria')}</small></button>`).join('')
        + (t && !uguale ? `<button data-nuovo="1">${ic('piu')} Non c'è: aggiungi «${esc(t)}» come Prospect</button>` : '');
      velo.querySelectorAll('[data-id]').forEach(b => b.onclick = () => chiudi(elenco.find(c => c.id === b.dataset.id)));
      const n = velo.querySelector('[data-nuovo]');
      if (n) n.onclick = async () => {
        n.disabled = true;
        const { data, error } = await dbq('nuovo contatto', supa.from('contatti').insert({ nome: t, categoria: 'Prospect', user_id: visto().id }).select('id, nome, categoria').single());
        if (error) { n.disabled = false; return mostraToast('Non salvato: riprova.'); }
        contattiMiei = null; LS.righe = [];
        mostraToast(`${t} aggiunto alla Lista`);
        chiudi(data);
      };
    };
    inp.oninput = disegna;
    disegna();
    inp.focus();
  });
}

// ── CHECK (Fase 6) ───────────────────────────────────────
// Brief docs/MB21_v4_Brief_F6_Check.md: si apre dal bottone «visione completa» della Dashboard (decisione A), periodi Mese · Wes · Anno,
// adesso · prima (a pari giorni) · andamento, riga grigia col periodo prima intero (B), grafico dei 12 mesi, Segni Vitali a 12 mesi (C).
// Numeri del partner loggato. Calcoli in check.js.
// ── Gli ultimi 12 mesi (Ignazio 25/09: «alla fine di una lunga lista… la griglia nera è dispersa in fondo»,
// «sempre la possibilità di selezionare gli utenti»): un posto solo per lo storico dei Segni Vitali, con due
// porte — la striscia in Dashboard e la riga in cima al Check. Dentro: chi guardi, la griglia dei 12 mesi e,
// per l'Admin, tutte le linee con il flusso a barrette e il cambiamento sul mese prima.
const SL = { dati: null, tipo: 'bbs', chi: null, segniAl: undefined };
const TIPI_SL = [['bbs', 'BBS'], ['wes', 'WES'], ['cep', 'CEP']];

async function caricaStorico() {
  if (SL.dati) return SL.dati;
  // tutte le persone che si possono guardare e l'albero Amway: servono per il ramo (niente crossline).
  // Chi non è Admin vede solo sé stesso, anche perché i check degli altri non li legge (RLS)
  let persone = [{ id: ST.utente.id, nome: nomeDi(ST.utente), partner_id: ST.utente.partner_id }], squadra = [], volumi = [];
  if (eAdmin()) {
    const [ut, alb] = await Promise.all([
      dbq('persone dello storico', supa.from('utenti').select('id, nome, nome_cognome, partner_id').is('eliminato_il', null)),
      caricaAlberoMappa(),
    ]);
    if (ut.error) throw ut.error;
    squadra = alb.squadra || []; volumi = alb.volumi || [];
    if (ut.data && ut.data.length) persone = ut.data.map(p => ({ id: p.id, nome: nomeDi(p), partner_id: p.partner_id }));
  }
  persone.sort((a, b) => (a.id === ST.utente.id ? -1 : b.id === ST.utente.id ? 1 : a.nome.localeCompare(b.nome, 'it')));
  const ids = persone.map(p => p.id), giorni = [];
  for (let da = 0; ; da += 1000) {
    const { data, error } = await dbq('storico dei check', supa.from('check_giorni_conti').select(CAMPI_CK)
      .in('user_id', ids).order('id').range(da, da + 999));
    if (error) throw error;
    giorni.push(...data);
    if (data.length < 1000) break;
  }
  const { data: ob, error } = await dbq('storico degli obiettivi', supa.from('obiettivi_mese').select('*').in('user_id', ids));
  if (error) throw error;
  if (SL.segniAl === undefined) SL.segniAl = CK.segniAl !== undefined ? CK.segniAl : await calcolatoreSegni();
  SL.dati = { giorni, obiettivi: ob, persone, squadra, volumi };
  return SL.dati;
}

async function foglioStorico() {
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `<div class="foglio alto mc">
    <div class="mc-testa"><span class="ts-pastiglia" style="background:var(--gr-segni)">${ic('segnivitali')}</span>
      <div><small>Il flusso e i cambiamenti</small><b>Gli ultimi 12 mesi</b></div>
      <button id="sl-x" aria-label="Chiudi">${ic('chiudi')}</button></div>
    <div id="sl-corpo"><div class="vuoto">Carico i numeri…</div></div></div>`;
  document.body.appendChild(velo);
  velo.querySelector('#sl-x').onclick = () => velo.remove();
  let dati;
  try { dati = await caricaStorico(); } catch (e) {
    velo.querySelector('#sl-corpo').innerHTML = `<div class="avviso">Non riesco a caricare lo storico. Controlla la connessione e riprova.</div>`;
    return;
  }
  if (!SL.chi || !dati.persone.some(p => p.id === SL.chi)) SL.chi = (visto() || ST.utente).id;
  disegnaStorico(velo, dati);
}

function disegnaStorico(velo, dati) {
  const C = MB21Check, D = MB21Dashboard, oggi = MB21Coda.oggiRoma();
  // Una linea per codice Amway (Ignazio 25/09): la coppia è un partner solo, col nome di Amway, e somma i due
  const tutte = MB21Mappa.lineePerCodice(dati.persone, dati.squadra);
  const chi = tutte.find(l => l.utenti.includes(SL.chi)) || tutte[0];
  const io = (visto() || ST.utente).id;
  const suoiGiorni = dati.giorni.filter(g => chi.utenti.includes(g.user_id));
  const suoiOb = dati.obiettivi.filter(o => chi.utenti.includes(o.user_id));
  const sv = C.segniVitali({ giorni: suoiGiorni, oggi, segniAl: chi.utenti.includes(io) ? SL.segniAl : null,
    // più utenti (la coppia): gli obiettivi si uniscono come fa «Tutti», ognuno con le sue partenze
    obiettivi: chi.utenti.length > 1 ? D.unisciPartner(D.mesiDaGiorni(suoiGiorni, C.CAMPI_STATO), suoiOb, oggi.slice(0, 8) + '01').obiettivi : suoiOb });
  // Niente crossline (Ignazio 25/09): le linee sono quelle **sotto la persona scelta**, mai le squadre parallele.
  // Cambiando persona in cima cambiano anche le linee sotto.
  const ramo = MB21Mappa.ramoDi(dati.squadra, chi.partner_id);
  const linee = MB21Mappa.ordinePerMappa(tutte.filter(l => l.partner_id && ramo.has(l.partner_id)),
    dati.squadra, dati.volumi, chi.partner_id);   // l'ordine della Mappa, a partire da chi guardi
  const livello = {};
  for (const p of linee) livello[p.id] = p.livello || 0;
  let html = '';
  if (tutte.length > 1) html += `<button class="sl-chi" id="sl-chi">${ic('persona')} ${esc(chi.nome)}${chi.compagni.length ? `<small>con ${esc(chi.compagni.join(' e '))}</small>` : ''}<span>cambia ▾</span></button>`;
  html += tabellaSv(sv, chi.nome);
  if (linee.length > 1) {
    const st = C.storicoLinee({ ...dati, persone: linee, oggi });
    const colore = `var(--${SL.tipo})`;
    const riga = (nome, celle, tot, classe, id) => {
      const max = tot ? Math.max(1, ...celle.map(c => c.valore || 0)) : st.massimi[SL.tipo];
      const ultima = celle[celle.length - 1], v = ultima.valore;
      const frecce = { su: '▲', giu: '▼' };
      const giu = id ? Math.min(livello[id] || 0, 4) : 0;
      return `<${id ? 'button' : 'div'} class="sl-riga ${classe}" ${id ? `data-slchi="${id}"` : ''} style="--sl-c:${colore}">
        <b>${giu ? `<i class="ramo" style="margin-left:${(giu - 1) * 10}px">↳</i>` : ''}${esc(nome)}</b>
        <span class="sl-barre">${celle.map(c => `<i class="${c.valore ? 'pieno' : ''}" style="height:${Math.round((c.valore || 0) / max * 24) + 2}px"></i>`).join('')}</span>
        <span class="sl-n ${v ? '' : 'zero'}">${v == null ? '·' : v}</span>
        <span class="sl-f ${ultima.cambio}">${frecce[ultima.cambio] || ''}</span></${id ? 'button' : 'div'}>`;
    };
    html += `<h4 class="mc-t">${esc(chi.nome)} e le sue linee</h4>
      <div class="rp-periodi">${TIPI_SL.map(([k, t]) => `<button data-sltipo="${k}" class="${SL.tipo === k ? 'scelto' : ''}">${t}</button>`).join('')}</div>
      <div class="sl">
        ${st.righe.filter(r => !r.vuota).map(r => riga(r.nome, r.celle[SL.tipo], false, r.id === chi.id ? 'scelta' : '', r.id)).join('')}
        ${riga('Tutto il gruppo', st.totali[SL.tipo].map((v, i) => ({ valore: v, cambio: i && v > st.totali[SL.tipo][i - 1] ? 'su' : i && v < st.totali[SL.tipo][i - 1] ? 'giu' : '' })), true, 'gruppo')}
      </div>
      <p class="sl-nota">Da ${esc(st.mesi[0].etichetta.toLowerCase())} ${st.mesi[0].anno} a ${esc(st.mesi[11].etichetta.toLowerCase())} ${st.mesi[11].anno} · il numero è quello dell'ultimo mese, la freccia dice come è cambiato rispetto al mese prima. Tocca una linea per vederne i 12 mesi qui sopra e scendere nella sua.</p>
      <p class="sl-nota">${ic('squadra')} Solo la linea di ${esc(chi.nome)}: le squadre che non stanno sotto di ${esc(chi.nome)} non si vedono.</p>
      ${st.righe.some(r => r.vuota) ? `<p class="sl-nota">Senza biglietti in questi 12 mesi: ${st.righe.filter(r => r.vuota).map(r => esc(r.nome)).join(' · ')}.</p>` : ''}`;
  } else if (tutte.length > 1) {
    // niente da confrontare: sotto questa persona non c'è ancora nessuno con l'app. Meglio dirlo che far sparire la parte
    html += `<p class="sl-nota">Sotto ${esc(chi.nome)} non c'è ancora nessuno che usa l'app: qui compariranno le sue linee, con il flusso mese per mese.</p>`;
  }
  velo.querySelector('#sl-corpo').innerHTML = html;
  const b = velo.querySelector('#sl-chi');
  if (b) b.onclick = async () => {
    const v = await sceltaDa('Chi guardi', await inOrdineDiMappa(tutte.map(l => ({ ...vocePersona(l, l.nome),
      etichetta: l.nome + (l.utenti.includes(ST.utente.id) ? ' (tu)' : ''), nota: l.compagni.length ? 'con ' + l.compagni.join(' e ') : '' }))));
    if (v) { SL.chi = v.id; disegnaStorico(velo, dati); }
  };
  velo.querySelectorAll('[data-sltipo]').forEach(x => x.onclick = () => { SL.tipo = x.dataset.sltipo; disegnaStorico(velo, dati); });
  velo.querySelectorAll('[data-slchi]').forEach(x => x.onclick = () => { SL.chi = x.dataset.slchi; disegnaStorico(velo, dati); velo.querySelector('.foglio').scrollTop = 0; });
}

const CK = { tipo: 'mese', periodo: null, giorni: null, obiettivi: [], wes: [], eventi: null, lc1: null, core: {}, aperta: null, indietro: 1, chiusi: leggiGruppiChiusi() };   // indietro: con quanti periodi fa si confronta (Ignazio 20/09)
// I gruppi del Check chiusi (Volume, Azione, Segni Vitali N21, Crescita) si ricordano sul telefono: è una comodità
// di chi guarda, quindi solo qui; se la memoria del telefono non risponde, si parte tutti aperti
function leggiGruppiChiusi() {
  try { return new Set(JSON.parse(localStorage.getItem('mb21_check_chiusi') || '[]')); } catch (e) { return new Set(); }
}
function salvaGruppiChiusi() {
  try { localStorage.setItem('mb21_check_chiusi', JSON.stringify([...CK.chiusi])); } catch (e) { /* resta solo per questa volta */ }
}
const CAMPI_CK = 'user_id, data, ' + MB21Check.CAMPI_GIORNO.join(', ');

async function apriPaginaCheck() {
  if (!CK.giorni) app.innerHTML = `<button class="indietro" id="ck-indietro">‹ Dashboard</button><h1>Check</h1><div class="vuoto">Carico i numeri…</div>`;
  const indietro = document.getElementById('ck-indietro');
  if (indietro) indietro.onclick = () => { ST.tab = 'oggi'; mostraTab(); };
  try {
    const giorni = [];
    for (let da = 0; ; da += 1000) {
      const { data, error } = await dbq('check giornalieri', supa.from('check_giorni_conti').select(CAMPI_CK)
        .in('user_id', idVisti()).order('id').range(da, da + 999));
      if (error) throw error;
      giorni.push(...data);
      if (data.length < 1000) break;
    }
    const [ob, wes, bbs, segniAl, biglietti, cep] = await Promise.all([
      dbq('obiettivi del mese', supa.from('obiettivi_mese').select('*').in('user_id', idVisti())),
      dbq('date dei WES', supa.from('wes').select('data, creato_il').order('data')),
      dbq('date dei BBS', supa.from('bbs').select('data, creato_il').order('data')),
      calcolatoreSegni(),   // BBS/WES/CEP dalle persone da settembre 2026
      // LC1 (26/09): i biglietti e il CEP della propria scheda, ovunque sia; con «Tutti» non serve (LC1 è di una persona)
      vediTutti() ? null : bigliettiDiChiGuardo(visto(), null),
      vediTutti() ? null : cepDiChiGuardo(visto()),
    ]);
    CK.segniAl = segniAl;
    if (ob.error || wes.error || bbs.error) throw ob.error || wes.error || bbs.error;
    CK.eventi = { bbs: bbs.data, wes: wes.data };
    CK.lc1 = vediTutti() ? null : { biglietti, cep };
    CK.core = {};   // il Modulo Core di ogni mese guardato (Leader Core), letto al bisogno
    // «Tutti»: check di tutti insieme, obiettivi sommati con le partenze calcolate per ognuno (dashboard.js → unisciPartner)
    CK.obiettivi = vediTutti()
      ? MB21Dashboard.unisciPartner(MB21Dashboard.mesiDaGiorni(giorni, ['bbs', 'wes', 'cep']), ob.data, MB21Coda.oggiRoma().slice(0, 8) + '01').obiettivi
      : ob.data;
    CK.giorni = giorni; CK.wes = wes.data.map(w => w.data);
  } catch (e) {
    app.innerHTML = `<button class="indietro" id="ck-indietro">‹ Dashboard</button><h1>Check</h1>
      <div class="avviso">Non riesco a caricare il Check. Controlla la connessione e riprova.</div>${versione()}`;
    document.getElementById('ck-indietro').onclick = () => { ST.tab = 'oggi'; mostraTab(); };
    return;
  }
  if (!CK.periodo) CK.periodo = MB21Report.periodoIniziale(CK.tipo, MB21Coda.oggiRoma(), CK.wes);
  disegnaCheck();
}

function disegnaCheck() {
  const R = MB21Report, C = MB21Check, oggi = MB21Coda.oggiRoma(), p = CK.periodo;
  const dati = { giorni: CK.giorni, obiettivi: CK.obiettivi, oggi, segniAl: CK.segniAl };
  let html = `<button class="indietro" id="ck-indietro">‹ Dashboard</button><h1>Check</h1>${partnerSelect()}
    <div class="rp-periodi">${[['mese', 'Mese'], ['wes', 'WES'], ['anno', 'Anno']].map(([k, t]) =>
      `<button data-ckperiodo="${k}" class="${CK.tipo === k ? 'scelto' : ''}">${t}</button>`).join('')}</div>`;
  if (!p) {
    html += `<div class="vuoto">Nessun WES ancora: l'Admin aggiunge le date dei WES.</div>`;
  } else {
    const r = C.calcola({ ...dati, dateWes: CK.wes, periodo: p, indietro: CK.indietro });
    html += `<div class="rp-naviga">
      <button id="ck-prima" aria-label="Periodo prima" ${R.spostaPeriodo(p, -1, oggi, CK.wes) ? '' : 'disabled'}>‹</button>
      <b>${esc(R.testoPeriodo(p))}</b>
      <button id="ck-dopo" aria-label="Periodo dopo" ${R.spostaPeriodo(p, 1, oggi, CK.wes) ? '' : 'disabled'}>›</button></div>
      <div class="ck-quando">Confronta con${[1, 2].map(n => {
        const parole = { mese: ['il mese scorso', 'due mesi fa'], wes: ['il WES prima', 'due WES fa'], anno: ["l'anno prima", 'due anni fa'] }[CK.tipo];
        return `<button data-ckindietro="${n}" class="${CK.indietro === n ? 'scelto' : ''}">${parole[n - 1]}</button>`;
      }).join('')}</div>
      <div class="ck-confronto">${esc(r.confronto)}</div>
      ${lc1Html(p, oggi)}
      <button class="rp-apri scura" id="ck-storico"><span>${ic('segnivitali')} Gli ultimi 12 mesi<small>il flusso dei Segni Vitali, linea per linea</small></span><span>›</span></button>`;
    // ogni gruppo si apre e si chiude toccando la testata (Ignazio 25/09); da chiuso resta il riassunto
    html += r.gruppi.map(g => { const chiuso = CK.chiusi.has(g.etichetta); return `<div class="ck-gruppo ${chiuso ? 'chiuso' : ''}" style="--g:${g.colore}; --g-tinta:${g.colore.replace(')', '-tinta)')}">
      <button class="ck-testa-g" data-ckgruppo="${esc(g.etichetta)}" aria-expanded="${chiuso ? 'false' : 'true'}"><span class="tondo">${esc(g.etichetta[0])}</span>
        <span><h3>${esc(g.etichetta)}</h3>${g.riassunto ? `<small>${esc(g.riassunto)}</small>` : ''}</span><span class="apri">${chiuso ? '›' : '⌄'}</span></button>
      ${chiuso ? '' : `<div class="ck-testa"><span></span>
        <span>${r.inCorso ? 'Oggi' : 'Totale'}<small>al ${esc(r.alGiorno)}</small></span>
        <span>Prima${r.alGiornoPrima ? `<small>al ${esc(r.alGiornoPrima)}</small>` : ''}</span>
        <span>▲▼</span></div>
      ${g.voci.map(v => {
        const aperta = CK.aperta === v.chiave;
        let h = `<button class="ck-riga ${aperta ? 'aperta' : ''}" data-voce="${v.chiave}"><span>${esc(v.titolo)}</span>
          <span class="n">${esc(v.adesso)}</span><span class="pr ${v.primaNota ? 'nota' : ''}">${esc(v.prima)}</span><span class="an ${v.andamento.segno}">${esc(v.andamento.testo)}</span>
          ${v.riga ? `<small>${esc(v.riga)}</small>` : ''}</button>`;
        if (!aperta) return h;
        const gr = C.grafico(dati, v.chiave, p.a && p.a <= oggi ? R.spostaGiorno(p.a, -1) : oggi);
        const fmt = x => x == null ? '—' : Number(x).toLocaleString('it-IT', { maximumFractionDigits: gr.decimali });
        h += `<div class="ck-grafico">
          <div class="legenda"><i style="background:${g.colore};margin-left:0"></i>${esc(gr.anno)}<i style="background:var(--spento)"></i>${esc(gr.annoPrima)}</div>
          <div class="ck-barre">${gr.mesi.map(m => `<div>
            <span class="prima" style="height:${(m.prima || 0) / gr.max * 100}%"></span>
            <span style="height:${(m.valore || 0) / gr.max * 100}%;background:${g.colore}"></span></div>`).join('')}</div>
          <div class="rp-mesi">${gr.mesi.map(m => `<span class="${m.valore == null ? 'futuro' : ''}">${m.etichetta}</span>`).join('')}</div>
          <div class="ck-valori">${gr.mesi.filter(m => m.valore != null).map(m => `${m.etichetta} ${fmt(m.valore)} <span style="color:var(--grigio-chiaro)">(${fmt(m.prima)})</span>`).join(' · ')}</div>
        </div>`;
        return h;
      }).join('')}`}</div>`; }).join('');
  }
  app.innerHTML = html + versione();
  collegaCheck();
}

// «Leader 1° livello» nel Check (Ignazio 26/09; nel codice resta `lc1`, il nome di squadra di prima): «i primi 4 punti Core»
// del mese, quattro luci e cosa manca (MB21Check.lc1). Con tutte e sette le abitudini Core si diventa «Leader Core» (la scala, dopo).
// Il mese è quello del periodo; con WES e Anno l'ultimo mese guardato. Con «Tutti» la card non c'è: LC1 è di una
// persona (il conto per l'Admin, chi ce l'ha e chi no, viene dopo).
function lc1Html(p, oggi) {
  if (!CK.lc1) return '';
  const R = MB21Report, C = MB21Check;
  const fine = p.a && p.a <= oggi ? R.spostaGiorno(p.a, -1) : oggi;
  const l = C.lc1({ mese: p.tipo === 'mese' ? p.da : fine, oggi, obiettivi: CK.obiettivi, biglietti: CK.lc1.biglietti, cep: CK.lc1.cep, eventi: CK.eventi });
  const io = visto().id === ST.utente.id;
  if (l.prima) return `<div class="ck-lc1"><div class="testa"><span><b>Dove sei · ${esc(l.nome)}</b><small>il percorso Core, un gradino alla volta</small></span></div>
    <small class="nota-lc1">Il percorso si conta da settembre 2026, il nuovo anno di performance</small></div>`;
  // Leader Core: il Modulo Core del mese si legge al bisogno (una volta per mese guardato); intanto la riga dice «…»
  const core = CK.core[l.mese];
  if (!core) caricaCoreCheck(l.mese);
  const pc = C.percorso({ lc1: l, modulo: core && core.modulo ? core.modulo : null });
  // sotto le luci solo quello che i gradini non dicono già: il mese chiuso, la scheda che manca
  const avvisi = [];
  if (!l.fatto && !l.inCorso) avvisi.push('mese chiuso');
  if (l.luci.some(x => x.ignoto && x.chiave !== 'vp')) avvisi.push(io ? 'non trovo la scheda col tuo codice Amway: chiedi all\'Admin' : 'nessuna scheda col suo codice Amway');
  const nota = avvisi.join(' · ');
  // le mancanze di un gradino: le prime tre, poi «e altre N»
  const mancanze = g => g.mancano.slice(0, 3).map(x => x.testo).join(' · ') + (g.mancano.length > 3 ? ` · e altre ${g.mancano.length - 3}` : '');
  const stato = pc.doveSei || `${l.accese} su 4`;
  const prossimo = pc.tuttiFatti ? (io ? 'Tutti i gradini di questo mese sono tuoi' : 'Tutti i gradini di questo mese sono fatti')
    : pc.prossimo ? `Prossimo passo: ${pc.prossimo}` : core && core.errore ? 'Non riesco a leggere il Modulo Core: riprova' : '';
  return `<div class="ck-lc1 ${l.fatto ? 'fatto' : ''}">
    <div class="testa"><span><b>Dove sei · ${esc(l.nome)}</b><small>il percorso Core, un gradino alla volta</small></span><span class="stato">${esc(stato)}</span></div>
    <div class="luci">${l.luci.map(x => `<span class="luce ${x.chiave} ${x.ok ? 'on' : ''} ${x.ignoto ? 'ignoto' : ''}"><i>${x.ok ? '✓' : x.ignoto ? '?' : ''}</i>${esc(x.titolo)}<small>${esc(x.testo)}</small></span>`).join('')}</div>
    ${nota ? `<small class="nota-lc1">${esc(nota)}</small>` : ''}
    <div class="scala">${pc.gradini.map((g, i) => `<div class="grad ${g.fatto ? 'ok' : g.pronto ? 'qui' : ''}" data-grad="${g.chiave}"><i>${g.fatto ? '✓' : i + 1}</i>
      <span><b>${esc(g.titolo)}</b><small>${esc(g.fatto || !g.mancano.length ? g.sotto : mancanze(g))}</small></span><span class="st">${esc(g.stato)}</span></div>`).join('')}</div>
    ${prossimo ? `<div class="prossimo ${pc.tuttiFatti ? 'fatto' : ''}">${esc(prossimo)}</div>` : ''}</div>`;
}

// Il Modulo Core del mese per la riga «Leader Core» (stessa lettura del Modulo Core: `datiCoreDelMese`, e lo stesso conto,
// `MB21Core.modulo`). Quando arriva, il Check si ridisegna se è ancora aperto sulla stessa persona.
async function caricaCoreCheck(mese) {
  const chi = visto().id;
  CK.core[mese] = { modulo: null };
  try {
    const d = await datiCoreDelMese(visto(), mese.slice(0, 7));
    if (visto().id !== chi) return;
    CK.core[mese] = { modulo: MB21Core.modulo({ ...d, mese: mese.slice(0, 7), oggi: MB21Coda.oggiRoma() }) };
  } catch (e) {
    CK.core[mese] = { modulo: null, errore: true };
  }
  if (ST.tab === 'check' && CK.giorni && visto().id === chi) disegnaCheck();
}

function collegaCheck() {
  const R = MB21Report, oggi = MB21Coda.oggiRoma();
  const su = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  su('ck-indietro', () => { ST.tab = 'oggi'; mostraTab(); });
  su('ck-storico', foglioStorico);
  app.querySelectorAll('[data-ckgruppo]').forEach(b => b.onclick = () => {
    const k = b.dataset.ckgruppo;
    if (CK.chiusi.has(k)) CK.chiusi.delete(k); else CK.chiusi.add(k);
    salvaGruppiChiusi();
    disegnaCheck();
  });
  collegaPartnerSelect();
  app.querySelectorAll('[data-ckindietro]').forEach(b => b.onclick = () => {
    CK.indietro = Number(b.dataset.ckindietro); disegnaCheck();
  });
  app.querySelectorAll('[data-ckperiodo]').forEach(b => b.onclick = () => {
    CK.tipo = b.dataset.ckperiodo; CK.periodo = R.periodoIniziale(CK.tipo, oggi, CK.wes); disegnaCheck();
  });
  const sposta = n => { const q = R.spostaPeriodo(CK.periodo, n, oggi, CK.wes); if (q) { CK.periodo = q; disegnaCheck(); } };
  su('ck-prima', () => sposta(-1));
  su('ck-dopo', () => sposta(1));
  app.querySelectorAll('[data-voce]').forEach(b => b.onclick = () => { CK.aperta = CK.aperta === b.dataset.voce ? null : b.dataset.voce; disegnaCheck(); });
}

// ── MAPPA (Fase 8) ── la pagina è in pagina-mappa.js (albero, targhette, visione completa, lettura dei segni vitali)

// ── REPORT (Fase 5) ──────────────────────────────────────
// Brief docs/MB21_v4_Brief_F5_Report.md: periodo Mese · Wes · Anno con ‹ ›, numeri a scalini tipo → esito → nomi
// (tocco su un nome = scheda contatto), grafico dell'anno, Griglia PM in una pagina sua, date dei Wes (solo Admin).
// Numeri del partner loggato (anche l'Admin vede i suoi, come la Dashboard). Calcoli in report.js.
const RP = { tipo: 'mese', periodo: null, azioni: null, wes: [], griglia: null, aperto: null, esito: null, vista: 'report', cella: null };
const CAMPI_REPORT = 'id, contatto_id, portato_da, categoria, tipo_azione, modalita, esito, completata, inizio, ospite, contatti(nome, categoria)';   // categoria e completata: servono a `contaAzione`

async function leggiAzioniMie() {
  const righe = [];
  for (let da = 0; ; da += 1000) {
    const { data, error } = await dbq('azioni del report', supa.from('azioni').select(CAMPI_REPORT)
      .in('user_id', idVisti()).not('inizio', 'is', null).order('id').range(da, da + 999));
    if (error) throw error;
    righe.push(...data);
    if (data.length < 1000) return righe;
  }
}

async function apriReport(vista) {
  RP.vista = vista || RP.vista;
  if (!RP.azioni) app.innerHTML = `<h1>Report</h1><div class="vuoto">Carico i numeri…</div>`;
  try {
    const [azioni, wes, gr] = await Promise.all([
      leggiAzioniMie(),
      dbq('date dei WES', supa.from('wes').select('id, data').order('data')),
      vediTutti() ? { data: null } : dbq('griglia PM', supa.from('griglia_pm').select('obiettivo, inizio, mesi').eq('user_id', visto().id).maybeSingle()),
    ]);
    if (wes.error || gr.error) throw wes.error || gr.error;
    RP.azioni = await aggiungiPortatoDa(azioni); RP.wes = wes.data; RP.griglia = gr.data;
  } catch (e) {
    app.innerHTML = `<h1>Report</h1><div class="avviso">Non riesco a caricare il Report. Controlla la connessione e riprova.</div>${versione()}`;
    return;
  }
  const oggi = MB21Coda.oggiRoma();
  if (!RP.periodo) RP.periodo = MB21Report.periodoIniziale(RP.tipo, oggi, RP.wes.map(w => w.data));
  RP.vista === 'griglia' ? disegnaGriglia() : disegnaReport();
}

function disegnaReport() {
  const R = MB21Report, oggi = MB21Coda.oggiRoma(), date = RP.wes.map(w => w.data), p = RP.periodo;
  const riga = (classe, attr, testo, n, perc, freccia) =>
    `<button class="rp-riga ${classe}" ${attr}><span>${testo}</span><span class="n">${n}</span><span class="p">${perc}</span><span class="f">${freccia}</span></button>`;
  let html = `<h1>Report</h1>${partnerSelect()}
    <div class="rp-periodi">${[['mese', 'Mese'], ['wes', 'WES'], ['anno', 'Anno']].map(([k, t]) =>
      `<button data-periodo="${k}" class="${RP.tipo === k ? 'scelto' : ''}">${t}</button>`).join('')}</div>`;
  if (!p) {
    html += `<div class="vuoto">Nessun WES ancora. ${eAdmin() ? 'Aggiungi la data nella pagina Admin.' : "L'Admin aggiunge le date dei WES."}</div>`;
  } else {
    html += `<div class="rp-naviga">
      <button id="rp-prima" aria-label="Periodo prima" ${R.spostaPeriodo(p, -1, oggi, date) ? '' : 'disabled'}>‹</button>
      <b>${esc(R.testoPeriodo(p))}</b>
      <button id="rp-dopo" aria-label="Periodo dopo" ${R.spostaPeriodo(p, 1, oggi, date) ? '' : 'disabled'}>›</button></div>`;
    const gruppi = R.numeri(RP.azioni, p, oggi);
    html += `<div class="rp-lista">${gruppi.map(g => {
      const aperto = RP.aperto === g.chiave;
      let h = riga(`tipo ${aperto ? 'aperto' : ''}`, `data-gruppo="${g.chiave}"`, esc(g.etichetta), g.totale, '', aperto ? '⌄' : '›');
      if (!aperto) return h;
      if (!g.esiti.length) return h + `<div class="rp-altre">Nessuna azione nel periodo</div>`;
      let divisore = false;
      for (const e of g.esiti) {
        const scelto = RP.esito === e.esito;
        if (!e.conta && !divisore) { divisore = true; h += `<div class="rp-altre">Non contano nel totale · ${g.nonContano}</div>`; }   // cantiere 27: tentativi a vuoto, senza esito, PM non avvenuti
        h += riga(`esito ${e.verde ? 'verde' : ''} ${e.n && e.conta ? '' : 'zero'}`, `data-esito="${esc(e.esito)}" ${e.n ? '' : 'disabled'}`,
          esc(e.esito), e.n, e.conta ? `${e.percentuale}%` : '', e.n ? (scelto ? '⌄' : '›') : '');
        if (!scelto) continue;
        h += e.persone.map(x => `<button class="rp-riga nome ${classeCat(x.categoria)}" data-azione="${esc(x.id)}">
          <span class="rp-chi"><i class="rp-tondo">${esc(iniziali(x.nome))}</i><span>${esc(x.nome)}<br><small>${esc(R.dataBreve(x.giorno))}${x.modalita ? ' · ' + esc(x.modalita) : ''}${x.portato ? ' · ' + rigaPortato(x.portato) : ''}</small></span></span><span></span><span class="f">›</span></button>`).join('');
        if (e.altre) h += `<div class="rp-altre">e altri ${e.altre}: scegli un periodo più corto</div>`;
      }
      return h;
    }).join('')}</div>`;
    const anno = R.periodoAnno(p.da), aperto = gruppi.find(g => g.chiave === RP.aperto);
    const mesi = R.grafico(RP.azioni, anno, oggi, RP.aperto), max = Math.max(1, ...mesi.map(m => m.azioni));
    html += `<div class="rp-grafico"><h3>${ic('crescita')} Anno ${esc(anno.etichetta)}${aperto ? ' · ' + esc(aperto.etichetta) : ''}</h3>
      <div class="legenda"><i style="background:var(--gr-volume);margin-left:0"></i>azioni fatte<i style="background:var(--verde)"></i>risultati che contano</div>
      <div class="rp-barre">${mesi.map(m => `<div><small>${m.azioni || ''}</small><span style="height:${m.azioni / max * 100}%">
        <i style="height:${m.azioni ? m.verdi / m.azioni * 100 : 0}%"></i></span></div>`).join('')}</div>
      <div class="rp-mesi">${mesi.map(m => `<span class="${m.futuro ? 'futuro' : ''}">${m.etichetta}</span>`).join('')}</div></div>`;
  }
  const gp = RP.griglia ? R.griglia(RP.azioni.filter(a => a.tipo_azione === 'Piano Marketing'), RP.griglia, oggi) : null;
  if (!vediTutti()) html += `<button class="rp-apri" id="rp-griglia"><span>${ic('pianomarketing')} Griglia PM${gp ? ` · ${gp.fatti} di ${gp.obiettivo}` : ' · da impostare'}</span><span>›</span></button>`;
  app.innerHTML = html + versione();
  collegaReport();
}

function collegaReport() {
  const R = MB21Report, oggi = MB21Coda.oggiRoma(), date = RP.wes.map(w => w.data);
  const su = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  collegaPartnerSelect();
  app.querySelectorAll('[data-periodo]').forEach(b => b.onclick = () => {
    RP.tipo = b.dataset.periodo; RP.periodo = R.periodoIniziale(RP.tipo, oggi, date); RP.esito = null; disegnaReport();
  });
  const sposta = n => { const q = R.spostaPeriodo(RP.periodo, n, oggi, date); if (q) { RP.periodo = q; RP.esito = null; disegnaReport(); } };
  su('rp-prima', () => sposta(-1));
  su('rp-dopo', () => sposta(1));
  app.querySelectorAll('[data-gruppo]').forEach(b => b.onclick = () => {
    RP.aperto = RP.aperto === b.dataset.gruppo ? null : b.dataset.gruppo; RP.esito = null; disegnaReport();
  });
  app.querySelectorAll('[data-esito]').forEach(b => b.onclick = () => { RP.esito = RP.esito === b.dataset.esito ? null : b.dataset.esito; disegnaReport(); });
  app.querySelectorAll('[data-azione]').forEach(b => b.onclick = () => foglioAzione(b.dataset.azione, { ritorno: 'report', dopo: () => apriReport('report') }));
  su('rp-griglia', () => { RP.vista = 'griglia'; RP.cella = null; window.scrollTo(0, 0); disegnaGriglia(); });
}

// Conferma dentro l'app al posto di confirm(): in alcuni browser la finestra del sistema non compare
// e il bottone sembra non fare niente (Ignazio 16/09: «non mi fa cliccare né rifiuta né approva»).
// Con `spunta` (testo) sotto il testo c'è una casella: la risposta «sì» diventa { spunta: true | false } (cantiere 33: «Togli anche biglietti e CEP»)
function chiediConferma(titolo, testo, si = 'Conferma', pericolo = false, spunta = '', no = 'Annulla') {
  return new Promise(risolvi => {
    const velo = document.createElement('div');
    velo.className = 'velo';
    velo.innerHTML = `<div class="foglio"><h3>${esc(titolo)}</h3>${testo ? `<p>${esc(testo)}</p>` : ''}
      ${spunta ? `<label class="cf-spunta"><input type="checkbox" id="cf-spunta"> <span>${esc(spunta)}</span></label>` : ''}
      <button class="primario" id="cf-si" ${pericolo ? 'style="background:var(--rosso)"' : ''}>${esc(si)}</button>
      <button class="link" id="cf-no">${esc(no)}</button></div>`;
    document.body.appendChild(velo);
    const fine = v => { velo.remove(); risolvi(v); };
    velo.onclick = e => { if (e.target === velo) fine(false); };
    velo.querySelector('#cf-no').onclick = () => fine(false);
    velo.querySelector('#cf-si').onclick = () => fine(spunta ? { spunta: velo.querySelector('#cf-spunta').checked } : true);
  });
}

// Link di registrazione di chi è entrato («da» = lui): si vede scritto, si copia, e sul telefono si manda con Condividi.
// Il foglio serve perché la copia automatica non funziona dappertutto (Ignazio 16/09: «non si può copiare il link»).
// opz: { da: id di chi invita (predefinito: chi è entrato), nome, telefono } → WhatsApp e SMS già indirizzati alla persona
// Con opz.link · messaggio · titolo · spiega lo stesso foglio manda altro (es. «Avvisa» dopo l'approvazione in Admin)
function foglioLinkInvito(opz = {}) {
  const link = opz.link || `${location.origin}${location.pathname}?registrati&da=${opz.da || ST.utente.id}`;
  // Messaggio con il saluto, modificabile nel riquadro: Copia e tutti i bottoni mandano il testo com'è in quel momento (Ignazio 16/09)
  const messaggio = opz.messaggio || `${opz.nome ? 'Ciao ' + opz.nome.split(' ')[0] + ', r' : 'R'}egistrati all'app MB21 da questo link:\n${link}`;
  const tel = opz.telefono && opz.telefono.startsWith('+') ? opz.telefono : '';   // i numeri dubbi non partono
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `<div class="foglio"><h3>${opz.titolo ? esc(opz.titolo) : ic('collega') + ' ' + (opz.nome ? 'Invita ' + esc(opz.nome) + " nell'app MB21" : 'Link di registrazione')}</h3>
    <p>${opz.spiega ? esc(opz.spiega) : opz.nome ? 'Mandagli il messaggio (puoi cambiarlo): si registra, e l\'Admin approva la richiesta.' : 'Manda il messaggio (puoi cambiarlo) a chi si deve registrare: la richiesta arriva all\'Admin, che la approva.'}</p>
    <textarea id="li-testo" rows="4" style="width:100%;font-size:15px;padding:10px;border-radius:12px;border:1px solid var(--linea)">${esc(messaggio)}</textarea>
    <div class="li-canali">
      <a href="#" data-canale="wa">WhatsApp</a><a href="#" data-canale="tg">Telegram</a><a href="#" data-canale="sms">SMS</a>
    </div>
    ${navigator.share ? '<button class="primario" id="li-condividi" style="margin-top:8px">' + ic('condividi') + ' Altre app</button>' : ''}
    <button class="primario" id="li-copia" style="margin-top:8px">⧉ Copia il messaggio</button>
    <button class="link" id="li-chiudi">Chiudi</button></div>`;
  document.body.appendChild(velo);
  const chiudi = () => velo.remove();
  velo.onclick = e => { if (e.target === velo) chiudi(); };
  velo.querySelector('#li-chiudi').onclick = chiudi;
  const testo = velo.querySelector('#li-testo');
  const attuale = () => testo.value.trim() || messaggio;
  // Il link del bottone si prepara al tocco, con il testo del riquadro
  velo.querySelectorAll('[data-canale]').forEach(a => a.onclick = () => {
    const t = encodeURIComponent(attuale());
    a.target = a.dataset.canale === 'sms' ? '' : '_blank';
    a.rel = 'noopener';
    a.href = a.dataset.canale === 'wa' ? `https://wa.me/${tel.replace(/[^0-9]/g, '')}?text=${t}`
      : a.dataset.canale === 'tg' ? `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(attuale().replace(link, '').trim())}`
      : `sms:${tel}?&body=${t}`;
  });
  velo.querySelector('#li-copia').onclick = () => copiaTesto(attuale(), 'Messaggio copiato: incollalo dove vuoi', testo, 'Tieni premuto sul messaggio e scegli Copia');
  const cond = velo.querySelector('#li-condividi');
  if (cond) cond.onclick = () => navigator.share({ title: 'Registrati a MB21', text: attuale() }).catch(() => {});
}

// Contatto appena diventato Partner (Ignazio 16/09): domanda «Vuoi invitarlo nell'app MB21?». Invitato da = proprietario della lista.
async function domandaInvito(c) {
  if (!c || !c.nome) return;
  const si = await chiediConferma(`${c.nome} è diventato Partner`, "Vuoi invitarlo nell'app MB21? Puoi farlo anche dopo, dalla sua scheda.", "Invita nell'app MB21");
  if (si) foglioLinkInvito({ da: c.user_id || visto().id, nome: c.nome, telefono: c.telefono });
}

// Griglia PM (decisioni 8-10): obiettivo 8 · 15 · 30 · Altro (fino a 100), inizio + durata 1-12 mesi, caselle dei PM fatti
function disegnaGriglia() {
  const R = MB21Report, oggi = MB21Coda.oggiRoma();
  const imp = RP.griglia;
  let html = `<button class="indietro" id="gp-indietro">‹ Report</button><h1>Griglia PM</h1>`;
  if (!imp) {
    html += `<div class="riquadro"><p style="margin:0 0 12px">Scegli quanti Piani Marketing vuoi fare e in quanto tempo.</p>
      <button class="primario" id="gp-imposta">Imposta la griglia</button></div>`;
    app.innerHTML = html + versione();
    document.getElementById('gp-indietro').onclick = () => { RP.vista = 'report'; disegnaReport(); };
    document.getElementById('gp-imposta').onclick = impostaGriglia;
    return;
  }
  const g = R.griglia(RP.azioni.filter(a => a.tipo_azione === 'Piano Marketing'), imp, oggi);
  html += `<div class="riquadro">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div><b style="font-size:18px">Obiettivo ${g.obiettivo} PM</b>
          <div class="sotto" style="margin:2px 0 0">${esc(R.dataLunga(g.inizio))} → ${esc(R.dataLunga(g.fine))} · ${g.mesi} ${g.mesi === 1 ? 'mese' : 'mesi'}</div></div>
        <button class="modifica" id="gp-cambia">Cambia</button></div></div>
    <div class="riquadro">
      <div class="gp-numeri"><div><b>${g.fatti}</b><small>PM fatti</small></div><div><b>${g.mancanti}</b><small>Mancanti</small></div>
        <div><b>${g.alMese}</b><small>PM al mese</small></div></div>
      <div class="barra"><div style="width:${g.percentuale}%;background:${g.mancanti ? 'var(--blu)' : 'var(--verde)'}"></div></div>
      <div class="gp-sotto"><span>${g.percentuale}% completato</span><span>Ritmo: ${String(g.ritmo).replace('.', ',')} PM al mese</span></div>
      ${g.mancanti ? '' : `<div class="gp-dettaglio" style="color:var(--verde);font-weight:700">${ic('complimenti')} Obiettivo raggiunto!</div>`}
    </div>
    <div class="riquadro">
      <div class="gp-celle">${g.celle.map((c, i) => c.id
        ? `<button class="fatta" data-cella="${c.numero}" style="border-color:${R.coloreCella(c.esito)}">
            <b>${c.numero}</b><span>${esc(R.dataBreve(c.giorno))}</span><span>${esc(c.breve)}</span>${c.portato ? `<span class="gp-portato">${ic('squadra')} ${esc(c.portato)}</span>` : ''}</button>`
        : `<button class="${i === g.fatti ? 'prossima' : ''}" disabled>${c.numero}</button>`).join('')}</div>
      <div class="gp-legenda">${Object.entries(R.COLORI_GRIGLIA).map(([e, c]) => `<span><i style="background:${c}"></i>${esc(e)}</span>`).join('')}</div>
    </div>`;
  app.innerHTML = html + versione();
  document.getElementById('gp-indietro').onclick = () => { RP.vista = 'report'; disegnaReport(); };
  document.getElementById('gp-cambia').onclick = impostaGriglia;
  app.querySelectorAll('[data-cella]').forEach(b => b.onclick = () => foglioAzione(g.celle.find(c => c.numero === Number(b.dataset.cella)).id, { ritorno: 'griglia', dopo: () => apriReport('griglia') }));
}

function impostaGriglia() {
  if (soloGuardo()) return;
  const R = MB21Report, imp = RP.griglia || { obiettivo: 8, inizio: MB21Coda.oggiRoma().slice(0, 8) + '01', mesi: 6 };
  let obiettivo = imp.obiettivo;
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML = `<div class="foglio alto mc">
    <div class="mc-testa"><span class="ts-pastiglia" style="background:var(--gr-azione)">${ic('pianomarketing')}</span>
      <div><small>Come vuoi impostarla</small><b>Griglia PM</b></div>
      <button id="gi-x" aria-label="Chiudi">${ic('chiudi')}</button></div>
    <h4 class="mc-t">Il traguardo</h4><div class="riquadro mc-g">
    <div class="campo"><label>Obiettivo PM</label>
      <div class="gp-obiettivi">${R.OBIETTIVI_PM.map(n => `<button data-ob="${n}">${n}</button>`).join('')}<button data-ob="altro">Altro</button></div>
      <div class="gp-altro" id="gi-altro" hidden><input type="range" id="gi-barra" min="1" max="100" step="1" value="${obiettivo}"><b id="gi-valore">${obiettivo}</b></div></div>
    </div><h4 class="mc-t">Da quando e per quanto</h4><div class="riquadro mc-g">
    <div class="campo"><label>Data di inizio</label><input type="date" id="gi-inizio" value="${esc(imp.inizio)}"></div>
    <div class="campo"><label>Durata</label><select id="gi-mesi">${Array.from({ length: 12 }, (_, i) => i + 1).map(m =>
      `<option value="${m}" ${m === imp.mesi ? 'selected' : ''}>${m} ${m === 1 ? 'mese' : 'mesi'}</option>`).join('')}</select></div>
    <p id="gi-fine" style="margin:6px 0 0"></p></div>
    <div class="errore" id="gi-errore"></div>
    <div class="mc-fondo"><button class="link" id="gi-no">Annulla</button><button class="primario" id="gi-si">Salva</button></div>
  </div>`;
  document.body.appendChild(velo);
  const $ = id => velo.querySelector('#' + id);
  const chiudi = () => velo.remove();
  $('gi-x').onclick = chiudi; $('gi-no').onclick = chiudi;
  const aggiorna = () => {
    const altro = !R.OBIETTIVI_PM.includes(obiettivo) || !$('gi-altro').hidden;
    velo.querySelectorAll('[data-ob]').forEach(b => b.classList.toggle('scelto', altro ? b.dataset.ob === 'altro' : Number(b.dataset.ob) === obiettivo));
    $('gi-valore').textContent = obiettivo;
    const v = { obiettivo, inizio: $('gi-inizio').value, mesi: Number($('gi-mesi').value) };
    $('gi-fine').textContent = R.validaGriglia(v) ? '' : `Fino al ${R.dataLunga(R.griglia([], v, MB21Coda.oggiRoma()).fine)}`;
  };
  if (!R.OBIETTIVI_PM.includes(obiettivo)) $('gi-altro').hidden = false;
  velo.querySelectorAll('[data-ob]').forEach(b => b.onclick = () => {
    if (b.dataset.ob === 'altro') { $('gi-altro').hidden = false; obiettivo = Number($('gi-barra').value); }
    else { $('gi-altro').hidden = true; obiettivo = Number(b.dataset.ob); $('gi-barra').value = obiettivo; }
    aggiorna();
  });
  $('gi-barra').oninput = () => { obiettivo = Number($('gi-barra').value); aggiorna(); };
  $('gi-inizio').onchange = aggiorna; $('gi-mesi').onchange = aggiorna;
  aggiorna();
  $('gi-si').onclick = async () => {
    const v = { obiettivo, inizio: $('gi-inizio').value, mesi: Number($('gi-mesi').value) };
    const errore = R.validaGriglia(v);
    if (errore) { $('gi-errore').textContent = errore; return; }
    $('gi-si').disabled = true;
    const { error } = await dbq('salva griglia PM', supa.from('griglia_pm')
      .upsert({ user_id: visto().id, ...v, aggiornata_il: new Date().toISOString() }, { onConflict: 'user_id' }));
    if (error) { $('gi-si').disabled = false; $('gi-errore').textContent = 'Non salvato: controlla la connessione e riprova.'; return; }
    chiudi();
    RP.griglia = v; RP.cella = null;
    mostraToast('Griglia PM salvata');
    disegnaGriglia();
  };
}

// ── Avvio ────────────────────────────────────────────────
// INITIAL_SESSION arriva all'apertura (già letto anche il link dell'email, #access_token);
// SIGNED_IN dopo il link. Callback sincrona: le chiamate al DB partono fuori (setTimeout),
// altrimenti supabase-js si blocca aspettando se stesso.
let accessoInCorso = false;
supa.auth.onAuthStateChange((evento, sessione) => {
  setTimeout(() => {
    if (evento === 'SIGNED_OUT') { ST.utente = null; mostraEmail(ST.motivoUscita); ST.motivoUscita = ''; return; }
    if (evento !== 'INITIAL_SESSION' && evento !== 'SIGNED_IN') return;
    if (!sessione) return REGISTRAZIONE.has('registrati') ? mostraRegistrazione() : mostraEmail();
    if (ST.utente || accessoInCorso) return;
    accessoInCorso = true;
    dopoAccesso(sessione).finally(() => { accessoInCorso = false; });
  }, 0);
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
