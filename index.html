<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MB21">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<title>MB21</title>
<style>
  :root {
    --sfondo: #F2F2F7; --card: #FFFFFF; --testo: #1C1C1E; --grigio: #6B7280; --grigio-chiaro: #9CA3AF;
    --linea: #E5E7EB; --blu: #2563EB; --coach: #8B5CF6; --verde: #059669; --rosso: #DC2626;
    --prospect: #F97316; --cliente: #3B82F6; --partner: #8B5CF6; --ex: #9CA3AF; --unlinked: #D1D5DB;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sfondo); color: var(--testo);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 16px) 16px 110px; }
  h1 { font-size: 32px; margin: 8px 0 2px; letter-spacing: -0.5px; }
  .sotto { color: var(--grigio); font-size: 14px; margin-bottom: 18px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--grigio); margin: 22px 4px 8px; }

  .card { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.04); }
  .strip { height: 4px; background: var(--unlinked); }
  .corpo { padding: 14px 16px 16px; }
  .nome { font-size: 17px; font-weight: 700; }
  .prof { font-size: 13px; color: var(--grigio); margin-top: 2px; }
  .luogo { font-size: 12px; color: var(--grigio-chiaro); margin-top: 2px; }
  .riga { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .tel { color: var(--blu); font-size: 16px; font-weight: 600; text-decoration: none; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #F3F4F6; color: #374151; }
  .badge.scaduto { background: #FEE2E2; color: var(--rosso); }
  .coach { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #F5F3FF; color: #5B21B6;
    font-size: 15px; font-weight: 600; line-height: 1.3; }
  .coach small { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--coach); margin-bottom: 2px; }

  .vuoto, .avviso { text-align: center; color: var(--grigio); padding: 28px 16px; font-size: 15px; }
  .avviso { background: #FFFBEB; color: #92400E; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }

  .accesso { max-width: 360px; margin: 12vh auto 0; }
  .accesso p { color: var(--grigio); font-size: 15px; }
  input { width: 100%; font-size: 17px; padding: 14px; border-radius: 12px; border: 1px solid var(--linea); background: #fff; margin: 6px 0 12px; }
  button.primario { width: 100%; font-size: 17px; font-weight: 600; padding: 14px; border: 0; border-radius: 12px; background: var(--testo); color: #fff; }
  button.primario:disabled { opacity: .5; }
  button.link { background: none; border: 0; color: var(--blu); font-size: 15px; padding: 10px 0; }
  .errore { color: var(--rosso); font-size: 14px; min-height: 20px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.92); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--linea); display: flex; justify-content: space-around;
    padding: 8px 0 calc(env(safe-area-inset-bottom) + 8px); }
  nav button { background: none; border: 0; font-size: 12px; font-weight: 600; color: var(--grigio-chiaro); padding: 6px 18px; }
  nav button.attiva { color: var(--testo); }
  .bottoni { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .bottoni button { font-size: 15px; font-weight: 600; padding: 12px 6px; border-radius: 12px; border: 0; background: #F3F4F6; color: var(--testo); }
  .bottoni button:active { transform: scale(.97); }
  .bottoni .appuntamento { background: #DCFCE7; color: #166534; }
  .bottoni .no { background: #FEF2F2; color: #991B1B; }
  .bottoni button:disabled { opacity: .45; }
  .bottoni button:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .card.via { opacity: 0; transform: translateX(40px); transition: all .25s ease; }

  .velo { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; z-index: 20; }
  .foglio { background: #fff; width: 100%; max-width: 520px; margin: 0 auto; border-radius: 20px 20px 0 0;
    padding: 20px 16px calc(env(safe-area-inset-bottom) + 20px); }
  .foglio h3 { margin: 0 0 4px; font-size: 20px; }
  .foglio p { margin: 0 0 12px; color: var(--grigio); font-size: 14px; }
  .foglio .due { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 78px); max-width: 488px; margin: 0 auto;
    background: #1C1C1E; color: #fff; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; font-size: 15px; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .toast button { background: none; border: 0; color: #FBBF24; font-size: 15px; font-weight: 700; padding: 4px 0; }

  .versione { text-align: center; color: var(--grigio-chiaro); font-size: 11px; margin-top: 28px; }
</style>
</head>
<body>
<main id="app"></main>
<nav id="tab" hidden>
  <button data-tab="oggi" class="attiva">OGGI</button>
  <button data-tab="lista">LISTA</button>
  <button data-tab="progressi">PROGRESSI</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="coda.js"></script>
<script>
const APP_VERSION = '2026.09.14 · 09:31';

const SUPABASE_URL = 'https://exwgjlhbhlgebkgxtanq.supabase.co';
// Chiave pubblica (anon/publishable): può stare nella pagina, i dati li proteggono le regole di accesso.
const SUPABASE_KEY = 'sb_publishable_i9kxRdnrgk2fvk71P3VV9g_GJA1-r26';

const COLORI = { 'Prospect': 'var(--prospect)', 'Cliente': 'var(--cliente)', 'Partner': 'var(--partner)',
  'Ex Partner/Cliente': 'var(--ex)', 'Archiviato': 'var(--ex)', 'Referral': 'var(--ex)', 'Unlinked': 'var(--unlinked)' };
const CHIAVE_CACHE = 'mb21_coda';

const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const ST = { email: '', utente: null, tab: 'oggi' };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function versione() { return `<div class="versione">Versione ${APP_VERSION}</div>`; }
function dataEstesa(iso) {
  return new Date(iso + 'T12:00:00Z').toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
}

// supabase-js non lancia eccezioni sugli errori: si controlla sempre `error` (lezione di Zona Tracker).
async function dbq(cosa, promessa) {
  const res = await promessa;
  if (res.error) console.error('[MB21] ' + cosa, res.error);
  return res;
}

// ── Accesso ──────────────────────────────────────────────
function mostraEmail(errore) {
  document.getElementById('tab').hidden = true;
  app.innerHTML = `
    <div class="accesso">
      <h1>MB21</h1>
      <p>Scrivi la tua email: ti mandiamo un link per entrare.</p>
      <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="nome@email.it" value="${esc(ST.email)}">
      <div class="errore">${esc(errore || '')}</div>
      <button class="primario" id="invia">Mandami il link</button>
      ${versione()}
    </div>`;
  document.getElementById('invia').onclick = inviaLink;
}

// Piano gratuito di Supabase: il testo dell'email non si può cambiare, quindi arriva solo il link
// (niente codice a 6 cifre). Il link riapre questa pagina e supabase-js legge l'accesso da solo.
async function inviaLink() {
  const btn = document.getElementById('invia');
  ST.email = document.getElementById('email').value.trim().toLowerCase();
  if (!ST.email.includes('@')) return mostraEmail('Controlla l\'email.');
  btn.disabled = true; btn.textContent = 'Invio…';
  const { error } = await dbq('invio link', supa.auth.signInWithOtp({
    email: ST.email, options: { emailRedirectTo: location.origin + location.pathname } }));
  if (error) return mostraEmail(messaggioAccesso(error));
  app.innerHTML = `
    <div class="accesso">
      <h1>Controlla l'email</h1>
      <p>Abbiamo mandato un link a <b>${esc(ST.email)}</b>. Aprilo <b>su questo telefono</b>: ti riporta qui già dentro.</p>
      <button class="link" id="indietro">Cambia email</button>
    </div>`;
  document.getElementById('indietro').onclick = () => mostraEmail();
}

function messaggioAccesso(error) {
  const m = (error.message || '').toLowerCase();
  if (m.includes('database error') || m.includes('non abilitato') || m.includes('signups not allowed')) return 'Utente non abilitato.';
  if (m.includes('rate limit') || error.status === 429) return 'Troppi tentativi: riprova tra un\'ora.';
  return 'Non è andata: ' + error.message;
}

async function dopoAccesso(sessione) {
  const { data, error } = await dbq('lettura utente',
    supa.from('utenti').select('id, nome, nome_cognome').eq('auth_id', sessione.user.id).maybeSingle());
  if (error && !navigator.onLine) { ST.utente = {}; return mostraTab(); }   // offline: si prova con la cache
  if (!data) {
    ST.motivoUscita = 'Utente non abilitato.';
    return supa.auth.signOut();   // → SIGNED_OUT mostra il motivo
  }
  ST.utente = data;
  mostraTab();
}

// ── Tab ──────────────────────────────────────────────────
function mostraTab() {
  const nav = document.getElementById('tab');
  nav.hidden = false;
  nav.querySelectorAll('button').forEach(b => {
    b.classList.toggle('attiva', b.dataset.tab === ST.tab);
    b.onclick = () => { ST.tab = b.dataset.tab; mostraTab(); };
  });
  if (ST.tab === 'oggi') return caricaOggi();
  app.innerHTML = `<h1>${ST.tab === 'lista' ? 'Lista' : 'Progressi'}</h1><div class="vuoto">In arrivo.</div>${versione()}`;
}

// ── OGGI ─────────────────────────────────────────────────
async function leggiCandidati(oggi) {
  const righe = [];
  for (let da = 0; ; da += 1000) {   // PostgREST restituisce al massimo 1000 righe per volta
    const { data, error } = await dbq('lettura coda',
      supa.from('contatti_coda').select('*').lte('rientro_il', oggi).order('id').range(da, da + 999));
    if (error) throw error;
    righe.push(...data);
    if (data.length < 1000) return righe;
  }
}

async function caricaOggi() {
  const oggi = MB21Coda.oggiRoma();
  app.innerHTML = `<h1>Oggi</h1><div class="sotto">${esc(dataEstesa(oggi))}</div><div class="vuoto">Carico la coda…</div>`;
  let risultato, offline = false;
  try {
    risultato = MB21Coda.calcolaCoda(await leggiCandidati(oggi), oggi);
    if (risultato.nuoviInCoda.length) {
      await dbq('ingresso in coda', supa.from('contatti').update({ in_coda_dal: oggi })
        .in('id', risultato.nuoviInCoda).is('in_coda_dal', null));
    }
  } catch (e) {
    let cache = null;
    try { cache = JSON.parse(localStorage.getItem(CHIAVE_CACHE)); } catch (e2) {}
    if (!cache) {
      app.innerHTML = `<h1>Oggi</h1><div class="avviso">Non riesco a caricare la coda. Controlla la connessione e riapri l'app.</div>${versione()}`;
      return;
    }
    risultato = cache.risultato; offline = cache.salvata;
  }
  ST.oggi = oggi; ST.risultato = risultato; ST.offline = offline;
  if (!offline) salvaCache();
  disegnaOggi();
}

// ── Bottoni esito (tabella confermata da Ignazio il 14/09, STRUTTURA.md → Bottoni esito) ──
// Prospect, Referral e senza categoria: 5 bottoni sulle fasi Prospect · Contatto.
// Partner e Cliente: in Sequenze non hanno fasi di telefonata → solo i due con data.
const BOTTONI_PROSPECT = [
  { etichetta: 'Appuntamento', chiave: 'Prospect-Contatto-PM Fissato', data: 'giorno-ora', classe: 'appuntamento' },
  { etichetta: 'Richiamare', chiave: 'Prospect-Contatto-Richiamare', data: 'giorno' },
  { etichetta: 'Non risponde', chiave: 'Prospect-Contatto-No Risposta' },
  { etichetta: 'Non ora', chiave: 'Prospect-Contatto-Relazione' },
  { etichetta: 'Non interessato', chiave: 'Prospect-Contatto-No Interesse', classe: 'no' },
];
function bottoniPer(categoria) {
  if (categoria === 'Partner' || categoria === 'Cliente') return [
    { etichetta: 'Appuntamento', chiave: `${categoria}-Contatto-Appuntamento`, data: 'giorno-ora', classe: 'appuntamento' },
    { etichetta: 'Richiamare', chiave: `${categoria}-Contatto-Richiamare`, data: 'giorno' },
  ];
  return BOTTONI_PROSPECT;
}

function cardContatto(r, dareSeguito) {
  const luogo = [r.citta, r.fascia_eta].filter(Boolean).join(' · ');
  const fase = r.contattato ? (r.ultima_fase || 'Senza esito') : 'Mai contattato';
  const badge = dareSeguito
    ? `<span class="badge scaduto">${esc(fase)} · scaduto da ${r.scadutoDa} ${r.scadutoDa === 1 ? 'giorno' : 'giorni'}</span>`
    : `<span class="badge">${esc(fase)}</span>`;
  const tel = r.telefono ? `<a class="tel" href="tel:${esc(r.telefono.replace(/[^0-9+]/g, ''))}">${esc(r.telefono)}</a>` : '<span></span>';
  const bottoni = bottoniPer(r.categoria).map((b, i) =>
    `<button class="${b.classe || ''}" data-contatto="${esc(r.id)}" data-bottone="${i}" ${ST.offline ? 'disabled' : ''}>${esc(b.etichetta)}</button>`).join('');
  return `
    <div class="card" id="card-${esc(r.id)}">
      <div class="strip" style="background:${COLORI[r.categoria] || 'var(--unlinked)'}"></div>
      <div class="corpo">
        <div class="nome">${esc(r.nome)}</div>
        ${r.professione ? `<div class="prof">${esc(r.professione)}</div>` : ''}
        ${luogo ? `<div class="luogo">${esc(luogo)}</div>` : ''}
        <div class="riga">${tel}${badge}</div>
        ${r.coach ? `<div class="coach"><small>Coach</small>${esc(r.coach)}</div>` : ''}
        <div class="bottoni">${bottoni}</div>
      </div>
    </div>`;
}

function disegnaOggi() {
  const r = ST.risultato;
  let html = `<h1>Oggi</h1><div class="sotto">${esc(dataEstesa(ST.oggi))}</div>`;
  if (ST.offline) {
    const ora = new Date(ST.offline).toLocaleString('it-IT', { timeZone: 'Europe/Rome', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    html += `<div class="avviso">Sei offline: questa è la coda salvata il ${esc(ora)}. Solo lettura.</div>`;
  }
  if (r.dareSeguito.length) {
    html += `<h2>Dare Seguito scaduti</h2>` + r.dareSeguito.map(x => cardContatto(x, true)).join('');
  }
  html += `<h2>La tua coda · ${r.coda.length} da chiamare</h2>`;
  html += r.coda.length ? r.coda.map(x => cardContatto(x, false)).join('') : `<div class="vuoto">Per oggi hai finito.</div>`;
  app.innerHTML = html + versione();
  app.querySelectorAll('.bottoni button').forEach(btn => {
    btn.onclick = () => toccaBottone(btn.dataset.contatto, Number(btn.dataset.bottone));
  });
}

function trovaInCoda(id) {
  for (const lista of ['dareSeguito', 'coda']) {
    const i = ST.risultato[lista].findIndex(x => x.id === id);
    if (i >= 0) return { lista, i, contatto: ST.risultato[lista][i] };
  }
  return null;
}

async function toccaBottone(id, indice) {
  const pos = trovaInCoda(id);
  if (!pos) return;
  const bottone = bottoniPer(pos.contatto.categoria)[indice];
  let data = null;
  if (bottone.data) {
    data = await chiediData(bottone, pos.contatto.nome);
    if (!data) return;                       // annullato dal foglio
  }
  const card = document.getElementById('card-' + id);
  card.querySelectorAll('button').forEach(b => { b.disabled = true; });
  const { data: esito, error } = await dbq('registra esito', supa.rpc('registra_esito',
    { p_contatto: id, p_chiave: bottone.chiave, p_data: data }));
  if (error) {
    card.querySelectorAll('button').forEach(b => { b.disabled = false; });
    return mostraToast('Non salvato: controlla la connessione e riprova.');
  }
  card.classList.add('via');
  setTimeout(() => {
    ST.risultato[pos.lista].splice(pos.i, 1);
    salvaCache();
    disegnaOggi();
    mostraToast(`${pos.contatto.nome} · ${bottone.etichetta}`, () => annulla(pos, esito));
  }, 250);
}

async function annulla(pos, esito) {
  const { error } = await dbq('annulla esito', supa.rpc('annulla_esito',
    { p_azione: esito.azione_id, p_rientro: esito.rientro_prec, p_in_coda: esito.in_coda_prec }));
  if (error) return mostraToast('Annullamento non riuscito: riprova.');
  ST.risultato[pos.lista].splice(pos.i, 0, pos.contatto);
  salvaCache();
  disegnaOggi();
  mostraToast('Annullato');
}

function salvaCache() {
  try { localStorage.setItem(CHIAVE_CACHE, JSON.stringify({ oggi: ST.oggi, risultato: ST.risultato, salvata: new Date().toISOString() })); } catch (e) {}
}

// Foglio in basso per scegliere il giorno (e l'ora per l'appuntamento). Restituisce un ISO o null.
function chiediData(bottone, nome) {
  const domani = MB21Coda.oggiRoma(new Date(Date.now() + 86400000));
  return new Promise(risolvi => {
    const velo = document.createElement('div');
    velo.className = 'velo';
    velo.innerHTML = `
      <div class="foglio">
        <h3>${esc(bottone.etichetta)}</h3>
        <p>${esc(nome)}</p>
        <input id="scelta-giorno" type="date" value="${domani}" min="${MB21Coda.oggiRoma()}">
        ${bottone.data === 'giorno-ora' ? '<input id="scelta-ora" type="time" value="18:30">' : ''}
        <div class="due">
          <button class="link" id="scelta-no">Annulla</button>
          <button class="primario" id="scelta-si">Conferma</button>
        </div>
      </div>`;
    document.body.appendChild(velo);
    const chiudi = valore => { velo.remove(); risolvi(valore); };
    velo.onclick = e => { if (e.target === velo) chiudi(null); };
    velo.querySelector('#scelta-no').onclick = () => chiudi(null);
    velo.querySelector('#scelta-si').onclick = () => {
      const giorno = velo.querySelector('#scelta-giorno').value;
      if (!giorno) return;
      const ora = bottone.data === 'giorno-ora' ? (velo.querySelector('#scelta-ora').value || '12:00') : '12:00';
      chiudi(new Date(`${giorno}T${ora}:00`).toISOString());   // ora del telefono (Italia)
    };
  });
}

let timerToast;
function mostraToast(testo, suAnnulla) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  clearTimeout(timerToast);
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${esc(testo)}</span>${suAnnulla ? '<button>Annulla</button>' : ''}`;
  if (suAnnulla) t.querySelector('button').onclick = () => { t.remove(); clearTimeout(timerToast); suAnnulla(); };
  document.body.appendChild(t);
  timerToast = setTimeout(() => t.remove(), suAnnulla ? 6000 : 3500);
}

// ── Avvio ────────────────────────────────────────────────
// INITIAL_SESSION arriva all'apertura (già letto anche il link dell'email, #access_token);
// SIGNED_IN dopo il link. Callback sincrona: le chiamate al DB partono fuori (setTimeout),
// altrimenti supabase-js si blocca aspettando se stesso.
let accessoInCorso = false;
supa.auth.onAuthStateChange((evento, sessione) => {
  setTimeout(() => {
    if (evento === 'SIGNED_OUT') { ST.utente = null; mostraEmail(ST.motivoUscita); ST.motivoUscita = ''; return; }
    if (evento !== 'INITIAL_SESSION' && evento !== 'SIGNED_IN') return;
    if (!sessione) return mostraEmail();
    if (ST.utente || accessoInCorso) return;
    accessoInCorso = true;
    dopoAccesso(sessione).finally(() => { accessoInCorso = false; });
  }, 0);
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
